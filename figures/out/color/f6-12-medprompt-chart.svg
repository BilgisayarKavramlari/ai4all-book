  <g id="text_24">
   <text style="fill: #1d1d1f; font: 10px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 397.867687)">Published values: Nori et al. (2023), Figure 4 (the paper's step-by-step chart; first bar: simple prompt, no examples).</text>
   <text style="fill: #1d1d1f; font: 10px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 409.0655)">Steps are cumulative in the authors' order, which they call subjective; the paper's Figure 6</text>
   <text style="fill: #1d1d1f; font: 10px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 420.263312)">gives slightly different sizes for the last two steps (+0.8, +2.1). Small numbers = change from the bar before.</text>
