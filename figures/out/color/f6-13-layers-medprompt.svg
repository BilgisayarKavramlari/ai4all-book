<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Medprompt changed what the model received and how often it was asked</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="580" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Context layers</text><text x="400.0" y="46.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Medprompt (2023): what GPT-4 received, and how often it was asked</text><rect x="20" y="62" width="540" height="458" rx="6" fill="#EEF2F7" stroke="#1D1D1F" stroke-width="1.6"/><text x="36.0" y="82.0" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Context window</text><text x="36.0" y="102.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">everything the model receives this turn</text><text x="420.0" y="102.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Who sets it</text><rect x="36" y="116" width="290" height="56" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="181.0" y="135.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">System prompt</text><text x="181.0" y="155.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">set by the tool&#x27;s maker</text><text x="420.0" y="136.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the provider; usually unseen</text><rect x="36" y="182" width="290" height="56" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="181.0" y="201.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Standing instructions</text><text x="181.0" y="221.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">your rules for every chat in a scope</text><text x="420.0" y="194.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">you, once, in options or a</text><text x="420.0" y="209.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">project</text><text x="420.0" y="224.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">(new in Chapter 6)</text><rect x="36" y="248" width="290" height="56" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="181.0" y="267.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Project files and memory notes</text><text x="181.0" y="287.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">added automatically</text><text x="420.0" y="268.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">you, or the product</text><text x="420.0" y="290.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">(new in Chapter 6)</text><rect x="36" y="314" width="290" height="56" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="181.0" y="333.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Conversation so far</text><text x="181.0" y="353.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">earlier prompts and responses</text><text x="420.0" y="334.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">you and the model, earlier</text><rect x="36" y="380" width="290" height="56" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="181.0" y="399.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Pasted or retrieved text</text><text x="181.0" y="419.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">documents, search results</text><text x="420.0" y="400.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">you, or a search tool</text><rect x="36" y="446" width="290" height="56" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="3"/><text x="181.0" y="465.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Your prompt</text><text x="181.0" y="485.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">the newest message</text><text x="420.0" y="466.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">you, now</text><path d="M562.0,291.0 L600.0,291.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="622.0,240.0 762.0,240.0 780.0,291.0 762.0,342.0 622.0,342.0 604.0,291.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="692.0" y="274.7" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The model</text><text x="692.0" y="303.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">receives all layers as</text><text x="692.0" y="319.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">one input</text><text x="692.0" y="378.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Plus a workflow:</text><text x="692.0" y="410.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">5 runs, answer options</text><text x="692.0" y="425.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">shuffled</text><text x="692.0" y="458.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">majority vote</text><text x="400.0" y="536.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Dashed = usually not visible to you · rounded = you, now · hexagon = AI component · dark or thick = this section&#x27;s</text><text x="400.0" y="551.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">layer</text><text x="400.0" y="566.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Chapter 3&#x27;s four layers, with two that persistent features fill before you type.</text></svg>