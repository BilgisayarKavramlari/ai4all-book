<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Bias can withhold an opportunity or misrepresent a group</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="300" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Two kinds of harm</text><rect x="40" y="50" width="340" height="70" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="210.0" y="73.8" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Allocation harm</text><text x="210.0" y="99.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">An opportunity or resource is withheld</text><text x="210.0" y="150.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">· A job shortlist (Ch. 2&#x27;s recruiting tool)</text><text x="210.0" y="180.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">· A care program (Ch. 11&#x27;s health algorithm)</text><text x="210.0" y="210.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">· A tutoring offer (Maya&#x27;s outreach score)</text><rect x="420" y="50" width="340" height="70" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="590.0" y="73.8" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Representation harm</text><text x="590.0" y="91.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A group is stereotyped, demeaned or left</text><text x="590.0" y="106.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">out</text><text x="590.0" y="150.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">· Images of &quot;a software developer&quot;</text><text x="590.0" y="180.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">· Default descriptions of &quot;a typical&quot; person</text><text x="590.0" y="210.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">· A group missing from examples</text><text x="400.0" y="242.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">The same system can cause both. Allocation harms show up in decisions; representation harms show up in what</text><text x="400.0" y="257.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">people see and read.</text><text x="400.0" y="286.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">After Blodgett et al. (2020)</text></svg>