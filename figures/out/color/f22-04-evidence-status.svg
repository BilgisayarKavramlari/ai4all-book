<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A claim&#x27;s status tells you who checked it, not whether it is true</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="490" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Three tags for every claim about what AI can do</text><rect x="20" y="48" width="230" height="74" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="135.0" y="73.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">1. As-of date</text><text x="135.0" y="99.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">when it was made or measured</text><polygon points="400.0,48.0 515.0,85.0 400.0,122.0 285.0,85.0" fill="#1C3D6E" stroke="#0F2440" stroke-width="3"/><text x="400.0" y="85.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">2. Evidence status</text><rect x="550" y="48" width="230" height="74" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="665.0" y="73.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3. Who could check it</text><text x="665.0" y="99.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the outside source that could</text><path d="M252.0,85.0 L283.0,85.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M517.0,85.0 L548.0,85.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="20" y="150" width="180" height="112" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="110.0" y="188.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">■ measured</text><text x="110.0" y="212.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">checked by an outside</text><text x="110.0" y="228.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">source; method you can</text><text x="110.0" y="244.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">read</text><path d="M400.0,124.0 L110.0,148.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="212" y="150" width="180" height="112" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="302.0" y="188.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">□ reported</text><text x="302.0" y="212.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">stated by the</text><text x="302.0" y="228.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">developer, or an</text><text x="302.0" y="244.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">outlet citing it</text><path d="M400.0,124.0 L302.0,148.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="404" y="150" width="180" height="112" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="494.0" y="188.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">→ forecast</text><text x="494.0" y="220.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">about the future,</text><text x="494.0" y="236.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">whoever says it</text><path d="M400.0,124.0 L494.0,148.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="596" y="150" width="180" height="112" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="686.0" y="188.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the book&#x27;s inference</text><text x="686.0" y="220.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">this book&#x27;s reading,</text><text x="686.0" y="236.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">marked as such</text><path d="M400.0,124.0 L686.0,148.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="400.0" y="292.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Crosswalk with the case tiers</text><rect x="20" y="308" width="370" height="92" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="205.0" y="330.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Case tier: is this fact in the primary</text><text x="205.0" y="347.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">record?</text><text x="205.0" y="372.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">confirmed · reported · inferred</text><rect x="410" y="308" width="370" height="92" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="595.0" y="330.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Evidence status: who checked the</text><text x="595.0" y="347.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">capability?</text><text x="595.0" y="364.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">measured · reported · forecast · the book&#x27;s</text><text x="595.0" y="380.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">inference</text><text x="400.0" y="420.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">Example: DeepMind&#x27;s post is the confirmed record of what DeepMind says; the score it reports was checked by the</text><text x="400.0" y="435.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">IMO&#x27;s coordinators, so it is measured.</text><text x="400.0" y="470.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Dashed = the book&#x27;s inference only · light fill = forecast · diamond = the decision you make about a claim</text></svg>