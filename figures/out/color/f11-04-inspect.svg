<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>What you can inspect depends on how the AI took part</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="450" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">What you can inspect depends on how the AI took part</text><rect x="300" y="48" width="200" height="54" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="400.0" y="75.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Your question and data</text><path d="M400.0,104.0 L140.0,140.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="38.0,142.0 242.0,142.0 260.0,185.0 242.0,228.0 38.0,228.0 20.0,185.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="140.0" y="171.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">AI feature in a spreadsheet</text><text x="140.0" y="194.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">fills cells or writes a</text><text x="140.0" y="210.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">formula</text><path d="M140.0,230.0 L140.0,262.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="20" y="264" width="240" height="62" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="140.0" y="285.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">You can inspect:</text><text x="140.0" y="307.4" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">The formula</text><text x="140.0" y="352.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">read it; test it on two rows by</text><text x="140.0" y="367.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">hand</text><path d="M400.0,104.0 L402.0,140.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="300.0,142.0 504.0,142.0 522.0,185.0 504.0,228.0 300.0,228.0 282.0,185.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="402.0" y="171.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Chat tool that runs code</text><text x="402.0" y="194.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">writes and runs code on a file</text><text x="402.0" y="210.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">you give it</text><path d="M402.0,230.0 L402.0,262.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="282" y="264" width="240" height="62" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="402.0" y="285.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">You can inspect:</text><text x="402.0" y="307.4" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">The code, if you ask</text><text x="402.0" y="352.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">count rows in and out; read each</text><text x="402.0" y="367.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">step</text><path d="M400.0,104.0 L664.0,140.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="562.0,142.0 766.0,142.0 784.0,185.0 766.0,228.0 562.0,228.0 544.0,185.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="664.0" y="171.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Chat answer</text><text x="664.0" y="194.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">produces text about the data</text><text x="664.0" y="210.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">or the decision</text><path d="M664.0,230.0 L664.0,262.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="544" y="264" width="240" height="62" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6" stroke-dasharray="7 5"/><text x="664.0" y="285.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">You can inspect:</text><text x="664.0" y="307.4" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Nothing but the answer</text><text x="664.0" y="360.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">recalculate everything you rely on</text><text x="400.0" y="410.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Chapter 12 names the kinds of tools and compares them; current features are in Compass.</text><text x="400.0" y="436.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Hexagon = AI component · rounded = a person · dashed = little to inspect</text></svg>