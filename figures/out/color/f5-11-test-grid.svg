<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A prompt works when it passes across runs and test inputs, not once</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="440" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Lucía&#x27;s v4: three test inputs × two runs, five criteria</text><text x="390.0" y="58.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Run 1</text><text x="590.0" y="58.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Run 2</text><text x="150.0" y="104.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Typical</text><text x="150.0" y="126.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">the association&#x27;s figures</text><rect x="300" y="76" width="180" height="70" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="390.0" y="111.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">All 5 met</text><rect x="500" y="76" width="180" height="70" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="590.0" y="111.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">All 5 met</text><text x="150.0" y="192.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Different</text><text x="150.0" y="206.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">income that changes month to</text><text x="150.0" y="221.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">month</text><rect x="300" y="164" width="180" height="70" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="390.0" y="199.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">All 5 met</text><rect x="500" y="164" width="180" height="70" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="590.0" y="191.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Format partly met: no</text><text x="590.0" y="206.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">table</text><text x="150.0" y="280.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Edge</text><text x="150.0" y="302.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">costs higher than income</text><rect x="300" y="252" width="180" height="70" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="390.0" y="287.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">All 5 met</text><rect x="500" y="252" width="180" height="70" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="590.0" y="279.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Numbers not met:</text><text x="590.0" y="294.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">invented income line</text><rect x="260" y="344" width="460" height="58" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="490.0" y="365.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Verdict: not yet. It fails on the edge input, so v5 adds a</text><text x="490.0" y="380.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">rule for budgets that do not balance.</text><text x="400.0" y="424.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Shaded = met · light = partly met · hatched with a thick border = not met</text></svg>