<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Training memos built from a competitor&#x27;s headnotes led to the first appeals ruling on AI training and fair use</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="340" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Thomson Reuters v. Ross: from a refused license to an appeals ruling</text><rect x="18" y="50" width="176" height="92" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="106.0" y="72.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Ross asks to license</text><text x="106.0" y="89.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Westlaw</text><text x="106.0" y="114.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">refused: a competitor</text><path d="M196.0,96.0 L212.0,96.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="214" y="50" width="176" height="92" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="302.0" y="72.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Training memos</text><text x="302.0" y="89.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">written</text><text x="302.0" y="106.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">using Westlaw</text><text x="302.0" y="122.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">headnotes</text><path d="M392.0,96.0 L408.0,96.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="410" y="50" width="176" height="92" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="498.0" y="81.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Search tool trained</text><text x="498.0" y="106.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">returns passages of</text><text x="498.0" y="122.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">court opinions</text><path d="M588.0,96.0 L604.0,96.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="606" y="50" width="176" height="92" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="694.0" y="81.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Thomson Reuters sues</text><text x="694.0" y="114.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2020</text><path d="M694.0,144.0 Q398.3,141.1 106.0,186.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="18" y="190" width="176" height="92" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="106.0" y="221.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Ross shuts down</text><text x="106.0" y="246.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Dec 2020 announcement</text><text x="106.0" y="262.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">(reported)</text><path d="M196.0,236.0 L212.0,236.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="214" y="190" width="176" height="92" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="302.0" y="221.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2023 ruling</text><text x="302.0" y="246.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">fair use left for a</text><text x="302.0" y="262.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">jury</text><path d="M392.0,236.0 L408.0,236.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="410" y="190" width="176" height="92" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="498.0" y="221.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Feb 11, 2025</text><text x="498.0" y="246.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">not fair use (appeal</text><text x="498.0" y="262.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">allowed Apr 2025)</text><path d="M588.0,236.0 L604.0,236.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="606" y="190" width="176" height="92" rx="3" fill="#1C3D6E" stroke="#0F2440" stroke-width="3"/><text x="694.0" y="221.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Sept 29, 2026</text><text x="694.0" y="254.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Third Circuit affirms</text><text x="400.0" y="318.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Solid = court record · dashed = reported by a named outlet · thick = the ruling now in force (as of October 2026)</text></svg>