<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 616" width="800" height="616" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Facts in a draft go through the same funnel as any claim</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="616" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The Verification Funnel</text><text x="400.0" y="46.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Facts in your draft: names, dates, numbers, policies</text><polygon points="226.0,76.0 410.0,76.0 428.0,98.0 410.0,120.0 226.0,120.0 208.0,98.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="318.0" y="98.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">An AI output</text><path d="M318.0,122.0 L318.0,140.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="646.0" y="86.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Stop when the evidence</text><text x="646.0" y="101.9" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">matches the stakes</text><rect x="48.0" y="142" width="540" height="66" rx="3" fill="#1C3D6E" stroke="#0F2440" stroke-width="3"/><text x="318.0" y="164.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Claims</text><text x="318.0" y="188.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">split the output: one statement you might rely on per claim</text><path d="M318.0,209.0 L318.0,227.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="328.0" y="218.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">every claim you rely on</text><rect x="80.0" y="228" width="476" height="66" rx="3" fill="#1C3D6E" stroke="#0F2440" stroke-width="3"/><text x="318.0" y="250.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">1. Independent check</text><text x="318.0" y="266.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">a source no AI tool produced, with an author or publisher</text><text x="318.0" y="282.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">you can name, or redo the calculation yourself</text><path d="M318.0,295.0 L318.0,313.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="328.0" y="304.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">stakes not yet met</text><path d="M559.0,261.0 L638.0,261.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="113.0" y="314" width="410" height="66" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="318.0" y="336.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2. Primary source</text><text x="318.0" y="352.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the original record: the study, dataset, law, court</text><text x="318.0" y="368.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">record or official page</text><path d="M318.0,381.0 L318.0,399.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="328.0" y="390.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">stakes not yet met</text><path d="M526.0,347.0 L638.0,347.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="146.0" y="400" width="344" height="66" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="318.0" y="422.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3. Expert</text><text x="318.0" y="438.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a person with the knowledge and access to</text><text x="318.0" y="454.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">judge it; ask for reasons</text><path d="M493.0,433.0 L638.0,433.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><line x1="640" y1="261.0" x2="640" y2="462" stroke="#1D1D1F" stroke-width="2.0"/><path d="M640.0,461.0 L640.0,490.0" fill="none" stroke="#1D1D1F" stroke-width="2.0" marker-end="url(#arrow-color)"/><rect x="430" y="492" width="350" height="74" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="605.0" y="517.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Verdict</text><text x="605.0" y="535.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">supported · partly supported · unsupported ·</text><text x="605.0" y="551.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">contradicted · cannot verify</text><rect x="30" y="492" width="360" height="74" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6" stroke-dasharray="7 5"/><text x="210.0" y="517.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Remaining uncertainty</text><text x="210.0" y="543.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">what you could not check, and why</text><path d="M428.0,529.0 L393.0,529.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-color)"/><text x="400.0" y="586.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Hexagon = AI output · rectangles = checks you run · rounded = a person · dashed = uncertainty · thick dark border =</text><text x="400.0" y="601.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">the stage this figure marks</text></svg>