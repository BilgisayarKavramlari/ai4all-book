<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A line becomes a commitment only when it passes three tests</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="372" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A line becomes a commitment only when it passes three tests</text><rect x="14" y="70" width="112" height="70" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="70.0" y="96.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A line in</text><text x="70.0" y="113.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">your draft</text><polygon points="216.0,50.0 286.0,105.0 216.0,160.0 146.0,105.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="216.0" y="105.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Moment?</text><text x="216.0" y="168.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">would I notice it</text><text x="216.0" y="184.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">then, from something I</text><text x="216.0" y="199.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">can see?</text><path d="M128.0,105.0 L144.0,105.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M216.0,210.0 L216.0,238.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="230.0" y="224.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">no</text><polygon points="376.0,50.0 446.0,105.0 376.0,160.0 306.0,105.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="376.0" y="105.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Action?</text><text x="376.0" y="176.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">can I or someone else</text><text x="376.0" y="191.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">trace it afterward?</text><path d="M288.0,105.0 L304.0,105.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="296.0" y="88.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">yes</text><path d="M376.0,210.0 L376.0,238.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="390.0" y="224.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">no</text><polygon points="536.0,50.0 606.0,105.0 536.0,160.0 466.0,105.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="536.0" y="105.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Reason?</text><text x="536.0" y="176.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">does it point to my</text><text x="536.0" y="191.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">own evidence?</text><path d="M448.0,105.0 L464.0,105.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="456.0" y="88.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">yes</text><path d="M536.0,210.0 L536.0,238.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="550.0" y="224.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">no</text><text x="616.0" y="88.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">yes</text><path d="M608.0,105.0 L650.0,105.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="652" y="70" width="134" height="70" rx="16" fill="#4CAF84" stroke="#1F5E43" stroke-width="3"/><text x="719.0" y="105.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Commitment</text><rect x="146" y="240" width="460" height="54" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="376.0" y="258.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Rewrite: name a visible moment, a trace, or your</text><text x="376.0" y="275.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">evidence</text><line x1="146" y1="267" x2="70" y2="267" stroke="#1D1D1F" stroke-width="1.4"/><path d="M70.0,267.0 L70.0,144.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="400.0" y="326.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">A rewritten line takes the test again.</text><text x="400.0" y="344.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rectangle = a step · diamond = a test you apply · rounded = your commitment · thick border (hatched in print) =</text><text x="400.0" y="359.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">rewrite</text></svg>