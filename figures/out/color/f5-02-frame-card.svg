<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A task frame says what good looks like before the first prompt</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="410" fill="#FFFFFF"/><text x="400.0" y="28.0" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Task frame</text><rect x="40" y="56" width="350" height="88" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="215.0" y="85.9" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Goal</text><text x="215.0" y="117.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">what the result is for</text><rect x="410" y="56" width="350" height="88" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="585.0" y="85.9" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Audience</text><text x="585.0" y="117.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">who will use it, and what they already know</text><rect x="40" y="162" width="350" height="88" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3"/><text x="215.0" y="191.9" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Success criteria</text><text x="215.0" y="215.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3–5 checks you can score met, partly or not</text><text x="215.0" y="231.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">met</text><rect x="410" y="162" width="350" height="88" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="585.0" y="191.9" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Limits</text><text x="585.0" y="223.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">length, sources, time, data you may not use</text><rect x="40" y="268" width="350" height="88" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="215.0" y="297.9" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">What stays with you</text><text x="215.0" y="329.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">decisions, judgments, the final check</text><rect x="410" y="268" width="350" height="88" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="585.0" y="297.9" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A rung for each part (added in 5.2)</text><text x="585.0" y="321.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">no AI, automation, augmentation or agency,</text><text x="585.0" y="337.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">part by part</text><text x="400.0" y="392.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Write it before the first prompt; every version is scored against the criteria.</text></svg>