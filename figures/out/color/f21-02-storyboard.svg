<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A profession&#x27;s code waited about 26 years for an update, and still asks for judgment</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="360" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The ACM Code: from the 1992 version to the 2018 update</text><rect x="14" y="52" width="246" height="100" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="137.0" y="86.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">1992</text><text x="137.0" y="114.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the code&#x27;s last update before</text><text x="137.0" y="129.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2018</text><path d="M262.0,102.0 L274.0,102.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="276" y="52" width="246" height="100" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="399.0" y="86.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2016–2018</text><text x="399.0" y="114.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">two-year update; drafts</text><text x="399.0" y="129.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">published for comment</text><path d="M524.0,102.0 L536.0,102.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="538" y="52" width="246" height="100" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="661.0" y="86.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">June 22, 2018</text><text x="661.0" y="122.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">ACM Council adopts the update</text><rect x="14" y="184" width="246" height="100" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="137.0" y="218.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Structure</text><text x="137.0" y="246.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">principles + guidelines +</text><text x="137.0" y="261.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">compliance (Section 4)</text><path d="M262.0,234.0 L274.0,234.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="276" y="184" width="246" height="100" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="399.0" y="218.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Its own limit</text><text x="399.0" y="246.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">not an algorithm; a basis for</text><text x="399.0" y="261.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">judgment</text><path d="M524.0,234.0 L536.0,234.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="538" y="184" width="246" height="100" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="661.0" y="218.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">October 2026</text><text x="661.0" y="246.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">still the current version (page</text><text x="661.0" y="261.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">archived Jul 9, 2026)</text><line x1="659" y1="154" x2="659" y2="168" stroke="#1D1D1F" stroke-width="1.4"/><line x1="659" y1="168" x2="137" y2="168" stroke="#1D1D1F" stroke-width="1.4"/><path d="M137.0,168.0 L137.0,182.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="400.0" y="308.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Sources: ACM&#x27;s 2018 booklet and July 17, 2018 press release; ACM&#x27;s code page as archived July 9, 2026. All boxes</text><text x="400.0" y="323.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">rest on ACM&#x27;s own records.</text><text x="400.0" y="342.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">About 26 years passed between the two versions.</text></svg>