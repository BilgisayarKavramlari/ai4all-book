<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 436" width="800" height="436" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A global explanation describes the model&#x27;s overall pattern; a local one, a single decision</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="436" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A global explanation describes the model&#x27;s overall pattern; a local one, a single decision</text><text x="200.0" y="66.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Global</text><rect x="40" y="84" width="320" height="62" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="200.0" y="105.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Many cases</text><text x="200.0" y="127.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the whole test set</text><path d="M200.0,148.0 L200.0,178.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="58.0,180.0 342.0,180.0 360.0,215.0 342.0,250.0 58.0,250.0 40.0,215.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="200.0" y="215.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The model</text><path d="M200.0,252.0 L200.0,282.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="40" y="284" width="320" height="70" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="200.0" y="299.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">&quot;Overall, debt ratio and income</text><text x="200.0" y="316.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">matter most&quot;</text><text x="200.0" y="333.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">who asks: builders, auditors</text><text x="600.0" y="66.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Local</text><rect x="440" y="84" width="320" height="62" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="600.0" y="105.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">One case</text><text x="600.0" y="127.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">this applicant</text><path d="M600.0,148.0 L600.0,178.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="458.0,180.0 742.0,180.0 760.0,215.0 742.0,250.0 458.0,250.0 440.0,215.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="600.0" y="215.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The model</text><path d="M600.0,252.0 L600.0,282.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="440" y="284" width="320" height="70" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="600.0" y="299.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">&quot;For you, the debt ratio pulled the</text><text x="600.0" y="316.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">score down most&quot;</text><text x="600.0" y="333.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">who asks: the reviewer, the applicant</text><text x="400.0" y="392.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A local explanation can disagree with the global pattern; that disagreement is worth checking.</text><text x="400.0" y="418.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Hexagon = AI model · rectangle = input or explanation · constructed example</text></svg>