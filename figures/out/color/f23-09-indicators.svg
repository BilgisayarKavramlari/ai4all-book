<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Check a system against theories&#x27; indicator properties, not its words</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="430" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Check a system against theories&#x27; indicator properties, not its words</text><rect x="20" y="70" width="200" height="120" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="120.0" y="102.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Scientific theories of</text><text x="120.0" y="119.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">consciousness</text><text x="120.0" y="138.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">e.g., global workspace,</text><text x="120.0" y="154.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">recurrent processing,</text><text x="120.0" y="169.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">higher-order</text><rect x="300" y="70" width="200" height="120" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="110.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Indicator properties</text><text x="400.0" y="138.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">features each theory says</text><text x="400.0" y="154.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">matter, stated in</text><text x="400.0" y="169.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">computational terms</text><rect x="580" y="70" width="200" height="120" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="680.0" y="110.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Check a system&#x27;s design</text><text x="680.0" y="146.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">which indicators does its</text><text x="680.0" y="161.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">architecture have?</text><path d="M222.0,130.0 L298.0,130.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M502.0,130.0 L578.0,130.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="580" y="240" width="200" height="100" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="680.0" y="265.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A credence, not a</text><text x="680.0" y="282.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">verdict</text><text x="680.0" y="302.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">how likely, given the</text><text x="680.0" y="317.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">theories you accept</text><path d="M680.0,192.0 L680.0,238.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="20" y="240" width="470" height="100" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="255.0" y="274.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The system&#x27;s own words (&quot;I feel...&quot;)</text><text x="255.0" y="310.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a claim to check: both sides of the debate accept this</text><text x="400.0" y="364.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Method of Butlin et al. (2023; journal version 2026). Their 2023 conclusion: no current system is conscious; no</text><text x="400.0" y="379.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">obvious technical barrier to systems with the indicators.</text><text x="400.0" y="410.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Contested: critics doubt that computation is enough for consciousness (Seth, 2025).</text></svg>