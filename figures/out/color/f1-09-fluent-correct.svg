<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Sounding right and being right are two different things</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="440" fill="#FFFFFF"/><rect x="150" y="70" width="290" height="160" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="295.0" y="124.4" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Fluent and correct</text><text x="295.0" y="182.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Useful, still verify</text><rect x="450" y="70" width="290" height="160" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="595.0" y="124.4" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Fluent and wrong</text><text x="595.0" y="174.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Dangerous: nothing on the surface</text><text x="595.0" y="189.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">warns you</text><rect x="150" y="240" width="290" height="160" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="295.0" y="294.4" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Halting and correct</text><text x="295.0" y="352.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Useful, needs editing</text><rect x="450" y="240" width="290" height="160" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="595.0" y="294.4" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Halting and wrong</text><text x="595.0" y="352.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Easy to spot and reject</text><text x="295.0" y="50.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Correct</text><text x="595.0" y="50.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Wrong</text><text x="85.0" y="141.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Sounds</text><text x="85.0" y="158.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">fluent</text><text x="85.0" y="311.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Sounds</text><text x="85.0" y="328.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">halting</text><text x="400.0" y="420.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Thick border and hatching mark the risk corner.</text></svg>