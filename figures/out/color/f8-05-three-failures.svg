<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A citation can fail in three ways, and each needs a different check</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="390" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Three ways a citation fails</text><rect x="20" y="46" width="244" height="64" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="142.0" y="78.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">1. It does not exist</text><path d="M142.0,112.0 L142.0,132.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="20" y="134" width="244" height="70" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="142.0" y="157.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The check</text><text x="142.0" y="175.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Search an index no AI tool</text><text x="142.0" y="190.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">produced</text><text x="142.0" y="246.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">In Mata: “Varghese v. China</text><text x="142.0" y="262.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">Southern Airlines”: the federal</text><text x="142.0" y="277.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">appeals court&#x27;s clerk confirmed no</text><text x="142.0" y="293.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">such case (¶ 26)</text><rect x="278" y="46" width="244" height="64" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="400.0" y="68.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">2. It points to another</text><text x="400.0" y="87.1" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">work</text><path d="M400.0,112.0 L400.0,132.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="278" y="134" width="244" height="70" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="157.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The check</text><text x="400.0" y="175.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Match every detail to the</text><text x="400.0" y="190.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">record</text><text x="400.0" y="254.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">In Mata: Its docket number and</text><text x="400.0" y="270.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">Federal Reporter citation belong</text><text x="400.0" y="285.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">to two other cases (¶ 28)</text><rect x="536" y="46" width="244" height="64" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="658.0" y="78.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">3. It does not say it</text><path d="M658.0,112.0 L658.0,132.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="536" y="134" width="244" height="70" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="658.0" y="157.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The check</text><text x="658.0" y="175.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Open the source and find the</text><text x="658.0" y="190.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">passage</text><text x="658.0" y="254.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">In Mata: Real decisions cited</text><text x="658.0" y="270.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">inside it do not contain the</text><text x="658.0" y="285.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">quoted words (¶ 29g)</text><text x="400.0" y="352.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Thick border (hatched in print) = the failure · rounded = the check you run</text><text x="400.0" y="374.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Examples from Mata v. Avianca, ECF 54 (June 22, 2023), Findings of Fact.</text></svg>