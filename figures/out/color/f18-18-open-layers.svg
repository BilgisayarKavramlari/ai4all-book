<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Open is a license question: weights, code, data information and terms can each be open or closed</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="370" fill="#FFFFFF"/><polygon points="188.0,40.0 532.0,40.0 550.0,78.0 532.0,116.0 188.0,116.0 170.0,78.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="360.0" y="65.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Parameters (weights)</text><text x="360.0" y="93.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">what you download and run</text><rect x="170" y="132" width="380" height="76" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="360.0" y="170.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Code to train and run the system</text><rect x="170" y="224" width="380" height="76" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="360.0" y="249.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Information about the training data</text><text x="360.0" y="277.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">enough to build a similar system</text><rect x="580" y="40" width="200" height="260" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="680.0" y="128.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">License terms</text><text x="680.0" y="206.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">what you may do: use,</text><text x="680.0" y="222.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">study, change, share;</text><text x="680.0" y="237.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">some licenses limit uses</text><line x1="158" y1="40" x2="158" y2="116" stroke="#1D1D1F" stroke-width="3"/><text x="146.0" y="70.0" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1D1D1F" style="">open-weight</text><text x="146.0" y="90.0" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1D1D1F" style="">release</text><line x1="50" y1="40" x2="50" y2="300" stroke="#1D1D1F" stroke-width="3"/><text x="62.0" y="210.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">open source</text><text x="62.0" y="230.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">AI (OSI):</text><text x="62.0" y="250.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">all three</text><text x="400.0" y="322.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Open-weight release: the top layer, under a license. Open Source AI Definition (OSI, 2024): all three layers,</text><text x="400.0" y="337.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">under terms that allow use, study, change and sharing.</text></svg>