<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Chapter 11 summary card</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="340" fill="#FFFFFF"/><text x="400.0" y="26.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Chapter 11 — what you can do now</text><rect x="20" y="50" width="242" height="130" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="141.0" y="97.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Distinguish: informs,</text><text x="141.0" y="115.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">recommends, triggers; name</text><text x="141.0" y="132.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the owner</text><rect x="278" y="50" width="242" height="130" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="399.0" y="97.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Test a blank: count, ask</text><text x="399.0" y="115.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">why, get the real value,</text><text x="399.0" y="132.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">then compare</text><rect x="536" y="50" width="242" height="130" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="657.0" y="97.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Evaluate a proxy: mean?</text><text x="657.0" y="115.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">measure? for whom is the gap</text><text x="657.0" y="132.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">bigger?</text><rect x="20" y="200" width="242" height="130" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="141.0" y="247.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Verify an analysis: six</text><text x="141.0" y="265.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">places; recalculate outside</text><text x="141.0" y="282.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the tool</text><rect x="278" y="200" width="242" height="130" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="399.0" y="247.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Stress-test a matrix:</text><text x="399.0" y="265.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">margins and shortlists, not</text><text x="399.0" y="282.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">only the top</text><rect x="536" y="200" width="242" height="130" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="657.0" y="256.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Design a review step that</text><text x="657.0" y="273.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">makes disagreement possible</text></svg>