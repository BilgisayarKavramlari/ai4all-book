<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Your matrix records the evidence behind every fit decision</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="500" fill="#FFFFFF"/><rect x="20" y="20" width="160" height="46" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="100.0" y="43.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">1 Task</text><text x="200.0" y="43.0" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">parts · predictions per tool · frame and criteria · data class</text><rect x="20" y="76" width="160" height="46" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="100.0" y="99.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2 Tools</text><text x="200.0" y="99.0" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">kind · how the model is reached · model · date</text><rect x="20" y="132" width="160" height="46" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3"/><text x="100.0" y="155.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3 Data gate</text><text x="200.0" y="155.0" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">three questions per tool, cited · pass, changed input, or blocked</text><rect x="20" y="188" width="160" height="46" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="100.0" y="211.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">4 Runs</text><text x="200.0" y="211.0" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">route A, B or C · same prompt · typical, different, edge · fresh chats</text><rect x="20" y="244" width="160" height="46" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="100.0" y="267.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">5 Scores</text><text x="200.0" y="267.0" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">correctness (independent check) · polish 1–5 · time incl. checking</text><rect x="20" y="300" width="160" height="46" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="100.0" y="323.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">6 Cost row</text><text x="200.0" y="323.0" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">price form · limits · checking time · no-AI baseline (estimate)</text><rect x="20" y="356" width="160" height="46" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="100.0" y="379.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">7 Fit matrix</text><text x="200.0" y="379.0" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">decision · rung · reason per cell · predicted / tested once · re-test trigger</text><rect x="20" y="412" width="160" height="46" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="100.0" y="435.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">8 Judgment</text><text x="200.0" y="435.0" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">80–100 words, one comparison with a 12.3 study · declaration, five elements</text><text x="400.0" y="482.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Thick border: the gate comes before any quality score.</text></svg>