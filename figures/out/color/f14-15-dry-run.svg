<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 435" width="800" height="435" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A dry run with a planted fault shows which point catches an error before anyone relies on the workflow</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="435" fill="#FFFFFF"/><rect x="20" y="40" width="200" height="70" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="120.0" y="66.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Test inputs: typical,</text><text x="120.0" y="83.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">edge</text><rect x="20" y="130" width="200" height="70" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="1.6"/><text x="120.0" y="153.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">One planted fault</text><text x="120.0" y="171.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">wrong result · missing</text><text x="120.0" y="186.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">data · hidden instruction</text><path d="M222.0,75.0 L258.0,115.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M222.0,165.0 L258.0,130.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="260" y="85" width="200" height="80" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="360.0" y="112.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Side effects off</text><text x="360.0" y="133.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">run on paper or in a test</text><text x="360.0" y="148.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">copy</text><path d="M462.0,125.0 L488.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="490" y="85" width="170" height="80" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="575.0" y="112.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Record each step</text><text x="575.0" y="141.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">right? checked how?</text><path d="M575.0,167.0 L575.0,193.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="575.0,195.0 650.0,250.0 575.0,305.0 500.0,250.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="575.0" y="241.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Fault</text><text x="575.0" y="258.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">caught?</text><path d="M652.0,250.0 L688.0,250.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="670.0" y="238.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">yes</text><rect x="690" y="215" width="90" height="70" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="735.0" y="242.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Keep the</text><text x="735.0" y="257.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">design</text><path d="M575.0,307.0 L575.0,333.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="588.0" y="320.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">no</text><rect x="250" y="335" width="530" height="60" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3"/><text x="515.0" y="356.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Move or add a point · narrow a permission · or use a simpler</text><text x="515.0" y="373.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">system (14.1)</text><text x="400.0" y="420.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Then rerun the run that failed. One run is a sample, not a reliability estimate (14.3).</text></svg>