<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>The framed prompt carries what Lucía knew but had not written down</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="510" fill="#FFFFFF"/><rect x="20" y="30" width="250" height="200" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="145.0" y="130.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="145.0" y="52.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">v1 (first prompt)</text><text x="145.0" y="88.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Write a one-page handout for</text><text x="145.0" y="104.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">first-year students on how to</text><text x="145.0" y="120.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">make a monthly budget. Include</text><text x="145.0" y="135.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">one worked example as a table.</text><text x="145.0" y="151.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Use plain language.</text><text x="145.0" y="250.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Missing: the figures, the readers&#x27;</text><text x="145.0" y="265.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">situation, what not to include.</text><rect x="290" y="30" width="490" height="470" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="535.0" y="265.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="535.0" y="52.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">v2 (parts labeled)</text><rect x="302" y="78" width="112" height="50" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="358.0" y="103.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Role</text><text x="426.0" y="95.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Write as a peer from the accounting students&#x27;</text><text x="426.0" y="110.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">association.</text><rect x="302" y="140" width="112" height="50" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3"/><text x="358.0" y="165.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Task</text><text x="426.0" y="157.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Draft a one-page handout that shows first-year</text><text x="426.0" y="172.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">students how to make a monthly budget.</text><rect x="302" y="202" width="112" height="104" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="358.0" y="254.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Context</text><text x="426.0" y="222.3" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Readers: first-year university students; many</text><text x="426.0" y="238.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">manage money alone for the first time; some work</text><text x="426.0" y="254.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">part-time. Use only these monthly figures: income</text><text x="426.0" y="269.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">$1,150; rent $650; groceries $280; phone $45;</text><text x="426.0" y="285.7" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">transport $60.</text><rect x="302" y="318" width="112" height="68" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="358.0" y="352.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Constraints</text><text x="426.0" y="336.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Under 350 words. Plain language. Do not name any</text><text x="426.0" y="352.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">product, bank or app. Do not add numbers I did not</text><text x="426.0" y="367.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">give.</text><rect x="302" y="398" width="112" height="68" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="358.0" y="432.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Output format</text><text x="426.0" y="416.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">A title; three short sections (income, fixed</text><text x="426.0" y="432.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">costs, flexible costs); the example as a table</text><text x="426.0" y="447.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">with a total row.</text><text x="535.0" y="486.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">No in-context example: the format line already shows the shape.</text></svg>