<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" width="800" height="476" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Your review records the evidence behind every rating</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="476" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">One A6 source reliability review</text><rect x="20" y="44" width="260" height="42" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="150.0" y="65.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Question, purpose, claim</text><text x="294.0" y="65.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">the claim you most need to support</text><rect x="20" y="94" width="260" height="42" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="150.0" y="115.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Source: type and status</text><text x="294.0" y="107.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">primary/secondary/tertiary; peer-reviewed, preprint, corrected,</text><text x="294.0" y="122.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">retracted or not reviewed</text><rect x="20" y="144" width="260" height="42" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="150.0" y="165.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Outside-source log</text><text x="294.0" y="165.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">who is behind it, according to sources it did not write or pay for</text><rect x="20" y="194" width="260" height="42" rx="16" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="150.0" y="206.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Rung for the claim · rung</text><text x="150.0" y="223.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">needed</text><text x="294.0" y="215.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">with a one-sentence justification</text><rect x="20" y="244" width="260" height="42" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="150.0" y="265.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Use decision</text><text x="294.0" y="265.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">needs both: the rung and who is behind it (outside sources)</text><rect x="20" y="294" width="260" height="42" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="150.0" y="315.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Trace</text><text x="294.0" y="315.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">at least two hops or a dead end; three checks per hop; verdict</text><rect x="20" y="344" width="260" height="42" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="150.0" y="365.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Summary check</text><text x="294.0" y="365.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">each sentence: passage, verdict, drift type if one fits; omitted result</text><rect x="20" y="394" width="260" height="42" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6" stroke-dasharray="7 5"/><text x="150.0" y="406.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">References · judgment ·</text><text x="150.0" y="423.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">declaration</text><text x="294.0" y="415.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">what you relied on, and what remains uncertain</text><text x="400.0" y="458.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rounded = what you write · green = the rung judgment · dashed = remaining uncertainty</text></svg>