<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 422" width="800" height="422" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Recalling from memory feels harder and lasts longer</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="422" fill="#FFFFFF"/><text x="105.0" y="26.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">What you do</text><text x="400.0" y="26.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">How it feels</text><text x="655.0" y="26.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">What it does</text><rect x="20" y="46" width="170" height="108" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="3"/><text x="105.0" y="82.7" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Retrieve</text><text x="105.0" y="113.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">recall from memory,</text><text x="105.0" y="129.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">then check</text><rect x="222" y="46" width="356" height="108" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="400.0" y="100.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Slower; more mistakes at first</text><rect x="600" y="46" width="180" height="108" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="690.0" y="76.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Stronger memory a week</text><text x="690.0" y="92.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">later than rereading</text><text x="690.0" y="107.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">(Roediger &amp; Karpicke,</text><text x="690.0" y="123.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">2006)</text><path d="M192.0,100.0 L220.0,100.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M580.0,100.0 L598.0,100.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="20" y="172" width="170" height="84" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="105.0" y="200.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Generate</text><text x="105.0" y="222.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">produce the answer</text><text x="105.0" y="238.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">yourself</text><rect x="222" y="172" width="356" height="84" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="400.0" y="214.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Harder than reading it</text><rect x="600" y="172" width="180" height="84" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="690.0" y="190.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Remembered better than</text><text x="690.0" y="206.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">what you only read</text><text x="690.0" y="221.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">(Slamecka &amp; Graf,</text><text x="690.0" y="237.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">1978)</text><path d="M192.0,214.0 L220.0,214.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M580.0,214.0 L598.0,214.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="20" y="274" width="170" height="84" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="105.0" y="302.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Space</text><text x="105.0" y="324.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">spread sessions over</text><text x="105.0" y="340.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">days</text><rect x="222" y="274" width="356" height="84" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="400.0" y="316.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">You forget a little in between</text><rect x="600" y="274" width="180" height="84" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="690.0" y="300.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Beats cramming for</text><text x="690.0" y="316.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">later recall (Cepeda</text><text x="690.0" y="331.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">et al., 2006)</text><path d="M192.0,316.0 L220.0,316.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M580.0,316.0 L598.0,316.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="400.0" y="386.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Retrieval practice is the core habit; generation and spacing support it.</text><text x="400.0" y="408.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">A difficulty helps if you can meet it with effort, or if the answer follows (Bjork &amp; Bjork, 2011; Kornell et al., 2009).</text></svg>