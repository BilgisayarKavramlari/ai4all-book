   <text style="fill: #1d1d1f; font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(156.31 304.562281)">Source: Handa et al. (2025), Anthropic Education Report (Apr 8, 2025): 574,740 conversations from accounts with higher-education email</text>
