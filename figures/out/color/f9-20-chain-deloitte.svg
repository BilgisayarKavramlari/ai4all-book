<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>The errors reached the published report; what checks ran is not on record</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="420" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">From failure to harm</text><polygon points="36.0,120.0 172.0,120.0 190.0,166.0 172.0,212.0 36.0,212.0 18.0,166.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="104.0" y="142.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">1. The output is</text><text x="104.0" y="159.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">wrong</text><text x="104.0" y="184.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a branch of the tree</text><path d="M192.0,166.0 L212.0,166.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="104.0" y="58.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Incorrect references</text><text x="104.0" y="74.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">reached the published</text><text x="104.0" y="89.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">report (confirmed)</text><polygon points="307.0,106.0 400.0,166.0 307.0,226.0 214.0,166.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3" stroke-dasharray="7 5"/><text x="307.0" y="157.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2. Checked</text><text x="307.0" y="174.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">before use?</text><path d="M402.0,166.0 L422.0,166.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="412.0" y="154.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">no</text><text x="307.0" y="58.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Two checkpoints, firm and</text><text x="307.0" y="74.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">department; what ran is</text><text x="307.0" y="89.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">unknown (inferred)</text><rect x="424" y="120" width="182" height="92" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="515.0" y="142.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3. Someone relies on</text><text x="515.0" y="159.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">it</text><text x="515.0" y="184.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a person or system acts</text><path d="M608.0,166.0 L624.0,166.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="515.0" y="58.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Published by the department;</text><text x="515.0" y="74.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">recommendations stand</text><text x="515.0" y="89.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">(reported)</text><rect x="626" y="120" width="156" height="92" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="1.6"/><text x="704.0" y="151.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">4. Loss or harm</text><text x="704.0" y="176.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">money, safety,</text><text x="704.0" y="192.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">rights, trust</text><text x="704.0" y="58.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Corrections, partial</text><text x="704.0" y="74.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">refund, lost trust</text><text x="704.0" y="89.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">(reported)</text><path d="M307.0,228.0 L307.0,286.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="318.0" y="250.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">yes</text><rect x="207" y="288" width="200" height="52" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="307.0" y="305.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Caught: fixed before</text><text x="307.0" y="322.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">harm</text><text x="400.0" y="372.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Tiers: confirmed = the department&#x27;s pages · reported = news reports · inferred = this book&#x27;s reading</text><text x="400.0" y="394.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Hexagon = AI output · diamond = a check · rounded = a person · thick border = the link that failed · dashed =</text><text x="400.0" y="409.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">inferred</text></svg>