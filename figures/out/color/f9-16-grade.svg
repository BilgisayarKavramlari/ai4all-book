<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 414" width="800" height="414" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Certainty in a body of evidence starts from study design and moves up or down</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="414" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Rating certainty in a body of evidence (GRADE, simplified)</text><rect x="20" y="60" width="220" height="74" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="130.0" y="85.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Randomized trials</text><text x="130.0" y="111.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">start high</text><rect x="20" y="160" width="220" height="74" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="130.0" y="185.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Observational studies</text><text x="130.0" y="211.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">start low</text><path d="M242.0,97.0 L300.0,140.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M242.0,197.0 L300.0,160.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="302" y="110" width="196" height="80" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="150.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Certainty rating</text><rect x="530" y="46" width="250" height="104" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="655.0" y="81.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Move down</text><text x="655.0" y="102.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">study limitations,</text><text x="655.0" y="118.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">inconsistency, indirectness,</text><text x="655.0" y="134.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">imprecision, reporting bias</text><rect x="530" y="166" width="250" height="104" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="655.0" y="201.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Move up</text><text x="655.0" y="215.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">mainly observational: a very</text><text x="655.0" y="230.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">large effect, dose-response,</text><text x="655.0" y="246.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">biases that would hide the</text><text x="655.0" y="262.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">effect</text><path d="M500.0,136.0 L528.0,100.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M242.0,214.0 L528.0,214.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-color)"/><path d="M400.0,192.0 L400.0,276.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="150" y="278" width="500" height="62" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="400.0" y="309.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">High · Moderate · Low · Very low</text><text x="400.0" y="372.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Thick (hatched in print) = reasons to lower certainty · green = reasons to raise it</text><text x="400.0" y="388.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Simplified from Guyatt et al. (2008) and Balshem et al. (2011). Dashed arrow: upgrades apply mainly to</text><text x="400.0" y="403.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">observational evidence.</text></svg>