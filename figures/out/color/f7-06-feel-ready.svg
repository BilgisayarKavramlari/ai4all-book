<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 446" width="800" height="446" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Feeling ready and being ready are different</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="446" fill="#FFFFFF"/><rect x="170" y="64" width="290" height="150" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="315.0" y="115.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Calibrated</text><text x="315.0" y="169.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Feel ready and are ready</text><rect x="470" y="64" width="290" height="150" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="615.0" y="115.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Overconfident</text><text x="615.0" y="161.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Feel ready but are not: the risk</text><text x="615.0" y="176.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">corner</text><rect x="170" y="224" width="290" height="150" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="315.0" y="275.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Underconfident</text><text x="315.0" y="329.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">More ready than you think</text><rect x="470" y="224" width="290" height="150" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="615.0" y="275.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Calibrated</text><text x="615.0" y="321.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Not ready, and you know to keep</text><text x="615.0" y="336.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">studying</text><text x="315.0" y="44.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Are ready</text><text x="615.0" y="44.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Are not ready</text><text x="95.0" y="130.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Feel</text><text x="95.0" y="147.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">ready</text><text x="95.0" y="290.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Do not feel</text><text x="95.0" y="307.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">ready</text><text x="400.0" y="410.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Predict, then check: the gap between your prediction and your score tells you which cell you are in.</text><text x="400.0" y="432.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Thick border and hatching mark the risk corner.</text></svg>