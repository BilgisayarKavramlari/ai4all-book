<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 566" width="800" height="566" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A source&#x27;s rung depends on how directly it records the claim you need</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="566" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The source ladder: how directly does this source record the claim?</text><rect x="160" y="60" width="390" height="70" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="355.0" y="83.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">4. Is the record of this claim</text><text x="355.0" y="101.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">the study for “this study found”; a systematic</text><text x="355.0" y="116.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">review for “what studies show”</text><rect x="160" y="142" width="390" height="70" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="355.0" y="165.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3. Cites the specific record</text><text x="355.0" y="183.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a findable citation (page, table, DOI), or a</text><text x="355.0" y="198.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">narrower record: one study for a general claim</text><rect x="160" y="224" width="390" height="70" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="355.0" y="247.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2. Names a source too vaguely to find</text><text x="355.0" y="273.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">“a recent Harvard study”, “experts say”</text><rect x="160" y="306" width="390" height="70" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="355.0" y="329.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">1. Gives no source</text><text x="355.0" y="347.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">an unsourced page, a social post, a quotation</text><text x="355.0" y="362.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">with no reference</text><line x1="150" y1="50" x2="150" y2="386" stroke="#1D1D1F" stroke-width="3"/><line x1="560" y1="50" x2="560" y2="386" stroke="#1D1D1F" stroke-width="3"/><polygon points="178.0,402.0 532.0,402.0 550.0,433.0 532.0,464.0 178.0,464.0 160.0,433.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6" stroke-dasharray="7 5"/><text x="355.0" y="423.1" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Below the ladder: AI output</text><text x="355.0" y="437.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a lead to sources, not evidence (except of what</text><text x="355.0" y="453.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the tool produced)</text><line x1="582" y1="64" x2="582" y2="126" stroke="#1D1D1F" stroke-width="2"/><line x1="574" y1="64" x2="582" y2="64" stroke="#1D1D1F" stroke-width="2"/><line x1="574" y1="126" x2="582" y2="126" stroke="#1D1D1F" stroke-width="2"/><text x="594.0" y="87.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Funnel stage 2: the record</text><text x="594.0" y="102.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">of this claim (Chapter 8)</text><line x1="582" y1="146" x2="582" y2="372" stroke="#1D1D1F" stroke-width="2"/><line x1="574" y1="146" x2="582" y2="146" stroke="#1D1D1F" stroke-width="2"/><line x1="574" y1="372" x2="582" y2="372" stroke="#1D1D1F" stroke-width="2"/><text x="594.0" y="227.3" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Funnel stage 1: an</text><text x="594.0" y="243.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">independent check if the</text><text x="594.0" y="259.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">author or publisher can be</text><text x="594.0" y="274.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">named (rungs 1–2 rarely</text><text x="594.0" y="290.7" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">enough)</text><text x="400.0" y="486.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">A citation lifts a source only if the cited record holds this claim (or a narrower part of it). Opening</text><text x="400.0" y="501.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">the cited record does not raise this source&#x27;s rung: it gives you a second source, with its own rung.</text><text x="400.0" y="522.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rectangles = sources on the rungs · green = the record itself · dashed hexagon = not on the ladder ·</text><text x="400.0" y="537.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">thick dark border = the rung this figure marks · arrow = the rung you need</text></svg>