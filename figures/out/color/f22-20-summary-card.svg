<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Chapter 22 summary card</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="340" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Chapter 22 in six cards</text><rect x="20" y="50" width="240" height="110" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="140.0" y="87.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Date it</text><text x="140.0" y="127.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">every claim has an as-of date</text><rect x="280" y="50" width="240" height="110" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="87.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Status it</text><text x="400.0" y="119.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">measured · reported · forecast</text><text x="400.0" y="134.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">· the book&#x27;s inference</text><rect x="540" y="50" width="240" height="110" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="660.0" y="87.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Who could check?</text><text x="660.0" y="111.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">an outside source, a</text><text x="660.0" y="127.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">competition, a proof checker,</text><text x="660.0" y="142.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the field</text><rect x="20" y="180" width="240" height="110" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="140.0" y="217.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Half the time ≠ reliably</text><text x="140.0" y="241.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">50% and 80% horizons;</text><text x="140.0" y="257.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">benchmarks are someone else&#x27;s</text><text x="140.0" y="272.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">tasks</text><rect x="280" y="180" width="240" height="110" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="217.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Count the boundary</text><text x="400.0" y="249.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">per prompt vs. total; what the</text><text x="400.0" y="264.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">number includes</text><rect x="540" y="180" width="240" height="110" rx="16" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="660.0" y="217.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Check what aged</text><text x="660.0" y="249.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">facts, status or only names;</text><text x="660.0" y="264.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">set the next check</text><text x="400.0" y="316.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rounded = what you do next · written as of October 2026</text></svg>