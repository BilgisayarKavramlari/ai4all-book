<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A detector score is a guess about a text; process evidence shows how it was made</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="420" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">What a detector score can show, and what process evidence shows</text><polygon points="48.0,52.0 352.0,52.0 370.0,85.0 352.0,118.0 48.0,118.0 30.0,85.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="200.0" y="74.4" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A detector score</text><text x="200.0" y="98.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a number about the text</text><rect x="30" y="136" width="340" height="90" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="200.0" y="158.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Often rests on how predictable the words</text><text x="200.0" y="175.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">are</text><text x="200.0" y="191.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">plain, common wording can score as</text><text x="200.0" y="206.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">&quot;AI-like&quot;</text><rect x="30" y="244" width="340" height="90" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="200.0" y="274.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Cannot show who wrote it, or how</text><text x="200.0" y="299.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">its error rate for this writer and this</text><text x="200.0" y="314.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">text is unknown</text><rect x="430" y="52" width="340" height="66" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="600.0" y="74.4" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Process evidence</text><text x="600.0" y="98.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">a record of how you wrote</text><rect x="430" y="136" width="340" height="60" rx="16" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="600.0" y="166.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Notes and earlier drafts, dated</text><rect x="430" y="206" width="340" height="60" rx="16" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="600.0" y="236.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Version history and revision trace</text><rect x="430" y="276" width="340" height="60" rx="16" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="600.0" y="297.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Your declaration, and explaining your</text><text x="600.0" y="314.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">choices</text><text x="400.0" y="372.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Hexagon = a tool&#x27;s output · thick (hatched in print) = its limit · rounded green = records you keep</text><text x="400.0" y="390.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Sources: Liang et al. (2023); Weber-Wulff et al. (2023); OpenAI (2023, classifier withdrawn for low accuracy, as</text><text x="400.0" y="405.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">reported).</text></svg>