<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 426" width="800" height="426" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A camera records an event; a generator produces a plausible picture of none</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="426" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A camera records an event; a generator produces a plausible picture of none</text><text x="30.0" y="74.0" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Camera</text><rect x="20" y="92" width="172" height="104" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="106.0" y="127.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">An event</text><text x="106.0" y="164.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">something happened</text><path d="M194.0,144.0 L214.0,144.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="216" y="92" width="172" height="104" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="302.0" y="127.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Light from it</text><text x="302.0" y="164.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">reaches the lens</text><path d="M390.0,144.0 L410.0,144.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="412" y="92" width="172" height="104" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="498.0" y="127.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Camera sensor</text><text x="498.0" y="164.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">records the light</text><path d="M586.0,144.0 L606.0,144.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="608" y="92" width="172" height="104" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="694.0" y="127.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Photo file</text><text x="694.0" y="164.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">a record of the event</text><rect x="20" y="262" width="172" height="104" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="106.0" y="297.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Prompt + noise</text><text x="106.0" y="326.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">words and random</text><text x="106.0" y="342.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">speckle</text><path d="M194.0,314.0 L214.0,314.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="234.0,262.0 370.0,262.0 388.0,314.0 370.0,366.0 234.0,366.0 216.0,314.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="302.0" y="297.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Generator</text><text x="302.0" y="326.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">removes noise,</text><text x="302.0" y="342.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">steered by the prompt</text><path d="M390.0,314.0 L410.0,314.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="412" y="262" width="172" height="104" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="498.0" y="297.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Image file</text><text x="498.0" y="326.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">plausible for the</text><text x="498.0" y="342.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">prompt</text><path d="M586.0,314.0 L606.0,314.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="608" y="262" width="172" height="104" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="694.0" y="297.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">No event</text><text x="694.0" y="326.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">nothing behind the</text><text x="694.0" y="342.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">picture</text><text x="30.0" y="244.0" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Generator</text><text x="400.0" y="406.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Both files can look alike. Only one has an event behind it. Gray box = what is missing.</text></svg>