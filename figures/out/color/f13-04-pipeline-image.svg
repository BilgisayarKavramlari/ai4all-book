<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A generated image is built from noise toward the prompt, not looked up in a record</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="440" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A generated image is built from noise toward the prompt, not looked up in a record</text><rect x="20.0" y="96" width="113.33333333333333" height="132" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="76.7" y="140.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Prompt</text><text x="76.7" y="172.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">words</text><text x="76.7" y="188.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">describing the</text><text x="76.7" y="204.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">image</text><path d="M134.3,162.0 L148.3,162.0" fill="none" stroke="#1D1D1F" stroke-width="2.0" marker-end="url(#arrow-color)"/><rect x="149.33333333333331" y="96" width="113.33333333333333" height="132" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="206.0" y="140.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Text encoder</text><text x="206.0" y="172.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">turns the</text><text x="206.0" y="188.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">words into</text><text x="206.0" y="204.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">numbers</text><path d="M263.7,162.0 L277.7,162.0" fill="none" stroke="#1D1D1F" stroke-width="2.0" marker-end="url(#arrow-color)"/><rect x="278.66666666666663" y="96" width="113.33333333333333" height="132" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="335.3" y="140.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Random noise</text><text x="335.3" y="180.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the starting</text><text x="335.3" y="196.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">point</text><path d="M393.0,162.0 L407.0,162.0" fill="none" stroke="#1D1D1F" stroke-width="2.0" marker-end="url(#arrow-color)"/><polygon points="421.6,96.0 507.7,96.0 521.3,162.0 507.7,228.0 421.6,228.0 408.0,162.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="464.7" y="132.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Remove a</text><text x="464.7" y="149.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">little noise</text><text x="464.7" y="172.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">repeated many</text><text x="464.7" y="188.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">times, steered</text><text x="464.7" y="204.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">by the prompt</text><path d="M522.3,162.0 L536.3,162.0" fill="none" stroke="#1D1D1F" stroke-width="2.0" marker-end="url(#arrow-color)"/><path d="M490.7,232.0 Q464.7,258.0 438.7,232.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="464.7" y="268.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">loop: many steps</text><rect x="537.3333333333333" y="96" width="113.33333333333333" height="132" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="594.0" y="140.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Decoder</text><text x="594.0" y="172.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">turns the</text><text x="594.0" y="188.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">result into</text><text x="594.0" y="204.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">pixels</text><path d="M651.7,162.0 L665.7,162.0" fill="none" stroke="#1D1D1F" stroke-width="2.0" marker-end="url(#arrow-color)"/><rect x="666.6666666666665" y="96" width="113.33333333333333" height="132" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="723.3" y="140.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">New image</text><text x="723.3" y="164.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">plausible for</text><text x="723.3" y="180.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the prompt; no</text><text x="723.3" y="196.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">event behind</text><text x="723.3" y="212.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">it</text><rect x="170" y="300" width="460" height="64" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="400.0" y="324.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Training (earlier): very many images with captions; noise</text><text x="400.0" y="339.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">added; settings adjusted to predict and remove it</text><path d="M400.0,300.0 L400.0,262.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="400.0" y="400.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rounded = what a person provides · hexagon = AI step · gray box = the earlier training stage</text><text x="400.0" y="424.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Sources: Ho et al. (2020); Rombach et al. (2022), which works in a compressed (latent) version of the image.</text></svg>