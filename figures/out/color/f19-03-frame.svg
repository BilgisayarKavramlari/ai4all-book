<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 455" width="800" height="455" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Every field guide answers the same five questions</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="455" fill="#FFFFFF"/><rect x="300" y="150" width="200" height="90" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="400.0" y="185.2" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Your task, in your</text><text x="400.0" y="204.8" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">field</text><rect x="40" y="40" width="210" height="80" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="145.0" y="67.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Typical uses</text><text x="145.0" y="96.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">your row of the use map</text><rect x="540" y="40" width="210" height="80" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="645.0" y="67.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">What to verify</text><text x="645.0" y="96.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">and who can confirm it</text><rect x="20" y="290" width="210" height="80" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="125.0" y="317.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Data cautions</text><text x="125.0" y="338.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the course floor and your</text><text x="125.0" y="353.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">field&#x27;s records</text><rect x="300" y="300" width="210" height="80" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="405.0" y="327.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Field rules</text><text x="405.0" y="356.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">nearest first, dated</text><rect x="580" y="290" width="210" height="80" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="685.0" y="317.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Career note</text><text x="685.0" y="346.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">how employers ask about it</text><path d="M300.0,175.0 L252.0,122.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M500.0,175.0 L548.0,122.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M300.0,225.0 L232.0,290.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M400.0,242.0 L403.0,298.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M500.0,225.0 L588.0,290.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="400.0" y="402.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Every field guide (19.F1–19.F7) answers the same five questions, plus one fairness question and the default</text><text x="400.0" y="417.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">people point.</text><text x="400.0" y="436.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rounded = a person · rectangle = a part of the guide</text></svg>