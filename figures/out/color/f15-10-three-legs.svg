<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Private data, untrusted content and a way to send data out: remove any one and this route for stealing data closes</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="500" fill="#FFFFFF"/><polygon points="318.0,160.0 482.0,160.0 500.0,205.0 482.0,250.0 318.0,250.0 300.0,205.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="400.0" y="205.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">One AI system</text><rect x="40" y="40" width="200" height="90" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="140.0" y="70.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Private data</text><text x="140.0" y="95.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">it can read your mail,</text><text x="140.0" y="110.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">files or records</text><rect x="560" y="40" width="200" height="90" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="660.0" y="70.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Untrusted content</text><text x="660.0" y="95.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">it receives text a</text><text x="660.0" y="110.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">stranger can write</text><rect x="300" y="320" width="200" height="90" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="400.0" y="350.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">A way to send data out</text><text x="400.0" y="375.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">it can send messages or</text><text x="400.0" y="390.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">load links</text><path d="M240.0,110.0 L312.0,168.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M560.0,110.0 L488.0,168.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M400.0,252.0 L400.0,318.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="400.0" y="431.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Remove any one leg and this route for stealing data closes. Injected text can still change the outputs,</text><text x="400.0" y="448.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">so they still need a check.</text><text x="400.0" y="482.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">After Willison (2025), who calls the combination the lethal trifecta · thick = a leg</text></svg>