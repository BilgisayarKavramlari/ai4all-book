<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 474" width="800" height="474" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Fact-checkers learned more about a site by leaving it</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="474" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Vertical and lateral reading of the same website</text><rect x="14" y="168" width="150" height="92" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="89.0" y="204.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">An unfamiliar</text><text x="89.0" y="223.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">website</text><text x="500.0" y="56.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Vertical reading</text><path d="M166.0,214.0 L204.0,116.0" fill="none" stroke="#1D1D1F" stroke-width="2.0" marker-end="url(#arrow-color)"/><rect x="206" y="70" width="176" height="92" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="294.0" y="101.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Stay on the page</text><text x="294.0" y="134.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">read it carefully</text><path d="M384.0,116.0 L400.0,116.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="402" y="70" width="176" height="92" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="490.0" y="92.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Judge it by its</text><text x="490.0" y="109.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">looks</text><text x="490.0" y="126.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">logos, About page,</text><text x="490.0" y="142.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">.org, references</text><path d="M580.0,116.0 L596.0,116.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="598" y="70" width="176" height="92" rx="16" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="686.0" y="101.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Often taken in</text><text x="686.0" y="126.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">historians and</text><text x="686.0" y="142.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">students in the study</text><text x="500.0" y="392.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Lateral reading</text><path d="M166.0,214.0 L204.0,328.0" fill="none" stroke="#1D1D1F" stroke-width="2.0" marker-end="url(#arrow-color)"/><rect x="206" y="282" width="176" height="92" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="294.0" y="313.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Leave early</text><text x="294.0" y="338.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">often within about</text><text x="294.0" y="354.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">half a minute</text><path d="M384.0,328.0 L400.0,328.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="402" y="282" width="176" height="92" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="490.0" y="313.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Ask outside sources</text><text x="490.0" y="338.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">who is behind it, and</text><text x="490.0" y="354.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">who pays?</text><path d="M580.0,328.0 L596.0,328.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="598" y="282" width="176" height="92" rx="16" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="686.0" y="313.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Return with evidence</text><text x="686.0" y="338.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">fact-checkers: faster,</text><text x="686.0" y="354.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">more accurate</text><text x="400.0" y="428.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rounded = what the reader does · thick (hatched in print) = the risk · green = the better result</text><text x="400.0" y="452.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">After Wineburg &amp; McGrew (2019): 10 fact-checkers, 10 historians, 25 undergraduates.</text></svg>