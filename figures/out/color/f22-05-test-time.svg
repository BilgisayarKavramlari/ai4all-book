<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A reasoning model spends extra tokens before it answers, and they cost time and money</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="440" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A reasoning model produces extra tokens before its answer</text><rect x="20" y="70" width="150" height="80" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="95.0" y="110.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Your prompt</text><polygon points="238.0,60.0 352.0,60.0 370.0,110.0 352.0,160.0 238.0,160.0 220.0,110.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="295.0" y="110.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Model</text><rect x="420" y="60" width="200" height="100" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="520.0" y="94.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Reasoning tokens</text><text x="520.0" y="122.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">often hidden; counted in</text><text x="520.0" y="137.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">time and cost</text><rect x="660" y="70" width="120" height="80" rx="3" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="720.0" y="110.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Answer</text><path d="M172.0,110.0 L218.0,110.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M372.0,110.0 L418.0,110.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M622.0,110.0 L658.0,110.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="20" y="200" width="360" height="90" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="200.0" y="230.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Earlier chat model: answer right away</text><text x="200.0" y="263.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">less computation at answer time</text><rect x="420" y="200" width="360" height="90" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="600.0" y="230.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Reasoning model: more tokens first</text><text x="600.0" y="255.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">test-time compute: more computation spent per</text><text x="600.0" y="270.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">answer</text><rect x="20" y="320" width="760" height="70" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="400.0" y="347.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Outside tests: large gains on math and code (measured). Factual errors remain and depend on the</text><text x="400.0" y="362.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">task (one developer&#x27;s test: reported).</text><text x="400.0" y="420.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Hexagon = AI · the reasoning text is generated like any other text: a claim to check (Chapter 17)</text></svg>