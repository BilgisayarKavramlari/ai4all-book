<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A sharing option widened the seen-by box to anyone with a search engine</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="510" fill="#FFFFFF"/><rect x="20" y="190" width="110" height="80" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="75.0" y="217.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">You</text><text x="75.0" y="246.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">or your team</text><rect x="150" y="190" width="140" height="80" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="220.0" y="217.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Input</text><text x="220.0" y="238.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">typed, pasted,</text><text x="220.0" y="253.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">uploaded</text><rect x="340" y="62" width="170" height="70" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="425.0" y="85.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Connectors</text><text x="425.0" y="103.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">other apps it reads</text><text x="425.0" y="118.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">or sends to</text><polygon points="348.0,185.0 502.0,185.0 520.0,230.0 502.0,275.0 348.0,275.0 330.0,230.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="425.0" y="215.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">AI tool</text><text x="425.0" y="240.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the model, at the</text><text x="425.0" y="255.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">provider</text><rect x="330" y="330" width="140" height="86" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="359.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Storage</text><text x="400.0" y="382.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">history, memory,</text><text x="400.0" y="398.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">logs, backups</text><rect x="488" y="330" width="150" height="86" rx="16" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="563.0" y="359.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Seen by</text><text x="563.0" y="382.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">reviewers, admins,</text><text x="563.0" y="398.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">people with a link</text><rect x="656" y="330" width="128" height="86" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="720.0" y="359.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Reuse</text><text x="720.0" y="382.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">training future</text><text x="720.0" y="398.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">models?</text><rect x="548" y="190" width="110" height="80" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="603.0" y="217.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Output</text><text x="603.0" y="246.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the response</text><rect x="676" y="185" width="108" height="90" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="730.0" y="215.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Recipients</text><text x="730.0" y="240.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">anyone it is</text><text x="730.0" y="255.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">forwarded to</text><path d="M132.0,230.0 L148.0,230.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M292.0,230.0 L330.0,230.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M520.0,230.0 L546.0,230.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M660.0,230.0 L674.0,230.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M425.0,134.0 L425.0,183.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M445.0,183.0 L445.0,134.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M405.0,277.0 L405.0,328.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M472.0,373.0 L486.0,373.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M640.0,373.0 L654.0,373.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="306" y="46" width="12" height="400" fill="#D9DEE6" stroke="none"/><text x="312.0" y="28.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Trust boundary</text><text x="302.0" y="50.0" font-size="13" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">← your side</text><text x="322.0" y="50.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">someone else&#x27;s rules →</text><text x="563.0" y="418.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">anyone using a search</text><text x="563.0" y="434.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">engine, once a shared</text><text x="563.0" y="449.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">chat was made findable</text><text x="730.0" y="296.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">people with the</text><text x="730.0" y="311.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">link</text><text x="400.0" y="472.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">C20 (2025): an opt-in sharing option widened who could see a chat. The option was removed.</text><text x="400.0" y="488.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rounded = people · hexagon = AI · rectangle = a place data goes · shaded box = depends on the terms · shaded band =</text><text x="400.0" y="503.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">trust boundary · thick = the risk</text></svg>