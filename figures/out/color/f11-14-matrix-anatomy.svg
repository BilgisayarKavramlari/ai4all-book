ddle" dominant-baseline="middle" fill="#1D1D1F" style="">years of experience stand in</text><text x="140.0" y="346.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">for skill</text><rect x="280" y="290" width="240" height="70" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="400.0" y="313.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2 Weight: a judgment</text><text x="400.0" y="331.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">even equal weights are a</text><text x="400.0" y="346.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">choice</text><rect x="540" y="290" width="240" height="70" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="660.0" y="313.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3 Blank: scored how?</text><text x="660.0" y="339.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">C&#x27;s interview was not yet held</text><rect x="20" y="372" width="240" height="70" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="140.0" y="395.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">4 Scale: what counts as 10?</text><text x="140.0" y="413.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">fixed ranges set each 0–10</text><text x="140.0" y="428.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">score</text><rect x="280" y="372" width="240" height="70" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="400.0" y="395.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">5 Margin: how close?</text><text x="400.0" y="421.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">E leads B (6.94) by 0.06 of 10</text><rect x="540" y="372" width="240" height="70" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="660.0" y="395.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">6 Reason: who decides?</text><text x="660.0" y="413.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the owner, with reasons on</text><text x="660.0" y="428.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">record</text><text x="400.0" y="462.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Constructed internship shortlist from section 11.5: three of six candidates, all five criteria. Scaled score =</text><text x="400.0" y="477.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">(value − low end) ÷ (high end − low end) × 10; total = sum of weight × scaled score.</text><text x="400.0" y="504.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Numbered circles point to the cells each note describes · dashed cell with thick border = a blank · rounded = a</text><text x="400.0" y="519.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">judgment someone made</text></svg>