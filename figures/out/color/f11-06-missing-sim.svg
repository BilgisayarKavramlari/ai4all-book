  <g id="text_26">
   <text style="fill: #1d1d1f; font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(105.505 359.092906)">Simulated data: 1,000 constructed logs per condition, seed 11, three events, eight shifts each</text>
   <text style="fill: #1d1d1f; font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(105.505 369.730828)">(data/ch11_missing_sim.csv; parameters in data/ch11_experiments_meta.txt). As in the chapter's log, long shifts</text>
   <text style="fill: #1d1d1f; font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(105.505 380.632969)">earn less per hour in the simulation. A teaching simulation, not a study of real events.</text>
