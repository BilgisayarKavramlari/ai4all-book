<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>IMO 2025: the same score, three kinds of check</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="490" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">IMO 2025: the same score, three kinds of check</text><rect x="20" y="50" width="236" height="64" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="138.0" y="82.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Graded by the competition</text><polygon points="38.0,132.0 238.0,132.0 256.0,188.0 238.0,244.0 38.0,244.0 20.0,188.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="138.0" y="180.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Gemini Deep Think: 35 of 42,</text><text x="138.0" y="195.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">natural language, 4.5 hours</text><path d="M138.0,116.0 L138.0,130.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="138.0" y="262.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">measured: IMO coordinators (as</text><text x="138.0" y="277.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">DeepMind&#x27;s post states)</text><rect x="282" y="50" width="236" height="64" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="73.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Graded in the developer&#x27;s</text><text x="400.0" y="90.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">own evaluation</text><polygon points="300.0,132.0 500.0,132.0 518.0,188.0 500.0,244.0 300.0,244.0 282.0,188.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="400.0" y="180.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">OpenAI experimental model: 35</text><text x="400.0" y="195.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">of 42</text><path d="M400.0,116.0 L400.0,130.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="400.0" y="262.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">reported: three former medalists,</text><text x="400.0" y="277.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">according to OpenAI</text><rect x="544" y="50" width="236" height="64" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="662.0" y="82.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Checked by a proof program</text><polygon points="562.0,132.0 762.0,132.0 780.0,188.0 762.0,244.0 562.0,244.0 544.0,188.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="662.0" y="172.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Seed Prover: 30 of 42 after</text><text x="662.0" y="188.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">about 3 days · Aristotle: gold</text><text x="662.0" y="203.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">level</text><path d="M662.0,116.0 L662.0,130.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="662.0" y="254.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">measured: each proof&#x27;s validity</text><text x="662.0" y="270.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">(Lean) · scores reported by the</text><text x="662.0" y="285.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">developers</text><rect x="20" y="320" width="760" height="62" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="400.0" y="343.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">What no check covered: how much computing was used, or whether people helped (the IMO president,</text><text x="400.0" y="358.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">reported by AFP)</text><rect x="20" y="398" width="760" height="50" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="423.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Human context (AFP): 641 students; about 10% won gold; five scored 42 of 42</text><text x="400.0" y="462.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Hexagon = an AI system&#x27;s result · rounded = who checked it · Seed Prover&#x27;s score: IMO-confirmed, according to</text><text x="400.0" y="477.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">ByteDance</text></svg>