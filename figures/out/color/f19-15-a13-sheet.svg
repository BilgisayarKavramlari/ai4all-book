<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Your A13 records field answers, the build, the runs, the peer test and the card</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="390" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A13 record (one page)</text><rect x="30" y="44" width="236" height="88" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="148.0" y="88.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">1. Task and field answers</text><rect x="282" y="44" width="236" height="88" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="3"/><text x="400.0" y="88.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">2. The build (rerunnable)</text><rect x="534" y="44" width="236" height="88" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="3"/><text x="652.0" y="88.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">3. Three runs and checks</text><rect x="30" y="148" width="236" height="88" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="148.0" y="192.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">4. Safeguards table</text><rect x="282" y="148" width="236" height="88" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="3"/><text x="400.0" y="192.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">5. Peer test</text><rect x="534" y="148" width="236" height="88" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="652.0" y="192.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">6. Revision and rerun</text><rect x="30" y="252" width="236" height="88" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="148.0" y="296.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">7. Workflow card</text><rect x="282" y="252" width="236" height="88" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="286.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">8. Defense: one result,</text><text x="400.0" y="305.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">one limit</text><rect x="534" y="252" width="236" height="88" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="652.0" y="296.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">9. AI Use Declaration</text><text x="400.0" y="372.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Thick = the new work A13 is graded on: build, runs, peer test (with checks, safeguards, card and defense)</text></svg>