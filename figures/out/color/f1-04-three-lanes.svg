L608.0,82.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="610" y="40" width="170" height="84" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="695.0" y="74.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">You choose and read a</text><text x="695.0" y="89.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">source</text><text x="20.0" y="232.0" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Generative model</text><rect x="210" y="190" width="170" height="84" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="295.0" y="232.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Your prompt</text><path d="M382.0,232.0 L408.0,232.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="428.0,190.0 562.0,190.0 580.0,232.0 562.0,274.0 428.0,274.0 410.0,232.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6" stroke-dasharray="7 5"/><text x="495.0" y="224.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Model writes new</text><text x="495.0" y="239.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">text, piece by piece</text><path d="M582.0,232.0 L608.0,232.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="610" y="190" width="170" height="84" rx="16" fill="#C2410C" stroke="#7A2808" stroke-width="1.6"/><text x="695.0" y="224.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">You must verify every</text><text x="695.0" y="239.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">claim</text><text x="20.0" y="382.0" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Search-then-generate tool</text><rect x="210" y="340" width="170" height="84" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="295.0" y="382.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Your prompt</text><path d="M382.0,382.0 L408.0,382.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="428.0,340.0 562.0,340.0 580.0,382.0 562.0,424.0 428.0,424.0 410.0,382.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6" stroke-dasharray="7 5"/><text x="495.0" y="374.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Searches, then writes</text><text x="495.0" y="389.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">new text with links</text><path d="M582.0,382.0 L608.0,382.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="610" y="340" width="170" height="84" rx="16" fill="#C2410C" stroke="#7A2808" stroke-width="1.6"/><text x="695.0" y="366.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Check each claim</text><text x="695.0" y="382.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">against its cited</text><text x="695.0" y="397.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">page</text><text x="400.0" y="488.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Dashed outline = output may be wrong · hexagon = AI component · rounded = you</text></svg>