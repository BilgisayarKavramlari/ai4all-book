<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 495" width="800" height="495" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Generative AI is a branch of machine learning, not a different kind of thing</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="495" fill="#FFFFFF"/><rect x="20" y="20" width="760" height="440" rx="16" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.6"/><text x="38.0" y="44.0" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Artificial intelligence</text><text x="38.0" y="68.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Systems that do tasks we associate with intelligence · e.g., a rule-based expert system</text><rect x="60" y="94" width="680" height="354" rx="16" fill="#EEF2F7" stroke="#1D1D1F" stroke-width="1.6"/><text x="78.0" y="118.0" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Machine learning</text><text x="78.0" y="142.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Learns rules from data · e.g., a credit-scoring model</text><rect x="100" y="168" width="600" height="268" rx="16" fill="#D5DFEC" stroke="#1D1D1F" stroke-width="1.6"/><text x="118.0" y="192.0" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Deep learning</text><text x="118.0" y="216.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Many layers of simple units · e.g., photo recognition</text><rect x="140" y="242" width="520" height="182" rx="16" fill="#FCE38A" stroke="#1D1D1F" stroke-width="2.4" stroke-dasharray="7 5"/><text x="158.0" y="266.0" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Generative AI</text><text x="158.0" y="290.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Produces new content · e.g., an image generator</text><rect x="180" y="316" width="440" height="96" rx="16" fill="#F7D24D" stroke="#1D1D1F" stroke-width="1.6" stroke-dasharray="7 5"/><text x="198.0" y="340.0" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Large language models</text><text x="198.0" y="364.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Generate text · e.g., today&#x27;s chat tools</text><text x="400.0" y="478.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Each box sits inside the one around it. Dashed = generates content; same learning loop, much larger scale.</text></svg>