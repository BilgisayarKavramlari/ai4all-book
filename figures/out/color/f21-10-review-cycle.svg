<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" width="800" height="366" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A review date or a trigger sends you back to your marks before you revise</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="366" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A review date or a trigger sends you back to your marks before you revise</text><polygon points="111.0,62.0 206.0,117.0 111.0,172.0 16.0,117.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="111.0" y="101.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Review date</text><text x="111.0" y="117.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">reached, or a</text><text x="111.0" y="132.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">review trigger?</text><path d="M208.0,117.0 L234.0,117.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="221.0" y="107.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">yes</text><rect x="236" y="72" width="200" height="90" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="336.0" y="102.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Reread your marks</text><text x="336.0" y="127.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">which triggers fired,</text><text x="336.0" y="142.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">which never did</text><rect x="476" y="44" width="176" height="64" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="564.0" y="65.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Keep</text><text x="564.0" y="88.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">it fired and held</text><path d="M438.0,117.0 L474.0,76.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M654.0,76.0 L678.0,145.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="476" y="118" width="176" height="64" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="564.0" y="139.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Revise</text><text x="564.0" y="154.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">it failed, or a rule</text><text x="564.0" y="170.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">changed</text><path d="M438.0,117.0 L474.0,150.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M654.0,150.0 L678.0,145.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="476" y="192" width="176" height="64" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="564.0" y="213.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Retire</text><text x="564.0" y="236.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">it no longer applies</text><path d="M438.0,117.0 L474.0,224.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M654.0,224.0 L678.0,145.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="680" y="110" width="108" height="70" rx="16" fill="#4CAF84" stroke="#1F5E43" stroke-width="3"/><text x="734.0" y="136.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Set the next</text><text x="734.0" y="153.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">date</text><line x1="734" y1="182" x2="734" y2="262" stroke="#1D1D1F" stroke-width="1.4"/><line x1="734" y1="262" x2="111" y2="262" stroke="#1D1D1F" stroke-width="1.4"/><path d="M111.0,262.0 L111.0,176.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="420.0" y="280.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">the next date starts the cycle again</text><text x="400.0" y="306.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Review triggers: Chapter 12&#x27;s re-test triggers (a model update or retirement, a change in price or terms, a new</text><text x="400.0" y="321.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">kind of input, a change of job or school), plus a new rule from someone who binds you and a failure you met.</text><text x="400.0" y="352.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Diamond = a test · rectangle = a step · rounded = your decision</text></svg>