<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" width="800" height="456" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>AI suggestions can pull different writers toward the same phrasing</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="456" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">AI suggestions can pull different writers toward the same phrasing</text><rect x="20" y="52" width="210" height="78" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="125.0" y="78.5" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Writer A</text><text x="125.0" y="98.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a specific example from</text><text x="125.0" y="114.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">home</text><path d="M232.0,91.0 L318.0,220.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="20" y="144" width="210" height="78" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="125.0" y="170.5" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Writer B</text><text x="125.0" y="198.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a hedge: &quot;I think&quot;</text><path d="M232.0,183.0 L318.0,220.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="20" y="236" width="210" height="78" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="125.0" y="262.5" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Writer C</text><text x="125.0" y="290.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a local turn of phrase</text><path d="M232.0,275.0 L318.0,220.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="20" y="328" width="210" height="78" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="125.0" y="354.5" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Writer D</text><text x="125.0" y="382.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">an exact number</text><path d="M232.0,367.0 L318.0,220.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="340.0,176.0 474.0,176.0 492.0,220.0 474.0,264.0 340.0,264.0 322.0,220.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="407.0" y="205.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">AI suggestions</text><text x="407.0" y="229.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">likely, common</text><text x="407.0" y="245.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">wording</text><path d="M494.0,220.0 L538.0,220.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="542" y="150" width="236" height="140" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="660.0" y="188.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Drafts that sound more</text><text x="660.0" y="206.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">alike</text><text x="660.0" y="240.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">fewer specifics, lost nuances,</text><text x="660.0" y="255.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">more stock phrases</text><text x="660.0" y="322.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Studies: stories with AI ideas were</text><text x="660.0" y="338.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">more alike (Doshi &amp; Hauser, 2024);</text><text x="660.0" y="354.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">autocomplete moved Indian</text><text x="660.0" y="369.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">participants toward Western styles</text><text x="660.0" y="385.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">(Agarwal et al., 2025).</text><text x="400.0" y="434.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rounded = writers · hexagon = AI · grammar checkers were not tested: that they also pull is this book&#x27;s inference</text></svg>