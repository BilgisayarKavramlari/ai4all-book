<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Someone must choose which error matters more, and say who was asked</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="260" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Who decides what is fair, and on what record</text><rect x="10" y="76" width="148" height="88" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="84.0" y="105.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The decision</text><text x="84.0" y="129.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">is AI needed for</text><text x="84.0" y="145.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">it at all?</text><path d="M160.0,120.0 L166.0,120.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="249.0,60.0 330.0,120.0 249.0,180.0 168.0,120.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="249.0" y="92.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Which error</text><text x="249.0" y="109.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">harms whom?</text><text x="249.0" y="136.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a miss or a</text><text x="249.0" y="151.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">false flag</text><path d="M332.0,120.0 L338.0,120.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="340" y="76" width="140" height="88" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="410.0" y="97.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Fairness</text><text x="410.0" y="114.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">definition</text><text x="410.0" y="129.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">and the trade-off</text><text x="410.0" y="145.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">accepted</text><path d="M482.0,120.0 L488.0,120.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="490" y="76" width="145" height="88" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="562.5" y="97.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">People affected</text><text x="562.5" y="114.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">asked</text><text x="562.5" y="129.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">stakeholders, not</text><text x="562.5" y="145.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">only users</text><path d="M637.0,120.0 L643.0,120.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="645" y="76" width="145" height="88" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="717.5" y="97.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Decision owner</text><text x="717.5" y="114.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">records</text><text x="717.5" y="129.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">the choice and its</text><text x="717.5" y="145.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">reason</text><text x="400.0" y="214.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The numbers show what each choice costs; people decide which cost is acceptable.</text><text x="400.0" y="244.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rectangle = step · diamond = a judgment · rounded = people</text></svg>