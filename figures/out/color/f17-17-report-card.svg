<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 505" width="800" height="505" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Your report says what the person is told and where each statement came from</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="505" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Your report says what the person is told and where each statement came from</text><rect x="60" y="50" width="680" height="52" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="67.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">1. Decision, role, owner</text><text x="400.0" y="86.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">informs · recommends · triggers; who answers for it</text><rect x="60" y="110" width="680" height="52" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="127.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2. Layer audit</text><text x="400.0" y="146.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">six layers: present · partly · missing, and where you looked</text><rect x="60" y="170" width="680" height="52" rx="16" fill="#4CAF84" stroke="#1F5E43" stroke-width="3"/><text x="400.0" y="187.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">3. The explanation (≤ 150 words)</text><text x="400.0" y="206.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">decision · reasons · what would change it · unknowns · contest</text><rect x="60" y="230" width="680" height="52" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="247.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">4. Faithfulness record</text><text x="400.0" y="266.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">each statement: rule or record · approximation · self-account</text><rect x="60" y="290" width="680" height="52" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="307.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">5. Revision</text><text x="400.0" y="326.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">after reading it aloud as the person affected</text><rect x="60" y="350" width="680" height="52" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="367.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">6. Judgment</text><text x="400.0" y="386.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">what the person still cannot learn, and who should fix it</text><rect x="60" y="410" width="680" height="52" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="427.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">7. AI Use Declaration</text><text x="400.0" y="446.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">tools · purpose · accepted/rejected/revised · how verified</text><text x="400.0" y="488.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rounded, thick = the part the person reads · rectangles = your working record</text></svg>