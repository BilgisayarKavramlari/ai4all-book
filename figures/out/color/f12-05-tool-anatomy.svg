<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A tool is a model plus what it receives, what it can do, where it runs and whose terms cover it</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="490" fill="#FFFFFF"/><polygon points="328.0,190.0 472.0,190.0 490.0,235.0 472.0,280.0 328.0,280.0 310.0,235.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="400.0" y="220.6" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Model</text><text x="400.0" y="253.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">settings (parameters)</text><rect x="220" y="30" width="360" height="100" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="64.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">What it receives</text><text x="400.0" y="92.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">your prompt · files you upload · your mail</text><text x="400.0" y="107.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">and documents · web pages it retrieves</text><rect x="20" y="180" width="250" height="110" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="145.0" y="217.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">What it can do</text><text x="145.0" y="249.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">produce text · search · run</text><text x="145.0" y="264.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">code · act for you (Chapter 14)</text><rect x="530" y="180" width="250" height="110" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="655.0" y="217.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Where it runs</text><text x="655.0" y="233.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">provider&#x27;s service ·</text><text x="655.0" y="249.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">institution&#x27;s license ·</text><text x="655.0" y="264.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">hardware you or your</text><text x="655.0" y="280.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">institution control</text><rect x="220" y="340" width="360" height="100" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3"/><text x="400.0" y="374.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Whose terms cover your input</text><text x="400.0" y="402.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">used for training? · kept how long, seen by</text><text x="400.0" y="417.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">whom? · consumer or institutional contract</text><line x1="400" y1="130" x2="400" y2="190" stroke="#1D1D1F" stroke-width="1.6"/><line x1="270" y1="235" x2="310" y2="235" stroke="#1D1D1F" stroke-width="1.6"/><line x1="490" y1="235" x2="530" y2="235" stroke="#1D1D1F" stroke-width="1.6"/><line x1="400" y1="280" x2="400" y2="340" stroke="#1D1D1F" stroke-width="1.6"/><text x="400.0" y="462.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Two tools built on the same model can differ in all four. Thick border: the part that decides the data gate</text><text x="400.0" y="477.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">(section 12.5).</text></svg>