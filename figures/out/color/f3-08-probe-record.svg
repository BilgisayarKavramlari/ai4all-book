<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A probe turns a guess about a model into evidence</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="470" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A probe record (worked example)</text><rect x="20" y="46" width="190" height="76" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="115.0" y="84.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">1. Prediction</text><path d="M212.0,84.0 L236.0,84.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="240.0" y="75.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">The model will miscount the letter r in “strawberry”, because it receives</text><text x="240.0" y="92.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">tokens, not letters.</text><path d="M115.0,124.0 L115.0,136.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="20" y="138" width="190" height="76" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="115.0" y="176.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2. Prompt</text><path d="M212.0,176.0 L236.0,176.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="240.0" y="167.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">“How many times does the letter r appear in the word strawberry? Answer</text><text x="240.0" y="184.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">with a number.”</text><path d="M115.0,216.0 L115.0,228.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="38.0,230.0 192.0,230.0 210.0,268.0 192.0,306.0 38.0,306.0 20.0,268.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6" stroke-dasharray="7 5"/><text x="115.0" y="268.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3. Result</text><path d="M212.0,268.0 L236.0,268.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="240.0" y="259.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Constructed example: “3”. Correct. Asked to spell the word letter by</text><text x="240.0" y="276.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">letter first: also 3.</text><path d="M115.0,308.0 L115.0,320.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="20" y="322" width="190" height="76" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="115.0" y="360.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">4. Conclusion</text><path d="M212.0,360.0 L236.0,360.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="240.0" y="342.9" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">My prediction was wrong for this tool on this date. One correct answer</text><text x="240.0" y="360.0" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">does not show the tool counts letters reliably; I would test five more</text><text x="240.0" y="377.1" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">words.</text><text x="400.0" y="432.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Also record: the tool, the model name if shown, the options used (search on or off) and the date.</text><text x="400.0" y="454.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rounded = your decisions · hexagon (dashed) = the model&#x27;s output, which may be wrong</text></svg>