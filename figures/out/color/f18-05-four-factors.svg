<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Fair use is weighed factor by factor, and market harm carries great weight</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="420" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Fair use (17 U.S.C. § 107): four factors, weighed together</text><polygon points="110.0,46.0 180.0,94.0 110.0,142.0 40.0,94.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="110.0" y="94.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">1. Purpose</text><text x="110.0" y="158.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">new purpose? commercial?</text><path d="M110.0,176.0 L340.0,214.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="302.0,46.0 372.0,94.0 302.0,142.0 232.0,94.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="302.0" y="94.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2. Nature</text><text x="302.0" y="158.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">creative or factual?</text><path d="M302.0,176.0 L380.0,214.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="494.0,46.0 564.0,94.0 494.0,142.0 424.0,94.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="494.0" y="94.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3. Amount</text><text x="494.0" y="150.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">how much, and was it</text><text x="494.0" y="165.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">needed?</text><path d="M494.0,176.0 L420.0,214.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="686.0,46.0 756.0,94.0 686.0,142.0 616.0,94.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3"/><text x="686.0" y="94.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">4. Market</text><text x="686.0" y="150.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">does it replace the</text><text x="686.0" y="165.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">original?</text><path d="M686.0,176.0 L460.0,214.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="270" y="216" width="260" height="56" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="234.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Weighed together, case by</text><text x="400.0" y="253.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">case</text><path d="M330.0,274.0 L220.0,312.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M470.0,274.0 L580.0,312.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="110" y="314" width="220" height="60" rx="16" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="220.0" y="344.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Fair use: allowed</text><rect x="470" y="314" width="220" height="60" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="580.0" y="334.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Not fair use:</text><text x="580.0" y="353.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">infringement</text><text x="400.0" y="392.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Diamond = a question the court asks · thick = carries great weight (the trial court in Ross called it the most</text><text x="400.0" y="407.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">important) · rounded = a court&#x27;s decision</text></svg>