<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Consultants who solved the hard task split the work with the tool in different ways</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="380" fill="#FFFFFF"/><rect x="20" y="40" width="240" height="170" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="140.0" y="97.8" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Centaurs, about 14%</text><text x="140.0" y="141.9" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">divide the work: decide</text><text x="140.0" y="159.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">which parts go to the tool,</text><text x="140.0" y="176.1" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">keep the rest</text><text x="140.0" y="240.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">≈ a fit matrix in practice</text><rect x="280" y="40" width="240" height="170" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="97.8" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Cyborgs, about 60%</text><text x="400.0" y="141.9" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">work with the tool turn by</text><text x="400.0" y="159.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">turn, down to sentences and</text><text x="400.0" y="176.1" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">subtasks</text><text x="400.0" y="240.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">≈ augmentation</text><rect x="540" y="40" width="240" height="170" rx="16" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="660.0" y="87.4" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Self-automators, about</text><text x="660.0" y="108.2" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">27%</text><text x="660.0" y="141.9" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">hand over the whole task in</text><text x="660.0" y="159.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">one or two exchanges, with</text><text x="660.0" y="176.1" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">little review</text><text x="660.0" y="240.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">≈ automation without its check</text><text x="400.0" y="292.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Centaurs and cyborgs: Dell&#x27;Acqua et al. (2023). Self-automators and shares (244 consultants): Randazzo et al.</text><text x="400.0" y="307.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">(2025), as summarized by the authors.</text><text x="400.0" y="338.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Mapping onto the Delegation Ladder (italic) is this book&#x27;s reading. Thick border: the pattern with the least</text><text x="400.0" y="353.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">review.</text></svg>