<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 478" width="800" height="478" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Six invented cases went from a court filing to a sanctions order in under four months</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="478" fill="#FFFFFF"/><line x1="24" y1="200" x2="776" y2="200" stroke="#1D1D1F" stroke-width="2.4"/><polygon points="28.6,34.0 121.4,34.0 136.0,107.0 121.4,180.0 28.6,180.0 14.0,107.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="75.0" y="83.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Mar 1, 2023</text><text x="75.0" y="112.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Filing cites</text><text x="75.0" y="128.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">cases ChatGPT</text><text x="75.0" y="144.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">made up (¶¶ 5,</text><text x="75.0" y="160.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">36)</text><line x1="75" y1="180" x2="75" y2="200" stroke="#1D1D1F" stroke-width="1.4"/><circle cx="75" cy="200" r="5" fill="#1D1D1F"/><rect x="143" y="222" width="122" height="146" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="204.0" y="271.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Mar 15</text><text x="204.0" y="300.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Avianca&#x27;s</text><text x="204.0" y="316.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">lawyers cannot</text><text x="204.0" y="332.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">find most of</text><text x="204.0" y="348.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the cases (¶ 7)</text><line x1="204" y1="222" x2="204" y2="200" stroke="#1D1D1F" stroke-width="1.4"/><circle cx="204" cy="200" r="5" fill="#1D1D1F"/><rect x="272" y="34" width="122" height="146" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="333.0" y="83.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Apr 11–12</text><text x="333.0" y="112.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Court orders</text><text x="333.0" y="128.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">copies of the</text><text x="333.0" y="144.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">decisions (¶</text><text x="333.0" y="160.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">13)</text><line x1="333" y1="180" x2="333" y2="200" stroke="#1D1D1F" stroke-width="1.4"/><circle cx="333" cy="200" r="5" fill="#1D1D1F"/><rect x="401" y="222" width="122" height="146" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="1.6"/><text x="462.0" y="271.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Apr 25</text><text x="462.0" y="284.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Affidavit</text><text x="462.0" y="300.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">attaches</text><text x="462.0" y="316.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">excerpts of</text><text x="462.0" y="332.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">fake</text><text x="462.0" y="348.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">“decisions” (¶¶</text><text x="462.0" y="363.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">20–22)</text><line x1="462" y1="222" x2="462" y2="200" stroke="#1D1D1F" stroke-width="1.4"/><circle cx="462" cy="200" r="5" fill="#1D1D1F"/><rect x="530" y="34" width="122" height="146" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="591.0" y="83.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">May 25</text><text x="591.0" y="112.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The lawyers</text><text x="591.0" y="128.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">begin to admit</text><text x="591.0" y="144.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">what happened</text><text x="591.0" y="160.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">(p. 2)</text><line x1="591" y1="180" x2="591" y2="200" stroke="#1D1D1F" stroke-width="1.4"/><circle cx="591" cy="200" r="5" fill="#1D1D1F"/><rect x="659" y="222" width="122" height="146" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="720.0" y="271.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Jun 22, 2023</text><text x="720.0" y="292.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Sanctions:</text><text x="720.0" y="308.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">$5,000 and</text><text x="720.0" y="324.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">letters to the</text><text x="720.0" y="340.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">client and</text><text x="720.0" y="355.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">judges</text><line x1="720" y1="222" x2="720" y2="200" stroke="#1D1D1F" stroke-width="1.4"/><circle cx="720" cy="200" r="5" fill="#1D1D1F"/><text x="400.0" y="388.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Hexagon = the AI-produced text · hatched in print, dark orange in color = the filing that repeated the error ·</text><text x="400.0" y="403.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">rounded = admission · shaded = the order</text><text x="400.0" y="438.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Dates and paragraphs from Mata v. Avianca, Inc. (federal court, New York), court document ECF 54 (June 22, 2023).</text><text x="400.0" y="453.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">The claim itself was dismissed as filed too late (ECF 55).</text></svg>