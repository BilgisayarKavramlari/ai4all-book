<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Check the channel and get a second approver; how real a voice sounds is not a check</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="420" fill="#FFFFFF"/><rect x="20" y="120" width="140" height="90" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="90.0" y="150.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A request</text><text x="90.0" y="175.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">money, logins or</text><text x="90.0" y="190.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">data</text><rect x="185" y="120" width="120" height="90" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="245.0" y="150.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Pause</text><text x="245.0" y="175.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">urgency is a</text><text x="245.0" y="190.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">cue</text><polygon points="405.0,105.0 480.0,165.0 405.0,225.0 330.0,165.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="405.0" y="156.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Confirmed</text><text x="405.0" y="173.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">out of band?</text><rect x="505" y="120" width="140" height="90" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="575.0" y="150.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Second approver</text><text x="575.0" y="175.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">dual</text><text x="575.0" y="190.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">authorization</text><rect x="660" y="120" width="120" height="90" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="720.0" y="165.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Act</text><path d="M162.0,165.0 L183.0,165.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M307.0,165.0 L328.0,165.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M482.0,165.0 L503.0,165.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="492.5" y="153.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">yes</text><path d="M647.0,165.0 L658.0,165.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M405.0,227.0 L405.0,290.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="420.0" y="255.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">no</text><rect x="320" y="292" width="170" height="60" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="405.0" y="322.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Stop; report it</text><rect x="20" y="40" width="300" height="54" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="170.0" y="67.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">How real the voice or face seems</text><line x1="24" y1="44" x2="316" y2="90" stroke="#5C5C66" stroke-width="1.4"/><text x="470.0" y="66.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">not a check: a voice or a face can be generated</text><text x="400.0" y="392.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Out of band = through a channel you already have: the number on file, the directory, in person · crossed out = set</text><text x="400.0" y="407.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">aside</text></svg>