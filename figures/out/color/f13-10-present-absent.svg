<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" width="800" height="412" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A signal that is present is a lead about origin; a missing signal proves nothing</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="412" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A signal that is present is a lead about origin; a missing signal proves nothing</text><text x="330.0" y="64.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Present and valid</text><text x="620.0" y="64.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Missing</text><rect x="20" y="84" width="160" height="80" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="100.0" y="124.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Content credential</text><rect x="210" y="84" width="250" height="80" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="335.0" y="116.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">signed history of the file (not</text><text x="335.0" y="131.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">truth)</text><rect x="490" y="84" width="290" height="80" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="635.0" y="116.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">proves nothing: stripped, never</text><text x="635.0" y="131.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">added, or removed</text><rect x="20" y="180" width="160" height="80" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="100.0" y="220.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Watermark</text><rect x="210" y="180" width="250" height="80" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="335.0" y="220.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">the maker&#x27;s tool produced it</text><rect x="490" y="180" width="290" height="80" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="635.0" y="212.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">proves nothing: stripped, never</text><text x="635.0" y="227.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">added, or removed</text><rect x="20" y="276" width="160" height="80" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="100.0" y="316.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Platform label</text><rect x="210" y="276" width="250" height="80" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="335.0" y="308.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">the platform or uploader says</text><text x="335.0" y="323.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">AI was used</text><rect x="490" y="276" width="290" height="80" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="635.0" y="308.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">proves nothing: stripped, never</text><text x="635.0" y="323.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">added, or removed</text><text x="400.0" y="384.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Green (mid-gray in print) = a lead about where content came from · light gray cells = proves nothing · a lead still</text><text x="400.0" y="399.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">needs the context checks of section 13.7</text></svg>