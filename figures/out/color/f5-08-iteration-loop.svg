<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 492" width="800" height="492" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Iteration is the loop between Prompt and Verify: one change, a prediction, a rerun, a score</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="492" fill="#FFFFFF"/><path d="M482.2,108.1 Q518.1,104.1 546.1,126.9" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M648.6,205.2 Q669.6,221.4 664.4,247.4" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M627.8,345.1 Q614.2,373.1 583.6,378.9" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M435.5,422.4 Q400.0,436.4 364.5,422.4" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M216.4,378.9 Q185.8,373.1 172.2,345.1" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M135.6,247.4 Q130.4,221.4 151.4,205.2" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M253.9,126.9 Q281.9,104.1 317.8,108.1" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="308.0" y="52.0" width="184" height="64" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="76.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">1. Diagnose the weak</text><text x="400.0" y="91.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">output</text><rect x="536.2947928806648" y="119.01881526914542" width="184" height="64" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="628.3" y="143.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2. Trace it to a prompt</text><text x="628.3" y="158.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">part (or the frame)</text><rect x="592.6789503570925" y="269.60872624422393" width="184" height="64" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="684.7" y="301.6" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3. Change one thing</text><rect x="434.69405182232697" y="390.37245848663065" width="184" height="64" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="526.7" y="422.4" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">4. Predict the effect</text><rect x="181.30594817767303" y="390.37245848663065" width="184" height="64" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="273.3" y="414.4" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">5. Rerun in a fresh</text><text x="273.3" y="430.3" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">chat, twice</text><rect x="23.321049642907496" y="269.608726244224" width="184" height="64" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="115.3" y="293.7" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">6. Score against the</text><text x="115.3" y="309.5" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">criteria</text><rect x="79.70520711933526" y="119.01881526914548" width="184" height="64" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="171.7" y="143.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">7. Log it; keep or</text><text x="171.7" y="158.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">revert</text><rect x="296" y="228" width="208" height="68" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="400.0" y="251.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Back to Frame</text><text x="400.0" y="267.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">when the trace ends at the</text><text x="400.0" y="283.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">task itself</text><path d="M558.3,181.0 L490.0,232.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-color)"/><text x="400.0" y="476.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">The Prompt ↔ Verify part of the AI Work Loop. Dashed = taken only when needed.</text></svg>