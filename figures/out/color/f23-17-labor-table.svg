<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" width="800" height="466" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Three studies of AI and work answer three different questions</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="466" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Three studies of AI and work answer three different questions</text><rect x="20" y="60" width="760" height="40" fill="none" stroke="#1D1D1F" stroke-width="1.4"/><text x="105.0" y="80.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Study</text><text x="295.0" y="80.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Question asked</text><text x="500.0" y="80.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Result (as of its date)</text><text x="690.0" y="80.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Evidence status</text><rect x="20" y="100" width="760" height="104" fill="none" stroke="#1D1D1F" stroke-width="1.2"/><text x="105.0" y="144.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Brynjolfsson, Li &amp;</text><text x="105.0" y="159.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Raymond (2025)</text><text x="295.0" y="144.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Did an assistant change</text><text x="295.0" y="159.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">support agents&#x27; output?</text><text x="500.0" y="128.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">+15% issues resolved per</text><text x="500.0" y="144.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">hour; about +30% for less</text><text x="500.0" y="159.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">experienced, lower-skilled</text><text x="500.0" y="175.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">agents</text><text x="690.0" y="152.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">measured (one firm)</text><rect x="20" y="204" width="760" height="104" fill="none" stroke="#1D1D1F" stroke-width="1.2"/><text x="105.0" y="248.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Humlum &amp; Vestergaard</text><text x="105.0" y="263.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">(rev. March 2026)</text><text x="295.0" y="248.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Did chatbots change earnings</text><text x="295.0" y="263.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">and hours in Denmark?</text><text x="500.0" y="240.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">effects larger than 2%</text><text x="500.0" y="256.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">ruled out two years after</text><text x="500.0" y="271.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">launch; tasks reorganized</text><text x="690.0" y="248.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">measured (national</text><text x="690.0" y="263.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">records)</text><rect x="20" y="308" width="760" height="104" fill="none" stroke="#1D1D1F" stroke-width="1.2"/><text x="105.0" y="344.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Brynjolfsson, Chandar &amp;</text><text x="105.0" y="360.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Chen (rev. Aug 12,</text><text x="105.0" y="375.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2026)</text><text x="295.0" y="344.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">How has young workers&#x27;</text><text x="295.0" y="360.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">employment moved in</text><text x="295.0" y="375.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">AI-exposed jobs?</text><text x="500.0" y="344.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">22–25-year-olds 19% below</text><text x="500.0" y="360.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">less-exposed peers&#x27; pace,</text><text x="500.0" y="375.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">to June 2026</text><text x="690.0" y="352.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">measured; descriptive,</text><text x="690.0" y="367.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">not causal</text><line x1="190" y1="60" x2="190" y2="412" stroke="#1D1D1F" stroke-width="1.2"/><line x1="400" y1="60" x2="400" y2="412" stroke="#1D1D1F" stroke-width="1.2"/><line x1="600" y1="60" x2="600" y2="412" stroke="#1D1D1F" stroke-width="1.2"/><text x="400.0" y="428.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Different firms, countries, measures and dates: the numbers cannot be added or compared directly. Earlier versions</text><text x="400.0" y="443.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">of the last two reported other figures.</text></svg>