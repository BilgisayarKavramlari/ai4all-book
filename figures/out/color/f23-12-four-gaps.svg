<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Four responsibility gaps ask four different questions</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="410" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Four responsibility gaps ask four different questions</text><rect x="20" y="60" width="370" height="130" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="205.0" y="104.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Culpability</text><text x="205.0" y="143.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Can anyone fairly be blamed for this harm?</text><text x="205.0" y="158.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Fix: clear duties before use</text><rect x="410" y="60" width="370" height="130" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="595.0" y="104.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Moral accountability</text><text x="595.0" y="135.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Can anyone explain and answer for what the</text><text x="595.0" y="151.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">system did?</text><text x="595.0" y="166.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Fix: reasons people can give and check</text><rect x="20" y="210" width="370" height="130" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="205.0" y="254.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Public accountability</text><text x="205.0" y="285.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Can officials or companies be called to</text><text x="205.0" y="301.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">account?</text><text x="205.0" y="316.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Fix: records, audits, a route to complain</text><rect x="410" y="210" width="370" height="130" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="595.0" y="254.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Active responsibility</text><text x="595.0" y="285.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Does anyone see it as their job to prevent</text><text x="595.0" y="301.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">harm?</text><text x="595.0" y="316.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Fix: named owners, forward-looking duties</text><text x="400.0" y="372.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">After Santoni de Sio &amp; Mecacci (2021); the &quot;fix&quot; lines summarize their proposals. They argue the gaps have</text><text x="400.0" y="387.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">different sources and can arise with non-learning systems too.</text></svg>