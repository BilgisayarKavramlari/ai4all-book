<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Every instruction came through a channel the fraudsters controlled</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="470" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Every instruction came through a channel the fraudsters controlled</text><line x1="24" y1="214" x2="776" y2="214" stroke="#1D1D1F" stroke-width="2.4"/><rect x="18" y="48" width="144" height="148" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="1.6"/><text x="90.0" y="98.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Email</text><text x="90.0" y="119.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">phishing email</text><text x="90.0" y="135.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">from a fake CFO;</text><text x="90.0" y="151.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">first doubted</text><text x="90.0" y="167.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">(doubt: reported,</text><text x="90.0" y="183.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">CNN)</text><line x1="90" y1="196" x2="90" y2="214" stroke="#1D1D1F" stroke-width="1.4"/><circle cx="90" cy="214" r="5" fill="#1D1D1F"/><rect x="172" y="236" width="144" height="148" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="1.6"/><text x="244.0" y="286.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Video conference</text><text x="244.0" y="307.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">pre-recorded; made</text><text x="244.0" y="323.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">from public clips</text><text x="244.0" y="339.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">and voices, police</text><text x="244.0" y="355.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">believe</text><text x="244.0" y="371.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">(confirmed)</text><line x1="244" y1="236" x2="244" y2="214" stroke="#1D1D1F" stroke-width="1.4"/><circle cx="244" cy="214" r="5" fill="#1D1D1F"/><rect x="326" y="48" width="144" height="148" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="1.6"/><text x="398.0" y="98.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Instant messages</text><text x="398.0" y="119.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">meeting ended</text><text x="398.0" y="135.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">under a pretext;</text><text x="398.0" y="151.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">instructions by</text><text x="398.0" y="167.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">messaging</text><text x="398.0" y="183.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">(confirmed)</text><line x1="398" y1="196" x2="398" y2="214" stroke="#1D1D1F" stroke-width="1.4"/><circle cx="398" cy="214" r="5" fill="#1D1D1F"/><rect x="480" y="236" width="144" height="148" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="552.0" y="286.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Transfers</text><text x="552.0" y="315.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">to five local</text><text x="552.0" y="331.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">accounts; about</text><text x="552.0" y="347.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">HK$200 million</text><text x="552.0" y="363.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">(confirmed)</text><line x1="552" y1="236" x2="552" y2="214" stroke="#1D1D1F" stroke-width="1.4"/><circle cx="552" cy="214" r="5" fill="#1D1D1F"/><rect x="634" y="48" width="144" height="148" rx="16" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="706.0" y="98.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Later check</text><text x="706.0" y="135.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">with head office:</text><text x="706.0" y="151.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">fraud found</text><text x="706.0" y="167.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">(reported, CNN)</text><line x1="706" y1="196" x2="706" y2="214" stroke="#1D1D1F" stroke-width="1.4"/><circle cx="706" cy="214" r="5" fill="#1D1D1F"/><text x="400.0" y="402.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Orange (hatched, thick border in print) = a channel the fraudsters controlled · confirmed = the government&#x27;s reply</text><text x="400.0" y="417.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">· reported = CNN, citing police</text><text x="400.0" y="440.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Sources: Hong Kong SAR Government (2024); Chen &amp; Magramo (2024). Late January 2024; the company later confirmed it</text><text x="400.0" y="455.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">was Arup (Magramo, 2024).</text></svg>