<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 362" width="800" height="362" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Three fairness definitions ask three different questions</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="362" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Three fairness definitions, three questions</text><polygon points="288.0,46.0 512.0,46.0 530.0,74.0 512.0,102.0 288.0,102.0 270.0,74.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="400.0" y="74.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A tool that flags people</text><path d="M400.0,104.0 L145.0,136.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="145.0,138.0 260.0,186.0 145.0,234.0 30.0,186.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="145.0" y="177.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Equal selection</text><text x="145.0" y="194.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">rates</text><text x="145.0" y="254.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Is the same share of each group</text><text x="145.0" y="269.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">flagged?</text><path d="M400.0,104.0 L400.0,136.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="400.0,138.0 515.0,186.0 400.0,234.0 285.0,186.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="186.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Equal error rates</text><text x="400.0" y="254.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Is the same share missed, and</text><text x="400.0" y="269.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the same share wrongly flagged?</text><path d="M400.0,104.0 L655.0,136.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="655.0,138.0 770.0,186.0 655.0,234.0 540.0,186.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="655.0" y="186.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Equal precision</text><text x="655.0" y="254.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Does a flag mean the same thing</text><text x="655.0" y="269.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">in each group?</text><text x="400.0" y="304.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">When groups differ in how often the outcome really occurs (the base rate), a tool that makes errors cannot meet</text><text x="400.0" y="319.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">all three at once.</text><text x="400.0" y="346.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Diamond = a question you must answer for the decision · hexagon = AI component</text></svg>