<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" width="800" height="356" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Each retelling of a study is a chance for a caveat to drop</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="356" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Each retelling of a study is a chance for a caveat to drop</text><rect x="20.0" y="56" width="111.66666666666667" height="132" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="75.8" y="100.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Study</text><text x="75.8" y="132.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">the record of</text><text x="75.8" y="148.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">what was done</text><text x="75.8" y="164.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">and found</text><path d="M132.7,122.0 L148.7,122.0" fill="none" stroke="#1D1D1F" stroke-width="2.2" marker-end="url(#arrow-color)"/><rect x="149.66666666666669" y="56" width="111.66666666666667" height="132" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="205.5" y="100.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Preprint</text><text x="205.5" y="140.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">posted before</text><text x="205.5" y="156.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">peer review</text><path d="M262.3,122.0 L278.3,122.0" fill="none" stroke="#1D1D1F" stroke-width="2.2" marker-end="url(#arrow-color)"/><rect x="279.33333333333337" y="56" width="111.66666666666667" height="132" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="335.2" y="92.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Journal</text><text x="335.2" y="109.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">article</text><text x="335.2" y="140.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">after peer</text><text x="335.2" y="156.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">review</text><path d="M392.0,122.0 L408.0,122.0" fill="none" stroke="#1D1D1F" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow-color)"/><rect x="409.00000000000006" y="56" width="111.66666666666667" height="132" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="464.8" y="100.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Press release</text><text x="464.8" y="140.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">written for</text><text x="464.8" y="156.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the media</text><path d="M521.7,122.0 L537.7,122.0" fill="none" stroke="#1D1D1F" stroke-width="2.2" marker-end="url(#arrow-color)"/><text x="464.8" y="212.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">Exaggeration</text><text x="464.8" y="228.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">documented in</text><text x="464.8" y="243.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">many (Sumner et</text><text x="464.8" y="259.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">al., 2014)</text><rect x="538.6666666666667" y="56" width="111.66666666666667" height="132" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="594.5" y="100.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">News story</text><text x="594.5" y="140.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">written by a</text><text x="594.5" y="156.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">journalist</text><path d="M651.3,122.0 L667.3,122.0" fill="none" stroke="#1D1D1F" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow-color)"/><polygon points="681.7,56.0 766.6,56.0 780.0,122.0 766.6,188.0 681.7,188.0 668.3,122.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="724.2" y="100.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">AI summary</text><text x="724.2" y="132.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">new text</text><text x="724.2" y="148.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">generated from</text><text x="724.2" y="164.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a source</text><text x="724.2" y="212.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">Broader claims</text><text x="724.2" y="228.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">documented</text><text x="724.2" y="243.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">(Peters &amp;</text><text x="724.2" y="259.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">Chin-Yee, 2025)</text><text x="400.0" y="298.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rectangles = sources written by people · hexagon = AI output · dashed box = no record found · dashed arrow = drift</text><text x="400.0" y="313.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">documented at that step</text><text x="400.0" y="336.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Not every claim travels every step; check status (9.2) and trace back (9.4).</text></svg>