<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>The rules nearest you come first: course, program, placement, then law</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="500" fill="#FFFFFF"/><text x="400.0" y="26.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Read the rules nearest you first</text><rect x="30" y="52" width="330" height="50" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="3"/><text x="195.0" y="77.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">1. Course syllabus and instructor</text><text x="376.0" y="77.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">declare AI use; drug calculations by hand on exams</text><rect x="30" y="114" width="356" height="50" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="208.0" y="139.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2. Program or department</text><text x="402.0" y="139.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">program handbook rules for coursework</text><rect x="30" y="176" width="382" height="50" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="221.0" y="201.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3. Placement site or employer</text><text x="428.0" y="201.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">no patient information in any outside tool</text><rect x="30" y="238" width="408" height="50" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="234.0" y="263.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">4. Professional code and licensing board</text><text x="454.0" y="263.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">privacy and confidentiality duties</text><rect x="30" y="300" width="434" height="50" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="247.0" y="325.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">5. Journals and funders</text><text x="480.0" y="317.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">authorship and disclosure rules (when you</text><text x="480.0" y="332.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">publish)</text><rect x="30" y="362" width="460" height="50" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="260.0" y="387.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">6. Law: federal and state</text><text x="506.0" y="387.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">HIPAA; Texas TRAIGA (Chapter 18)</text><path d="M16.0,60.0 L16.0,410.0" fill="none" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow-color)"/><text x="400.0" y="438.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Marcus&#x27;s list (constructed placement policy, labeled). Rounded = rules people in your institution or profession</text><text x="400.0" y="453.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">write; rectangle = external rules. Dated in the text.</text><text x="400.0" y="478.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Most rules say who checks, who discloses and what data may go in.</text></svg>