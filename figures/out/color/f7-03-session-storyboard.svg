<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Only the practice part of each session differed; the exam came right after, closed-book for everyone</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="372" fill="#FFFFFF"/><text x="120.0" y="24.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Part 1</text><text x="410.0" y="24.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Part 2: only this differed</text><text x="690.0" y="24.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Part 3</text><rect x="20" y="120" width="200" height="110" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="120.0" y="157.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Teacher review</text><text x="120.0" y="197.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">same for every class</text><rect x="290" y="44" width="240" height="80" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="410.0" y="71.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Control</text><text x="410.0" y="100.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">books and notes, no devices</text><path d="M222.0,175.0 L288.0,84.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M532.0,84.0 L598.0,175.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="308.0,136.0 512.0,136.0 530.0,176.0 512.0,216.0 308.0,216.0 290.0,176.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="410.0" y="163.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">GPT Base</text><text x="410.0" y="184.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">chat built like ChatGPT, asked</text><text x="410.0" y="199.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">to act as a tutor</text><path d="M222.0,175.0 L288.0,176.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M532.0,176.0 L598.0,175.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="308.0,228.0 512.0,228.0 530.0,268.0 512.0,308.0 308.0,308.0 290.0,268.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="3"/><text x="410.0" y="255.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">GPT Tutor</text><text x="410.0" y="276.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">hints, not answers; teachers&#x27;</text><text x="410.0" y="291.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">solutions in its instructions</text><path d="M222.0,175.0 L288.0,268.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M532.0,268.0 L598.0,175.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="600" y="120" width="180" height="110" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3"/><text x="690.0" y="157.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Closed-book exam</text><text x="690.0" y="181.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">same for all; each</text><text x="690.0" y="197.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">problem paired with a</text><text x="690.0" y="212.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">practice problem</text><text x="400.0" y="336.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Four 90-minute sessions, fall 2023–24; classrooms randomly assigned; practice and exam both graded.</text><text x="400.0" y="358.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Source: Bastani et al. (2025). Hexagon = AI component; rounded = people; thick = the learning measure.</text></svg>