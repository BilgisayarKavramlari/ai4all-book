  <g id="text_30">
   <text style="fill: #1d1d1f; font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(58.60375 354.677125)">Source: Peters &amp; Chin-Yee (2025), Royal Society Open Science, Table 2: summaries of 100 medical abstracts with a simple prompt.</text>
   <text style="fill: #1d1d1f; font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(58.60375 365.315047)">Dashed line = share of the original abstracts with generalized conclusions. The authors found no significant difference</text>
   <text style="fill: #1d1d1f; font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(58.60375 375.952969)">from the originals for the Claude models. Results for these models and this prompt; newer tools differ.</text>
