<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" width="800" height="466" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Why a value is missing decides which fix is safe</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="466" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Why a value is missing decides which fix is safe</text><rect x="20" y="52" width="240" height="110" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="140.0" y="80.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Missing completely at</text><text x="140.0" y="98.5" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">random</text><text x="140.0" y="129.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">MCAR</text><path d="M262.0,107.0 L290.0,107.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="292" y="52" width="230" height="110" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="407.0" y="89.4" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Example from Lucía&#x27;s log</text><text x="407.0" y="121.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a page of the sign-in sheet</text><text x="407.0" y="136.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">got wet</text><path d="M524.0,107.0 L552.0,107.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="554" y="52" width="226" height="110" rx="16" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="667.0" y="89.4" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">What it means</text><text x="667.0" y="121.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">deletion loses data but does</text><text x="667.0" y="136.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">not tilt the answer</text><rect x="20" y="180" width="240" height="110" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="140.0" y="208.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Missing at random, given</text><text x="140.0" y="226.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">what you know</text><text x="140.0" y="257.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">MAR</text><path d="M262.0,235.0 L290.0,235.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="292" y="180" width="230" height="110" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="407.0" y="217.4" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Example from Lucía&#x27;s log</text><text x="407.0" y="241.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">evening shifts were logged</text><text x="407.0" y="257.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">less often, and you know</text><text x="407.0" y="272.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">which shifts were evenings</text><path d="M524.0,235.0 L552.0,235.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="554" y="180" width="226" height="110" rx="16" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="667.0" y="217.4" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">What it means</text><text x="667.0" y="249.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">a fill that uses the known</text><text x="667.0" y="264.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">pattern can work</text><rect x="20" y="308" width="240" height="110" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3" stroke-dasharray="7 5"/><text x="140.0" y="345.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Missing not at random</text><text x="140.0" y="385.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">MNAR</text><path d="M262.0,363.0 L290.0,363.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="292" y="308" width="230" height="110" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="407.0" y="345.4" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Example from Lucía&#x27;s log</text><text x="407.0" y="369.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the longest shifts went</text><text x="407.0" y="385.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">unlogged because they were</text><text x="407.0" y="400.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">long</text><path d="M524.0,363.0 L552.0,363.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="554" y="308" width="226" height="110" rx="16" fill="#C2410C" stroke="#7A2808" stroke-width="1.6"/><text x="667.0" y="345.4" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">What it means</text><text x="667.0" y="377.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">every simple fix can</text><text x="667.0" y="392.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">mislead: get the real value</text><text x="400.0" y="448.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">After Rubin (1976). Dashed, thick = the case where no fill method is safe. Examples are constructed.</text></svg>