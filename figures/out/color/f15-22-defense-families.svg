<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Train, detect or design: each family of injection defense leaves a gap</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="410" fill="#FFFFFF"/><rect x="20" y="50" width="240" height="70" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="140.0" y="85.0" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Train</text><rect x="20" y="140" width="240" height="100" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="140.0" y="172.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the model is trained to</text><text x="140.0" y="190.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">favor privileged</text><text x="140.0" y="207.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">instructions</text><rect x="20" y="260" width="240" height="90" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="140.0" y="296.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Leaves open: attacks still</text><text x="140.0" y="313.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">succeed, less often</text><rect x="282" y="50" width="240" height="70" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="402.0" y="85.0" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Detect</text><rect x="282" y="140" width="240" height="100" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="402.0" y="181.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">classifiers flag likely</text><text x="402.0" y="198.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">injections</text><rect x="282" y="260" width="240" height="90" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="402.0" y="296.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Leaves open: new attacks can</text><text x="402.0" y="313.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">slip past a filter</text><rect x="544" y="50" width="240" height="70" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="664.0" y="85.0" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Design</text><rect x="544" y="140" width="240" height="100" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="664.0" y="172.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the plan comes only from the</text><text x="664.0" y="190.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">user&#x27;s request; tools&#x27; data</text><text x="664.0" y="207.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">cannot steer it</text><rect x="544" y="260" width="240" height="90" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="664.0" y="287.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Leaves open: fewer tasks</text><text x="664.0" y="305.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">completed; a summary can</text><text x="664.0" y="322.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">still be changed</text><text x="400.0" y="390.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Thick = what each family leaves open (Deep 15.B)</text></svg>