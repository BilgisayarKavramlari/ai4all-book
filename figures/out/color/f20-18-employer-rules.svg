<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>All three employers&#x27; rules keep AI tools out of interviews</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="420" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">All three employers&#x27; rules, as published or reported, keep AI tools out of interviews</text><text x="298.0" y="56.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Application materials</text><text x="494.0" y="56.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Take-home tasks</text><text x="690.0" y="56.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Interviews</text><text x="190.0" y="110.1" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1D1D1F" style="">Anthropic (company page,</text><text x="190.0" y="125.9" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1D1D1F" style="">July 2025)</text><rect x="204" y="76" width="186" height="90" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="297.0" y="105.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Your own first draft;</text><text x="297.0" y="121.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">AI to refine; never</text><text x="297.0" y="136.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">invent experience</text><rect x="400" y="76" width="186" height="90" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="493.0" y="105.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">No AI unless the</text><text x="493.0" y="121.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">company says it is</text><text x="493.0" y="136.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">allowed</text><rect x="596" y="76" width="186" height="90" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="689.0" y="105.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">No AI in live</text><text x="689.0" y="121.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">interviews unless</text><text x="689.0" y="136.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">indicated</text><text x="190.0" y="214.1" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1D1D1F" style="">Amazon (reported, Feb</text><text x="190.0" y="229.9" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1D1D1F" style="">2025)</text><rect x="204" y="180" width="186" height="90" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="297.0" y="225.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">no rule reported</text><rect x="400" y="180" width="186" height="90" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="493.0" y="225.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">no rule reported</text><rect x="596" y="180" width="186" height="90" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="689.0" y="201.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Generative AI in</text><text x="689.0" y="217.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">interviews may</text><text x="689.0" y="232.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">disqualify, unless</text><text x="689.0" y="248.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">explicitly permitted</text><text x="190.0" y="318.1" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1D1D1F" style="">Goldman Sachs (reported,</text><text x="190.0" y="333.9" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#1D1D1F" style="">June 2025)</text><rect x="204" y="284" width="186" height="90" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="297.0" y="329.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">no rule reported</text><rect x="400" y="284" width="186" height="90" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="493.0" y="329.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">no rule reported</text><rect x="596" y="284" width="186" height="90" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="689.0" y="305.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Interviews (HireVue):</text><text x="689.0" y="321.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">no outside sources,</text><text x="689.0" y="336.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">incl. ChatGPT; all</text><text x="689.0" y="352.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">campus applicants</text><text x="400.0" y="396.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Solid = the company&#x27;s own page · dashed = reported in news coverage · light fill with label = no rule reported.</text><text x="400.0" y="411.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Three firms only: not evidence of what employers in general do.</text></svg>