<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Recall from Chapter 3: text arrives as tokens</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="490" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Anatomy of an LLM response</text><text x="400.0" y="44.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Recall from Chapter 3</text><rect x="20" y="56" width="262" height="364" rx="6" fill="#EEF2F7" stroke="#1D1D1F" stroke-width="1.6"/><text x="151.0" y="72.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Context window</text><text x="151.0" y="92.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">everything the model receives this turn</text><rect x="36" y="116" width="230" height="56" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="151.0" y="135.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">System prompt</text><text x="151.0" y="155.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">set by the tool&#x27;s maker</text><rect x="36" y="182" width="230" height="56" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="151.0" y="201.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Conversation so far</text><text x="151.0" y="221.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">earlier prompts and responses</text><rect x="36" y="248" width="230" height="56" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="151.0" y="267.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Pasted or retrieved text</text><text x="151.0" y="287.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">documents, search results</text><rect x="36" y="314" width="230" height="56" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="151.0" y="333.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Your prompt</text><text x="151.0" y="353.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the newest message</text><text x="151.0" y="398.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">+ each token the model adds</text><rect x="318" y="60" width="210" height="120" rx="3" fill="#1C3D6E" stroke="#0F2440" stroke-width="3"/><text x="423.0" y="100.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">1. Text becomes tokens</text><text x="423.0" y="128.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">A | good | name | for |</text><text x="423.0" y="144.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">a | coffee | shop | near |</text><text x="423.0" y="159.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">campus | is</text><path d="M284.0,120.0 L316.0,120.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="584.0,60.0 762.0,60.0 780.0,120.0 762.0,180.0 584.0,180.0 566.0,120.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="673.0" y="92.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2. The model scores every</text><text x="673.0" y="109.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">possible next token</text><text x="673.0" y="136.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">settings fixed after</text><text x="673.0" y="151.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">training</text><path d="M530.0,120.0 L564.0,120.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="566" y="216" width="214" height="204" rx="3" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.6"/><text x="673.0" y="233.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Scores for the next token</text><text x="580.0" y="268.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">The</text><rect x="644" y="260" width="90" height="16" fill="#FCE38A" stroke="#6B5A12" stroke-width="1"/><text x="740.0" y="268.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">30%</text><text x="580.0" y="293.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Bean</text><rect x="644" y="285" width="48" height="16" fill="#FCE38A" stroke="#6B5A12" stroke-width="1"/><text x="698.0" y="293.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">16%</text><text x="580.0" y="318.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Brew</text><rect x="644" y="310" width="36" height="16" fill="#FCE38A" stroke="#6B5A12" stroke-width="1"/><text x="686.0" y="318.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">12%</text><text x="580.0" y="343.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Campus</text><rect x="644" y="335" width="27" height="16" fill="#FCE38A" stroke="#6B5A12" stroke-width="1"/><text x="677.0" y="343.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">9%</text><text x="580.0" y="368.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Common</text><rect x="644" y="360" width="18" height="16" fill="#FCE38A" stroke="#6B5A12" stroke-width="1"/><text x="668.0" y="368.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">6%</text><text x="673.0" y="394.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">… thousands more, most near 0%</text><path d="M673.0,182.0 L673.0,214.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="318" y="252" width="210" height="120" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="423.0" y="284.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3. Pick one token</text><text x="423.0" y="301.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">(sampling)</text><text x="423.0" y="320.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the temperature option</text><text x="423.0" y="336.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">sets how often less likely</text><text x="423.0" y="351.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">tokens win</text><path d="M564.0,312.0 L530.0,312.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M316.0,352.0 L286.0,380.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="423.0" y="396.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">4. Add the token to the context; repeat</text><text x="423.0" y="414.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">until the response is finished</text><text x="400.0" y="452.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Hexagon = AI component · dashed = chance involved · rounded = you · dark or thick = this section&#x27;s step</text><text x="400.0" y="476.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Scores are illustrative; token pieces from a newer OpenAI tokenizer (o200k_base).</text></svg>