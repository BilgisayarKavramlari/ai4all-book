<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Shape tells you who or what acts; line and fill tell you how sure, how risky and where to look</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="560" fill="#FFFFFF"/><text x="200.0" y="34.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Shape: who or what acts</text><text x="600.0" y="34.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Line and fill: how sure, how risky</text><line x1="400" y1="60" x2="400" y2="470" stroke="#5C5C66" stroke-width="1"/><rect x="24" y="76.0" width="140" height="64" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="94.0" y="108.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Step</text><text x="184.0" y="99.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Rectangle: a step or stage</text><text x="184.0" y="116.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">in a process</text><rect x="24" y="176.0" width="140" height="64" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="94.0" y="208.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Person</text><text x="184.0" y="199.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Rounded box: a person acts</text><text x="184.0" y="216.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">or decides</text><polygon points="40.8,276.0 147.2,276.0 164.0,308.0 147.2,340.0 40.8,340.0 24.0,308.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="94.0" y="308.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">AI tool</text><text x="184.0" y="299.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Hexagon: an AI component</text><text x="184.0" y="316.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">produces something</text><polygon points="94.0,370.0 164.0,408.0 94.0,446.0 24.0,408.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="94.0" y="408.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Choice?</text><text x="184.0" y="399.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Diamond: a decision point</text><text x="184.0" y="416.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">with more than one way out</text><rect x="424" y="76.0" width="140" height="64" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="494.0" y="108.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Inferred</text><text x="584.0" y="90.9" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Dashed outline: inferred,</text><text x="584.0" y="108.0" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">this book&#x27;s reading; never</text><text x="584.0" y="125.1" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">anything else</text><rect x="424" y="176.0" width="140" height="64" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="494.0" y="208.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Risk</text><text x="584.0" y="199.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Thick border (hatched in</text><text x="584.0" y="216.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">print): a risk or warning</text><rect x="424" y="276.0" width="140" height="64" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="494.0" y="308.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Checked</text><text x="584.0" y="290.9" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Green fill (mid-gray in</text><text x="584.0" y="308.0" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">print), labeled: verified</text><text x="584.0" y="325.1" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">information</text><rect x="424" y="376.0" width="140" height="64" rx="3" fill="#1C3D6E" stroke="#0F2440" stroke-width="3"/><text x="494.0" y="408.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">This step</text><text x="584.0" y="399.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Dark fill, light text: the</text><text x="584.0" y="416.5" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">part this figure is about</text><path d="M60.0,500.0 L170.0,500.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="190.0" y="500.0" font-size="14" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Solid arrow: what comes next, or what feeds what</text><text x="400.0" y="538.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Every meaning is carried by shape, line or label, so it survives the gray print edition.</text></svg>