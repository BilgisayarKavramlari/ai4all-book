<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 344" width="800" height="344" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>In AI-mediated communication, software changes the message between two people</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="344" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">AI-mediated communication</text><rect x="20" y="90" width="190" height="90" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="115.0" y="120.6" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Sender</text><text x="115.0" y="153.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">decides what to say</text><path d="M212.0,135.0 L290.0,135.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="312.0,82.0 488.0,82.0 506.0,135.0 488.0,188.0 312.0,188.0 294.0,135.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="400.0" y="118.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">AI software</text><text x="400.0" y="148.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">changes · adds to ·</text><text x="400.0" y="164.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">generates</text><path d="M508.0,135.0 L586.0,135.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="590" y="90" width="190" height="90" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="685.0" y="120.6" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Receiver</text><text x="685.0" y="153.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">reads the message</text><path d="M684.0,184.0 Q400.0,244.0 116.0,184.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-color)"/><text x="400.0" y="240.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">infers the sender&#x27;s effort and sincerity</text><text x="400.0" y="296.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Examples: autocorrect · suggested replies · tone rewriters · drafting assistants</text><text x="400.0" y="322.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Definition after Hancock, Naaman &amp; Levy (2020) · rounded = people · hexagon = AI · dashed = an inference</text></svg>