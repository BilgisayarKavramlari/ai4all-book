<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>The same score flagged some patients by itself and only advised a doctor about others</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="450" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The same score flagged some patients by itself and only advised a doctor about others</text><polygon points="308.0,50.0 492.0,50.0 510.0,80.0 492.0,110.0 308.0,110.0 290.0,80.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="400.0" y="70.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">An AI output</text><text x="400.0" y="84.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a score, an analysis, a</text><text x="400.0" y="99.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">draft</text><path d="M400.0,112.0 L142.0,150.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="22" y="152" width="240" height="92" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="142.0" y="183.3" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Informs</text><text x="142.0" y="208.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a person reads it among other</text><text x="142.0" y="224.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">evidence</text><path d="M142.0,246.0 L142.0,282.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="32" y="284" width="220" height="62" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="142.0" y="305.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">The decision owner</text><text x="142.0" y="327.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">decides; answers for it</text><text x="142.0" y="370.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">e.g., a summary of the patient&#x27;s</text><text x="142.0" y="385.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">record</text><path d="M400.0,112.0 L398.0,150.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="278" y="152" width="240" height="92" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3"/><text x="398.0" y="183.3" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Recommends</text><text x="398.0" y="208.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a person decides whether to</text><text x="398.0" y="224.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">follow it</text><path d="M398.0,246.0 L398.0,282.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="288" y="284" width="220" height="62" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="398.0" y="305.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">The decision owner</text><text x="398.0" y="327.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">decides; answers for it</text><text x="398.0" y="362.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Above the 55th percentile: the</text><text x="398.0" y="378.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">doctor is prompted to consider</text><text x="398.0" y="393.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">enrollment</text><path d="M400.0,112.0 L654.0,150.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="534" y="152" width="240" height="92" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="654.0" y="183.3" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Triggers an action</text><text x="654.0" y="208.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">no person in between: an</text><text x="654.0" y="224.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">automated decision</text><path d="M654.0,246.0 L654.0,282.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="544" y="284" width="220" height="62" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="654.0" y="305.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The action happens</text><text x="654.0" y="327.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">answered for afterward</text><text x="654.0" y="370.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Above the 97th percentile: flagged</text><text x="654.0" y="385.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">for enrollment by the score alone</text><text x="400.0" y="422.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Hexagon = AI output · rounded = a person · risk fill (hatched in print) = no person in between · thick border = a</text><text x="400.0" y="437.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">role this example shows</text></svg>