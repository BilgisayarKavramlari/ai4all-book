<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 506" width="800" height="506" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>The EU AI Act sets duties by risk, and most uses carry none</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="506" fill="#FFFFFF"/><text x="400.0" y="20.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The EU AI Act&#x27;s risk tiers (this book&#x27;s grouping; as of October 2026)</text><rect x="80.0" y="48" width="380" height="80" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="270.0" y="75.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Prohibited practices</text><text x="270.0" y="96.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">e.g., inferring emotions from faces or voices at</text><text x="270.0" y="111.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">work or school; social scoring</text><text x="472.0" y="80.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">applies from Feb 2,</text><text x="472.0" y="95.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">2025</text><rect x="65.0" y="144" width="410" height="80" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="270.0" y="171.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">High-risk systems</text><text x="270.0" y="192.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">e.g., admission, grading, test monitoring, CV</text><text x="270.0" y="207.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">screening (Annex III)</text><text x="487.0" y="168.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Annex III duties</text><text x="487.0" y="184.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">scheduled from Dec</text><text x="487.0" y="199.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">2, 2027</text><rect x="45.0" y="240" width="450" height="80" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="270.0" y="267.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Transparency duties</text><text x="270.0" y="288.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">tell people it is AI; mark generated content; label</text><text x="270.0" y="303.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">deepfakes</text><text x="507.0" y="248.3" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">applies from Aug 2,</text><text x="507.0" y="264.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">2026 (marking: Dec</text><text x="507.0" y="280.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">2, 2026 for systems</text><text x="507.0" y="295.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">already on the</text><text x="507.0" y="311.7" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">market)</text><rect x="20.0" y="336" width="500" height="80" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="270.0" y="363.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Minimal risk</text><text x="270.0" y="384.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">e.g., spam filters, spell-checkers: no new duties beyond AI</text><text x="270.0" y="399.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">literacy</text><text x="532.0" y="376.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">most uses</text><polygon points="653.3,346.0 762.7,346.0 780.0,394.0 762.7,442.0 653.3,442.0 636.0,394.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="708.0" y="370.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">General-purpose</text><text x="708.0" y="387.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">AI models</text><text x="708.0" y="405.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">duties from Aug 2,</text><text x="708.0" y="421.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2025</text><text x="400.0" y="466.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Thick, hatched in print = banned · wider = more uses, fewer duties · hexagon = AI models</text><text x="400.0" y="490.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Dates: Regulation (EU) 2024/1689, Art. 113, as amended by Regulation (EU) 2026/1744. Check the current status.</text></svg>