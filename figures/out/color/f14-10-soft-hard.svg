<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>An instruction is text the model receives; a hard gate is a step the system cannot skip</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="430" fill="#FFFFFF"/><text x="200.0" y="34.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Soft gate</text><text x="600.0" y="34.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Hard gate</text><line x1="400" y1="50" x2="400" y2="380" stroke="#5C5C66" stroke-width="1.4"/><rect x="40" y="60" width="320" height="60" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="200.0" y="81.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Instruction: &quot;always ask before</text><text x="200.0" y="98.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">ordering&quot;</text><path d="M200.0,122.0 L200.0,146.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="40" y="148" width="320" height="60" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="200.0" y="178.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">It becomes text in the context window</text><path d="M200.0,210.0 L200.0,234.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="78.0,236.0 322.0,236.0 340.0,271.0 322.0,306.0 78.0,306.0 60.0,271.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="200.0" y="262.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The model produces the next</text><text x="200.0" y="279.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">action</text><path d="M200.0,308.0 L200.0,332.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="60" y="334" width="280" height="50" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="200.0" y="359.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Action may run without asking</text><polygon points="458.0,60.0 742.0,60.0 760.0,90.0 742.0,120.0 458.0,120.0 440.0,90.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="600.0" y="90.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The model proposes an action</text><path d="M600.0,122.0 L600.0,146.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="440" y="148" width="320" height="60" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="600.0" y="169.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The system pauses: the tool cannot</text><text x="600.0" y="186.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">run yet</text><path d="M600.0,210.0 L600.0,234.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="470" y="236" width="260" height="90" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="3"/><text x="600.0" y="272.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">A named person approves, edits</text><text x="600.0" y="289.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">or rejects</text><path d="M600.0,328.0 L600.0,344.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="470" y="346" width="260" height="40" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="600.0" y="366.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Only then does the action run</text><text x="400.0" y="406.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Examples of soft gates in this chapter: a declared code freeze (Opening Case); an agent&#x27;s own confirmation step</text><text x="400.0" y="421.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">that did not fire (Operator).</text></svg>