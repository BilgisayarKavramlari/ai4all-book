<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 232" width="800" height="232" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>How the WEF numbers are made</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="232" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The WEF&#x27;s job numbers scale employers&#x27; answers up to about 1.2 billion jobs</text><rect x="14" y="66" width="144" height="124" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="86.0" y="108.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Survey answers</text><text x="86.0" y="136.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">over 1,000</text><text x="86.0" y="152.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">employers,</text><text x="86.0" y="168.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">May–September 2024</text><path d="M160.0,125.0 L172.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="172" y="66" width="144" height="124" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="244.0" y="99.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Expected %</text><text x="244.0" y="116.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">changes</text><text x="244.0" y="136.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">per role and</text><text x="244.0" y="152.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">industry,</text><text x="244.0" y="168.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2025–2030</text><path d="M318.0,125.0 L330.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="330" y="66" width="144" height="124" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="402.0" y="108.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Jobs data</text><text x="402.0" y="129.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">ILO employee</text><text x="402.0" y="144.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">counts: about 1.18</text><text x="402.0" y="160.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">billion in covered</text><text x="402.0" y="176.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">roles</text><path d="M476.0,125.0 L488.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="488" y="66" width="144" height="124" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="560.0" y="108.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Millions of jobs</text><text x="560.0" y="144.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">170 created · 92</text><text x="560.0" y="160.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">displaced</text><path d="M634.0,125.0 L646.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="646" y="66" width="144" height="124" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="718.0" y="108.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Net and churn</text><text x="718.0" y="129.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">net 78 million</text><text x="718.0" y="144.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">(7%) · churn 22% ·</text><text x="718.0" y="160.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">all trends, not AI</text><text x="718.0" y="176.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">alone</text><text x="400.0" y="214.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Each step adds an assumption: who answered (large firms), how roles are matched, which jobs are covered.</text></svg>