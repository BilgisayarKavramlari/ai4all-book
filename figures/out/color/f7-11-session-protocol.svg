<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A tutor-mode session is a small experiment on yourself</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="270" fill="#FFFFFF"/><text x="83.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">1 · Before</text><rect x="10" y="50" width="146" height="150" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="83.0" y="100.3" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3 keyed</text><text x="83.0" y="116.8" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">questions;</text><text x="83.0" y="133.2" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">baseline answers;</text><text x="83.0" y="149.7" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">confidence</text><path d="M157.0,125.0 L167.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="241.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2 · During</text><polygon points="185.5,50.0 296.5,50.0 314.0,125.0 296.5,200.0 185.5,200.0 168.0,125.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="241.0" y="108.5" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Tutor-mode</text><text x="241.0" y="125.0" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">dialogue: attempt</text><text x="241.0" y="141.5" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">before every hint</text><path d="M315.0,125.0 L325.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="399.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3 · Right after</text><rect x="326" y="50" width="146" height="150" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3"/><text x="399.0" y="100.3" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Devices away:</text><text x="399.0" y="116.8" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">predict, answer,</text><text x="399.0" y="133.2" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">score against the</text><text x="399.0" y="149.7" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">key</text><path d="M473.0,125.0 L483.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="557.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">4 · Later</text><rect x="484" y="50" width="146" height="150" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3"/><text x="557.0" y="108.5" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2+ days: predict</text><text x="557.0" y="125.0" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">and answer again</text><text x="557.0" y="141.5" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">(spacing)</text><path d="M631.0,125.0 L641.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="715.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">5 · Reflect</text><rect x="642" y="50" width="146" height="150" rx="16" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="715.0" y="108.5" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Calibration gap;</text><text x="715.0" y="125.0" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">one S turn, one C</text><text x="715.0" y="141.5" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">turn; one change</text><text x="400.0" y="232.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Thick border = closed-book checks (no tool, no notes). Hexagon = the AI tool; rounded = you.</text><text x="400.0" y="256.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Your scores are evidence for your reflection, not your grade.</text></svg>