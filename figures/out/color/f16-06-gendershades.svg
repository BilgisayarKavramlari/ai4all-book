   <text style="fill: #1d1d1f; font: 9.5px 'Source Sans 3', 'STIXGeneral', 'DejaVu Sans', sans-serif" transform="translate(7.2 357.700688)">Source: Buolamwini &amp; Gebru (2018), Table 4: three commercial gender classifiers, April–May 2017, 1,270 faces of parliamentarians.</text>
