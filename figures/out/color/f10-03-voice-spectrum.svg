<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 506" width="800" height="506" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>The more wording a tool supplies, the more of your judgment the message needs to stay yours</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="506" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The voice and ownership spectrum</text><path d="M40.0,70.0 L760.0,70.0" fill="none" stroke="#1D1D1F" stroke-width="2.2" marker-end="url(#arrow-color)"/><text x="40.0" y="52.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">More of the wording supplied by a tool</text><text x="760.0" y="88.0" font-size="13" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#5C5C66" style="">so more of your judgment is needed to keep the message yours</text><rect x="22" y="118" width="140" height="152" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="92.0" y="194.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="92.0" y="143.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">1 · Your words</text><text x="92.0" y="160.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">only</text><text x="92.0" y="204.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">no AI</text><rect x="36" y="250" width="112" height="10" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1"/><rect x="174" y="118" width="140" height="152" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="244.0" y="194.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="244.0" y="152.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2 · AI as reader</text><text x="244.0" y="196.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">comments; you</text><text x="244.0" y="211.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">change it</text><rect x="188" y="250" width="112" height="10" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1"/><rect x="188" y="250" width="9.0" height="10" fill="#FCE38A" stroke="#6B5A12" stroke-width="1"/><rect x="326" y="118" width="140" height="152" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="396.0" y="194.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="396.0" y="152.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3 · AI as editor</text><text x="396.0" y="188.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">grammar,</text><text x="396.0" y="204.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">rewording or</text><text x="396.0" y="219.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">translation</text><rect x="340" y="250" width="112" height="10" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1"/><rect x="340" y="250" width="39.2" height="10" fill="#FCE38A" stroke="#6B5A12" stroke-width="1"/><rect x="478" y="118" width="140" height="152" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="548.0" y="194.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="548.0" y="143.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">4 · AI as</text><text x="548.0" y="160.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">co-drafter</text><text x="548.0" y="188.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">drafts from your</text><text x="548.0" y="204.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">points; you</text><text x="548.0" y="219.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">rewrite</text><rect x="492" y="250" width="112" height="10" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1"/><rect x="492" y="250" width="76.2" height="10" fill="#FCE38A" stroke="#6B5A12" stroke-width="1"/><rect x="630" y="118" width="140" height="152" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="700.0" y="194.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="700.0" y="152.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">5 · AI as author</text><text x="700.0" y="204.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">sent as is</text><rect x="644" y="250" width="112" height="10" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1"/><rect x="644" y="250" width="106.4" height="10" fill="#FCE38A" stroke="#6B5A12" stroke-width="1"/><text x="400.0" y="290.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Which position fits depends on what these readers expect:</text><rect x="22" y="304" width="372" height="82" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="208.0" y="331.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Own words expected</text><text x="208.0" y="353.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">apology · message after a loss · personal</text><text x="208.0" y="369.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">statement · reference letter · reflection essay</text><rect x="406" y="304" width="372" height="82" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="592.0" y="331.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Accuracy and clarity first</text><text x="592.0" y="353.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">meeting summary · FAQ answer · routine notice ·</text><text x="592.0" y="369.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">status update</text><line x1="400" y1="300" x2="400" y2="390" stroke="#1D1D1F" stroke-width="1.6" stroke-dasharray="6 4"/><text x="400.0" y="416.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Inner bar = the tool&#x27;s share of the wording (also in each label) · dashed bracket = an inferred placement</text></svg>