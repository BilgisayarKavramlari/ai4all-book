<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A research report brings more sources, not better ones</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="440" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A research report brings more sources, not better ones</text><rect x="20" y="50" width="200" height="80" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="120.0" y="90.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Your question</text><path d="M222.0,90.0 L286.0,90.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="306.0,50.0 500.0,50.0 518.0,90.0 500.0,130.0 306.0,130.0 288.0,90.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="403.0" y="77.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Many searches</text><text x="403.0" y="106.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">many pages retrieved</text><path d="M520.0,90.0 L576.0,90.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="596.0,50.0 762.0,50.0 780.0,90.0 762.0,130.0 596.0,130.0 578.0,90.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="679.0" y="77.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A long report</text><text x="679.0" y="106.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">dozens of citations</text><line x1="679" y1="132" x2="679" y2="160" stroke="#1D1D1F" stroke-width="1.4"/><line x1="110" y1="160" x2="695" y2="160" stroke="#1D1D1F" stroke-width="1.4"/><path d="M110.0,160.0 L110.0,186.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="20" y="188" width="180" height="96" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="110.0" y="220.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">1. Types</text><text x="110.0" y="247.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">which rungs, for which</text><text x="110.0" y="263.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">claims?</text><path d="M305.0,160.0 L305.0,186.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="215" y="188" width="180" height="96" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="305.0" y="220.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2. Support</text><text x="305.0" y="255.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">does each page say it?</text><path d="M500.0,160.0 L500.0,186.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="410" y="188" width="180" height="96" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="500.0" y="220.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3. Missing evidence</text><text x="500.0" y="239.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">dates,</text><text x="500.0" y="255.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">counter-evidence,</text><text x="500.0" y="271.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">primary sources</text><path d="M695.0,160.0 L695.0,186.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="605" y="188" width="180" height="96" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="695.0" y="220.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">4. Faithfulness</text><text x="695.0" y="247.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">does the synthesis</text><text x="695.0" y="263.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">match its sources?</text><path d="M400.0,286.0 L400.0,320.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="200" y="322" width="400" height="70" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6" stroke-dasharray="7 5"/><text x="400.0" y="345.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Remaining uncertainty</text><text x="400.0" y="371.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">what you could not check, and why</text><text x="400.0" y="420.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Hexagons = AI steps · rounded = checks you run · dashed = uncertainty</text></svg>