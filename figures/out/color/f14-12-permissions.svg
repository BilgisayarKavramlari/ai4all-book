<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" width="800" height="425" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Each part of the workflow gets only the access its step needs</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="425" fill="#FFFFFF"/><text x="400.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Marcus&#x27;s rehearsal assistant (constructed): what each part may do</text><rect x="30" y="60" width="230" height="70" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="145.0" y="95.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Band calendar</text><text x="520.0" y="95.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">read: yes · write: no · send: no · pay: no</text><rect x="30" y="146" width="230" height="70" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="145.0" y="181.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Drafts folder</text><text x="520.0" y="181.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">read: yes · write: drafts only · send: no · pay: no</text><rect x="30" y="232" width="230" height="70" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="145.0" y="267.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Band mailing list</text><text x="520.0" y="267.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">send: reminders only, after his weekly approval · pay: no</text><rect x="30" y="322" width="740" height="64" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="400.0" y="345.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Never touches: his email account, anything from his nursing placement, any payment or</text><text x="400.0" y="362.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">room booking</text><text x="400.0" y="412.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Least privilege: each part gets only the access its step needs. Thick = a line the assistant never crosses.</text></svg>