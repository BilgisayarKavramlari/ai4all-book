<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Training changes the settings; inference only uses them, so knowledge stops at the cutoff</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="480" fill="#FFFFFF"/><text x="20.0" y="26.0" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Training (before you use the tool): the settings change</text><rect x="20" y="44" width="240" height="118" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="140.0" y="84.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Pretraining</text><text x="140.0" y="110.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">predict the next token in huge</text><text x="140.0" y="126.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">amounts of text</text><text x="140.0" y="142.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">(self-supervised)</text><path d="M262.0,103.0 L278.0,103.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="280" y="44" width="240" height="118" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="84.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Instruction tuning</text><text x="400.0" y="118.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">examples of prompts and good</text><text x="400.0" y="134.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">responses</text><path d="M522.0,103.0 L538.0,103.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="540" y="44" width="240" height="118" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="660.0" y="84.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Learning from human feedback</text><text x="660.0" y="110.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">people rank responses; a</text><text x="660.0" y="126.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">scoring model is trained on</text><text x="660.0" y="142.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">them</text><text x="20.0" y="200.0" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Inference (each time you use it):</text><text x="20.0" y="220.0" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">the settings only get used</text><rect x="20" y="244" width="200" height="76" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="120.0" y="282.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Your prompt</text><path d="M222.0,282.0 L278.0,282.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="298.0,236.0 502.0,236.0 520.0,282.0 502.0,328.0 298.0,328.0 280.0,282.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="400.0" y="267.3" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The model</text><text x="400.0" y="300.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">settings fixed (frozen)</text><path d="M522.0,282.0 L578.0,282.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="580" y="244" width="200" height="76" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="680.0" y="269.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Response</text><text x="680.0" y="289.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">likely text; may be out</text><text x="680.0" y="305.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">of date</text><path d="M650.0,166.0 L470.0,234.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="520.0" y="190.0" font-size="13" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">settings frozen when training ends</text><line x1="40" y1="392" x2="520" y2="392" stroke="#1D1D1F" stroke-width="3"/><line x1="520" y1="392" x2="760" y2="392" stroke="#1D1D1F" stroke-width="2" stroke-dasharray="6 4"/><polygon points="760,386 772,392 760,398" fill="#1D1D1F"/><text x="280.0" y="372.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Text written before the cutoff: can shape the settings</text><text x="642.0" y="372.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Later events: not in the settings</text><line x1="520" y1="358" x2="520" y2="418" stroke="#1D1D1F" stroke-width="2.4" stroke-dasharray="6 4"/><text x="520.0" y="432.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Knowledge cutoff</text><text x="776.0" y="432.0" font-size="13" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">time</text><text x="400.0" y="466.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Hexagon = AI component · rounded = human input · dashed = may be wrong or out of date</text></svg>