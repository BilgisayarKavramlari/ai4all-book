</text><text x="591.0" y="169.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">(confirmed)</text><line x1="591" y1="210" x2="591" y2="230" stroke="#1D1D1F" stroke-width="1.4"/><circle cx="591" cy="230" r="5" fill="#1D1D1F"/><rect x="659" y="252" width="122" height="176" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="720.0" y="340.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="720.0" y="276.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Oct 25, 2019</text><text x="720.0" y="308.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">New York</text><text x="720.0" y="324.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">regulators write</text><text x="720.0" y="340.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">to UnitedHealth</text><text x="720.0" y="356.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Group about</text><text x="720.0" y="371.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Optum&#x27;s Impact</text><text x="720.0" y="387.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Pro (confirmed:</text><text x="720.0" y="403.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">their letter)</text><line x1="720" y1="252" x2="720" y2="230" stroke="#1D1D1F" stroke-width="1.4"/><circle cx="720" cy="230" r="5" fill="#1D1D1F"/><text x="400.0" y="454.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rounded = a person&#x27;s or an agency&#x27;s action · green = a published result · article = in the primary record; authors&#x27;</text><text x="400.0" y="469.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">report = what the authors state they were told or found</text><text x="400.0" y="494.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Sources: Obermeyer et al. (2019); NYDFS &amp; NYSDOH (2019). The product&#x27;s name and maker rest on the regulators&#x27;</text><text x="400.0" y="509.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">letter and news reports; what changed for patients is not on record.</text></svg>