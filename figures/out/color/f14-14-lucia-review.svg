<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Lucia&#x27;s review step sends risky replies to a person and samples the rest</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="420" fill="#FFFFFF"/><polygon points="35.6,150.0 134.4,150.0 150.0,190.0 134.4,230.0 35.6,230.0 20.0,190.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="85.0" y="181.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">AI draft of a</text><text x="85.0" y="198.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">reply</text><path d="M152.0,190.0 L178.0,190.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="260.0,120.0 340.0,190.0 260.0,260.0 180.0,190.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="260.0" y="166.2" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Refund,</text><text x="260.0" y="182.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">discount or</text><text x="260.0" y="197.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">account</text><text x="260.0" y="213.8" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">change?</text><path d="M260.0,120.0 L260.0,70.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="272.0" y="96.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">yes</text><rect x="190" y="14" width="230" height="56" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="3"/><text x="305.0" y="33.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Approval queue: a support</text><text x="305.0" y="50.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">team member approves</text><path d="M342.0,190.0 L388.0,190.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="365.0" y="178.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">no</text><rect x="390" y="155" width="160" height="70" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="470.0" y="190.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Sent and logged</text><path d="M552.0,190.0 L578.0,190.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="580" y="150" width="190" height="80" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="675.0" y="181.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Weekly sample of 20</text><text x="675.0" y="198.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">sent replies</text><path d="M675.0,232.0 L675.0,262.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="675.0,264.0 760.0,319.0 675.0,374.0 590.0,319.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="675.0" y="311.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Policy error</text><text x="675.0" y="326.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">found?</text><path d="M588.0,319.0 L452.0,319.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="520.0" y="307.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">yes</text><rect x="220" y="290" width="230" height="60" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="335.0" y="311.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Pause automatic sending for</text><text x="335.0" y="328.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">that category</text><text x="400.0" y="404.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Lucia&#x27;s proposal (constructed; no customer data). Thick = a stop point and an approval gate.</text></svg>