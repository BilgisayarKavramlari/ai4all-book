<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 478" width="800" height="478" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>One fluent paragraph held six separate claims to check</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="478" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">One paragraph, six claims (constructed example)</text><polygon points="38.0,44.0 762.0,44.0 780.0,90.0 762.0,136.0 38.0,136.0 20.0,90.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="400.0" y="90.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="400.0" y="74.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">“The CPA exam has four sections, AUD, BEC, FAR and REG. Each lasts four hours, and you need 75 to</text><text x="400.0" y="90.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">pass each one. You must pass all four within 18 months. Most candidates should start with the</text><text x="400.0" y="105.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">hardest section. Source: the official exam blueprint.”</text><text x="34.0" y="160.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">#</text><text x="70.0" y="160.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Claim</text><text x="520.0" y="160.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Type</text><text x="690.0" y="160.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Stakes</text><rect x="24" y="169" width="750" height="32" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="399.0" y="185.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="36.0" y="185.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">1</text><text x="70.0" y="185.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">The exam has four sections: AUD, BEC, FAR and REG.</text><text x="520.0" y="185.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">fact</text><text x="690.0" y="185.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">high</text><rect x="24" y="209" width="750" height="32" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="399.0" y="225.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="36.0" y="225.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">2</text><text x="70.0" y="225.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Each section 