heckable as true or false</text><text x="400.0" y="462.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Lucía&#x27;s overview is a constructed example; section 8.2 checks claim 1.</text></svg>