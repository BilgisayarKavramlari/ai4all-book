<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" width="800" height="425" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Whether an action can be undone, and who bears an error, decide where a person belongs</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="425" fill="#FFFFFF"/><text x="470.0" y="40.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Who would bear an error?</text><text x="345.0" y="70.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Only you</text><text x="615.0" y="70.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Other people</text><text x="100.0" y="150.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Can be undone</text><text x="100.0" y="281.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Cannot easily be</text><text x="100.0" y="298.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">undone</text><rect x="210" y="90" width="260" height="120" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="340.0" y="130.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Review the log afterward</text><text x="340.0" y="174.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a draft, a cart, a test copy</text><rect x="480" y="90" width="260" height="120" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="610.0" y="121.7" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Check point before others</text><text x="610.0" y="140.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">see it</text><text x="610.0" y="174.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">a shared draft, a calendar hold</text><rect x="210" y="230" width="260" height="120" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="340.0" y="261.7" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Approval gate, or keep the</text><text x="340.0" y="280.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">step</text><text x="340.0" y="314.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">deleting your own files</text><rect x="480" y="230" width="260" height="120" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="3"/><text x="610.0" y="261.7" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Approval gate before it</text><text x="610.0" y="280.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">takes effect</text><text x="610.0" y="306.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">send, publish, pay, delete shared</text><text x="610.0" y="321.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">data</text><text x="400.0" y="382.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Read-only actions change nothing: log them. Stop points (limits, errors, surprises) apply in every cell.</text><text x="400.0" y="408.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rounded = a person acts · thick = the strongest point · the cells are this book&#x27;s arrangement, not a rule</text></svg>