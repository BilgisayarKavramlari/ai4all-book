<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Hana&#x27;s code turns values into triggers for creative work</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="620" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Hana&#x27;s code turns values into triggers for creative work</text><rect x="20" y="42" width="760" height="488" rx="6" fill="none" stroke="#1D1D1F" stroke-width="1.2"/><rect x="40" y="56" width="720" height="52" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="82.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Scope: Hana, freelance illustrator who runs a small zine · constructed example</text><rect x="40" y="122" width="720" height="234" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3"/><text x="400.0" y="239.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="56.0" y="139.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Commitments (5–7, including the four required lines)  · this section</text><line x1="52" y1="156" x2="748" y2="156" stroke="#5C5C66" stroke-width="0.8"/><text x="62.0" y="176.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">1.</text><text x="84.0" y="176.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Before any AI image generation on a client job, I get written agreement, because of my clause and the bakery job.</text><line x1="52" y1="196" x2="748" y2="196" stroke="#5C5C66" stroke-width="0.8"/><text x="62.0" y="216.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">2.</text><text x="84.0" y="216.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Before I upload a drawing to any tool, I check its data terms and log tool and date (two tools&#x27; terms differed).</text><line x1="52" y1="236" x2="748" y2="236" stroke="#5C5C66" stroke-width="0.8"/><text x="62.0" y="256.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">3.</text><text x="84.0" y="256.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Before I send an invoice, I list any AI use in its notes, because clients already ask me about these tools.</text><line x1="52" y1="276" x2="748" y2="276" stroke="#5C5C66" stroke-width="0.8"/><text x="62.0" y="296.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">4.</text><text x="84.0" y="296.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Before contributors&#x27; scans go into any AI tool, I check risk and form (Ch. 18 risk sheet: a tool trained on uploads).</text><line x1="52" y1="316" x2="748" y2="316" stroke="#5C5C66" stroke-width="0.8"/><text x="62.0" y="336.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">5.</text><text x="84.0" y="336.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Before an image or quotation goes into the zine, I trace it and file the record (a fake &quot;1890s photo&quot; once came in).</text><rect x="40" y="370" width="720" height="62" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3"/><text x="400.0" y="393.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Boundaries: my client contracts, my course&#x27;s AI rules and the rules of the zine collective</text><text x="400.0" y="408.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">I belong to; where one is stricter, it wins; I ask the client or the collective.</text><rect x="40" y="446" width="400" height="84" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="240.0" y="488.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><line x1="40" y1="446" x2="440" y2="446" stroke="#1D1D1F" stroke-width="5"/><rect x="52" y="458" width="34" height="30" rx="3" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.6"/><line x1="52" y1="466" x2="86" y2="466" stroke="#1D1D1F" stroke-width="3"/><text x="100.0" y="472.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Review</text><text x="240.0" y="496.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">by the first week of next term · triggers: a new</text><text x="240.0" y="511.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">contract, a tool-terms change, a zine form change</text><rect x="456" y="446" width="304" height="84" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="608.0" y="464.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Dated note: the terms of the tool my</text><text x="608.0" y="480.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">school provides say prompts are not</text><text x="608.0" y="495.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">used to train its foundation models</text><text x="608.0" y="511.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">(as of October 2026)</text><text x="400.0" y="558.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Constructed example from Hana&#x27;s details in Chapters 13 and 18; reasons shortened.</text><text x="400.0" y="582.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rounded = your choice · thick border = the rules around your code · calendar = a date you set · dark fill or &quot;this</text><text x="400.0" y="597.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">section&quot; = the part discussed</text></svg>