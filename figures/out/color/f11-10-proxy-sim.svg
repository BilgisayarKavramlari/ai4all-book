  <g id="text_26">
   <text style="fill: #1d1d1f; font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 309.574984)">Simulated mechanism, not Obermeyer et al.'s data (data/ch11_proxy_sim.csv; 20,000 people,</text>
   <text style="fill: #1d1d1f; font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 320.477125)">12% in group B, 50 seeds). Need is the same in both groups, unlike the case, and selecting only the</text>
   <text style="fill: #1d1d1f; font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 331.115047)">top 3% magnifies small gaps. Even with no gap, about 40% of the highest-need people were not selected</text>
   <text style="fill: #1d1d1f; font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 341.752969)">by cost: that is random noise in spending, not the gap.</text>
  </g>
