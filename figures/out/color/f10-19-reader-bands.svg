<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 262" width="800" height="262" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Readers of some messages expect your own words; readers of others want accuracy and clarity first</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="262" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Before you ask a tool: what do these readers expect?</text><rect x="22" y="52" width="372" height="150" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="208.0" y="103.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Own words expected</text><text x="208.0" y="141.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">thank-you note · apology · message after a loss</text><text x="208.0" y="157.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">· reference letter · personal statement ·</text><text x="208.0" y="172.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">reflection essay</text><rect x="406" y="52" width="372" height="150" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="592.0" y="103.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Accuracy and clarity first</text><text x="592.0" y="149.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">meeting summary · status update · routine</text><text x="592.0" y="164.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">notice · FAQ answer</text><line x1="400" y1="46" x2="400" y2="208" stroke="#1D1D1F" stroke-width="1.6" stroke-dasharray="6 4"/><text x="400.0" y="228.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Readers judge the sender by what they believe about how the message was made (Liu et al., 2022) · the boundary is</text><text x="400.0" y="243.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">dashed because messages vary</text></svg>