<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 548" width="800" height="548" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Data terms are a gate: a tool that fails it is out, whatever its quality</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="548" fill="#FFFFFF"/><rect x="20" y="130" width="200" height="170" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="120.0" y="178.7" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Data class of the</text><text x="120.0" y="197.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">input</text><text x="120.0" y="217.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Public · internal or</text><text x="120.0" y="233.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">confidential · restricted</text><text x="120.0" y="249.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">or legally protected;</text><text x="120.0" y="264.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">also: personal data about</text><text x="120.0" y="280.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">others; your own work</text><path d="M222.0,215.0 L248.0,215.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="355.0,140.0 460.0,215.0 355.0,290.0 250.0,215.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="355.0" y="197.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Do the tool&#x27;s</text><text x="355.0" y="215.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">data terms allow</text><text x="355.0" y="232.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">this class?</text><path d="M460.0,215.0 L558.0,215.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="509.0" y="203.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">yes</text><rect x="560" y="170" width="220" height="90" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="670.0" y="200.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Pass: now test quality</text><text x="670.0" y="233.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">the bake-off (12.6)</text><path d="M355.0,290.0 L355.0,318.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="368.0" y="304.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">no</text><polygon points="355.0,320.0 450.0,385.0 355.0,450.0 260.0,385.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="355.0" y="376.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Can you change</text><text x="355.0" y="393.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the input?</text><text x="30.0" y="360.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="">For example: remove names,</text><text x="30.0" y="380.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="">use placeholders, leave out</text><text x="30.0" y="400.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="">confidential details</text><path d="M450.0,385.0 L640.0,262.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="560.0" y="340.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">yes</text><path d="M355.0,450.0 L355.0,476.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="368.0" y="463.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">no</text><rect x="220" y="478" width="270" height="64" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="355.0" y="501.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Blocked for this part, whatever</text><text x="355.0" y="518.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">its quality</text><text x="530.0" y="470.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Three questions about the terms:</text><text x="530.0" y="492.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="">1 training · 2 retention and access</text><text x="530.0" y="512.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="">3 consumer or institutional contract</text></svg>