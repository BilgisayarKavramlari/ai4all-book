<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 335" width="800" height="335" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Klarna&#x27;s public account moved from speed and cost (2024) to a guaranteed human option (2025)</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="335" fill="#FFFFFF"/><rect x="20" y="40" width="236" height="230" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="138.0" y="155.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="138.0" y="64.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">February 2024</text><text x="138.0" y="112.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Klarna said its assistant had</text><text x="138.0" y="128.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2.3 million chats in its first</text><text x="138.0" y="144.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">month, two-thirds of its</text><text x="138.0" y="160.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">customer-service chats, work</text><text x="138.0" y="175.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">equal to 700 full-time agents,</text><text x="138.0" y="191.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">with satisfaction on par with</text><text x="138.0" y="207.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">people.</text><path d="M260.0,155.0 L278.0,155.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="282" y="40" width="236" height="230" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3"/><text x="400.0" y="155.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="400.0" y="64.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">May 2025</text><text x="400.0" y="120.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">In an interview reported by</text><text x="400.0" y="136.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Bloomberg, the CEO said cost</text><text x="400.0" y="152.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">had weighed too heavily,</text><text x="400.0" y="167.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">quality had suffered, and</text><text x="400.0" y="183.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">customers would always be able</text><text x="400.0" y="199.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">to reach a person.</text><path d="M522.0,155.0 L540.0,155.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="544" y="40" width="236" height="230" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="662.0" y="155.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="662.0" y="64.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">November 2025</text><text x="662.0" y="128.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">On an earnings call, the CEO</text><text x="662.0" y="144.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">said the assistant did the work</text><text x="662.0" y="160.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">of more than 853 full-time</text><text x="662.0" y="175.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">agents and had saved about $60</text><text x="662.0" y="191.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">million.</text><text x="400.0" y="296.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">All figures and statements are the company&#x27;s own, as reported; none is an independent measurement.</text><text x="400.0" y="318.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Sources: Klarna (2024); Bloomberg (2025) via Entrepreneur (2025); CX Dive (2025).</text></svg>