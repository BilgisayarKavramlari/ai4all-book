<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Plausible and faithful are separate questions</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="430" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Plausible and faithful are separate questions</text><text x="400.0" y="56.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Is it true of the model? (faithful)</text><text x="285.0" y="82.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">yes</text><text x="555.0" y="82.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">no</text><text x="70.0" y="228.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Does it seem</text><text x="70.0" y="246.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">right to people?</text><text x="70.0" y="263.1" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">(plausible)</text><text x="140.0" y="161.0" font-size="14" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="#1D1D1F" style="">yes</text><text x="140.0" y="311.0" font-size="14" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="#1D1D1F" style="">no</text><rect x="150" y="96" width="260" height="130" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="280.0" y="140.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">Useful</text><text x="280.0" y="179.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">convincing and true: still check</text><text x="280.0" y="194.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">it</text><rect x="420" y="96" width="260" height="130" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="550.0" y="140.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Dangerous</text><text x="550.0" y="179.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">convincing but not what the model</text><text x="550.0" y="194.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">did</text><rect x="150" y="246" width="260" height="130" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="280.0" y="290.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Easy to dismiss</text><text x="280.0" y="329.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">true but surprising: often a real</text><text x="280.0" y="344.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">finding</text><rect x="420" y="246" width="260" height="130" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="550.0" y="290.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Harmless</text><text x="550.0" y="329.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">unconvincing and untrue: few rely</text><text x="550.0" y="344.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">on it</text><text x="400.0" y="410.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Thick border, hatched in print = the cell this chapter warns about · a test, not a feeling, decides the column</text></svg>