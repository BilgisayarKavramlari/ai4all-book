<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A workflow card keeps the model card&#x27;s core: what it is for, what it was tested on, and where it fails</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="530" fill="#FFFFFF"/><text x="170.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Model card (nine sections)</text><text x="600.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Workflow card (five fields)</text><text x="40.0" y="82.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">· Intended use (out-of-scope uses)</text><rect x="500" y="64" width="240" height="42" rx="3" fill="#1C3D6E" stroke="#0F2440" stroke-width="3"/><text x="620.0" y="85.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Not for</text><path d="M330.0,85.0 L496.0,85.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="40.0" y="140.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">· Intended use</text><rect x="500" y="122" width="240" height="42" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="620.0" y="143.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">For</text><path d="M330.0,143.0 L496.0,143.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="40.0" y="198.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">· Model details (tool and model used)</text><text x="40.0" y="220.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">· Evaluation data</text><text x="40.0" y="242.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">· Factors</text><rect x="500" y="180" width="240" height="86" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="620.0" y="223.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Tested on</text><path d="M330.0,223.0 L496.0,223.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="40.0" y="300.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">· Metrics</text><text x="40.0" y="322.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">· Quantitative analyses</text><rect x="500" y="282" width="240" height="64" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="620.0" y="314.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Results</text><path d="M330.0,314.0 L496.0,314.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="40.0" y="380.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">· Training data (what it learned from, if known)</text><text x="40.0" y="402.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">· Ethical considerations</text><text x="40.0" y="424.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">· Caveats and recommendations</text><rect x="500" y="362" width="240" height="86" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="620.0" y="405.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Limits and safeguards</text><path d="M330.0,405.0 L496.0,405.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="400.0" y="474.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Factors and quantitative analyses ask for results by group and condition, not one overall number (Mitchell et al.,</text><text x="400.0" y="489.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">2019). Thick = the field to write first.</text></svg>