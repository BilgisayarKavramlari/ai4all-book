    <text style="fill: #1d1d1f; font: 700 11.5px 'DejaVu Sans', 'Bitstream Vera Sans', 'Computer Modern Sans Serif', 'Lucida Grande', 'Verdana', 'Geneva', 'Lucid', 'Arial', 'Helvetica', 'Avant Garde', sans-serif; text-anchor: start" x="193.04" y="174.218335" transform="rotate(-0 193.04 174.218335)">35% at 10 steps</text>
   </g>
   <g id="text_22">
    <text style="font: 700 12.5px 'DejaVu Sans', 'Bitstream Vera Sans', 'Computer Modern Sans Serif', 'Lucida Grande', 'Verdana', 'Geneva', 'Lucid', 'Arial', 'Helvetica', 'Avant Garde', sans-serif; text-anchor: start" x="73.44" y="16.698047" transform="rotate(-0 73.44 16.698047)">In this book's calculation, at 95% per step only about a third of 20-step runs have no error</text>
   </g>
  </g>
  <g id="text_23">
   <text style="fill: #1d1d1f; font: 9.5px 'DejaVu Sans', 'Bitstream Vera Sans', 'Computer Modern Sans Serif', 'Lucida Grande', 'Verdana', 'Geneva', 'Lucid', 'Arial', 'Helvetica', 'Avant Garde', sans-serif" transform="translate(7.2 312.147906)">Computed by this book (figures/scripts/ch14_experiments.py): chance of no error = p × p × … = p^n, assuming every step goes right</text>
   <text style="fill: #1d1d1f; font: 9.5px 'DejaVu Sans', 'Bitstream Vera Sans', 'Computer Modern Sans Serif', 'Lucida Grande', 'Verdana', 'Geneva', 'Lucid', 'Arial', 'Helvetica', 'Avant Garde', sans-serif" transform="translate(7.2 323.050047)">with the same chance, independently. A calculation, not data about any agent: real errors can be correlated (worse) or harmless and fixed (better).</text>
  </g>
