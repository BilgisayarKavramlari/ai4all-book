<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Bias in generated text enters where the data and the feedback come from</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="390" fill="#FFFFFF"/><text x="400.0" y="28.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The Data-to-Prediction Pipeline</text><rect x="22" y="70" width="170" height="110" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="107.0" y="107.4" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">1. Collect data</text><text x="107.0" y="139.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Which examples? From</text><text x="107.0" y="154.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">whom?</text><path d="M194.0,125.0 L216.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="107.0" y="206.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Web text, books, code:</text><text x="107.0" y="221.9" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">stereotypes included</text><rect x="218" y="70" width="170" height="110" rx="16" fill="#C2410C" stroke="#7A2808" stroke-width="3"/><text x="303.0" y="107.4" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">2. Label</text><text x="303.0" y="131.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Who decides the</text><text x="303.0" y="147.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">answers? By which</text><text x="303.0" y="162.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">guideline?</text><path d="M390.0,125.0 L412.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="303.0" y="206.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">People rate and correct</text><text x="303.0" y="221.9" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">answers</text><polygon points="432.0,70.0 566.0,70.0 584.0,125.0 566.0,180.0 432.0,180.0 414.0,125.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="499.0" y="107.4" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3. Train</text><text x="499.0" y="139.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Which model? How</text><text x="499.0" y="154.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">long?</text><path d="M586.0,125.0 L608.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="628.0,70.0 762.0,70.0 780.0,125.0 762.0,180.0 628.0,180.0 610.0,125.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="695.0" y="107.4" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">4. Predict</text><text x="695.0" y="147.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">On which new cases?</text><rect x="230" y="270" width="340" height="64" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3" stroke-dasharray="7 5"/><text x="400.0" y="291.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">5. Feedback</text><text x="400.0" y="306.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Decisions based on predictions become new</text><text x="400.0" y="322.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">data</text><path d="M695.0,184.0 Q662.4,271.6 574.0,302.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><path d="M226.0,302.0 Q148.0,306.5 107.0,240.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="400.0" y="364.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Hatched/colored with thick border = where the problem enters · Rounded = human decision · hexagon = AI component</text><text x="400.0" y="379.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">· dashed = loop back into the data</text></svg>