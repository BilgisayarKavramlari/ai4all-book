<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 486" width="800" height="486" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Your audit records the evidence behind every number in the matrix</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="486" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Your audit records the evidence behind every number in the matrix</text><rect x="30" y="48" width="740" height="50" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="400.0" y="73.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="50.0" y="73.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">1. Decision</text><text x="310.0" y="73.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">statement · owner · who is affected · reversible?</text><polygon points="48.0,106.0 752.0,106.0 770.0,131.0 752.0,156.0 48.0,156.0 30.0,131.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="400.0" y="131.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="50.0" y="131.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">2. AI-drafted matrix</text><text x="310.0" y="131.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">tool · model · date · prompt</text><rect x="30" y="164" width="740" height="50" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="189.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="50.0" y="189.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">3. Criteria audit</text><text x="310.0" y="181.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">meant · measured · proxy, for whom? · blanks: can you get the real</text><text x="310.0" y="196.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">value?</text><rect x="30" y="222" width="740" height="50" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="247.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="50.0" y="247.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">4. Recalculation</text><text x="310.0" y="247.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">top two totals outside the tool · verdict for each</text><rect x="30" y="280" width="740" height="50" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="400.0" y="305.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="50.0" y="305.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">5. Two sensitivity tests</text><text x="310.0" y="305.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">a weight · a blank or criterion → new top, margin, shortlist</text><rect x="30" y="338" width="740" height="50" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="400.0" y="363.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="50.0" y="363.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">6. Revised matrix and memo</text><text x="310.0" y="363.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">recommendation · reasons · review step · what the matrix misses</text><rect x="30" y="396" width="740" height="50" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="400.0" y="421.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="50.0" y="421.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">7–8. Uncertainty and declaration</text><text x="310.0" y="421.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">what you could not check · the five declaration elements</text><text x="400.0" y="470.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Hexagon = AI output · rounded = your decisions · dashed = what remains uncertain</text></svg>