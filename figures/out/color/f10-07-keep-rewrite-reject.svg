<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 592" width="800" height="592" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Every sentence earns its place: keep, rewrite or reject</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="592" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">One sentence at a time: keep, rewrite or reject</text><polygon points="78.0,44.0 262.0,44.0 280.0,66.0 262.0,88.0 78.0,88.0 60.0,66.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="170.0" y="66.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A sentence in the draft</text><path d="M170.0,90.0 L170.0,104.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><polygon points="170.0,106.0 300.0,150.0 170.0,194.0 40.0,150.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="170.0" y="142.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">True? Facts go through</text><text x="170.0" y="157.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the funnel</text><path d="M302.0,150.0 L470.0,150.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="