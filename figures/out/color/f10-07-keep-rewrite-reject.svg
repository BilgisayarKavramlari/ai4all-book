" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="182.0" y="301.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">yes</text><polygon points="170.0,302.0 300.0,346.0 170.0,390.0 40.0,346.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="170.0" y="346.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Right for this reader?</text><path d="M302.0,346.0 L470.0,346.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="386.0" y="334.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">no</text><rect x="474" y="316" width="300" height="60" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="624.0" y="336.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Rewrite</text><text x="624.0" y="358.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">tag: audience and tone</text><path d="M170.0,392.0 L170.0,406.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="182.0" y="399.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">yes</text><polygon points="170.0,400.0 300.0,444.0 170.0,488.0 40.0,444.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="170.0" y="436.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Can I stand behind it?</text><text x="170.0" y="451.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Safe to share?</text><path d="M302.0,444.0 L470.0,444.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" 