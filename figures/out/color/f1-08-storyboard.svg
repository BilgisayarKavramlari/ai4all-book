<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 245" width="800" height="245" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>What happened when the assistant arrived</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="245" fill="#FFFFFF"/><text x="102.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">1. Before</text><rect x="15" y="50" width="175" height="150" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="102.5" y="117.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Agents answer customer</text><text x="102.5" y="132.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">chats on their own</text><path d="M192.0,125.0 L210.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="299.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">2. Rollout</text><polygon points="230.0,50.0 369.0,50.0 387.0,125.0 369.0,200.0 230.0,200.0 212.0,125.0" fill="#FCE38A" stroke="#6B5A12" stroke-width="1.6"/><text x="299.5" y="101.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The AI assistant</text><text x="299.5" y="117.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">reaches agents a few</text><text x="299.5" y="132.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">at a time over several</text><text x="299.5" y="148.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">months</text><path d="M389.0,125.0 L407.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="496.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">3. Comparison</text><rect x="409" y="50" width="175" height="150" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="496.5" y="109.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Researchers compare</text><text x="496.5" y="125.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">agents with and</text><text x="496.5" y="140.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">without it, same weeks</text><path d="M586.0,125.0 L604.0,125.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="693.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">4. Result</text><rect x="606" y="50" width="175" height="150" rx="3" fill="#4CAF84" stroke="#1F5E43" stroke-width="1.6"/><text x="693.5" y="93.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">+15% issues/hour on</text><text x="693.5" y="109.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">average; about +30%</text><text x="693.5" y="125.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">for newer agents;</text><text x="693.5" y="140.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">small quality dip for</text><text x="693.5" y="156.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#0B1F16" style="">the most experienced</text><text x="400.0" y="232.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Source: Brynjolfsson, Li &amp; Raymond (2025), 5,172 agents</text></svg>