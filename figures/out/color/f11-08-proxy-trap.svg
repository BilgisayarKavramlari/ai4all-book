<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A proxy fails where the gap between it and the goal differs across groups</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="530" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The proxy-variable trap</text><text x="400.0" y="50.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Where the proxy sits: the label (Chapter 2&#x27;s proxies sat in the inputs)</text><rect x="20" y="80" width="190" height="96" rx="16" fill="#1C3D6E" stroke="#0F2440" stroke-width="1.6"/><text x="115.0" y="112.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Health need</text><text x="115.0" y="147.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">how sick a patient is</text><rect x="310" y="80" width="190" height="96" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="405.0" y="112.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Next year&#x27;s cost</text><text x="405.0" y="147.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">what was spent on care</text><path d="M307.0,128.0 L213.0,128.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="260.0" y="110.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">stands in for</text><rect x="125" y="212" width="270" height="88" rx="3" fill="#C2410C" stroke="#7A2808" stroke-width="3" stroke-dasharray="7 5"/><text x="260.0" y="241.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Unequal access to care</text><text x="260.0" y="265.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">less is spent on Black patients</text><text x="260.0" y="281.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">with the same need</text><line x1="115" y1="176" x2="150" y2="212" stroke="#1D1D1F" stroke-width="1.4" stroke-dasharray="6 4"/><line x1="405" y1="176" x2="370" y2="212" stroke="#1D1D1F" stroke-width="1.4" stroke-dasharray="6 4"/><polygon points="385.0,336.0 500.0,378.0 385.0,420.0 270.0,378.0" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="385.0" y="364.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Who is flagged</text><text x="385.0" y="394.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">for a care program</text><path d="M440.0,178.0 L400.0,352.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><text x="30.0" y="360.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">Prediction can be accurate</text><text x="30.0" y="382.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">for the measure and still</text><text x="30.0" y="402.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">wrong for the goal</text><rect x="530" y="80" width="250" height="340" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="655.0" y="250.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="655.0" y="110.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Three questions</text><text x="548.0" y="170.0" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">1. What do we mean?</text><text x="548.0" y="236.0" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">2. What do we measure?</text><text x="548.0" y="302.0" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">3. For whom is the gap bigger?</text><text x="655.0" y="384.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Ask them of every criterion</text><text x="400.0" y="450.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Obermeyer et al. (2019): race was excluded from the inputs; the gap entered through the label. Chapter 16 places</text><text x="400.0" y="465.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">this on the Bias Lifecycle.</text><text x="400.0" y="492.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Rounded = the goal people care about · rectangle = what is recorded · dashed, thick (hatched in print) = the hidden</text><text x="400.0" y="507.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">gap · diamond = the decision</text></svg>