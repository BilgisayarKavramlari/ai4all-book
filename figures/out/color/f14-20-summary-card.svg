<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Chapter 14 summary card</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="340" fill="#FFFFFF"/><text x="400.0" y="26.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Chapter 14 — what you can do now</text><rect x="20" y="50" width="242" height="130" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="141.0" y="106.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Place a system: who fixes</text><text x="141.0" y="123.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">the next step, who runs it</text><rect x="278" y="50" width="242" height="130" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="399.0" y="106.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Trace a run: plan, tool</text><text x="399.0" y="123.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">call, observation, stop</text><rect x="536" y="50" width="242" height="130" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="657.0" y="106.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Expect errors to compound;</text><text x="657.0" y="123.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">test whole runs</text><rect x="20" y="200" width="242" height="130" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="141.0" y="256.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Classify actions; place</text><text x="141.0" y="273.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">gates, checks and stops</text><rect x="278" y="200" width="242" height="130" rx="16" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="399.0" y="256.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Prefer hard gates; keep</text><text x="399.0" y="273.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">approvals few and real</text><rect x="536" y="200" width="242" height="130" rx="16" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="657.0" y="256.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Give least privilege; keep a</text><text x="657.0" y="273.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">log; dry-run with a fault</text></svg>