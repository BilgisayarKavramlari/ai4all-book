<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 486" width="800" height="486" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>The replies to Matthias deny a premise or offer a third option</title><defs><marker id="arrow-color" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1D1F"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="486" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">The replies to Matthias deny a premise or offer a third option</text><rect x="190" y="60" width="420" height="78" rx="3" fill="#EEF2F7" stroke="#8A94A3" stroke-width="1.6"/><text x="400.0" y="99.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="202.0" y="74.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">CLAIM</text><text x="400.0" y="91.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Learning systems open a responsibility gap: stop</text><text x="400.0" y="108.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">using them or accept the gap</text><text x="400.0" y="126.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">Matthias (2004)</text><text x="194.0" y="182.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">+ FOR (reasons and premises)</text><text x="606.0" y="182.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">− AGAINST (objections)</text><line x1="18" y1="99.0" x2="18" y2="356.0" stroke="#1D1D1F" stroke-width="1.6"/><path d="M18.0,99.0 L188.0,99.0" fill="none" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#arrow-color)"/><rect x="34" y="208" width="320" height="88" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="194.0" y="252.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="44.0" y="222.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">+ FOR 1</text><text x="194.0" y="246.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Holding someone responsible needs control</text><text x="194.0" y="261.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">and foresight</text><text x="194.0" y="285.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">Matthias (2004)</text><line x1="18" y1="252.0" x2="34" y2="252.0" stroke="#1D1D1F" stroke-width="1.6"/><rect x="34" y="312" width="320" height="88" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="194.0" y="356.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="44.0" y="326.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">+ FOR 2</text><text x="194.0" y="350.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Learning systems act in ways makers and</text><text x="194.0" y="365.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">operators cannot predict</text><text x="194.0" y="389.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">Matthias (2004)</text><line x1="18" y1="356.0" x2="34" y2="356.0" stroke="#1D1D1F" stroke-width="1.6"/><line x1="782" y1="99.0" x2="782" y2="356.0" stroke="#1D1D1F" stroke-width="1.6"/><line x1="782" y1="99.0" x2="620" y2="99.0" stroke="#1D1D1F" stroke-width="1.8"/><line x1="613" y1="90.0" x2="613" y2="108.0" stroke="#1D1D1F" stroke-width="3"/><rect x="446" y="208" width="320" height="88" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="606.0" y="252.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="456.0" y="222.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">− AGAINST 1</text><text x="606.0" y="246.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">Responsibility practices are flexible and</text><text x="606.0" y="261.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">can stretch to cover new cases</text><text x="606.0" y="285.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">Tigard (2021)</text><line x1="446" y1="252.0" x2="364" y2="252.0" stroke="#1D1D1F" stroke-width="1.8"/><line x1="357" y1="243.0" x2="357" y2="261.0" stroke="#1D1D1F" stroke-width="3"/><text x="403.0" y="240.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">denies</text><rect x="446" y="312" width="320" height="88" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.6"/><text x="606.0" y="356.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style=""></text><text x="456.0" y="326.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1D1D1F" style="">− AGAINST 2</text><text x="606.0" y="350.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">A third option: design for meaningful human</text><text x="606.0" y="365.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="">control (tracking and tracing)</text><text x="606.0" y="389.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1D1D1F" style="font-style:italic;">Santoni de Sio &amp; van den Hoven (2018)</text><line x1="766" y1="356.0" x2="782" y2="356.0" stroke="#1D1D1F" stroke-width="1.6"/><text x="400.0" y="416.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">Arrowhead = supports what it points to · flat bar = opposes it (the claim, or the premise it denies) · dashed =</text><text x="400.0" y="431.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="">inferred (the book&#x27;s reading or an unstated premise)</text><text x="400.0" y="460.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#5C5C66" style="font-style:italic;">Not drawn: Elish (2019), whose moral crumple zone is a warning about where blame lands, not a denial of the gap.</text></svg>