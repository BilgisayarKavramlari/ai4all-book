<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A right to contest needs a person who can change the decision</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="400" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A right to contest needs a person who can change the decision</text><rect x="16" y="110" width="168" height="96" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="100.0" y="142.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Notice</text><text x="100.0" y="169.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">you learn a system</text><text x="100.0" y="185.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">was used</text><path d="M186.0,158.0 L204.0,158.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="206" y="110" width="172" height="96" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="292.0" y="142.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Ask for reasons</text><text x="292.0" y="169.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">from the record, in</text><text x="292.0" y="185.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">words you can use</text><path d="M380.0,158.0 L402.0,158.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="498.0,92.0 592.0,158.0 498.0,224.0 404.0,158.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="498.0" y="128.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Review by a</text><text x="498.0" y="145.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">person</text><text x="498.0" y="176.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">with power to</text><text x="498.0" y="192.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">change it?</text><path d="M594.0,158.0 L616.0,158.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="618" y="110" width="170" height="96" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="703.0" y="142.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Correct and remedy</text><text x="703.0" y="169.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">decision changed;</text><text x="703.0" y="185.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">harm repaired</text><text x="603.0" y="140.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">yes</text><path d="M504.0,226.0 L504.0,280.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="370" y="282" width="268" height="72" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="504.0" y="306.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A review in form only</text><text x="504.0" y="332.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">no power to change, or no reasons</text><text x="516.0" y="252.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">no</text><text x="400.0" y="380.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Diamond = a check · rounded = a person · thick border, hatched in print = where a contest fails in practice</text></svg>