<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 446" width="800" height="446" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>The same five points can arrive in three tones</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="446" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Maya&#x27;s five points, three tones (constructed example)</text><rect x="20" y="46" width="242" height="40" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="141.0" y="66.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Formal</text><rect x="20" y="92" width="242" height="250" rx="3" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="141.0" y="217.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="141.0" y="144.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Dear [Coordinator], I am writing</text><text x="141.0" y="160.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">to inform you that I am unable</text><text x="141.0" y="176.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">to lead Thursday&#x27;s 4 p.m.</text><text x="141.0" y="192.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">session, as my examination has</text><text x="141.0" y="208.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">been rescheduled. I apologize</text><text x="141.0" y="223.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">for the short notice. Would</text><text x="141.0" y="239.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Friday at 2 p.m. or Monday at 4</text><text x="141.0" y="255.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">p.m. be suitable? I will notify</text><text x="141.0" y="271.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the students. The materials are</text><text x="141.0" y="287.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">in the shared folder.</text><text x="141.0" y="362.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">markers: &quot;I am writing to inform</text><text x="141.0" y="377.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">you&quot; · &quot;unable&quot; · &quot;suitable&quot;</text><rect x="278" y="46" width="242" height="40" rx="3" fill="#3A3A3A" stroke="#000000" stroke-width="3"/><text x="399.0" y="66.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Warm</text><rect x="278" y="92" width="242" height="250" rx="3" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="399.0" y="217.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="399.0" y="144.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Hi [Coordinator], I&#x27;m so sorry</text><text x="399.0" y="160.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">to do this on short notice: my</text><text x="399.0" y="176.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">stats exam moved to Thursday at</text><text x="399.0" y="192.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4, so I can&#x27;t lead that session.</text><text x="399.0" y="208.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">I completely understand if this</text><text x="399.0" y="223.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">causes inconvenience. Could we</text><text x="399.0" y="239.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">try Friday at 2 or Monday at 4?</text><text x="399.0" y="255.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">I&#x27;m happy to tell [STUDENTS]</text><text x="399.0" y="271.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">myself. Everything is in the</text><text x="399.0" y="287.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">shared folder.</text><text x="399.0" y="362.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">markers: &quot;I&#x27;m so sorry&quot; · &quot;happy</text><text x="399.0" y="377.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">to&quot; · contractions</text><rect x="536" y="46" width="242" height="40" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="657.0" y="66.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Brief</text><rect x="536" y="92" width="242" height="250" rx="3" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="657.0" y="217.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="657.0" y="168.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Hi [Coordinator], my exam moved,</text><text x="657.0" y="184.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">so I can&#x27;t lead Thursday 4 p.m.</text><text x="657.0" y="200.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Sorry for the late notice.</text><text x="657.0" y="216.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Friday 2 p.m. or Monday 4 p.m.?</text><text x="657.0" y="231.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">I&#x27;ll tell the students.</text><text x="657.0" y="247.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Materials are in the shared</text><text x="657.0" y="263.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">folder.</text><text x="657.0" y="362.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">markers: short sentences · no</text><text x="657.0" y="377.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">extra courtesy</text><text x="400.0" y="406.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Yellow cards = tool outputs · the same five points in each · thick = the version Maya chose to edit (she cut the</text><text x="400.0" y="421.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">&quot;completely understand&quot; sentence and added her own thanks)</text></svg>