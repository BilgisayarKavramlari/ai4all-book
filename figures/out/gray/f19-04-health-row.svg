" y="562.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Fill also marks the level: none · dots · hatching · solid. Thick border = highlighted. Levels follow Chapter 14&#x27;s</text><text x="400.0" y="577.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">rule: can it be undone, and who bears an error?</text><text x="400.0" y="604.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Health coursework includes placement work that can reach patients; a practice set that reaches no one is a check</text><text x="400.0" y="619.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">point.</text></svg>