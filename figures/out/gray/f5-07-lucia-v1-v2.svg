<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>The framed prompt carries what Lucia knew but had not written down</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="510" fill="#FFFFFF"/><rect x="20" y="30" width="250" height="200" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="145.0" y="130.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="145.0" y="52.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">v1 (first prompt)</text><text x="145.0" y="88.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Write a one-page handout for</text><text x="145.0" y="104.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">first-year students on how to</text><text x="145.0" y="120.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">make a monthly budget. Include</text><text x="145.0" y="135.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">one worked example as a table.</text><text x="145.0" y="151.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Use plain language.</text><text x="145.0" y="250.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Missing: the figures that were in</text><text x="145.0" y="265.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">her notes.</text><rect x="290" y="30" width="490" height="470" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="535.0" y="265.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="535.0" y="52.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Final prompt, v5 (parts labeled)</text><rect x="302" y="80" width="112" height="50" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="358.0" y="105.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Task</text><text x="426.0" y="97.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Write a one-page handout for first-year students</text><text x="426.0" y="112.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">on how to make a monthly budget.</text><rect x="302" y="144" width="112" height="68" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="358.0" y="178.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Context</text><text x="426.0" y="162.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Use only these monthly figures: income $1,150;</text><text x="426.0" y="178.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">rent $650; groceries $280; phone $45; transport</text><text x="426.0" y="193.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">$60.</text><rect x="302" y="226" width="112" height="122" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="358.0" y="287.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Constraints</text><text x="426.0" y="247.3" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Use plain language. Refer to tools in general</text><text x="426.0" y="263.2" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">terms, such as &quot;a spreadsheet or a notebook&quot;; do</text><text x="426.0" y="279.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">not name any product, bank or app. Explain every</text><text x="426.0" y="294.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">money term in everyday words the first time you</text><text x="426.0" y="310.8" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">use it. If costs are higher than income, say so</text><text x="426.0" y="326.6" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">and show the gap.</text><rect x="302" y="362" width="112" height="44" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="358.0" y="384.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Output format</text><text x="426.0" y="384.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Include one worked example as a table.</text><text x="535.0" y="452.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">No role and no in-context examples: this task did not need them.</text><text x="535.0" y="476.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">v2 to v5 each added one line (sections 5.4 and 5.5).</text></svg>