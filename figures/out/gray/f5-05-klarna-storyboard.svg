<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Klarna&#x27;s public account moved from efficiency (2024) to quality and a promise of human help (May 2025), then back to AI savings (Nov 2025)</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="350" fill="#FFFFFF"/><rect x="20" y="40" width="236" height="250" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="138.0" y="165.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="138.0" y="64.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">February 2024</text><text x="138.0" y="106.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Confirmed (press release): 2.3</text><text x="138.0" y="122.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">million chats in month one,</text><text x="138.0" y="138.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">two-thirds of chats, work equal</text><text x="138.0" y="154.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">to 700 full-time staff,</text><text x="138.0" y="170.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">satisfaction about the same as</text><text x="138.0" y="185.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">with people, more accurate</text><text x="138.0" y="201.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">resolution (its claim) with 25%</text><text x="138.0" y="217.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">fewer repeat questions; a</text><text x="138.0" y="233.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">person available on request.</text><path d="M260.0,165.0 L278.0,165.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="282" y="40" width="236" height="250" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="400.0" y="165.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="400.0" y="64.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">May 2025</text><text x="400.0" y="130.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Reported (Bloomberg interview,</text><text x="400.0" y="146.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">via other outlets): the chief</text><text x="400.0" y="162.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">executive said cost had been</text><text x="400.0" y="177.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">too dominant and quality was</text><text x="400.0" y="193.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">lower; customers must always be</text><text x="400.0" y="209.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">able to reach a human.</text><path d="M522.0,165.0 L540.0,165.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="544" y="40" width="236" height="250" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="662.0" y="165.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="662.0" y="64.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">November 2025</text><text x="662.0" y="138.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Reported (CX Dive): the chief</text><text x="662.0" y="154.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">executive said the assistant</text><text x="662.0" y="170.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">did the work of more than 853</text><text x="662.0" y="185.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">full-time staff and had saved</text><text x="662.0" y="201.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">about $60 million.</text><text x="400.0" y="314.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Every figure is the company&#x27;s own statement; none is an independent measurement.</text><text x="400.0" y="336.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Sources: Klarna (2024); Fisher (2025); Shibu (2025); Doerer (2025).</text></svg>