t-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">against: same purpose as Westlaw,</text><text x="610.0" y="113.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;minimally transformative&quot;</text><line x1="190" y1="142" x2="782" y2="142" stroke="#444444" stroke-width="0.8"/><rect x="18" y="148" width="162" height="60" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="99.0" y="178.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2. Nature</text><text x="330.0" y="170.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">for fair use: headnotes are mostly</text><text x="330.0" y="185.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">factual</text><text x="610.0" y="178.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">slightly for fair use</text><line x1="190" y1="214" x2="782" y2="214" stroke="#444444" stroke-width="0.8"/><rect x="18" y="220" width="162" height="60" rx="3" fill="#3A3A3A" stroke="#000000" stroke-width="3"/><text x="99.0" y="250.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">3. Amount</text><text x="330.0" y="242.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">for fair use: the outputs did not</text><text x="330.0" y="257.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">show headnotes</text><text x="610.0" y="242.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">against: whole headnotes copied, and</text><text x="610.0" y="257.9" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">copying was not needed</text><line x1="190" y1="286" x2="782" y2="286" stroke="#444444" stroke-width="0.8"/><rect x="18" y="292" width="162" height="60" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="99.0" y="322.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4. Market</text><text x="330.0" y="314.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">against: a substitute; harms an</text><text x="330.0" y="329.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">AI-training-data market</text><text x="610.0" y="314.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">against: harms Westlaw and a developing</text><text x="610.0" y="329.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">licensing market</text><line x1="190" y1="358" x2="782" y2="358" stroke="#444444" stroke-width="0.8"/><rect x="190" y="216" width="592" height="68" fill="none" stroke="#000000" stroke-width="2.4"/><rect x="190" y="372" width="592" height="46" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="486.0" y="395.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Result in both courts: not fair use for the 2,243 headnotes</text><text x="400.0" y="438.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Thick border = the factor the appeals court decided the other way · rounded = the courts&#x27; decision. The appeals</text><text x="400.0" y="453.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">cour