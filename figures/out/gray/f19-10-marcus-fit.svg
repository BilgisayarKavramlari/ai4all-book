<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Each part of Marcus&#x27;s workflow gets its own decision, and one part stays with no AI</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="510" fill="#FFFFFF"/><text x="293.0" y="62.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Institution&#x27;s tool</text><text x="491.0" y="62.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Consumer tool</text><text x="689.0" y="62.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">No AI</text><text x="20.0" y="125.5" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">1. Practice questions</text><text x="20.0" y="142.5" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">from a drug table</text><rect x="200" y="84" width="186" height="100" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="3"/><text x="293.0" y="118.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Use, then check</text><text x="293.0" y="154.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">augmentation · ● inside</text><rect x="398" y="84" width="186" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="491.0" y="109.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Passes the gate; not</text><text x="491.0" y="126.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">chosen</text><text x="491.0" y="154.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">training on by default</text><rect x="596" y="84" width="186" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="689.0" y="118.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Write by hand</text><text x="689.0" y="154.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">floor · slower</text><text x="20.0" y="246.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">2. Answers, closed-book</text><rect x="200" y="196" width="186" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="293.0" y="230.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Not used</text><text x="293.0" y="266.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">recall is the point</text><rect x="596" y="196" width="186" height="100" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="3"/><text x="689.0" y="230.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Answer from memory</text><text x="689.0" y="266.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">floor</text><text x="20.0" y="349.5" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">3. Marks against the</text><text x="20.0" y="366.5" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">table</text><rect x="200" y="308" width="186" height="100" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="3"/><text x="293.0" y="333.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Tool marks; he checks</text><text x="293.0" y="350.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">every mark</text><text x="293.0" y="378.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">augmentation · ● inside</text><rect x="596" y="308" width="186" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="689.0" y="342.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Mark by hand</text><text x="689.0" y="378.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">floor · the fallback</text><text x="400.0" y="430.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Thick, filled = chosen · thick with risk fill (hatched in print) = blocked by the data gate · dashed = predicted,</text><text x="400.0" y="445.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">not tested</text><text x="400.0" y="462.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">● inside / ○ outside the tool&#x27;s frontier (Signature 2) · rung on the Delegation Ladder (Signature 7)</text><text x="400.0" y="486.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Constructed example. Placement material would be blocked in every AI column by his placement rule.</text></svg>