<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Attention lets each token draw on the tokens before it</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="450" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Attention lets each token draw on the tokens before it</text><text x="44.9" y="140.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The</text><text x="99.6" y="140.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">trophy</text><text x="171.5" y="140.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">doesn&#x27;t</text><text x="230.5" y="140.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">fit</text><text x="268.0" y="140.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">in</text><text x="305.5" y="140.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the</text><text x="355.9" y="140.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">brown</text><text x="427.8" y="140.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">suitcase</text><text x="508.3" y="140.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">because</text><text x="571.6" y="140.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">it&#x27;s</text><text x="617.7" y="140.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">too</text><text x="663.8" y="140.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">big.</text><path d="M663.8,126.0 Q381.7,16.0 99.6,126.0" fill="none" stroke="#000000" stroke-width="3.4" marker-end="url(#arrow-gray)"/><path d="M663.8,154.0 Q545.8,234.0 427.8,154.0" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/><text x="30.0" y="190.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="">strong link: “trophy” · weak link: “suitcase”</text><text x="44.9" y="320.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The</text><text x="99.6" y="320.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">trophy</text><text x="171.5" y="320.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">doesn&#x27;t</text><text x="230.5" y="320.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">fit</text><text x="268.0" y="320.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">in</text><text x="305.5" y="320.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the</text><text x="355.9" y="320.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">brown</text><text x="427.8" y="320.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">suitcase</text><text x="508.3" y="320.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">because</text><text x="571.6" y="320.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">it&#x27;s</text><text x="617.7" y="320.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">too</text><text x="672.4" y="320.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">small.</text><path d="M672.4,306.0 Q550.1,196.0 427.8,306.0" fill="none" stroke="#000000" stroke-width="3.4" marker-end="url(#arrow-gray)"/><path d="M672.4,334.0 Q386.0,414.0 99.6,334.0" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/><text x="30.0" y="270.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="">strong link: “suitcase” · weak link: “trophy”</text><text x="400.0" y="408.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Arrows start at the later word: each token can draw only on the tokens before it.</text><text x="400.0" y="434.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Thick arrow = strong link · thin dashed arrow = weak link · illustration, not measured values</text></svg>