<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A counterfactual helps a person only if it names a change they can make</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="440" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A counterfactual helps a person only if it names a change they can make</text><rect x="30" y="150" width="210" height="110" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="135.0" y="187.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Not approved</text><text x="135.0" y="211.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">income 61.8k · debt ratio</text><text x="135.0" y="227.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">0.285 · 0 late payments ·</text><text x="135.0" y="242.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">age band 1</text><rect x="320" y="60" width="230" height="92" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="435.0" y="91.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Debt ratio 0.285 → 0.276</text><text x="435.0" y="116.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">actionable: pay down a little</text><text x="435.0" y="132.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">debt</text><rect x="320" y="258" width="230" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="435.0" y="289.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Age band 1 → 2</text><text x="435.0" y="314.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">cannot be changed soon: only</text><text x="435.0" y="330.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">by waiting years</text><path d="M242.0,186.0 L318.0,112.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M242.0,228.0 L318.0,300.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="200.0" y="124.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">smallest change found</text><text x="200.0" y="296.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">also flips it</text><rect x="610" y="60" width="170" height="92" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="695.0" y="91.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Approve (0.51)</text><text x="695.0" y="124.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">model output</text><rect x="610" y="258" width="170" height="92" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="695.0" y="289.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Approve (0.59)</text><text x="695.0" y="314.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">true of the model;</text><text x="695.0" y="330.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">not advice</text><path d="M552.0,106.0 L608.0,106.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M552.0,304.0 L608.0,304.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="384.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Both searches in this book&#x27;s simulation found the same smallest change: debt ratio down by 0.009. A one-band age</text><text x="400.0" y="399.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">change also flips it, at a higher cost.</text><text x="400.0" y="412.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Filled = actionable change · numbers are the model&#x27;s approval probability · constructed data</text><text x="400.0" y="427.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">(data/ch17_counterfactual.csv)</text></svg>