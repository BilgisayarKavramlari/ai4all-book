<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Cite the source you read, not the tool that found it</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="500" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What goes in your reference list</text><polygon points="175.0,48.0 310.0,116.0 175.0,184.0 40.0,116.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="175.0" y="107.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Did you open and read</text><text x="175.0" y="124.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the source?</text><path d="M312.0,116.0 L368.0,116.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="340.0" y="104.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">no</text><rect x="370" y="80" width="400" height="72" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="570.0" y="104.5" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Do not cite it</text><text x="570.0" y="130.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">read it first, or drop the claim</text><path d="M175.0,186.0 L175.0,222.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="175.0" y="204.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">yes</text><polygon points="175.0,224.0 310.0,292.0 175.0,360.0 40.0,292.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="175.0" y="274.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Are you quoting or</text><text x="175.0" y="292.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">paraphrasing AI output</text><text x="175.0" y="309.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">itself?</text><path d="M312.0,292.0 L368.0,240.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="340.0" y="258.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">no</text><rect x="370" y="206" width="400" height="70" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="570.0" y="229.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Cite the source you read</text><text x="570.0" y="255.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">not the tool that found it</text><path d="M312.0,292.0 L368.0,340.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="340.0" y="328.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">yes</text><rect x="370" y="306" width="400" height="74" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="570.0" y="331.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Cite the source, and cite the AI chat</text><text x="570.0" y="349.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">APA 2025: company, date, chat title, [Generative</text><text x="570.0" y="365.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">AI chat], tool, link</text><rect x="40" y="404" width="730" height="52" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="405.0" y="430.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">In this book&#x27;s assignments, declare AI use either way (AI Use Declaration, Chapter 1)</text><text x="400.0" y="484.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Diamonds = decisions · thick (hatched in print) = do not · green = cite · rounded = your declaration</text></svg>