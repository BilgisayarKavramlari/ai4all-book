<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 336" width="800" height="336" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Each role has its own duty, and none passes to the model</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="336" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Who is responsible for an AI system: roles and duties</text><rect x="18" y="60" width="176" height="120" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="106.0" y="100.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Provider</text><text x="106.0" y="128.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">builds and documents</text><text x="106.0" y="144.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">it; designs for</text><text x="106.0" y="159.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">oversight</text><path d="M196.0,115.0 L212.0,115.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="214" y="60" width="176" height="120" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="302.0" y="100.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Deployer</text><text x="302.0" y="128.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">uses it in its work;</text><text x="302.0" y="144.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">checks it; tells</text><text x="302.0" y="159.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">people</text><path d="M392.0,115.0 L408.0,115.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="410" y="60" width="176" height="120" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="498.0" y="100.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">User</text><text x="498.0" y="136.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">checks the output</text><text x="498.0" y="151.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">before relying on it</text><path d="M588.0,115.0 L604.0,115.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="606" y="60" width="176" height="120" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="694.0" y="100.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">People affected</text><text x="694.0" y="136.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">customers, applicants,</text><text x="694.0" y="151.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">patients, students</text><polygon points="58.0,214.0 232.0,214.0 250.0,252.0 232.0,290.0 58.0,290.0 40.0,252.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="145.0" y="239.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The model</text><text x="145.0" y="259.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">has no duties: not a legal</text><text x="145.0" y="275.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">person</text><path d="M146.0,212.0 L106.0,182.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="560.0" y="236.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Terms: provider (developer, in Texas TRAIGA) and deployer (EU</text><text x="560.0" y="252.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">AI Act). Which role carries which duty depends on the law that</text><text x="560.0" y="267.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">applies.</text><text x="400.0" y="316.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = people and organizations · hexagon = AI component · duties and good practice (this book&#x27;s reading)</text></svg>