<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 478" width="800" height="478" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A verification table records how far each claim got, not only a verdict</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="478" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">One row of a claim verification table (A5)</text><rect x="20" y="44" width="210" height="42" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="125.0" y="65.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Claim</text><text x="244.0" y="65.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">one statement you might rely on; checkable or not; type</text><rect x="20" y="94" width="210" height="42" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="125.0" y="115.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Stakes</text><text x="244.0" y="115.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">low · medium · high, with a reason</text><rect x="20" y="144" width="210" height="42" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="125.0" y="165.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Before checking</text><text x="244.0" y="165.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">your confidence (%) · the tool&#x27;s stated confidence (%) · any signal</text><rect x="20" y="194" width="210" height="42" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="125.0" y="215.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Stage reached</text><text x="244.0" y="215.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">independent check · primary source · expert</text><rect x="20" y="244" width="210" height="42" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="125.0" y="265.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Source</text><text x="244.0" y="265.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">link or location; for citations: exists? matches? says it?</text><rect x="20" y="294" width="210" height="42" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="125.0" y="315.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Verdict</text><text x="244.0" y="315.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">supported · partly supported · unsupported · contradicted · cannot verify</text><rect x="20" y="344" width="210" height="42" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="125.0" y="365.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Remaining uncertainty</text><text x="244.0" y="365.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">what you could not check, and why</text><rect x="20" y="394" width="210" height="42" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="125.0" y="415.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Corrected statement</text><text x="244.0" y="415.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">for every claim that is not supported</text><text x="400.0" y="450.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = what you write · shaded = the verdict · dashed = uncertainty · the tool&#x27;s own “yes” never counts as a</text><text x="400.0" y="465.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">source</text></svg>