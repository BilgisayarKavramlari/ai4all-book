<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 415" width="800" height="415" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A peer from another field finds what the builder&#x27;s own tests miss</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="415" fill="#FFFFFF"/><rect x="30" y="50" width="230" height="100" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="145.0" y="84.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Your three runs</text><text x="145.0" y="120.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">typical, different, edge</text><rect x="285" y="50" width="230" height="100" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="84.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A peer from another field</text><text x="400.0" y="112.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">chooses an input within your</text><text x="400.0" y="127.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">scope</text><rect x="540" y="50" width="230" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="655.0" y="74.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Runs it with only your</text><text x="655.0" y="93.1" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">instructions</text><text x="655.0" y="120.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">you watch and record</text><rect x="30" y="230" width="230" height="100" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="145.0" y="264.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Finding: confused here</text><text x="145.0" y="300.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">or a wrong output</text><rect x="285" y="230" width="230" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="264.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Revision</text><text x="400.0" y="300.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">one change, with a reason</text><rect x="540" y="230" width="230" height="100" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="655.0" y="264.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Rerun</text><text x="655.0" y="300.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the input that failed</text><path d="M262.0,100.0 L283.0,100.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M517.0,100.0 L538.0,100.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M655.0,152.0 L655.0,226.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M538.0,280.0 L517.0,280.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M283.0,280.0 L262.0,280.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="372.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Thick border = what the peer test is for: a finding you did not see yourself</text><text x="400.0" y="398.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = a person · rectangle = a step</text></svg>