<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>The person who relies on the output often cannot check it, so the author must</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="450" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The person who relies on the output often cannot check it, so the author must</text><rect x="20" y="56" width="370" height="124" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="205.0" y="98.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Alt text</text><text x="205.0" y="126.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">relies: a screen-reader user · can check:</text><text x="205.0" y="142.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">rarely (cannot see the image) · checks: the</text><text x="205.0" y="158.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">author who posts it</text><rect x="410" y="56" width="370" height="124" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="595.0" y="98.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Captions</text><text x="595.0" y="126.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">relies: a viewer who is deaf or hard of hearing</text><text x="595.0" y="142.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">· can check: rarely · checks: whoever publishes</text><text x="595.0" y="158.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the video</text><rect x="20" y="198" width="370" height="124" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="205.0" y="240.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Transcript</text><text x="205.0" y="276.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">relies: a reader of the record · can check:</text><text x="205.0" y="292.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">only with the audio · checks: whoever files it</text><rect x="410" y="198" width="370" height="124" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="595.0" y="240.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Design draft</text><text x="595.0" y="268.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">relies: a client · can check: what they see,</text><text x="595.0" y="284.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">not how it was made · checks: the designer, who</text><text x="595.0" y="300.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">discloses</text><rect x="170" y="352" width="460" height="56" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="380.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The check belongs to whoever publishes the output</text><text x="400.0" y="432.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Orange (hatched in print) = the reader can rarely check · rounded = a person&#x27;s action</text></svg>