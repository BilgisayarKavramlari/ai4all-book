<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Chapter 13 summary card</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="340" fill="#FFFFFF"/><text x="400.0" y="26.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Chapter 13 — what you can do now</text><rect x="20" y="50" width="242" height="130" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="141.0" y="97.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Built, not recorded: a</text><text x="141.0" y="115.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">realistic picture or voice</text><text x="141.0" y="132.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">records nothing by itself</text><rect x="278" y="50" width="242" height="130" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="399.0" y="97.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Who relies, who checks: the</text><text x="399.0" y="115.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">author checks alt text,</text><text x="399.0" y="132.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">captions and transcripts</text><rect x="536" y="50" width="242" height="130" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="657.0" y="89.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Signals: present = a lead</text><text x="657.0" y="106.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">about origin; missing =</text><text x="657.0" y="123.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">proves nothing; history is</text><text x="657.0" y="140.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">not truth</text><rect x="20" y="200" width="242" height="130" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="141.0" y="239.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Looks and scores are leads</text><text x="141.0" y="256.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">(clues, not conclusions):</text><text x="141.0" y="273.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">people near guessing,</text><text x="141.0" y="290.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">detectors weak on new media</text><rect x="278" y="200" width="242" height="130" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="399.0" y="247.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Context before pixels:</text><text x="399.0" y="265.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">source, channel, earliest</text><text x="399.0" y="282.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">version, outside sources</text><rect x="536" y="200" width="242" height="130" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="657.0" y="247.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Decide in advance: triggers,</text><text x="657.0" y="265.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">pause, a channel you trust,</text><text x="657.0" y="282.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">then disclose</text></svg>