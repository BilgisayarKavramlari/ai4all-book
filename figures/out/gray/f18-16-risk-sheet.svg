<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Your rules-and-rights risk names one rule, its layer and its evidence, and whom to ask</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="470" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The rules-and-rights risk (one A12 risk, Chapter 15&#x27;s template)</text><rect x="18" y="46" width="764" height="396" fill="none" stroke="#000000" stroke-width="1.8"/><text x="30.0" y="68.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">1 Scratch list</text><text x="200.0" y="68.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">prompts a–e on the data-flow map: terms, course rules, data classes, policies, one law</text><line x1="18" y1="90" x2="782" y2="90" stroke="#444444" stroke-width="0.8"/><text x="30.0" y="112.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">2 Choose</text><text x="200.0" y="112.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">the rule with the highest stakes; name its layer</text><line x1="18" y1="134" x2="782" y2="134" stroke="#444444" stroke-width="0.8"/><text x="30.0" y="156.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">3 The risk</text><text x="200.0" y="156.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">risk of breaking [a named rule] or of [a named person] losing [a named right]</text><line x1="18" y1="178" x2="782" y2="178" stroke="#444444" stroke-width="0.8"/><text x="30.0" y="200.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">4 Evidence</text><text x="200.0" y="200.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">D: the rule&#x27;s own text opened, section cited · I: give the reason</text><line x1="18" y1="222" x2="782" y2="222" stroke="#444444" stroke-width="0.8"/><text x="30.0" y="244.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">5 Who is harmed</text><text x="200.0" y="244.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">rights holder · person in the data · person affected · you or your organization</text><line x1="18" y1="266" x2="782" y2="266" stroke="#444444" stroke-width="0.8"/><text x="30.0" y="288.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">6 Rating</text><text x="200.0" y="288.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">likelihood · impact (Chapter 15&#x27;s anchors)</text><line x1="18" y1="310" x2="782" y2="310" stroke="#444444" stroke-width="0.8"/><text x="30.0" y="332.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">7 Mitigation</text><text x="200.0" y="332.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">avoid · reduce · detect · accept, with the risk owner by role</text><line x1="18" y1="354" x2="782" y2="354" stroke="#444444" stroke-width="0.8"/><text x="30.0" y="376.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">8 Whom to ask</text><text x="200.0" y="376.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">the rule&#x27;s owner, by role, and your question</text><line x1="18" y1="398" x2="782" y2="398" stroke="#444444" stroke-width="0.8"/><text x="30.0" y="420.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">9 Last line</text><text x="200.0" y="420.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">&quot;This records which rules to check and whom to ask; it is not a legal opinion.&quot;</text><line x1="190" y1="46" x2="190" y2="442" stroke="#444444" stroke-width="0.8"/><text x="400.0" y="464.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Drafted in Lab 15.1, step 6; finished at home</text></svg>