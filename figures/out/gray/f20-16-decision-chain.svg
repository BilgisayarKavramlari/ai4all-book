<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 232" width="800" height="232" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>The five-link answer</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="232" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;What did the AI do and what did you do?&quot; has a five-link answer</text><rect x="14" y="70" width="136" height="90" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="82.0" y="100.6" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">You asked for</text><text x="82.0" y="125.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the task and</text><text x="82.0" y="140.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">frame</text><path d="M152.0,115.0 L170.0,115.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="188.3,70.0 291.7,70.0 308.0,115.0 291.7,160.0 188.3,160.0 172.0,115.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="240.0" y="100.6" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The AI produced</text><text x="240.0" y="125.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a draft, totals,</text><text x="240.0" y="140.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a suggestion</text><path d="M310.0,115.0 L328.0,115.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="398.0,60.0 466.0,115.0 398.0,170.0 330.0,115.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="398.0" y="99.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">You kept,</text><text x="398.0" y="115.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">changed or</text><text x="398.0" y="130.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">rejected</text><text x="398.0" y="186.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">and why</text><path d="M468.0,115.0 L486.0,115.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="488" y="70" width="136" height="90" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="556.0" y="100.6" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">You checked</text><text x="556.0" y="133.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">how, against what</text><path d="M626.0,115.0 L644.0,115.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="646" y="70" width="136" height="90" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="714.0" y="100.6" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Who decided</text><text x="714.0" y="125.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">you, or the</text><text x="714.0" y="140.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">decision owner</text><text x="400.0" y="216.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagon = AI · diamond = your decision · rounded = a person · rectangle = a check</text></svg>