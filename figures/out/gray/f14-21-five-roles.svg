<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" width="800" height="425" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Autonomy is a design choice: five roles for the user, from operator to observer</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="425" fill="#FFFFFF"/><rect x="60" y="40" width="560" height="58" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="340.0" y="59.7" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1 Operator</text><text x="340.0" y="80.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">you direct; the agent helps when asked</text><rect x="90" y="110" width="530" height="58" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="355.0" y="129.7" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2 Collaborator</text><text x="355.0" y="150.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">you and the agent plan and act together</text><rect x="120" y="180" width="500" height="58" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="370.0" y="199.7" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3 Consultant</text><text x="370.0" y="220.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the agent leads and asks you for direction</text><rect x="150" y="250" width="470" height="58" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="3"/><text x="385.0" y="269.7" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">4 Approver</text><text x="385.0" y="290.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">the agent acts; you sign off on consequential actions</text><rect x="180" y="320" width="440" height="58" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="339.7" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">5 Observer</text><text x="400.0" y="360.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the agent acts; you watch the log and can switch it off</text><path d="M710.0,50.0 L710.0,380.0" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-gray)"/><text x="754.0" y="207.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">more</text><text x="754.0" y="222.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">autonomy</text><text x="400.0" y="410.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Paraphrased from Feng, McDonald &amp; Zhang (2025). Thick = the level an approval gate holds a step at.</text></svg>