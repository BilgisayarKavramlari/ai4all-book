   <g id="text_12">
    <text style="font: 700 12.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(70.128 16.698047)">In the paper's introduction, average scores fell from about 90% to about 65%</text>
    <text style="font: 700 12.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(70.128 30.792969)">when tasks arrived piece by piece (15 models tested in 2025)</text>
