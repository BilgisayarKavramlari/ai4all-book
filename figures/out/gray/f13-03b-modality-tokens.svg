<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Images and sound arrive as tokens too, beside your words</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="450" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A multimodal model receives images and sound as tokens</text><rect x="20" y="80" width="170" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="105.0" y="120.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Your words</text><rect x="222" y="80" width="250" height="80" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="347.0" y="120.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">split into text tokens</text><path d="M192.0,120.0 L220.0,120.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M474.0,120.0 L508.0,236.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="20" y="186" width="170" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="105.0" y="226.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">An image</text><rect x="222" y="186" width="250" height="80" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="347.0" y="218.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">cut into patches; each patch</text><text x="347.0" y="233.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">becomes an image token</text><path d="M192.0,226.0 L220.0,226.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M474.0,226.0 L508.0,226.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="20" y="292" width="170" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="105.0" y="332.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A recording</text><rect x="222" y="292" width="250" height="80" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="347.0" y="324.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">cut into short slices; a codec</text><text x="347.0" y="339.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">turns each into an audio token</text><path d="M192.0,332.0 L220.0,332.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M474.0,332.0 L508.0,236.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="510" y="140" width="130" height="172" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="575.0" y="189.3" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">One context</text><text x="575.0" y="207.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">window</text><text x="575.0" y="244.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">tokens of every</text><text x="575.0" y="260.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">kind, side by</text><text x="575.0" y="276.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">side</text><polygon points="678.4,186.0 769.6,186.0 784.0,226.0 769.6,266.0 678.4,266.0 664.0,226.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="724.0" y="213.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Model</text><text x="724.0" y="242.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">produces output</text><path d="M642.0,226.0 L662.0,226.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="410.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = what you provide · rectangle = a processing step · hexagon = AI component</text><text x="400.0" y="426.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">File information (date, place, camera) is not part of the tokens in two providers&#x27; tools, but the file itself still</text><text x="400.0" y="441.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">reaches the provider (as of October 2026).</text></svg>