   <text style="fill: #1d1d1f; font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 325.378828)">Constructed numbers (data/ch11_simpson_constructed.csv). In Berkeley's real fall 1973 data the pattern was milder: few departments</text>
   <text style="fill: #1d1d1f; font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 336.280969)">showed a significant difference, and about as many favored women as men (Bickel, Hammel &amp; O'Connell, 1975).</text>
