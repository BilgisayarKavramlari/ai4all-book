<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 548" width="800" height="548" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A computer-use agent&#x27;s observation is a screenshot; its action is a click or a keystroke</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="548" fill="#FFFFFF"/><rect x="20" y="70" width="150" height="70" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="95.0" y="93.8" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Goal</text><text x="95.0" y="119.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a person sets it</text><polygon points="238.0,65.0 382.0,65.0 400.0,105.0 382.0,145.0 238.0,145.0 220.0,105.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="310.0" y="92.2" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Plan</text><text x="310.0" y="113.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the model proposes the</text><text x="310.0" y="128.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">next action</text><path d="M172.0,105.0 L218.0,105.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="497.5,45.0 570.0,105.0 497.5,165.0 425.0,105.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="497.5" y="96.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Approval</text><text x="497.5" y="113.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">gate</text><path d="M402.0,105.0 L423.0,105.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M572.0,105.0 L628.0,105.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="600.0" y="84.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">yes</text><path d="M490.0,47.0 Q407.4,29.1 330.0,63.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="410.0" y="24.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">no, or edited: a new plan</text><rect x="630" y="65" width="150" height="80" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="705.0" y="92.2" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Tool call</text><text x="705.0" y="121.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the system runs it</text><path d="M705.0,147.0 L690.0,248.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="600" y="250" width="180" height="80" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="690.0" y="277.2" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Observation</text><text x="690.0" y="298.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the result enters the</text><text x="690.0" y="313.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">context window</text><path d="M598.0,290.0 L562.0,290.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="390" y="255" width="170" height="70" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="475.0" y="278.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Check point</text><text x="475.0" y="296.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a person inspects a</text><text x="475.0" y="311.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">result</text><path d="M388.0,290.0 L352.0,290.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="275.0,235.0 350.0,290.0 275.0,345.0 200.0,290.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="275.0" y="290.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Stop?</text><path d="M198.0,290.0 L172.0,290.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="185.0" y="278.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">yes</text><path d="M262.0,237.0 L270.0,148.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="242.0" y="196.0" font-size="13" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#444444" style="font-style:italic;">no: next pass</text><rect x="20" y="255" width="150" height="70" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="95.0" y="278.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Hand back</text><text x="95.0" y="304.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">to a person</text><rect x="20" y="410" width="760" height="50" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="400.0" y="435.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Log: the system records every plan, tool call, observation, approval and stop, with times</text><text x="690.0" y="344.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">a new screenshot of the</text><text x="690.0" y="359.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">screen</text><text x="400.0" y="506.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">A computer-use agent: the same loop, with the screen as the observation (Chapter 14 owns the gates)</text><text x="400.0" y="530.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagon = AI · rectangle = the system runs it · diamond = a decision · rounded = a person</text><text x="615.0" y="184.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">a click,</text><text x="615.0" y="200.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">keystroke or</text><text x="615.0" y="215.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">typed text</text></svg>