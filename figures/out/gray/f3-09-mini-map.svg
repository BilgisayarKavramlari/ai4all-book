<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Each new term attaches to a Chapter 2 term with a true sentence</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="450" fill="#FFFFFF"/><text x="150.0" y="28.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Chapter 3 term</text><text x="650.0" y="28.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Chapter 2 term</text><rect x="40.0" y="52.0" width="220" height="56" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="150.0" y="80.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Pretraining</text><rect x="540.0" y="52.0" width="220" height="56" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="650.0" y="80.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Self-supervised learning</text><path d="M262.0,80.0 L538.0,80.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="64.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">is a kind of</text><rect x="40.0" y="136.0" width="220" height="56" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="150.0" y="164.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Next-token prediction</text><rect x="540.0" y="136.0" width="220" height="56" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="650.0" y="164.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Label</text><path d="M262.0,164.0 L538.0,164.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="148.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">uses the real next token as its</text><rect x="40.0" y="220.0" width="220" height="56" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="150.0" y="248.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Knowledge cutoff</text><rect x="540.0" y="220.0" width="220" height="56" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="650.0" y="248.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Training data</text><path d="M262.0,248.0 L538.0,248.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="232.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">marks the end of the</text><rect x="40.0" y="304.0" width="220" height="56" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="150.0" y="332.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Context window</text><rect x="540.0" y="304.0" width="220" height="56" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="650.0" y="332.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Inference</text><path d="M262.0,332.0 L538.0,332.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="316.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">is rebuilt at every step of</text><text x="400.0" y="410.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Read each link as a sentence: “Pretraining is a kind of self-supervised learning.”</text><text x="400.0" y="436.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">White = Chapter 3 terms · shaded = Chapter 2 terms · italic labels = the relationship</text></svg>