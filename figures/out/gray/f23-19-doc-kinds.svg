<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376" width="800" height="376" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A statement, an assessment and an essay are different kinds of evidence</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="376" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A statement, an assessment and an essay are different kinds of evidence</text><rect x="20" y="64" width="240" height="230" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="142.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Statement (CAIS, May 2023)</text><text x="140.0" y="185.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Who: signatories, including</text><text x="140.0" y="201.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">researchers and company</text><text x="140.0" y="217.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">leaders</text><text x="140.0" y="232.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What: one sentence</text><text x="140.0" y="248.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Asks: treat extinction risk as</text><text x="140.0" y="264.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a global priority</text><rect x="280" y="64" width="240" height="230" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="133.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Assessment (International AI</text><text x="400.0" y="150.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Safety Report, Feb 2026)</text><text x="400.0" y="193.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Who: 100+ experts,</text><text x="400.0" y="209.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">government-backed</text><text x="400.0" y="225.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What: a review of evidence,</text><text x="400.0" y="240.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">with disagreements recorded</text><text x="400.0" y="256.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Asks: endorses no policy</text><rect x="540" y="64" width="240" height="230" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="660.0" y="133.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Essay (Narayanan &amp; Kapoor,</text><text x="660.0" y="150.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Apr 2025)</text><text x="660.0" y="201.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Who: two computer scientists</text><text x="660.0" y="217.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What: an argument from how</text><text x="660.0" y="232.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">past technologies spread</text><text x="660.0" y="248.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Asks: policies for resilience</text><text x="400.0" y="326.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Each makes or reviews forecasts (Chapter 22&#x27;s label); none is a measurement of the future.</text><text x="400.0" y="352.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">A signature list shows who holds a view, not that the view is true.</text></svg>