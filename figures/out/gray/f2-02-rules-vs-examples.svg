<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>In machine learning, people supply the answers and the machine finds the rule</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="400" fill="#FFFFFF"/><text x="20.0" y="52.0" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Classical programming</text><rect x="30" y="70" width="170" height="50" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="95.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Data</text><path d="M202.0,95.0 L290.0,125.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="30" y="130" width="170" height="50" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="155.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Rules</text><path d="M202.0,155.0 L290.0,125.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="295" y="85" width="220" height="80" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="405.0" y="116.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Computer applies the</text><text x="405.0" y="133.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">rules</text><path d="M517.0,125.0 L575.0,125.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="580" y="95" width="190" height="60" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="675.0" y="125.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Answers</text><text x="20.0" y="217.0" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Machine learning</text><rect x="30" y="235" width="170" height="50" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="260.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Data</text><path d="M202.0,260.0 L290.0,290.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="30" y="295" width="170" height="50" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="320.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Answers (labels)</text><path d="M202.0,320.0 L290.0,290.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="313.0,250.0 497.0,250.0 515.0,290.0 497.0,330.0 313.0,330.0 295.0,290.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="405.0" y="281.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Learning algorithm finds</text><text x="405.0" y="298.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">patterns</text><path d="M517.0,290.0 L575.0,290.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="580" y="260" width="190" height="60" rx="3" fill="#EDEDED" stroke="#000000" stroke-width="3"/><text x="675.0" y="281.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Rules (learned</text><text x="675.0" y="298.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">patterns)</text><text x="400.0" y="385.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = supplied by people · hexagon = AI component · thick border = what the machine produces</text></svg>