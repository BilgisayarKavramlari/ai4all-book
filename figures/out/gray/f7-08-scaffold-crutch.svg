<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Scaffold versus crutch: the same AI reply builds skill only after your own attempt</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="400" fill="#FFFFFF"/><text x="14.0" y="56.0" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Crutch: no attempt</text><text x="14.0" y="216.0" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Scaffold: attempt first</text><rect x="14" y="76" width="140" height="84" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="84.0" y="109.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A practice</text><text x="84.0" y="126.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">question</text><path d="M156.0,118.0 L324.0,118.0" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/><text x="240.0" y="106.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">no attempt</text><polygon points="342.8,76.0 449.2,76.0 466.0,118.0 449.2,160.0 342.8,160.0 326.0,118.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="396.0" y="102.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Same reply:</text><text x="396.0" y="118.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">worked steps and</text><text x="396.0" y="133.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the answer</text><path d="M468.0,118.0 L480.0,118.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="482" y="76" width="140" height="84" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="552.0" y="118.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">You copy it</text><path d="M624.0,118.0 L636.0,118.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="638" y="76" width="140" height="84" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="708.0" y="102.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Output done; you</text><text x="708.0" y="118.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">recalled and</text><text x="708.0" y="133.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">produced nothing</text><rect x="14" y="236" width="140" height="84" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="84.0" y="269.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A practice</text><text x="84.0" y="286.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">question</text><path d="M156.0,278.0 L168.0,278.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="170" y="236" width="140" height="84" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="240.0" y="269.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">You attempt</text><text x="240.0" y="286.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">first</text><path d="M312.0,278.0 L324.0,278.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="342.8,236.0 449.2,236.0 466.0,278.0 449.2,320.0 342.8,320.0 326.0,278.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="396.0" y="262.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Same reply:</text><text x="396.0" y="278.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">worked steps and</text><text x="396.0" y="293.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the answer</text><path d="M468.0,278.0 L480.0,278.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="482" y="236" width="140" height="84" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="552.0" y="262.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">You compare, redo</text><text x="552.0" y="278.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">and explain it</text><text x="552.0" y="293.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">back</text><path d="M624.0,278.0 L636.0,278.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="638" y="236" width="140" height="84" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="708.0" y="262.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">You recalled and</text><text x="708.0" y="278.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">produced: skill</text><text x="708.0" y="293.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">built</text><text x="400.0" y="360.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Test for every turn: who recalled and produced the answer, you or the tool?</text><text x="400.0" y="384.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagon = the AI reply (identical in both lanes) · rounded = you · thick border = risk</text></svg>