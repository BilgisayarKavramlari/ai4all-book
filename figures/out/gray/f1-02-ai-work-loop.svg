<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Every AI-assisted task passes through five human decisions</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="600" fill="#FFFFFF"/><path d="M457.1,141.5 Q505.7,154.5 533.1,196.7" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M568.4,305.3 Q571.0,355.6 539.4,394.7" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M447.0,461.8 Q400.0,479.8 353.0,461.8" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M260.6,394.7 Q229.0,355.6 231.6,305.3" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M266.9,196.7 Q294.3,154.5 342.9,141.5" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="295.0" y="57.0" width="210" height="86" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="86.2" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1. Frame</text><text x="400.0" y="109.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What is the task? Should</text><text x="400.0" y="125.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">AI be in it?</text><rect x="485.21130325903073" y="195.19660112501052" width="210" height="86" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="590.2" y="224.4" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2. Prompt</text><text x="590.2" y="247.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Give task, context,</text><text x="590.2" y="263.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">limits, format</text><rect x="412.5570504584946" y="418.8033988749895" width="210" height="86" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="517.6" y="448.0" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3. Verify</text><text x="517.6" y="471.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Check against something</text><text x="517.6" y="486.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">other than the tool</text><rect x="177.4429495415054" y="418.8033988749895" width="210" height="86" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="282.4" y="448.0" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4. Decide</text><text x="282.4" y="471.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Keep, change or reject;</text><text x="282.4" y="486.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">own the result</text><rect x="104.78869674096927" y="195.19660112501055" width="210" height="86" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="209.8" y="224.4" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">5. Disclose</text><text x="209.8" y="255.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Say what you used and how</text><polygon points="323.0,266.0 477.0,266.0 495.0,300.0 477.0,334.0 323.0,334.0 305.0,300.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="289.1" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The AI tool</text><text x="400.0" y="305.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">produces drafts; you</text><text x="400.0" y="321.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">make every decision</text><text x="400.0" y="585.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded boxes = human decisions · hexagon = AI component</text></svg>