<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Keep what you built outside any one tool, and re-test when something changes</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="460" fill="#FFFFFF"/><text x="200.0" y="30.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Keep in your own files</text><text x="600.0" y="30.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Stays with the tool unless you copy it</text><rect x="40" y="50" width="320" height="66" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="83.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Task frames and success criteria</text><rect x="440" y="50" width="320" height="66" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="600.0" y="83.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Chat history</text><rect x="40" y="132" width="320" height="66" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="165.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Prompts and test inputs</text><rect x="440" y="132" width="320" height="66" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="600.0" y="165.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Standing instructions and memory</text><rect x="40" y="214" width="320" height="66" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="247.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Outputs you need, exported</text><rect x="440" y="214" width="320" height="66" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="600.0" y="247.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Access tied to a school or job</text><rect x="40" y="320" width="720" height="90" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="400.0" y="350.6" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Re-test triggers</text><text x="400.0" y="374.5" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a model update or retirement · a change in price or terms · a new kind of input · a</text><text x="400.0" y="391.5" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">new job or school</text><text x="400.0" y="440.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = what you control · dashed = what you can lose when a tool changes or your access ends</text></svg>