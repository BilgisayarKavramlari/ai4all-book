<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Security vulnerability happens because instructions and data share one stream of tokens</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="560" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Failure Taxonomy Tree</text><polygon points="238.0,56.0 562.0,56.0 580.0,82.0 562.0,108.0 238.0,108.0 220.0,82.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="82.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">An AI output or system fails the task</text><line x1="400" y1="108" x2="400" y2="134" stroke="#000000" stroke-width="1.6"/><line x1="75.0" y1="134" x2="725.0" y2="134" stroke="#000000" stroke-width="1.6"/><line x1="75.0" y1="134" x2="75.0" y2="158" stroke="#000000" stroke-width="1.6"/><rect x="14.0" y="160" width="122" height="58" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="75.0" y="189.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Hallucination</text><text x="75.0" y="238.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· invented facts</text><text x="75.0" y="253.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">or sources</text><text x="75.0" y="276.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· contradicts its</text><text x="75.0" y="291.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">input or source</text><text x="75.0" y="314.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· outdated</text><text x="75.0" y="329.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">information</text><text x="75.0" y="352.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· wrong</text><text x="75.0" y="368.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">calculation or</text><text x="75.0" y="383.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">reasoning</text><line x1="205.0" y1="134" x2="205.0" y2="158" stroke="#000000" stroke-width="1.6"/><rect x="144.0" y="160" width="122" height="58" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="205.0" y="189.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Bias</text><text x="205.0" y="238.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· stereotyped</text><text x="205.0" y="253.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">defaults</text><text x="205.0" y="276.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· unequal quality</text><text x="205.0" y="292.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">across groups or</text><text x="205.0" y="307.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">languages</text><text x="205.0" y="330.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· skewed</text><text x="205.0" y="345.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">recommendations</text><line x1="335.0" y1="134" x2="335.0" y2="158" stroke="#000000" stroke-width="1.6"/><rect x="274.0" y="160" width="122" height="58" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="335.0" y="189.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Context loss</text><text x="335.0" y="238.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· dropped</text><text x="335.0" y="253.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">constraint</text><text x="335.0" y="276.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· missed middle</text><text x="335.0" y="291.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">of a long input</text><text x="335.0" y="314.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· early wrong</text><text x="335.0" y="329.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">assumption kept</text><text x="335.0" y="352.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· text cut off at</text><text x="335.0" y="367.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">the limit</text><line x1="465.0" y1="134" x2="465.0" y2="158" stroke="#000000" stroke-width="1.6"/><rect x="404.0" y="160" width="122" height="58" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="465.0" y="189.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Overconfidence</text><text x="465.0" y="238.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· certainty</text><text x="465.0" y="254.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">beyond the</text><text x="465.0" y="269.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">evidence</text><text x="465.0" y="292.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· sycophancy:</text><text x="465.0" y="308.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">agrees with you</text><text x="465.0" y="323.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">against the</text><text x="465.0" y="339.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">evidence</text><line x1="595.0" y1="134" x2="595.0" y2="158" stroke="#000000" stroke-width="1.6"/><rect x="534.0" y="160" width="122" height="58" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="595.0" y="180.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Security</text><text x="595.0" y="197.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">vulnerability</text><text x="595.0" y="238.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">· direct prompt</text><text x="595.0" y="253.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">injection</text><text x="595.0" y="276.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">· indirect prompt</text><text x="595.0" y="291.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">injection</text><text x="595.0" y="314.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">· data in the</text><text x="595.0" y="329.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">context exposed</text><text x="595.0" y="422.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">Why: instructions</text><text x="595.0" y="438.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">and data share</text><text x="595.0" y="453.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">one stream</text><line x1="725.0" y1="134" x2="725.0" y2="158" stroke="#000000" stroke-width="1.6"/><rect x="664.0" y="160" width="122" height="58" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="725.0" y="189.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Other</text><text x="725.0" y="238.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· misuse, such as</text><text x="725.0" y="254.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">fake media made</text><text x="725.0" y="269.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">to deceive</text><text x="725.0" y="292.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">· anything else:</text><text x="725.0" y="307.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">say what it is</text><text x="400.0" y="500.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagon = AI component · thick border (hatched in print) = the branch this figure marks · solid = documented,</text><text x="400.0" y="515.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">dashed = inferred</text><text x="400.0" y="530.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">People and workflows (no check, overreliance) are labeled on the failure-to-harm chain, not on the tree.</text></svg>