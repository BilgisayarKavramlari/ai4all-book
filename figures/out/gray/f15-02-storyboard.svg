<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432" width="800" height="432" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Three ordinary work requests sent confidential data outside the company, and none could be taken back</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="432" fill="#FFFFFF"/><text x="70.0" y="66.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Mar 11, 2023</text><rect x="20" y="84" width="100" height="176" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="70.0" y="132.3" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Chip</text><text x="70.0" y="148.2" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">division</text><text x="70.0" y="164.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">allows a</text><text x="70.0" y="179.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">chat tool;</text><text x="70.0" y="195.8" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">staff told</text><text x="70.0" y="211.6" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">to take care</text><path d="M121.0,172.0 L131.0,172.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="182.0" y="66.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Paste 1</text><rect x="132" y="84" width="100" height="176" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="182.0" y="140.3" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Source code</text><text x="182.0" y="156.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">of a</text><text x="182.0" y="172.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">chip-data</text><text x="182.0" y="187.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">program, to</text><text x="182.0" y="203.7" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">fix an error</text><path d="M233.0,172.0 L243.0,172.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="294.0" y="66.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Paste 2</text><rect x="244" y="84" width="100" height="176" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="294.0" y="140.3" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Source code</text><text x="294.0" y="156.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">of a yield</text><text x="294.0" y="172.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">and defect</text><text x="294.0" y="187.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">program, to</text><text x="294.0" y="203.7" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">optimize it</text><path d="M345.0,172.0 L355.0,172.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="406.0" y="66.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Paste 3</text><rect x="356" y="84" width="100" height="176" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="406.0" y="132.3" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A meeting</text><text x="406.0" y="148.2" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">recording</text><text x="406.0" y="164.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">turned into</text><text x="406.0" y="179.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">text, to</text><text x="406.0" y="195.8" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">draft</text><text x="406.0" y="211.6" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">minutes</text><path d="M457.0,172.0 L467.0,172.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="518.0" y="66.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Notice</text><rect x="468" y="84" width="100" height="176" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="518.0" y="132.3" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Once sent,</text><text x="518.0" y="148.2" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">stored on</text><text x="518.0" y="164.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">outside</text><text x="518.0" y="179.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">servers;</text><text x="518.0" y="195.8" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">cannot be</text><text x="518.0" y="211.6" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">retrieved</text><path d="M569.0,172.0 L579.0,172.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="630.0" y="66.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Emergency rule</text><rect x="580" y="84" width="100" height="176" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="630.0" y="148.2" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Uploads</text><text x="630.0" y="164.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">limited to</text><text x="630.0" y="179.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1,024 bytes</text><text x="630.0" y="195.8" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">per question</text><path d="M681.0,172.0 L691.0,172.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="742.0" y="66.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">May 2, 2023</text><rect x="692" y="84" width="100" height="176" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="742.0" y="132.3" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Generative</text><text x="742.0" y="148.2" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">AI</text><text x="742.0" y="164.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">restricted</text><text x="742.0" y="179.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">on company</text><text x="742.0" y="195.8" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">devices</text><text x="742.0" y="211.6" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">(confirmed)</text><text x="212.0" y="284.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Mar 30: The Economist Korea reports the three pastes</text><text x="630.0" y="284.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Bloomberg, citing the memo</text><rect x="20" y="306" width="760" height="58" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="400.0" y="327.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">No public Samsung statement confirms the pastes. The Economist Korea places them in March;</text><text x="400.0" y="342.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Bloomberg&#x27;s account of the memo says the leak happened in April.</text><text x="400.0" y="392.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Boxes are reported by named outlets; the May restriction was confirmed by a spokesperson · thick = a paste</text><text x="400.0" y="416.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Sources: Jeong (2023, The Economist Korea); Gurman (2023, Bloomberg) via Sharma (2023); Park (2023, TechCrunch)</text></svg>