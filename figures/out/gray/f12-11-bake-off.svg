<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A fair bake-off changes only the tool</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="520" fill="#FFFFFF"/><rect x="20" y="40" width="165" height="80" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="102.5" y="71.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Same frame and</text><text x="102.5" y="88.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">criteria</text><rect x="200" y="40" width="165" height="80" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="282.5" y="71.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Same prompt, word</text><text x="282.5" y="88.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">for word</text><rect x="380" y="40" width="165" height="80" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="462.5" y="62.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Same test inputs:</text><text x="462.5" y="80.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">typical · different</text><text x="462.5" y="97.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">· edge</text><path d="M186.0,80.0 L198.0,80.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M366.0,80.0 L378.0,80.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="640.0" y="80.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Only the tool changes</text><polygon points="78.0,180.0 242.0,180.0 260.0,220.0 242.0,260.0 78.0,260.0 60.0,220.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="160.0" y="207.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Tool A</text><text x="160.0" y="228.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">fresh chat, memory off;</text><text x="160.0" y="243.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">tool, model, date</text><path d="M462.0,122.0 L160.0,178.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="318.0,180.0 482.0,180.0 500.0,220.0 482.0,260.0 318.0,260.0 300.0,220.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="207.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Tool B</text><text x="400.0" y="228.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">fresh chat, memory off;</text><text x="400.0" y="243.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">tool, model, date</text><path d="M462.0,122.0 L400.0,178.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="540" y="180" width="200" height="80" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="640.0" y="207.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">No AI</text><text x="640.0" y="236.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">you, timed</text><path d="M462.0,122.0 L640.0,178.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="150" y="320" width="500" height="70" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="346.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Score separately: correctness (independent check) · polish</text><text x="400.0" y="363.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1–5 · time incl. checking</text><path d="M160.0,262.0 L256.0,318.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M400.0,262.0 L400.0,318.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M640.0,262.0 L544.0,318.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="280" y="420" width="240" height="56" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="400.0" y="439.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Verdict per input, not per</text><text x="400.0" y="456.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">tool</text><path d="M400.0,392.0 L400.0,418.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="500.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" 