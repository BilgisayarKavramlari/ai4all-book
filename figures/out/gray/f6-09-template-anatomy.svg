<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A template keeps the prompt&#x27;s fixed parts and leaves placeholders for what changes</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="640" fill="#FFFFFF"/><rect x="20" y="46" width="564" height="388" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="302.0" y="240.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="34.0" y="64.0" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Your prompt</text><rect x="36" y="84" width="172" height="100" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="122.0" y="118.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Role</text><text x="122.0" y="154.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">voice and perspective</text><rect x="120" y="204" width="362" height="92" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="301.0" y="235.3" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Task</text><text x="301.0" y="268.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the verb and what it acts on: always needed</text><rect x="216" y="84" width="172" height="100" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="302.0" y="118.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Context</text><text x="302.0" y="154.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">what this task needs</text><rect x="126" y="318" width="172" height="100" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="212.0" y="352.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Constraints</text><text x="212.0" y="388.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">limits and must-nots</text><rect x="396" y="84" width="172" height="100" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="482.0" y="108.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">In-context</text><text x="482.0" y="127.1" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">examples</text><text x="482.0" y="146.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">sample input with the</text><text x="482.0" y="161.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">output you want</text><rect x="306" y="318" width="172" height="100" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="392.0" y="352.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Output format</text><text x="392.0" y="388.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a shape you can check</text><path d="M588.0,240.0 L618.0,240.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="640.0,196.0 766.0,196.0 784.0,240.0 766.0,284.0 640.0,284.0 622.0,240.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="703.0" y="225.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The AI tool</text><text x="703.0" y="249.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">receives only what</text><text x="703.0" y="265.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">is written</text><path d="M703.0,288.0 L703.0,330.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="632" y="334" width="142" height="84" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="703.0" y="362.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Output</text><text x="703.0" y="384.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">scored against</text><text x="703.0" y="400.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">your criteria</text><text x="400.0" y="458.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded boxes = parts you write (thick border = always needed; dark = highlighted here) · hexagon = AI component</text><text x="400.0" y="482.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Shown as a template: the highlighted part becomes a {placeholder} you fill each time.</text><line x1="20" y1="504" x2="780" y2="504" stroke="#444444" stroke-width="1.4"/><text x="400.0" y="526.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Where the parts land in the context layers</text><text x="400.0" y="554.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Context → pasted text, project files or the prompt itself (6.2, 6.5)</text><text x="400.0" y="578.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">In-context examples → a fixed part of the template, kept only if a with-and-without test shows they help (6.4)</text><text x="400.0" y="602.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Task, constraints, format → the fixed part of the template (6.6)</text></svg>