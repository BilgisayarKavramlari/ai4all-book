<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Disclosure and verification make middle-zone uses acceptable; some uses stay off-limits</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="360" fill="#FFFFFF"/><rect x="20" y="40" width="240" height="210" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="111.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Permitted</text><text x="140.0" y="171.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Brainstorming · explanations ·</text><text x="140.0" y="187.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">study help · feedback on your</text><text x="140.0" y="202.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">own draft</text><rect x="282" y="40" width="240" height="210" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="402.0" y="102.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Permitted with disclosure</text><text x="402.0" y="120.5" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">and verification</text><text x="402.0" y="171.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Drafting · coding support ·</text><text x="402.0" y="187.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">source synthesis · case and</text><text x="402.0" y="202.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">data work</text><rect x="544" y="40" width="240" height="210" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="664.0" y="111.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Not acceptable</text><text x="664.0" y="139.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Undisclosed outsourcing ·</text><text x="664.0" y="155.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">fabricated sources ·</text><text x="664.0" y="171.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">unsupported claims · work you</text><text x="664.0" y="187.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">do not understand · AI use in</text><text x="664.0" y="202.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">exams · personal or</text><text x="664.0" y="218.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">confidential data in public</text><text x="664.0" y="234.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">tools</text><path d="M282.0,285.0 L282.0,252.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="282.0" y="305.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Disclose + verify + can explain</text><text x="544.0" y="285.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Stays off-limits even if disclosed</text><text x="400.0" y="345.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Dashed border = acceptable only under conditions</text></svg>