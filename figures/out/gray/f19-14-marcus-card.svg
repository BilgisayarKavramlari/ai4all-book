<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Marcus&#x27;s card says what the workflow is not for before it says what works</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="430" fill="#FFFFFF"/><text x="400.0" y="26.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Workflow card: pharmacology review (Marcus, constructed)</text><rect x="30" y="50" width="180" height="60" rx="3" fill="#3A3A3A" stroke="#000000" stroke-width="3"/><text x="120.0" y="80.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Not for</text><rect x="220" y="50" width="550" height="60" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="495.0" y="80.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">patient care; real dose calculations; anyone&#x27;s grades</text><rect x="30" y="120" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="120.0" y="150.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">For</text><rect x="220" y="120" width="550" height="60" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="495.0" y="150.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">my own exam review, from my textbook&#x27;s drug tables</text><rect x="30" y="190" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="120.0" y="220.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Tested on</text><rect x="220" y="190" width="550" height="60" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="495.0" y="211.5" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3 tables (typical, different, edge) + Hana&#x27;s peer test;</text><text x="495.0" y="228.5" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">university tool, model shown, date</text><rect x="30" y="260" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="120.0" y="290.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Results</text><rect x="220" y="260" width="550" height="60" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="495.0" y="281.5" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">typical and different: all marks right; edge: one name swap,</text><text x="495.0" y="298.5" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">caught; after revision, all right</text><rect x="30" y="330" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="120.0" y="350.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Limits and</text><text x="120.0" y="369.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">safeguards</text><rect x="220" y="330" width="550" height="60" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="495.0" y="351.5" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">one tool and model; no combination drugs tested; I check every</text><text x="495.0" y="368.5" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">mark; no group cue enters</text><text x="400.0" y="412.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Thick = the first line a reader sees: what the workflow must not be used for</text></svg>