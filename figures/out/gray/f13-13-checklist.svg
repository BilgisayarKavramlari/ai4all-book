<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" width="800" height="720" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Check the source and the channel first; inspect the pixels last</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="720" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Context before pixels: a check list for media</text><polygon points="400.0,70.0 500.0,112.0 400.0,154.0 300.0,112.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="112.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Stop</text><text x="620.0" y="104.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">a trigger fired: pause before</text><text x="620.0" y="119.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">you act or share</text><rect x="170" y="174" width="460" height="58" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="193.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1. Source and channel</text><text x="400.0" y="214.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">who sent it? reach them another way (out-of-band)</text><path d="M400.0,156.0 L400.0,172.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="170" y="244" width="460" height="58" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="263.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2. Earliest version</text><text x="400.0" y="284.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">reverse image search; where did it first appear?</text><path d="M400.0,232.0 L400.0,242.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="170" y="314" width="460" height="58" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="333.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3. Outside sources</text><text x="400.0" y="354.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">does anyone else report the event?</text><path d="M400.0,302.0 L400.0,312.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="170" y="384" width="460" height="58" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="403.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4. Provenance signals</text><text x="400.0" y="416.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">credential or watermark: present = lead; missing = proves</text><text x="400.0" y="432.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">nothing</text><path d="M400.0,372.0 L400.0,382.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="170" y="454" width="460" height="58" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="400.0" y="473.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">5. Content clues</text><text x="400.0" y="494.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">odd text, shadows, hands: weak leads, checked last</text><path d="M400.0,442.0 L400.0,452.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M400.0,512.0 L400.0,522.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="170" y="524" width="460" height="80" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="551.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Verdict and remaining uncertainty</text><text x="400.0" y="572.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">supported · partly supported · unsupported · contradicted</text><text x="400.0" y="587.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">· cannot verify</text><text x="400.0" y="622.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Diamond = decision · rectangle = a check · gray box = weak evidence · rounded = your judgment (Chapter 8&#x27;s verdict</text><text x="400.0" y="637.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">scale)</text></svg>