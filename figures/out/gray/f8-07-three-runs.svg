<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Answers that change across fresh runs are a warning sign; answers that agree are not proof</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="410" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">One question, three fresh chats (constructed example)</text><rect x="250" y="44" width="300" height="50" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="60.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">“How many sections does the CPA</text><text x="400.0" y="77.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">exam have?”</text><path d="M400.0,96.0 L142.0,128.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="42.0,130.0 242.0,130.0 260.0,182.0 242.0,234.0 42.0,234.0 24.0,182.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="142.0" y="165.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Run 1</text><text x="142.0" y="194.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Four: AUD, BEC, FAR, REG. “95%</text><text x="142.0" y="210.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">sure.”</text><path d="M400.0,96.0 L398.0,128.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="298.0,130.0 498.0,130.0 516.0,182.0 498.0,234.0 298.0,234.0 280.0,182.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="398.0" y="165.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Run 2</text><text x="398.0" y="194.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Four: AUD, BEC, FAR, REG. “95%</text><text x="398.0" y="210.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">sure.”</text><path d="M400.0,96.0 L654.0,128.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="554.0,130.0 754.0,130.0 772.0,182.0 754.0,234.0 554.0,234.0 536.0,182.0" fill="#EDEDED" stroke="#000000" stroke-width="3"/><text x="654.0" y="165.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Run 3</text><text x="654.0" y="186.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Three core sections plus one</text><text x="654.0" y="202.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">discipline section of your</text><text x="654.0" y="218.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">choice.</text><rect x="24" y="268" width="492" height="74" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="270.0" y="293.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Runs 1 and 2 agree, and both are outdated</text><text x="270.0" y="319.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">agreement is not proof</text><rect x="534" y="268" width="242" height="74" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="655.0" y="293.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Run 3 disagrees</text><text x="655.0" y="311.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a warning sign: check this</text><text x="655.0" y="327.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">claim first</text><line x1="142" y1="236" x2="142" y2="266" stroke="#000000" stroke-width="1.4"/><line x1="398" y1="236" x2="398" y2="266" stroke="#000000" stroke-width="1.4"/><line x1="654" y1="236" x2="654" y2="266" stroke="#000000" stroke-width="1.4"/><text x="400.0" y="374.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagons = AI outputs · thick = the run that differs · dashed = an agreement that still needs checking</text><text x="400.0" y="396.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Each run samples again (Chapter 3), so differences show where the scores are spread.</text></svg>