<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 362" width="800" height="362" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Commitments last for years; tool facts last for months</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="362" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Commitments last for years; tool facts last for months</text><rect x="20" y="52" width="190" height="76" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="3"/><text x="115.0" y="77.8" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Commitments</text><text x="115.0" y="105.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">years</text><rect x="222" y="52" width="558" height="76" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="501.0" y="82.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;Before I send anything others will rely on, I check every claim that</text><text x="501.0" y="97.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">carries a number, a name or a date.&quot;</text><rect x="20" y="144" width="190" height="76" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="169.8" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Practices</text><text x="115.0" y="197.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">one to two years</text><rect x="222" y="144" width="558" height="76" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="501.0" y="182.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a prompt template, a checklist, a test-input set, a review routine</text><rect x="20" y="236" width="190" height="76" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="115.0" y="261.8" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Tool notes</text><text x="115.0" y="289.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">months</text><rect x="222" y="236" width="558" height="76" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="501.0" y="266.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">which tool, which model, its price, its data terms, a setting: each</text><text x="501.0" y="281.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;as of [month year]&quot;</text><path d="M796.0,60.0 L796.0,316.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="334.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Arrow: faster change. Keep tool facts in dated notes, apart from your commitments. Source: this book&#x27;s own dating</text><text x="400.0" y="349.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">rule (style sheet §6), not a measured result.</text></svg>