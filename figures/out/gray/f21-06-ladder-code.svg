<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" width="800" height="590" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>At the agency rung, a commitment puts a person before consequential actions</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="590" fill="#FFFFFF"/><path d="M52.0,470.0 L52.0,60.0" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-gray)"/><text x="66.0" y="40.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Harder to see and check what the AI contributed before it takes effect</text><text x="66.0" y="512.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="">Easier to check</text><line x1="84" y1="46" x2="84" y2="488" stroke="#000000" stroke-width="3"/><line x1="784" y1="46" x2="784" y2="488" stroke="#000000" stroke-width="3"/><rect x="100" y="52" width="330" height="84" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="3"/><text x="265.0" y="80.6" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">3 · Agency</text><text x="265.0" y="102.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">you configure AI to carry out future</text><text x="265.0" y="118.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">tasks for you, including for others</text><polygon points="464.0,56.0 750.0,56.0 768.0,94.0 750.0,132.0 464.0,132.0 446.0,94.0" fill="#EDEDED" stroke="#000000" stroke-width="3"/><text x="607.0" y="85.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">acts later, without you checking each</text><text x="607.0" y="102.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">output</text><text x="434.0" y="152.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">my trigger: before a tool I set up acts for others, a person sees each consequential action</text><rect x="100" y="172" width="330" height="84" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="265.0" y="200.6" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2 · Augmentation</text><text x="265.0" y="222.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">you and the AI shape the task together,</text><text x="265.0" y="238.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">turn by turn</text><polygon points="464.0,176.0 750.0,176.0 768.0,214.0 750.0,252.0 464.0,252.0 446.0,214.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="607.0" y="205.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">suggests, drafts and questions inside</text><text x="607.0" y="222.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">your thinking</text><rect x="100" y="292" width="330" height="84" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="265.0" y="320.6" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1 · Automation</text><text x="265.0" y="342.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">you define the task; the AI carries it</text><text x="265.0" y="358.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">out</text><polygon points="464.0,296.0 750.0,296.0 768.0,334.0 750.0,372.0 464.0,372.0 446.0,334.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="607.0" y="325.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">produces an output you can check</text><text x="607.0" y="342.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">before you use it</text><rect x="100" y="412" width="668" height="66" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="434.0" y="434.4" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Floor · No AI: you do this part yourself</text><text x="434.0" y="458.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">always an option</text><text x="400.0" y="534.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">The ladder, its floor and its axis are this book&#x27;s arrangement of the AI Fluency framework&#x27;s three modalities (Dakan &amp; Feller, 2025).</text><text x="400.0" y="554.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">The framework ranks none of them; one task often mixes several. A higher rung is not a better use.</text><text x="400.0" y="576.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">A commitment for the top rung: an approval gate before consequential actions (Chapter 14).</text></svg>