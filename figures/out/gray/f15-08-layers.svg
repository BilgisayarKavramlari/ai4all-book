<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Each layer of defense against prompt injection reduces the risk; none removes it</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="440" fill="#FFFFFF"/><rect x="20" y="90" width="116" height="190" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="78.0" y="137.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Label</text><text x="78.0" y="154.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">untrusted</text><text x="78.0" y="171.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">content</text><text x="78.0" y="207.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">keep material</text><text x="78.0" y="223.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">apart from</text><text x="78.0" y="238.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">instructions</text><rect x="148" y="90" width="116" height="190" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="206.0" y="146.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Trained</text><text x="206.0" y="163.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">priority</text><text x="206.0" y="191.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the model</text><text x="206.0" y="207.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">favors the</text><text x="206.0" y="223.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">provider&#x27;s and</text><text x="206.0" y="238.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">developer&#x27;s</text><text x="206.0" y="254.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">instructions</text><rect x="276" y="90" width="116" height="190" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="334.0" y="154.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Filters</text><text x="334.0" y="207.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">classifiers</text><text x="334.0" y="223.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">flag likely</text><text x="334.0" y="238.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">injections</text><rect x="404" y="90" width="116" height="190" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="462.0" y="146.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Least</text><text x="462.0" y="163.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">privilege</text><text x="462.0" y="199.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the tool can</text><text x="462.0" y="215.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">reach only</text><text x="462.0" y="230.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">what its step</text><text x="462.0" y="246.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">needs</text><rect x="532" y="90" width="116" height="190" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="590.0" y="154.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Approval gate</text><text x="590.0" y="191.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">a person</text><text x="590.0" y="207.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">approves</text><text x="590.0" y="223.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">before an</text><text x="590.0" y="238.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">action takes</text><text x="590.0" y="254.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">effect</text><rect x="660" y="90" width="116" height="190" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="718.0" y="154.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Log</text><text x="718.0" y="207.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a record the</text><text x="718.0" y="223.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">system writes,</text><text x="718.0" y="238.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">reviewed later</text><text x="60.0" y="60.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Injected text</text><line x1="6" y1="316" x2="140" y2="316" stroke="#000000" stroke-width="4.2"/><line x1="140" y1="316" x2="268" y2="316" stroke="#000000" stroke-width="3.5500000000000003"/><line x1="268" y1="316" x2="396" y2="316" stroke="#000000" stroke-width="2.9000000000000004"/><line x1="396" y1="316" x2="524" y2="316" stroke="#000000" stroke-width="2.25"/><line x1="524" y1="316" x2="652" y2="316" stroke="#000000" stroke-width="1.6"/><line x1="652" y1="316" x2="780" y2="316" stroke="#000000" stroke-width="0.9500000000000002"/><path d="M770.0,316.0 L790.0,316.0" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-gray)"/><rect x="20" y="340" width="760" height="50" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="400.0" y="356.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Each layer lets less through; none has been shown to stop every attack outside its tests</text><text x="400.0" y="373.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">(as of October 2026)</text><text x="400.0" y="420.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Line under the layers = injected text getting through · thinner = less gets through · rounded = a person</text></svg>