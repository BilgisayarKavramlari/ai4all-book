<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" width="800" height="345" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>An outside audit with a balanced benchmark found the gaps, and a re-test showed they could shrink</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="345" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Gender Shades: from a missed face to a re-test</text><rect x="18" y="52" width="176" height="92" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="106.0" y="83.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Demo misses her face</text><text x="106.0" y="100.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">until she wears a</text><text x="106.0" y="116.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">white mask (her</text><text x="106.0" y="132.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">account)</text><path d="M196.0,98.0 L212.0,98.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="214" y="52" width="176" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="302.0" y="83.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A balanced benchmark</text><text x="302.0" y="100.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1,270</text><text x="302.0" y="116.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">parliamentarians, six</text><text x="302.0" y="132.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">countries</text><path d="M392.0,98.0 L408.0,98.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="410" y="52" width="176" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="498.0" y="83.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">April–May 2017 audit</text><text x="498.0" y="108.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">three gender</text><text x="498.0" y="124.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">classifiers</text><path d="M588.0,98.0 L604.0,98.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="606" y="52" width="176" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="694.0" y="83.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Results by subgroup</text><text x="694.0" y="108.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">darker-skinned women:</text><text x="694.0" y="124.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">20.8–34.7% error</text><path d="M694.0,146.0 L694.0,182.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="606" y="184" width="176" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="694.0" y="215.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Dec 19, 2017</text><text x="694.0" y="240.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">results sent to the</text><text x="694.0" y="256.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">companies, unnamed</text><rect x="410" y="184" width="176" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="498.0" y="215.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Feb 2018</text><text x="498.0" y="240.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">paper public,</text><text x="498.0" y="256.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">companies named</text><rect x="214" y="184" width="176" height="92" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="302.0" y="215.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Aug 21, 2018 re-test</text><text x="302.0" y="240.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">all three cut the</text><text x="302.0" y="256.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">largest gap</text><path d="M604.0,230.0 L588.0,230.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M408.0,230.0 L392.0,230.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="18" y="184" width="176" height="92" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="106.0" y="198.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">June 2020: IBM and</text><text x="106.0" y="214.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Amazon</text><text x="106.0" y="230.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">facial-recognition and</text><text x="106.0" y="245.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">analysis decisions.</text><text x="106.0" y="261.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Link not established</text><text x="400.0" y="296.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Solid = in the published record · dashed = reported (her own account) · gray box with no arrow = a later event;</text><text x="400.0" y="311.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">link to the audit not established</text><text x="400.0" y="330.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Sources: Buolamwini &amp; Gebru (2018); Raji &amp; Buolamwini (2019); Buolamwini (2023)</text></svg>