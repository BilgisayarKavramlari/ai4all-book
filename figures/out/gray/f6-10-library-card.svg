<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A library entry records when to use it, what it was tested on, and what changed</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="600" fill="#FFFFFF"/><rect x="20" y="16" width="760" height="548" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="400.0" y="290.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="40.0" y="40.0" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Library entry: Club update email · v1.1 · 2027-02-03</text><text x="40.0" y="72.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Purpose</text><text x="220.0" y="72.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Turn my meeting notes into the weekly update for members</text><text x="40.0" y="104.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Use when / not when</text><text x="220.0" y="104.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Weekly meeting notes · not for budget or safety decisions</text><text x="40.0" y="136.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Template</text><text x="220.0" y="136.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">{NOTES} + {DATE} first, then the fixed task, audience, format</text><text x="40.0" y="168.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Context to attach</text><text x="220.0" y="168.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">My notes, names replaced by roles · never members&#x27; contact details</text><text x="40.0" y="200.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">In-context examples</text><text x="220.0" y="200.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Not used: the test with and without showed no gain</text><text x="40.0" y="232.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Tested on</text><text x="220.0" y="232.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Tool and model name, date (in the file)</text><text x="40.0" y="264.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">What changed</text><text x="220.0" y="264.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">v1.1 adds: If no decisions were made, write &quot;No decisions this week.&quot;</text><line x1="36" y1="302" x2="764" y2="302" stroke="#444444" stroke-width="1.4"/><text x="40.0" y="324.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Test record</text><text x="40.0" y="352.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Input</text><text x="150.0" y="352.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">What it was</text><text x="470.0" y="352.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Pass criteria met?</text><text x="640.0" y="352.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Action</text><line x1="36" y1="366" x2="764" y2="366" stroke="#444444" stroke-width="0.8"/><text x="40.0" y="382.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Typical</text><text x="150.0" y="382.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Normal meeting, 3 decisions</text><text x="470.0" y="382.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">3 of 3</text><text x="640.0" y="382.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">keep</text><line x1="36" y1="398" x2="764" y2="398" stroke="#444444" stroke-width="0.8"/><text x="40.0" y="414.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Different</text><text x="150.0" y="414.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Two meetings merged</text><text x="470.0" y="414.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">3 of 3</text><text x="640.0" y="414.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">keep</text><line x1="36" y1="430" x2="764" y2="430" stroke="#444444" stroke-width="0.8"/><text x="40.0" y="446.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Edge (v1.0)</text><text x="150.0" y="446.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">No decisions; draft invented one</text><text x="470.0" y="446.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">2 of 3: (b) failed</text><text x="640.0" y="446.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">fix → v1.1</text><line x1="36" y1="462" x2="764" y2="462" stroke="#444444" stroke-width="0.8"/><text x="40.0" y="478.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Edge (v1.1)</text><text x="150.0" y="478.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Same notes, rerun</text><text x="470.0" y="478.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">3 of 3</text><text x="640.0" y="478.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">keep</text><text x="400.0" y="524.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Pass criteria: every decision in the notes appears · nothing appears that is not in the notes · each task has</text><text x="400.0" y="539.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">an owner and a date</text><text x="400.0" y="584.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Constructed example (Sam&#x27;s library). Earlier inputs are rerun after every change.</text></svg>