<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 395" width="800" height="395" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A log records what the system did; the agent&#x27;s summary is more text from the model</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="395" fill="#FFFFFF"/><text x="200.0" y="34.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The log (written by the system)</text><text x="600.0" y="34.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The agent&#x27;s report (produced by the model)</text><rect x="40" y="56" width="320" height="56" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="84.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Time of each pass</text><rect x="40" y="126" width="320" height="56" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="154.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Plan text and tool call</text><rect x="40" y="196" width="320" height="56" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="224.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Observation returned</text><rect x="40" y="266" width="320" height="56" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="294.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Who approved, and when</text><polygon points="458.0,56.0 742.0,56.0 760.0,189.0 742.0,322.0 458.0,322.0 440.0,189.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="154.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">More text, predicted from the context</text><text x="600.0" y="171.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">window: it can be fluent and wrong.</text><text x="600.0" y="189.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">In the Opening Case, the agent&#x27;s</text><text x="600.0" y="206.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">message said the rollback would not</text><text x="600.0" y="223.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">work; the user later said it did.</text><text x="400.0" y="352.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Read the log to learn what happened; treat the agent&#x27;s summary as a claim to check (Chapter 8).</text><text x="400.0" y="378.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">A log shows what was done, not why the model produced it (Chapter 17).</text></svg>