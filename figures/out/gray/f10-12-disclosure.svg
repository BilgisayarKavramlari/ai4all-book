<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" width="800" height="512" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Disclose when a rule, the reader or fairness asks for it; the sender answers for the message either way</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="512" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Should you disclose AI use in this message?</text><polygon points="180.0,48.0 330.0,98.0 180.0,148.0 30.0,98.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="180.0" y="82.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Does a rule require it?</text><text x="180.0" y="98.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">(course, employer, client,</text><text x="180.0" y="113.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">profession)</text><path d="M332.0,98.0 L420.0,160.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="346.0" y="84.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">yes</text><path d="M180.0,150.0 L180.0,158.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="196.0" y="154.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">no</text><polygon points="180.0,160.0 330.0,210.0 180.0,260.0 30.0,210.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="180.0" y="202.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Do these readers expect</text><text x="180.0" y="217.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">your own words?</text><path d="M332.0,210.0 L420.0,160.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="346.0" y="224.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">yes</text><path d="M180.0,262.0 L180.0,270.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="196.0" y="266.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">no</text><polygon points="180.0,272.0 330.0,322.0 180.0,372.0 30.0,322.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="180.0" y="314.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Would a reasonable reader</text><text x="180.0" y="329.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">feel misled later?</text><path d="M332.0,322.0 L420.0,160.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="346.0" y="336.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">yes</text><rect x="424" y="92" width="352" height="136" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="138.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Disclose, where readers will see it</text><text x="600.0" y="163.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a line in the message · a note to your</text><text x="600.0" y="179.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">manager · a project log · the course</text><text x="600.0" y="195.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">declaration · a citation for quoted AI</text><text x="600.0" y="211.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">output (Ch. 9)</text><path d="M180.0,374.0 L180.0,404.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="196.0" y="394.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">no to all</text><rect x="30" y="406" width="300" height="56" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="180.0" y="434.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">No line needed; keep your record</text><rect x="424" y="290" width="352" height="124" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="3"/><text x="600.0" y="332.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">The sender answers either way</text><text x="600.0" y="360.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">a label tells readers how a message was</text><text x="600.0" y="376.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">made, not who checks it (Moffatt, paras.</text><text x="600.0" y="392.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">27–29; this book&#x27;s reading)</text><text x="400.0" y="494.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Diamonds = your decisions · green = disclose · thick = always true</text></svg>