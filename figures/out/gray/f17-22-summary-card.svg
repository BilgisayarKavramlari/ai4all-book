<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Chapter 17 summary card</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="340" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Chapter 17 in six cards</text><rect x="20" y="50" width="240" height="110" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="87.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Who asks, and why</text><text x="140.0" y="119.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">contest · debug · decide how</text><text x="140.0" y="134.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">far to rely</text><rect x="280" y="50" width="240" height="110" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="87.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Layers, not one thing</text><text x="400.0" y="111.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">notice · documentation ·</text><text x="400.0" y="127.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">global · local · change ·</text><text x="400.0" y="142.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">contest</text><rect x="540" y="50" width="240" height="110" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="660.0" y="87.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Describes the model</text><text x="660.0" y="119.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">an attribution is not a cause</text><text x="660.0" y="134.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">in the world</text><rect x="20" y="180" width="240" height="110" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="217.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Actionable or not</text><text x="140.0" y="249.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a counterfactual helps only if</text><text x="140.0" y="264.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a person can act on it</text><rect x="280" y="180" width="240" height="110" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="217.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Plausible ≠ faithful</text><text x="400.0" y="249.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">fidelity, stability, the</text><text x="400.0" y="264.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">system&#x27;s own record</text><rect x="540" y="180" width="240" height="110" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="660.0" y="217.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A self-account is a claim</text><text x="660.0" y="249.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">check it; the contest route</text><text x="660.0" y="264.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">makes it matter</text><text x="400.0" y="316.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = what a person can do with an explanation</text></svg>