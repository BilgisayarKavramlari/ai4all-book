<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Working faster with AI is not the same as learning</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="430" fill="#FFFFFF"/><rect x="300" y="20" width="200" height="60" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="50.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A course assignment</text><polygon points="78.0,130.0 322.0,130.0 340.0,160.0 322.0,190.0 78.0,190.0 60.0,160.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="151.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The tool produces the answer; you</text><text x="200.0" y="168.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">hand it in</text><rect x="60" y="225" width="280" height="56" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="253.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Output delivered</text><rect x="60" y="315" width="280" height="60" rx="16" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="200.0" y="345.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Skill not built</text><path d="M200.0,192.0 L200.0,223.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M200.0,283.0 L200.0,313.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="478.0,130.0 722.0,130.0 740.0,160.0 722.0,190.0 478.0,190.0 460.0,160.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="151.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">You reason it through; the tool</text><text x="600.0" y="168.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">assists</text><rect x="460" y="225" width="280" height="56" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="253.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Output delivered</text><rect x="460" y="315" width="280" height="60" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="3"/><text x="600.0" y="345.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Skill built</text><path d="M600.0,192.0 L600.0,223.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M600.0,283.0 L600.0,313.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M360.0,82.0 L220.0,128.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M440.0,82.0 L580.0,128.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="410.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Same output, different result for you. At work the output may be the goal; in a course, the skill is.</text></svg>