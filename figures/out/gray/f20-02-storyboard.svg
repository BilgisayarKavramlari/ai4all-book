<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>From no AI to your first draft, AI to refine, none in interviews</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="400" fill="#FFFFFF"/><text x="107.0" y="70.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Feb 2025</text><rect x="20" y="84" width="175" height="96" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="107.5" y="108.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Job postings ask</text><text x="107.5" y="124.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">applicants not to use</text><text x="107.5" y="139.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">AI assistants in the</text><text x="107.5" y="155.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">application</text><path d="M197.0,132.0 L213.0,132.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="302.0" y="70.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">May 2025</text><rect x="215" y="84" width="175" height="96" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="302.5" y="124.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The rule reported</text><text x="302.5" y="139.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">again</text><path d="M392.0,132.0 L408.0,132.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="497.0" y="70.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Jul 10, 2025</text><rect x="410" y="84" width="175" height="96" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="497.5" y="116.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The company publishes</text><text x="497.5" y="132.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">guidance by hiring</text><text x="497.5" y="147.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">stage</text><path d="M587.0,132.0 L603.0,132.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="692.0" y="70.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Jul 21, 2025</text><rect x="605" y="84" width="175" height="96" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="692.5" y="100.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Fortune quotes the</text><text x="692.5" y="116.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">head of talent&#x27;s</text><text x="692.5" y="132.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">LinkedIn post: the</text><text x="692.5" y="147.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">approach is</text><text x="692.5" y="163.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">intentional</text><text x="400.0" y="30.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">From &quot;no AI&quot; to &quot;your first draft, AI to refine, none in live interviews&quot;</text><rect x="40" y="250" width="225" height="100" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="152.5" y="284.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Application materials</text><text x="152.5" y="304.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">write your own first draft,</text><text x="152.5" y="320.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">then refine; never invent</text><text x="152.5" y="335.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">experience</text><path d="M497.0,182.0 L152.0,248.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="290" y="250" width="225" height="100" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="402.5" y="284.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Take-home tasks</text><text x="402.5" y="312.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">no AI unless the company</text><text x="402.5" y="327.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">says it is allowed</text><path d="M497.0,182.0 L402.0,248.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="540" y="250" width="225" height="100" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="652.5" y="284.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Live interviews</text><text x="652.5" y="312.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">no AI unless the company</text><text x="652.5" y="327.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">indicates otherwise</text><path d="M497.0,182.0 L652.0,248.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="382.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Solid = the company&#x27;s own page · dashed = reported in news coverage (Fortune, 2025)</text></svg>