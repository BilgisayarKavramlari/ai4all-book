<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A code fits on one card: scope, a few commitments, boundaries, a review date and dated notes</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="620" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A personal AI code of practice fits on one card</text><rect x="20" y="42" width="760" height="488" rx="6" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="40" y="56" width="720" height="52" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="82.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Scope: who I am in this code (student in my major, job, freelance, club) · date</text><rect x="40" y="122" width="720" height="234" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="239.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="56.0" y="139.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Commitments (5–7, including the four required lines)</text><line x1="52" y1="156" x2="748" y2="156" stroke="#444444" stroke-width="0.8"/><text x="62.0" y="176.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">1.</text><text x="84.0" y="176.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">When [a moment I will notice], I [an action I or someone else can trace], because [my evidence].</text><line x1="52" y1="196" x2="748" y2="196" stroke="#444444" stroke-width="0.8"/><text x="62.0" y="216.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">2.</text><text x="84.0" y="216.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">When [a moment I will notice], I [an action I or someone else can trace], because [my evidence].</text><line x1="52" y1="236" x2="748" y2="236" stroke="#444444" stroke-width="0.8"/><text x="62.0" y="256.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">3.</text><text x="84.0" y="256.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">When [a moment I will notice], I [an action I or someone else can trace], because [my evidence].</text><line x1="52" y1="276" x2="748" y2="276" stroke="#444444" stroke-width="0.8"/><text x="62.0" y="296.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">4.</text><text x="84.0" y="296.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">When [a moment I will notice], I [an action I or someone else can trace], because [my evidence].</text><line x1="52" y1="316" x2="748" y2="316" stroke="#444444" stroke-width="0.8"/><text x="62.0" y="336.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">5.</text><text x="84.0" y="336.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">When [a moment I will notice], I [an action I or someone else can trace], because [my evidence].</text><rect x="40" y="370" width="720" height="62" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="400.0" y="393.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Boundaries: this code works inside [the rules I am under]; where one is stricter, it wins;</text><text x="400.0" y="408.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">when a rule is unclear, I ask [its owner, by role].</text><rect x="40" y="446" width="400" height="84" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="240.0" y="488.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><line x1="40" y1="446" x2="440" y2="446" stroke="#000000" stroke-width="5"/><rect x="52" y="458" width="34" height="30" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><line x1="52" y1="466" x2="86" y2="466" stroke="#000000" stroke-width="3"/><text x="100.0" y="472.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Review</text><text x="240.0" y="504.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">by [date, ≤ 6 months] · review triggers: [two or more]</text><rect x="456" y="446" width="304" height="84" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="608.0" y="480.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Dated notes: tool or rule facts, each</text><text x="608.0" y="495.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;as of [month year]&quot;</text><text x="400.0" y="558.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Blank template: every commitment is written &quot;When …, I …, because …&quot;.</text><text x="400.0" y="590.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = your choice · thick border = the rules around your code · calendar = a date you set</text></svg>