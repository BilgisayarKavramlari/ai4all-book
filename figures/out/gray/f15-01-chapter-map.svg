"">Disclose</text><text x="400.0" y="402.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">This chapter strengthens Prompt (what you send decides your privacy), then Decide (second): which risks to reduce,</text><text x="400.0" y="417.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">and who owns the rest.</text><text x="400.0" y="440.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Opening case: engineers paste source code and a meeting transcript into a chat tool (2023)</text></svg>