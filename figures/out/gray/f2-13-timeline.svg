<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 465" width="800" height="465" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Old ideas became practical when data, computing power and algorithms matured together</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="465" fill="#FFFFFF"/><line x1="30" y1="150" x2="770" y2="150" stroke="#000000" stroke-width="2"/><circle cx="70" cy="150" r="7" fill="#000000"/><line x1="70" y1="142" x2="70" y2="116" stroke="#000000" stroke-width="1"/><text x="70.0" y="60.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1956 Dartmouth</text><text x="70.0" y="76.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">workshop (term used</text><text x="70.0" y="91.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">in its 1955</text><text x="70.0" y="107.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">proposal)</text><circle cx="180" cy="150" r="7" fill="#000000"/><line x1="180" y1="158" x2="180" y2="184" stroke="#000000" stroke-width="1"/><text x="180.0" y="216.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1980s expert systems</text><circle cx="290" cy="150" r="7" fill="#000000"/><line x1="290" y1="142" x2="290" y2="116" stroke="#000000" stroke-width="1"/><text x="290.0" y="68.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1997 Deep Blue beats</text><text x="290.0" y="84.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the world chess</text><text x="290.0" y="99.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">champion</text><circle cx="400" cy="150" r="7" fill="#000000"/><line x1="400" y1="158" x2="400" y2="184" stroke="#000000" stroke-width="1"/><text x="400.0" y="200.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2012 a deep network</text><text x="400.0" y="216.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">leaps ahead in image</text><text x="400.0" y="231.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">recognition</text><circle cx="510" cy="150" r="7" fill="#000000"/><line x1="510" y1="142" x2="510" y2="116" stroke="#000000" stroke-width="1"/><text x="510.0" y="76.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2016 AlphaGo beats a</text><text x="510.0" y="91.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">top Go player</text><circle cx="620" cy="150" r="7" fill="#000000"/><line x1="620" y1="158" x2="620" y2="184" stroke="#000000" stroke-width="1"/><text x="620.0" y="216.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2017 the Transformer</text><circle cx="730" cy="150" r="7" fill="#000000"/><line x1="730" y1="142" x2="730" y2="116" stroke="#000000" stroke-width="1"/><text x="730.0" y="68.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2022 ChatGPT</text><text x="730.0" y="84.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">released to the</text><text x="730.0" y="99.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">public</text><rect x="20" y="262" width="270" height="36" fill="#F4F4F4" stroke="#000000" stroke-width="1"/><text x="155.0" y="280.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Wave 1: rules, logic, early learning</text><rect x="300" y="262" width="320" height="36" fill="#D6D6D6" stroke="#000000" stroke-width="1"/><text x="460.0" y="280.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Wave 2: deep learning</text><rect x="630" y="262" width="150" height="36" fill="#ADADAD" stroke="#000000" stroke-width="1"/><text x="705.0" y="280.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Wave 3: generative</text><text x="400.0" y="316.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Events evenly spaced, not to scale</text><text x="40.0" y="350.0" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Why now? Three things matured together:</text><rect x="30" y="368" width="236" height="84" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="148.0" y="396.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Data</text><text x="148.0" y="418.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">huge amounts of digital text</text><text x="148.0" y="434.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">and images</text><rect x="282" y="368" width="236" height="84" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="396.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Compute</text><text x="400.0" y="410.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">cheap parallel processing on</text><text x="400.0" y="426.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">graphics chips and computer</text><text x="400.0" y="442.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">clusters</text><rect x="534" y="368" width="236" height="84" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="652.0" y="396.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Algorithms</text><text x="652.0" y="418.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">training methods for very</text><text x="652.0" y="434.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">large networks</text></svg>