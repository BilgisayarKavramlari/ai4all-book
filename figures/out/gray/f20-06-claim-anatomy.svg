<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A labor-market number is a forecast by named respondents at a date</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="430" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A labor-market number is a forecast by named respondents at a date</text><rect x="270" y="176" width="260" height="84" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="400.0" y="195.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;170 million new jobs by</text><text x="400.0" y="213.7" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2030&quot;</text><text x="400.0" y="234.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the number as you met it</text><rect x="10" y="56" width="189" height="92" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="104.5" y="87.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Who said it?</text><text x="104.5" y="112.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the WEF, from employers&#x27;</text><text x="104.5" y="128.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2024 answers</text><path d="M105.0,150.0 L282.0,174.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="207" y="56" width="189" height="92" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="301.5" y="87.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Whom did they ask?</text><text x="301.5" y="112.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">over 1,000 employers,</text><text x="301.5" y="128.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">not workers</text><path d="M302.0,150.0 L360.8,174.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="404" y="56" width="189" height="92" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="498.5" y="87.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">When?</text><text x="498.5" y="112.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">survey May–September</text><text x="498.5" y="128.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2024</text><path d="M499.0,150.0 L439.6,174.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="601" y="56" width="189" height="92" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="695.5" y="87.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What caused it?</text><text x="695.5" y="112.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">all trends combined, not</text><text x="695.5" y="128.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">AI alone</text><path d="M696.0,150.0 L518.4,174.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="110" y="300" width="190" height="92" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="205.0" y="331.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What was measured?</text><text x="205.0" y="356.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">expectations and plans,</text><text x="205.0" y="372.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">not outcomes</text><path d="M205.0,298.0 L322.0,262.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="305" y="300" width="190" height="92" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="331.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Forecast or count?</text><text x="400.0" y="356.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">an estimate for</text><text x="400.0" y="372.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2025–2030</text><path d="M400.0,298.0 L400.0,262.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="500" y="300" width="190" height="92" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="595.0" y="331.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Gross or net?</text><text x="595.0" y="348.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">gross; 92 million</text><text x="595.0" y="364.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">displaced, net 78</text><text x="595.0" y="380.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">million</text><path d="M595.0,298.0 L478.0,262.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="420.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = a question you ask · rectangle = the claim. Answers from WEF (2025), pp. 5, 25, 97.</text></svg>