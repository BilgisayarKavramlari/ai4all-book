  <g id="text_30">
   <text style="font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 350.939469)">Source: Chandra et al. (2025), Deepfake-Eval-2024, arXiv:2503.02857 version 5 (May 2026), Table 3: nine open-source detectors, off the shelf, on real and fake</text>
   <text style="font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 361.577391)">media users flagged in 2024. The best of 22 anonymized commercial tools scored 0.79 (video), 0.93 (audio; the authors partly credit their audio labeling)</text>
   <text style="font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 372.215312)">and 0.90 (images) (Table 5). The authors built the benchmark with TrueMedia.org, a nonprofit deepfake-detection service (closed to the public in January 2025; TrueMedia.org, 2025).</text>
  </g>
