<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A check between steps catches errors where they start</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="460" fill="#FFFFFF"/><rect x="20" y="70" width="150" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="95.0" y="101.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Meeting notes</text><text x="95.0" y="126.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">names replaced by</text><text x="95.0" y="142.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">roles</text><path d="M172.0,116.0 L196.0,116.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="218.0,64.0 352.0,64.0 370.0,116.0 352.0,168.0 218.0,168.0 200.0,116.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="285.0" y="98.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Step 1: extract</text><text x="285.0" y="116.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">decisions and action</text><text x="285.0" y="133.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">items</text><path d="M372.0,116.0 L396.0,116.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="400" y="60" width="180" height="112" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="490.0" y="98.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Sam checks names,</text><text x="490.0" y="116.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">dates and owners</text><text x="490.0" y="133.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">against his notes</text><path d="M582.0,116.0 L606.0,116.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="695.0,56.0 780.0,116.0 695.0,176.0 610.0,116.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="695.0" y="116.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">All correct?</text><path d="M695.0,178.0 L695.0,236.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="712.0" y="207.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="font-style:italic;">yes</text><path d="M640.0,150.0 L500.0,174.0" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/><text x="560.0" y="196.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">no: fix the list</text><polygon points="628.0,240.0 762.0,240.0 780.0,292.0 762.0,344.0 628.0,344.0 610.0,292.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="695.0" y="283.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Step 2: draft the</text><text x="695.0" y="300.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">update email</text><path d="M608.0,292.0 L512.0,292.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="330" y="246" width="180" height="92" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="420.0" y="283.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Sam reads, edits and</text><text x="420.0" y="300.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">sends</text><text x="400.0" y="390.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Each step&#x27;s output becomes the next step&#x27;s input; the check sits where errors start.</text><text x="400.0" y="412.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rectangle = material · hexagon = AI step · rounded = Sam (thick = the check) · diamond = decision · dashed = loop</text><text x="400.0" y="427.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">back</text><text x="400.0" y="444.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Constructed example. You fix the steps and run them; the model does not choose them.</text></svg>