<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A13 may reuse A11&#x27;s design; it is graded on what A11 could not show: a build, runs and a peer test</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="450" fill="#FFFFFF"/><text x="200.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A11: designed on paper</text><text x="600.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A13: built and tested</text><rect x="40" y="60" width="320" height="70" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="200.0" y="95.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Step map</text><rect x="40" y="156" width="320" height="70" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="200.0" y="191.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Action table and people points</text><rect x="40" y="252" width="320" height="70" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="200.0" y="287.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Dry run on paper</text><rect x="440" y="56" width="320" height="52" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="3"/><text x="600.0" y="73.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Build: template, chain or configured</text><text x="600.0" y="90.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">tool</text><rect x="440" y="120" width="320" height="52" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="3"/><text x="600.0" y="146.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Three runs: typical, different, edge</text><rect x="440" y="184" width="320" height="52" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="210.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Safeguards built in</text><rect x="440" y="248" width="320" height="52" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="3"/><text x="600.0" y="274.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Peer test from another field</text><rect x="440" y="312" width="320" height="52" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="338.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Workflow card and defense</text><path d="M362.0,200.0 L438.0,200.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="188.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">may extend</text><text x="200.0" y="352.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Reused parts are marked &quot;from A11&quot; and earn no</text><text x="200.0" y="367.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">points unless revised for the build</text><text x="600.0" y="384.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Thick = graded as new work: build, runs, peer</text><text x="600.0" y="399.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">test</text><text x="400.0" y="430.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Light fill = reused design · white or green fill = new work in A13</text></svg>