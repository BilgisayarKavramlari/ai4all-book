<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A concept map is a set of labeled links between terms</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="420" fill="#FFFFFF"/><path d="M130.0,146.0 L130.0,272.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M315.0,90.0 L216.0,90.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M486.0,90.0 L584.0,90.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M670.0,272.0 L670.0,120.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M585.0,290.0 L200.0,120.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="45.0" y="62.0" width="170" height="56" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="130.0" y="90.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Training data</text><rect x="45.0" y="272.0" width="170" height="56" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="130.0" y="300.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Labels</text><rect x="315.0" y="62.0" width="170" height="56" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="90.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Model</text><rect x="585.0" y="62.0" width="170" height="56" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="670.0" y="90.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Predictions</text><rect x="585.0" y="272.0" width="170" height="56" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="670.0" y="300.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Test set</text><text x="70.0" y="210.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">is paired with</text><text x="265.0" y="64.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">is trained on</text><text x="535.0" y="64.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">produces</text><text x="730.0" y="196.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">checks</text><text x="350.0" y="250.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">must not overlap with</text><text x="400.0" y="372.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Read each link as a sentence: “A model is trained on training data.”</text><text x="400.0" y="400.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded boxes = terms · italic arrow labels = the relationship</text></svg>