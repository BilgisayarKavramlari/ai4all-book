<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A model can score well for the wrong reason</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="410" fill="#FFFFFF"/><text x="150.0" y="28.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Training photos</text><rect x="20" y="48" width="260" height="70" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="150.0" y="74.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Bolts, photographed on a brown</text><text x="150.0" y="91.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">desk</text><rect x="20" y="132" width="260" height="70" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="150.0" y="158.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Nuts and washers, photographed</text><text x="150.0" y="175.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">on a white table</text><path d="M284.0,83.0 L338.0,118.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M284.0,167.0 L338.0,134.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="470.0" y="28.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What the model learned</text><polygon points="360.0,82.0 580.0,82.0 598.0,125.0 580.0,168.0 360.0,168.0 342.0,125.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="470.0" y="111.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;Brown background = bolt&quot;</text><text x="470.0" y="142.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">an easier rule than the shape</text><text x="470.0" y="188.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Testing on photos from the same desk and</text><text x="470.0" y="203.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">table: almost all correct</text><path d="M470.0,222.0 L470.0,262.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="470.0" y="250.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><rect x="320" y="268" width="300" height="80" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="470.0" y="299.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">At the club workbench (new</text><text x="470.0" y="316.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">background): a nut is called &quot;bolt&quot;</text><text x="710.0" y="296.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Predictions</text><text x="710.0" y="318.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">collapse</text><text x="400.0" y="390.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Dashed = a rule nobody intended · thick border = the failure</text></svg>