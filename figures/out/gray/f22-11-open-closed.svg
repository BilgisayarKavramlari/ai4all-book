  <g id="text_22">
   <text style="font: 13.5px 'Source Sans 3', 'STIXGeneral', 'DejaVu Sans', sans-serif" transform="translate(9.274578 16.730156)">The measured gap between the best open-weight and best closed models: 1.7% on a leaderboard in 2025; about 4</text>
