  </g>
  <g id="text_23">
   <text style="fill: #1d1d1f; font: 10.5px 'Source Sans 3', 'STIXGeneral', 'DejaVu Sans', sans-serif" transform="translate(9.274578 272.480672)">Sources: Stanford HAI (2025), AI Index Report 2025; Epoch AI Data Insights (October 30, 2025; May 29, 2026). Left: crowd votes, compiled by</text>
   <text style="fill: #1d1d1f; font: 10.5px 'Source Sans 3', 'STIXGeneral', 'DejaVu Sans', sans-serif" transform="translate(9.274578 283.388531)">the AI Index (a score gap); right: Epoch's own index (a time gap). As of October 2026.</text>
