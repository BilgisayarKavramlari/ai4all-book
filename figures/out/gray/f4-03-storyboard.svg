<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 435" width="800" height="435" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A chatbot&#x27;s answer became a tribunal order in 15 months</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="435" fill="#FFFFFF"/><line x1="30" y1="200" x2="770" y2="200" stroke="#000000" stroke-width="2.4"/><rect x="18" y="30" width="146" height="150" rx="3" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="91.0" y="81.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Nov 11, 2022</text><text x="91.0" y="111.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Chatbot: claim</text><text x="91.0" y="127.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">within 90 days,</text><text x="91.0" y="142.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">even after travel</text><text x="91.0" y="158.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">(paras. 13–18)</text><line x1="91" y1="180" x2="91" y2="200" stroke="#000000" stroke-width="1.4"/><circle cx="91" cy="200" r="5" fill="#000000"/><rect x="173" y="222" width="146" height="150" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="246.0" y="273.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Nov 16, 2022</text><text x="246.0" y="303.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Books the return</text><text x="246.0" y="319.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">flight, relying on</text><text x="246.0" y="334.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the same reply</text><text x="246.0" y="350.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">(para. 18)</text><line x1="246" y1="222" x2="246" y2="200" stroke="#000000" stroke-width="1.4"/><circle cx="246" cy="200" r="5" fill="#000000"/><rect x="328" y="30" width="146" height="150" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="401.0" y="81.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Nov 17, 2022</text><text x="401.0" y="119.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Applies for the</text><text x="401.0" y="135.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">bereavement fare</text><text x="401.0" y="150.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">(para. 20)</text><line x1="401" y1="180" x2="401" y2="200" stroke="#000000" stroke-width="1.4"/><circle cx="401" cy="200" r="5" fill="#000000"/><rect x="483" y="222" width="146" height="150" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="556.0" y="273.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Feb 8, 2023</text><text x="556.0" y="303.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Airline admits the</text><text x="556.0" y="319.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">chatbot used</text><text x="556.0" y="334.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">“misleading words”</text><text x="556.0" y="350.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">(para. 22)</text><line x1="556" y1="222" x2="556" y2="200" stroke="#000000" stroke-width="1.4"/><circle cx="556" cy="200" r="5" fill="#000000"/><rect x="638" y="30" width="146" height="150" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="711.0" y="81.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Feb 14, 2024</text><text x="711.0" y="111.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Tribunal orders</text><text x="711.0" y="127.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the airline to pay</text><text x="711.0" y="142.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">$812.02 in total</text><text x="711.0" y="158.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">(para. 44)</text><line x1="711" y1="180" x2="711" y2="200" stroke="#000000" stroke-width="1.4"/><circle cx="711" cy="200" r="5" fill="#000000"/><text x="400.0" y="396.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Light shaded rectangle = the chatbot&#x27;s reply · rounded = Moffatt&#x27;s actions · darker shaded rectangle = the decision</text><text x="400.0" y="418.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">All dates and amounts from Moffatt v. Air Canada, 2024 BCCRT 149 (dollars, as the decision gives them).</text></svg>