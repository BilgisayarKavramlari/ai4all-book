<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Marcus sends a constructed case, not a de-identified real one</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="350" fill="#FFFFFF"/><text x="140.0" y="40.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Kept: what the task needs</text><rect x="20" y="70" width="240" height="80" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="110.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Condition and its signs</text><rect x="20" y="170" width="240" height="80" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="210.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The care steps to practice</text><text x="402.0" y="30.9" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Left out: what could point to a</text><text x="402.0" y="49.2" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">person</text><rect x="282" y="70" width="240" height="80" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="402.0" y="110.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Unit, bed, date of the shift</text><rect x="282" y="170" width="240" height="80" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="402.0" y="210.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Exact age; a rare detail</text><text x="664.0" y="40.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Built from the textbook</text><rect x="544" y="70" width="240" height="80" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="664.0" y="101.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A constructed patient with</text><text x="664.0" y="118.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">textbook values</text><rect x="544" y="170" width="240" height="80" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="664.0" y="210.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Labeled &#x27;constructed case&#x27;</text><text x="400.0" y="300.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Marcus sends no detail from his placement, with or without a name.</text><text x="400.0" y="330.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Thick border = left out · thin border = kept or built</text></svg>