<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 446" width="800" height="446" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A post-hoc explanation studies a model from outside; an interpretable model is its own explanation</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="446" fill="#FFFFFF"/><text x="400.0" y="14.2" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A post-hoc explanation studies a model from outside; an interpretable model is its own</text><text x="400.0" y="33.8" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">explanation</text><text x="200.0" y="70.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Interpretable model (glass box)</text><polygon points="58.0,92.0 342.0,92.0 360.0,127.0 342.0,162.0 58.0,162.0 40.0,127.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="115.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A scorecard or a rule list</text><text x="200.0" y="141.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">you can read it directly</text><path d="M200.0,164.0 L200.0,200.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="60" y="202" width="280" height="60" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="223.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The explanation is the model</text><text x="200.0" y="240.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">itself</text><text x="600.0" y="70.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Black box + post-hoc explanation</text><polygon points="458.0,92.0 742.0,92.0 760.0,127.0 742.0,162.0 458.0,162.0 440.0,127.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="115.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A complex model</text><text x="600.0" y="141.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">inputs and outputs visible; workings not</text><path d="M600.0,164.0 L600.0,200.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="612.0" y="182.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">inputs tried, outputs recorded</text><rect x="450" y="202" width="300" height="70" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="225.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">An explanation method run afterward</text><text x="600.0" y="243.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">occlusion, attribution, a surrogate</text><text x="600.0" y="258.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">model, a counterfactual search</text><path d="M600.0,274.0 L600.0,306.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="450" y="308" width="300" height="60" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="329.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">An explanation of the model, with</text><text x="600.0" y="346.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">its own error</text><text x="400.0" y="404.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagon = AI model · rectangle = a step or a product · filled = needs no separate check of its faithfulness</text><text x="400.0" y="428.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Rudin (2019) argues for the left column whenever a high-stakes decision allows it.</text></svg>