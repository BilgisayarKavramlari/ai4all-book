<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 374" width="800" height="374" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>In Hana&#x27;s menu cover, copyright covers Hana&#x27;s drawing, not the generated draft</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="374" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Hana&#x27;s menu cover: what copyright can protect, layer by layer</text><polygon points="58.0,52.0 492.0,52.0 510.0,87.0 492.0,122.0 58.0,122.0 40.0,87.0" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="275.0" y="75.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The owner&#x27;s generated draft</text><text x="275.0" y="101.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">layout reference only · not protected: no human author</text><rect x="40" y="140" width="470" height="70" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="275.0" y="163.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Hana&#x27;s hand-drawn illustration</text><text x="275.0" y="189.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Hana&#x27;s own expression · protected</text><rect x="40" y="228" width="470" height="70" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="275.0" y="251.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The owner&#x27;s arrangement of text and pictures</text><text x="275.0" y="277.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">at most thin protection, as an arrangement</text><rect x="550" y="140" width="220" height="158" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="660.0" y="184.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The bakery&#x27;s logo, as a</text><text x="660.0" y="202.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">brand</text><text x="660.0" y="226.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">trademark: protects the</text><text x="660.0" y="242.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">bakery&#x27;s brand in trade;</text><text x="660.0" y="258.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">its artwork may also have</text><text x="660.0" y="274.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">copyright</text><text x="400.0" y="330.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagon = AI output · rounded = made by people · the layout idea itself is not protected (ideas never are)</text><text x="400.0" y="356.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Source: U.S. Copyright Office (2025), Part 2; this book&#x27;s application to a constructed case</text></svg>