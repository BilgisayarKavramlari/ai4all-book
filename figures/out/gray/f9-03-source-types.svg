<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 446" width="800" height="446" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>The same document can be primary for one claim and secondary for another</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="446" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Source types: what each is good evidence for</text><rect x="20" y="46" width="240" height="100" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="80.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Primary</text><text x="140.0" y="100.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the record itself: a study,</text><text x="140.0" y="116.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">dataset, law, court record,</text><text x="140.0" y="131.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">official page</text><path d="M140.0,148.0 L140.0,168.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="20" y="170" width="240" height="80" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="140.0" y="202.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Good evidence for: what was</text><text x="140.0" y="217.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">done, found or decided</text><rect x="280" y="46" width="240" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="80.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Secondary</text><text x="400.0" y="100.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">reports on or interprets</text><text x="400.0" y="116.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">primary sources: a review, a</text><text x="400.0" y="131.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">textbook, a news story</text><path d="M400.0,148.0 L400.0,168.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="280" y="170" width="240" height="80" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="400.0" y="194.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Good evidence for: what the</text><text x="400.0" y="210.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">records add up to, if it cites</text><text x="400.0" y="225.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">them</text><rect x="540" y="46" width="240" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="660.0" y="80.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Tertiary</text><text x="660.0" y="100.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">collects and condenses: an</text><text x="660.0" y="116.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">encyclopedia, an index, a</text><text x="660.0" y="131.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">study guide</text><path d="M660.0,148.0 L660.0,168.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="540" y="170" width="240" height="80" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="660.0" y="202.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Good evidence for: background</text><text x="660.0" y="217.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">and where to look next</text><rect x="20" y="290" width="500" height="84" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="270.0" y="318.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Type depends on the claim: the Deloitte report</text><text x="270.0" y="340.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">primary for “what the department was told”; secondary for “what</text><text x="270.0" y="356.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the court said” (the judgment is the record)</text><polygon points="558.0,290.0 762.0,290.0 780.0,332.0 762.0,374.0 558.0,374.0 540.0,332.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="660.0" y="318.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">AI output</text><text x="660.0" y="340.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">not a source of evidence: a</text><text x="660.0" y="356.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">lead</text><text x="400.0" y="390.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Gray literature (reports by governments, firms, charities and consultancies) can be any of the three types; ask who</text><text x="400.0" y="405.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">paid for it.</text><text x="400.0" y="424.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Green = the record itself · rounded = what you can use it for · dashed hexagon = not a source</text></svg>