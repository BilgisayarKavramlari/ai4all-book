  <g id="text_22">
   <text style="fill: #1d1d1f; font: 10.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 294.160266)">Sources: IEA (2025), Energy and AI; IEA (2026b), Key Questions on Energy and AI, executive summary; LBNL</text>
   <text style="fill: #1d1d1f; font: 10.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 305.917969)">(Shehabi et al., 2024) as summarized by DOE (2024), 2028 totals. Filled = outside estimate of the past; light boxes</text>
   <text style="fill: #1d1d1f; font: 10.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 317.675672)">labeled forecast. The 2025 edition's 2030 base case was 945 TWh. As of October 2026.</text>
