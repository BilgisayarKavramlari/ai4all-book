<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>In five minutes, show one decision chain</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="240" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">In five minutes, show one decision chain and answer from your evidence</text><rect x="30" y="80" width="68.0" height="70" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="64.0" y="107.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Narrative</text><text x="64.0" y="122.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">sentence</text><rect x="102.0" y="80" width="212.0" height="70" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="208.0" y="107.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">One entry as a decision</text><text x="208.0" y="122.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">chain</text><rect x="318.0" y="80" width="140.0" height="70" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="388.0" y="107.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">One revision and</text><text x="388.0" y="122.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">its check</text><rect x="462.0" y="80" width="284.0" height="70" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="604.0" y="115.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Questions (2 minutes)</text><line x1="30" y1="158" x2="30" y2="170" stroke="#000000" stroke-width="1.4"/><text x="30.0" y="184.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">0:00</text><line x1="174" y1="158" x2="174" y2="170" stroke="#000000" stroke-width="1.4"/><text x="174.0" y="184.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1:00</text><line x1="318" y1="158" x2="318" y2="170" stroke="#000000" stroke-width="1.4"/><text x="318.0" y="184.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2:00</text><line x1="462" y1="158" x2="462" y2="170" stroke="#000000" stroke-width="1.4"/><text x="462.0" y="184.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3:00</text><line x1="606" y1="158" x2="606" y2="170" stroke="#000000" stroke-width="1.4"/><text x="606.0" y="184.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4:00</text><line x1="750" y1="158" x2="750" y2="170" stroke="#000000" stroke-width="1.4"/><text x="750.0" y="184.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">5:00</text><text x="400.0" y="222.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">No AI tool and no script; one index card and your portfolio open. A time limit, not a pace.</text></svg>