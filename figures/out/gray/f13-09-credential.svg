<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" width="800" height="412" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A content credential records a file&#x27;s history, and a screenshot often leaves it behind</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="412" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A content credential records a file&#x27;s history, and a screenshot often leaves it behind</text><rect x="30" y="70" width="220" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="101.3" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Image file</text><text x="140.0" y="134.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the pixels</text><rect x="30" y="190" width="220" height="150" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="241.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Credential (C2PA)</text><text x="140.0" y="279.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">signed statements: captured</text><text x="140.0" y="295.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">with … · edited with … ·</text><text x="140.0" y="310.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">generated with …</text><rect x="280" y="150" width="180" height="92" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="370.0" y="181.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Hash binding</text><text x="370.0" y="206.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a fingerprint of the</text><text x="370.0" y="222.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">pixels; changes show</text><path d="M252.0,116.0 L300.0,152.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M252.0,262.0 L300.0,236.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="530" y="70" width="250" height="100" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="655.0" y="104.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Shared as the file</text><text x="655.0" y="132.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">credential kept: a lead about</text><text x="655.0" y="147.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">origin</text><rect x="530" y="220" width="250" height="100" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="655.0" y="254.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Screenshot or re-upload</text><text x="655.0" y="274.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">new file: credential often</text><text x="655.0" y="290.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">stripped (unless stored online</text><text x="655.0" y="305.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">and linked)</text><path d="M462.0,186.0 L528.0,124.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M462.0,206.0 L528.0,266.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="372.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">A credential states history as signed by whoever signed it; it cannot say the scene is true (C2PA, 2026).</text><text x="400.0" y="396.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Gray box = stripped or missing · rectangles = parts of the record</text></svg>