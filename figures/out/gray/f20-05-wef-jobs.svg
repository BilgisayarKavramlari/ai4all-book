   </g>
   <g id="text_17">
    <text style="font: 13px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(79.2 17.077969)">From employers' expectations, the WEF estimates more jobs created than displaced</text>
    <text style="font: 13px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(79.2 31.635125)">by 2030, across all trends, with churn of 22%</text>
   </g>
  </g>
  <g id="text_18">
   <text style="fill: #444444; font: 10px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 303.2395)">Source: World Economic Forum (2025), Future of Jobs Report 2025, pp. 5-6, 25, 97, 99. The WEF's estimates from employers' expectations (over 1,000 employers,</text>
   <text style="fill: #444444; font: 10px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 314.437312)">survey May-September 2024; a p. 99 note says May-August), applied to about 1.18 billion employees in covered roles. All trends combined, not AI alone:</text>
   <text style="fill: #444444; font: 10px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 325.635125)">the report links about 11 million created and 9 million displaced to AI and information processing (p. 25).</text>
