<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 624" width="800" height="624" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>One part, two tools: a calculation can sit outside one tool&#x27;s frontier and inside another&#x27;s</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="624" fill="#FFFFFF"/><line x1="70" y1="400" x2="520" y2="400" stroke="#000000" stroke-width="1.4"/><line x1="70" y1="60" x2="70" y2="400" stroke="#000000" stroke-width="1.4"/><text x="295.0" y="428.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Tasks, ordered by how hard they look to a person →</text><text x="28" y="230.0" font-size="13" text-anchor="middle" fill="#000000" transform="rotate(-90 28 230.0)">How hard the task is for the AI tool →</text><polygon points="70,300 115,270 150,330 195,220 235,280 280,190 320,300 365,170 405,235 445,130 485,210 520,120 520,400 70,400" fill="#E6E6E6" stroke="none"/><polyline points="70,300 115,270 150,330 195,220 235,280 280,190 320,300 365,170 405,235 445,130 485,210 520,120" fill="none" stroke="#000000" stroke-width="2.6"/><text x="300.0" y="375.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Inside the frontier</text><text x="200.0" y="90.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Outside the frontier</text><circle cx="100" cy="345" r="12" fill="#000000"/><text x="100.0" y="345.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">1</text><circle cx="150" cy="245" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2.4"/><text x="150.0" y="245.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2</text><circle cx="260" cy="330" r="12" fill="#000000"/><text x="260.0" y="330.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">3</text><circle cx="300" cy="150" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2.4"/><text x="300.0" y="150.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4</text><circle cx="420" cy="300" r="12" fill="#000000"/><text x="420.0" y="300.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">5</text><circle cx="470" cy="105" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2.4"/><text x="470.0" y="105.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">6</text><text x="660.0" y="70.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Example tasks</text><text x="548.0" y="100.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">● 1</text><text x="585.0" y="92.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Rewrite a paragraph in</text><text x="585.0" y="107.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">another tone</text><text x="548.0" y="152.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">○ 2</text><text x="585.0" y="137.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Exact quotes with page</text><text x="585.0" y="152.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">numbers from a book it was</text><text x="585.0" y="167.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">not given</text><text x="548.0" y="204.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">● 3</text><text x="585.0" y="196.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Summarize an article you</text><text x="585.0" y="211.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">paste in</text><text x="548.0" y="256.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">○ 4</text><text x="585.0" y="241.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Exact letter counts in a long</text><text x="585.0" y="256.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">text, with no code or</text><text x="585.0" y="270.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">calculator feature</text><text x="548.0" y="308.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">● 5</text><text x="585.0" y="308.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Generate many ideas quickly</text><text x="548.0" y="360.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">○ 6</text><text x="585.0" y="345.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Facts about a small local</text><text x="585.0" y="360.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">organization, without web</text><text x="585.0" y="374.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">search</text><text x="400.0" y="470.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">● usually inside · ○ usually outside · Illustrative, as of October 2026; test your own tasks.</text><text x="400.0" y="500.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Sam&#x27;s unit conversion, 41 oz-in to N·m: the same part, two tools (constructed example)</text><rect x="40" y="518" width="350" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="215.0" y="549.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Tool A, no calculation: ○ outside</text><text x="215.0" y="574.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Gave 2.9 N·m, ten times too large; the right</text><text x="215.0" y="590.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">answer is about 0.29 N·m</text><rect x="410" y="518" width="350" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="585.0" y="549.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Tool B, runs code: ● inside</text><text x="585.0" y="574.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Matched his hand calculation on one</text><text x="585.0" y="590.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">known-answer test; one run, so test more</text></svg>