<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Every item passes a data-class check again for its new readers</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="530" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Every item passes a data-class check again for its new readers</text><rect x="300" y="46" width="200" height="50" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="62.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">An item for your</text><text x="400.0" y="79.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">portfolio</text><path d="M400.0,98.0 L400.0,118.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="400.0,120.0 500.0,175.0 400.0,230.0 300.0,175.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="166.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Whose information</text><text x="400.0" y="183.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">is in it?</text><path d="M502.0,175.0 L588.0,175.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="545.0" y="163.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">only yours</text><rect x="590" y="140" width="190" height="70" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="685.0" y="163.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Keep it</text><text x="685.0" y="181.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">check its data class</text><text x="685.0" y="196.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">anyway</text><path d="M298.0,175.0 L212.0,175.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="255.0" y="163.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">protected</text><rect x="20" y="132" width="190" height="86" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="115.0" y="161.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Remove it</text><text x="115.0" y="176.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">patients&#x27;, participants&#x27;</text><text x="115.0" y="192.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">or clients&#x27; confidential</text><text x="115.0" y="208.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">data</text><path d="M400.0,232.0 L400.0,268.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="412.0" y="250.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">classmates&#x27;, an employer&#x27;s, or a client&#x27;s work</text><polygon points="400.0,270.0 500.0,325.0 400.0,380.0 300.0,325.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="317.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Written permission</text><text x="400.0" y="332.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">from its owner?</text><path d="M502.0,325.0 L588.0,325.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="545.0" y="313.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">yes</text><rect x="590" y="290" width="190" height="70" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="685.0" y="325.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Keep, permission noted</text><path d="M400.0,382.0 L400.0,412.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="412.0" y="396.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">no</text><rect x="270" y="414" width="260" height="70" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="441.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Replace with placeholders, or</text><text x="400.0" y="456.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">describe the method only</text><text x="400.0" y="512.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Data classes from Chapter 12. Diamond = a decision · rectangle = an action · thick or hatched border = remove</text></svg>