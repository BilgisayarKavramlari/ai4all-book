<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Four safeguards travel with every prototype</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="440" fill="#FFFFFF"/><polygon points="318.0,160.0 482.0,160.0 500.0,205.0 482.0,250.0 318.0,250.0 300.0,205.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="205.0" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Your prototype</text><rect x="40" y="40" width="220" height="90" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="150.0" y="70.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Data gate passed</text><text x="150.0" y="95.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the table&#x27;s floor, then</text><text x="150.0" y="110.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">your field&#x27;s rules</text><rect x="540" y="40" width="220" height="90" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="650.0" y="70.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A people point</text><text x="650.0" y="95.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">hard where an error falls</text><text x="650.0" y="110.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">on others</text><rect x="40" y="300" width="220" height="90" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="150.0" y="330.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">One field rule applied</text><text x="150.0" y="363.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">with its source and date</text><rect x="540" y="300" width="220" height="90" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="650.0" y="330.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Fairness check</text><text x="650.0" y="355.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a small paired-input test,</text><text x="650.0" y="370.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">or why no group cue enters</text><line x1="262" y1="120" x2="312" y2="170" stroke="#000000" stroke-width="1.4"/><line x1="538" y1="120" x2="488" y2="170" stroke="#000000" stroke-width="1.4"/><line x1="262" y1="310" x2="312" y2="240" stroke="#000000" stroke-width="1.4"/><line x1="538" y1="310" x2="488" y2="240" stroke="#000000" stroke-width="1.4"/><text x="400.0" y="420.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagon = the AI workflow · rounded = a person acts · rectangle = a check or a rule</text></svg>