<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 486" width="800" height="486" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Moral status: two serious sides, one label: contested</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="486" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Moral status: two serious sides, one label: contested</text><rect x="190" y="60" width="420" height="78" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="400.0" y="99.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="202.0" y="74.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">CLAIM</text><text x="400.0" y="100.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">AI welfare deserves serious attention now</text><text x="400.0" y="126.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">Long et al. (2024)</text><text x="194.0" y="182.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">+ FOR (reasons and premises)</text><text x="606.0" y="182.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">− AGAINST (objections)</text><line x1="18" y1="99.0" x2="18" y2="356.0" stroke="#000000" stroke-width="1.6"/><path d="M18.0,99.0 L188.0,99.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="34" y="208" width="320" height="88" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="194.0" y="252.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="44.0" y="222.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">+ FOR 1</text><text x="194.0" y="246.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">There is a realistic chance some systems</text><text x="194.0" y="261.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">will soon be conscious or robustly agentic</text><text x="194.0" y="285.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">Long et al. (2024)</text><line x1="18" y1="252.0" x2="34" y2="252.0" stroke="#000000" stroke-width="1.6"/><rect x="34" y="312" width="320" height="88" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="194.0" y="356.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="44.0" y="326.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">+ FOR 2</text><text x="194.0" y="350.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Under uncertainty, take proportionate</text><text x="194.0" y="365.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">precautions</text><text x="194.0" y="389.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">Birch (2024)</text><line x1="18" y1="356.0" x2="34" y2="356.0" stroke="#000000" stroke-width="1.6"/><line x1="782" y1="99.0" x2="782" y2="356.0" stroke="#000000" stroke-width="1.6"/><line x1="782" y1="99.0" x2="620" y2="99.0" stroke="#000000" stroke-width="1.8"/><line x1="613" y1="90.0" x2="613" y2="108.0" stroke="#000000" stroke-width="3"/><rect x="446" y="208" width="320" height="88" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="606.0" y="252.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="456.0" y="222.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">− AGAINST 1</text><text x="606.0" y="246.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Consciousness likely depends on being a</text><text x="606.0" y="261.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">living organism</text><text x="606.0" y="285.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">Seth (2025)</text><line x1="446" y1="252.0" x2="364" y2="252.0" stroke="#000000" stroke-width="1.8"/><line x1="357" y1="243.0" x2="357" y2="261.0" stroke="#000000" stroke-width="3"/><text x="403.0" y="240.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">denies</text><rect x="446" y="312" width="320" height="88" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="606.0" y="356.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="456.0" y="326.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">− AGAINST 2</text><text x="606.0" y="350.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Welfare talk is premature and feeds belief</text><text x="606.0" y="365.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">in seemingly conscious AI</text><text x="606.0" y="389.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">Suleyman (2025): interested source</text><line x1="766" y1="356.0" x2="782" y2="356.0" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="416.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Arrowhead = supports what it points to · flat bar = opposes it (the claim, or the premise it denies) · dashed =</text><text x="400.0" y="431.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">inferred (the book&#x27;s reading or an unstated premise)</text><text x="400.0" y="452.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Contested. Another interested source, Anthropic, cited welfare uncertainty in August 2025; this book was drafted</text><text x="400.0" y="467.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">with Anthropic&#x27;s tools.</text></svg>