<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Who fixes the next step, and who runs it, separate four kinds of system</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="390" fill="#FFFFFF"/><path d="M40.0,70.0 L770.0,70.0" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-gray)"/><text x="400.0" y="44.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Who fixes the next step?</text><rect x="30" y="100" width="172" height="120" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="116.0" y="140.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Chat assistant</text><text x="116.0" y="184.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">you, each turn</text><text x="116.0" y="244.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">you run each step</text><rect x="220" y="100" width="172" height="120" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="306.0" y="140.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Prompt chain</text><text x="306.0" y="184.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">you, in advance</text><text x="306.0" y="244.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">you run each step</text><rect x="410" y="100" width="172" height="120" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="496.0" y="140.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Automated workflow</text><text x="496.0" y="184.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">people, in advance</text><text x="496.0" y="244.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">software runs each step</text><polygon points="618.0,100.0 754.0,100.0 772.0,160.0 754.0,220.0 618.0,220.0 600.0,160.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="686.0" y="140.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Agent</text><text x="686.0" y="184.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the model, as it goes</text><text x="686.0" y="244.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">software runs each step</text><rect x="30" y="280" width="740" height="64" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="400.0" y="304.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A separate question: what can it change? Read, write, send, pay (permissions, 14.6). An</text><text x="400.0" y="319.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">approval gate limits that; it does not change the kind of system.</text><text x="400.0" y="362.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Agency (a way of working: AI acts for you later) is not a kind of system; any kind above can be used that way</text><text x="400.0" y="377.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">(Chapter 5).</text></svg>