<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" width="800" height="476" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Your annotations and trace make your judgment visible</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="476" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">One A7 annotated draft and revision trace</text><rect x="20" y="44" width="240" height="42" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="65.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Context card</text><text x="274.0" y="57.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">document · reader · purpose · stakes · own words expected? · target</text><text x="274.0" y="72.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">position, with a reason</text><rect x="20" y="94" width="240" height="42" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="115.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">v0 (before any AI)</text><text x="274.0" y="115.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">your notes or first draft, dated</text><rect x="20" y="144" width="240" height="42" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="165.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Prompts</text><text x="274.0" y="165.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">parts labeled · tool · date · at least one iteration</text><rect x="20" y="194" width="240" height="42" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="215.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Annotation row</text><text x="274.0" y="207.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">sentence · K / R / X · tag (voice, accuracy, audience and tone, commitment,</text><text x="274.0" y="222.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">privacy) · why</text><rect x="20" y="244" width="240" height="42" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="265.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Fact-check row</text><text x="274.0" y="265.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">claim · source opened · verdict on the Chapter 8 scale</text><rect x="20" y="294" width="240" height="42" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="315.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Trace row</text><text x="274.0" y="315.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">v0 → v1 → v2 · who or what proposed it · why kept or changed</text><rect x="20" y="344" width="240" height="42" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="140.0" y="365.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Reflection</text><text x="274.0" y="357.1" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">voice · one rejected change · one thing not to delegate · reader-only</text><text x="274.0" y="372.9" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">route: v1 = the tool&#x27;s comments</text><rect x="20" y="394" width="240" height="42" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="140.0" y="415.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Declaration</text><text x="274.0" y="415.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">five elements, with the disclosure decision inside</text><text x="400.0" y="458.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = what you write · green = written before any AI · dashed = what you tell your readers</text></svg>