<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" width="800" height="456" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Every claim in a narrative points to an artifact</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="456" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Every claim in a narrative points to an artifact</text><rect x="250" y="50" width="300" height="60" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="70.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">One named reader</text><text x="400.0" y="92.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a recruiter at an accounting firm</text><rect x="30" y="150" width="230" height="70" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="145.0" y="173.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Claim 1</text><text x="145.0" y="199.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">I check before I send</text><rect x="30" y="260" width="230" height="56" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="145.0" y="288.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A5 entry</text><path d="M145.0,222.0 L145.0,258.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M400.0,112.0 L145.0,148.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="285" y="150" width="230" height="70" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="173.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Claim 2</text><text x="400.0" y="199.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">I find the hidden assumption</text><rect x="285" y="260" width="230" height="56" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="288.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A9 entry</text><path d="M400.0,222.0 L400.0,258.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M400.0,112.0 L400.0,148.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="540" y="150" width="230" height="70" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="655.0" y="173.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Claim 3</text><text x="655.0" y="199.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">I design a review step</text><rect x="540" y="260" width="230" height="56" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="655.0" y="288.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A11 and A12 entries</text><path d="M655.0,222.0 L655.0,258.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M400.0,112.0 L655.0,148.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="250" y="356" width="300" height="56" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="375.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What I am learning next</text><text x="400.0" y="395.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the CPA path</text><text x="400.0" y="440.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Lucía&#x27;s narrative (constructed). Rounded = her own words · rectangle = a claim or its evidence</text></svg>