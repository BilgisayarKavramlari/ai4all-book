<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>One-sided examples pull the outputs toward one label</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="450" fill="#FFFFFF"/><text x="196.0" y="30.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Balanced in-context examples</text><rect x="24" y="52" width="344" height="56" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="196.0" y="80.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;Loved the workshop&quot; → positive</text><rect x="24" y="122" width="344" height="56" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="196.0" y="150.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;Too long, hard to follow&quot; → negative</text><rect x="24" y="192" width="344" height="56" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="196.0" y="220.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;Useful, but the room was cold&quot; → mixed</text><path d="M196.0,262.0 L196.0,290.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="32" y="294" width="328" height="82" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="196.0" y="313.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">New answers coded across all three</text><text x="196.0" y="330.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">labels</text><text x="196.0" y="343.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">(illustrative pattern, not a measured</text><text x="196.0" y="359.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">result)</text><text x="588.0" y="30.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">One-sided in-context examples</text><rect x="416" y="52" width="344" height="56" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="588.0" y="80.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;Loved the workshop&quot; → positive</text><rect x="416" y="122" width="344" height="56" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="588.0" y="150.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;Great speakers&quot; → positive</text><rect x="416" y="192" width="344" height="56" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="588.0" y="220.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;Really helpful&quot; → positive</text><path d="M588.0,262.0 L588.0,290.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="424" y="294" width="328" height="82" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="588.0" y="313.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">New answers pulled toward &quot;positive&quot;,</text><text x="588.0" y="330.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">even mixed ones</text><text x="588.0" y="343.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">(illustrative pattern, not a measured</text><text x="588.0" y="359.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">result)</text><text x="400.0" y="396.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Coding open-ended survey answers. Balance and order of examples changed outputs in published tests (Zhao et al.,</text><text x="400.0" y="411.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">2021; Lu et al., 2022).</text><text x="400.0" y="434.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Thick border (orange in color, hatched in print) = the pattern to avoid · shaded = the pattern to aim for</text></svg>