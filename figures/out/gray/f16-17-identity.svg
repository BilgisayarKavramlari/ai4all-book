<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>With the same flag meaning, different base rates force different error rates</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="372" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Same flag meaning, different base rates</text><rect x="60" y="50" width="300" height="52" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="210.0" y="67.7" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Group A</text><text x="210.0" y="86.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">base rate 50%</text><rect x="60" y="116" width="300" height="40" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="210.0" y="136.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">flag means: 65.4% needed help</text><rect x="60" y="170" width="300" height="40" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="210.0" y="190.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">missed: 15.0%</text><rect x="60" y="224" width="300" height="40" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="210.0" y="244.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">wrongly flagged: 45.0%</text><rect x="440" y="50" width="300" height="52" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="590.0" y="67.7" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Group B</text><text x="590.0" y="86.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">base rate 30%</text><rect x="440" y="116" width="300" height="40" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="590.0" y="136.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">flag means: 66.0% needed help</text><rect x="440" y="170" width="300" height="40" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="590.0" y="190.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">missed: 45.0%</text><rect x="440" y="224" width="300" height="40" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="590.0" y="244.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">wrongly flagged: 12.1%</text><text x="400.0" y="296.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">wrongly flagged = base rate ÷ (1 − base rate) × (1 − precision) ÷ precision × (1 − miss rate)</text><text x="400.0" y="318.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">With precision held equal, a group with a higher base rate must have more wrong flags, more misses, or both (unless</text><text x="400.0" y="333.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">no one is flagged wrongly).</text><text x="400.0" y="348.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">This book&#x27;s calculation (one threshold, 0.5): data/ch16_tradeoff.csv; identity from Chouldechova (2017). Thick</text><text x="400.0" y="363.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">border = the larger error in that row.</text></svg>