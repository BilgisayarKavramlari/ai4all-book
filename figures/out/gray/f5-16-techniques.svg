<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A technique changes how the model is asked; your criteria still judge the result</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="360" fill="#FFFFFF"/><rect x="20" y="30" width="230" height="80" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="135.0" y="57.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Step-by-step prompting</text><text x="135.0" y="86.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">ask for intermediate steps</text><path d="M254.0,70.0 L300.0,170.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="20" y="130" width="230" height="80" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="135.0" y="157.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Ask what it needs</text><text x="135.0" y="178.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">list missing information</text><text x="135.0" y="193.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">first</text><path d="M254.0,170.0 L300.0,170.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="20" y="230" width="230" height="80" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="135.0" y="257.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Split into steps</text><text x="135.0" y="286.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a prompt chain (Chapter 6)</text><path d="M254.0,270.0 L300.0,170.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="322.0,128.0 436.0,128.0 454.0,170.0 436.0,212.0 322.0,212.0 304.0,170.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="379.0" y="170.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The AI tool</text><path d="M458.0,170.0 L488.0,170.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="492" y="136" width="110" height="68" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="547.0" y="170.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Output</text><path d="M606.0,170.0 L626.0,170.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="710.0,100.0 790.0,170.0 710.0,240.0 630.0,170.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="710.0" y="161.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Meets your</text><text x="710.0" y="178.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">criteria?</text><text x="400.0" y="336.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">A technique changes how the model is asked; only your criteria say whether the result is good.</text></svg>