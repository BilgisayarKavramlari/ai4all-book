<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Four ways to answer a risk: avoid it, reduce it, detect it, or accept it, each with a named owner</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="350" fill="#FFFFFF"/><rect x="20" y="90" width="138" height="170" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="89.0" y="147.8" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Avoid</text><text x="89.0" y="193.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">do not send it,</text><text x="89.0" y="209.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">connect it or use</text><text x="89.0" y="224.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the feature</text><path d="M160.0,175.0 L168.0,175.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="170" y="90" width="138" height="170" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="239.0" y="147.8" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Reduce</text><text x="239.0" y="169.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">minimize, use</text><text x="239.0" y="185.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">placeholders or</text><text x="239.0" y="201.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">an institutional</text><text x="239.0" y="216.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">tool, narrow</text><text x="239.0" y="232.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">access, add a</text><text x="239.0" y="248.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">gate</text><path d="M310.0,175.0 L318.0,175.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="320" y="90" width="138" height="170" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="389.0" y="147.8" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Detect</text><text x="389.0" y="193.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">logs, reviews, a</text><text x="389.0" y="209.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">planted fake</text><text x="389.0" y="224.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">value</text><path d="M460.0,175.0 L468.0,175.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="470" y="90" width="138" height="170" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="539.0" y="147.8" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Accept</text><text x="539.0" y="193.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the risk that</text><text x="539.0" y="209.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">remains, in</text><text x="539.0" y="224.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">writing</text><rect x="630" y="110" width="150" height="130" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="705.0" y="154.2" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Risk owner</text><text x="705.0" y="193.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">a named person for</text><text x="705.0" y="208.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">every row</text><path d="M620.0,175.0 L628.0,175.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="300.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Every mitigation moves a risk on the heat map; then rate it again.</text><text x="400.0" y="330.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = a person · the four kinds are the only words this book uses for mitigation</text></svg>