<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" width="800" height="366" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A profession&#x27;s code and your code do different jobs</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="366" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A profession&#x27;s code and your code do different jobs</text><rect x="200" y="46" width="290" height="50" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="345.0" y="62.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A profession&#x27;s code (e.g., ACM,</text><text x="345.0" y="79.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2018)</text><rect x="500" y="46" width="280" height="50" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="640.0" y="71.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Your personal code</text><text x="186.0" y="122.0" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#000000" style="">Who writes it</text><text x="345.0" y="122.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a professional body, with members&#x27; input</text><text x="640.0" y="122.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">you</text><line x1="20" y1="148" x2="780" y2="148" stroke="#444444" stroke-width="0.6"/><text x="186.0" y="174.0" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#000000" style="">Whom it binds</text><text x="345.0" y="174.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">its members (for ACM, every ACM member)</text><text x="640.0" y="174.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">you, inside the rules that bind you</text><line x1="20" y1="200" x2="780" y2="200" stroke="#444444" stroke-width="0.6"/><text x="186.0" y="226.0" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#000000" style="">Who enforces it</text><text x="345.0" y="226.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the body (ACM&#x27;s Enforcement Policy)</text><text x="640.0" y="226.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">you: your marks and your review</text><line x1="20" y1="252" x2="780" y2="252" stroke="#444444" stroke-width="0.6"/><text x="186.0" y="278.0" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#000000" style="">How it is updated</text><text x="345.0" y="278.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">rarely, by the body (1992 → 2018)</text><text x="640.0" y="278.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">at your review date, or on a trigger</text><line x1="20" y1="304" x2="780" y2="304" stroke="#444444" stroke-width="0.6"/><text x="400.0" y="344.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Your code borrows a profession&#x27;s habit of reasons and revision; it cannot borrow its enforcement. Rounded, thick =</text><text x="400.0" y="359.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">yours.</text></svg>