<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A detector score is a guess about a text; process evidence shows how it was made</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="420" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What a detector score can show, and what process evidence shows</text><polygon points="48.0,52.0 352.0,52.0 370.0,85.0 352.0,118.0 48.0,118.0 30.0,85.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="74.4" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A detector score</text><text x="200.0" y="98.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a number about the text</text><rect x="30" y="136" width="340" height="90" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="166.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Rests on how predictable the words are</text><text x="200.0" y="199.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">simple, common wording scores as &quot;AI-like&quot;</text><rect x="30" y="244" width="340" height="90" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="200.0" y="274.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Cannot show who wrote it, or how</text><text x="200.0" y="299.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">false positives fell hardest on non-native</text><text x="200.0" y="314.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">writers in a 2023 test</text><rect x="430" y="52" width="340" height="66" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="74.4" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Process evidence</text><text x="600.0" y="98.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">a record of how you wrote</text><rect x="430" y="136" width="340" height="60" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="166.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Notes and earlier drafts, dated</text><rect x="430" y="206" width="340" height="60" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="236.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Version history and revision trace</text><rect x="430" y="276" width="340" height="60" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="297.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Your declaration, and explaining your</text><text x="600.0" y="314.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">choices</text><text x="400.0" y="372.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagon = a tool&#x27;s output · thick (hatched in print) = its limit · rounded green = records you keep</text><text x="400.0" y="390.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Sources: Liang et al. (2023); Weber-Wulff et al. (2023); OpenAI (2023, classifier withdrawn for low accuracy, as</text><text x="400.0" y="405.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">reported).</text></svg>