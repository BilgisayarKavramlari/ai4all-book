<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Your probe sheet records the preregistered rule, the counts with totals and the row it produces</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="420" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Bias-probe sheet (Lab 15.1 station 3; A12 items 3 and 4c)</text><rect x="20" y="48" width="190" height="40" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="68.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1 Prompt pair</text><rect x="220" y="48" width="560" height="40" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="500.0" y="68.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">station prompt A, B or C; the one cue that changes</text><rect x="20" y="96" width="190" height="40" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="116.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2 Phase</text><rect x="220" y="96" width="560" height="40" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="500.0" y="116.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">where a gap would most likely enter (16.1)</text><rect x="20" y="144" width="190" height="40" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="164.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3 Counting rule</text><rect x="220" y="144" width="560" height="40" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="500.0" y="164.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the station&#x27;s preregistered rule (exact words count)</text><rect x="20" y="192" width="190" height="40" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="212.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4 Your counts</text><rect x="220" y="192" width="560" height="40" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="500.0" y="204.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">version 1: _ of 3 · version 2: _ of 3 (C: of 2; printed: of 3) · tool,</text><text x="500.0" y="219.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">date, model</text><rect x="20" y="240" width="190" height="40" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="260.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">5 Subtotal, pooled</text><rect x="220" y="240" width="560" height="40" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="500.0" y="260.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">table line on the class sheet; pooled _ of _ vs. _ of _ (printed apart)</text><rect x="20" y="288" width="190" height="40" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="308.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">6 Lead or finding</text><rect x="220" y="288" width="560" height="40" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="500.0" y="308.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">counts differ by at least the threshold for that many runs (16.4)?</text><rect x="20" y="336" width="190" height="40" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="356.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">7 Fairness row</text><rect x="220" y="336" width="560" height="40" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="500.0" y="348.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">worse error · harm kind · phase · likelihood · impact · marker · fix ·</text><text x="500.0" y="363.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">owner</text><text x="400.0" y="392.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Marker solid only if the two-part rule passes on the same tool and kind of task as your workflow; otherwise dashed</text><text x="400.0" y="407.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">(inferred)</text></svg>