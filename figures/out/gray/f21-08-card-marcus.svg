<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Marcus&#x27;s patient line is stricter than any rule he is under</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="620" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Marcus&#x27;s patient line is stricter than any rule he is under</text><rect x="20" y="42" width="760" height="488" rx="6" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="40" y="56" width="720" height="52" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="73.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Scope: Marcus, nursing student, clinical placement and night shifts · constructed</text><text x="400.0" y="90.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">example</text><rect x="40" y="122" width="720" height="234" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="239.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="56.0" y="139.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Commitments (5–7, including the four required lines)</text><line x1="52" y1="156" x2="748" y2="156" stroke="#444444" stroke-width="0.8"/><text x="62.0" y="176.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">1.</text><text x="84.0" y="176.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Before I paste or upload anything into an AI tool, I check it holds no information about a patient, even unnamed.</text><line x1="52" y1="196" x2="748" y2="196" stroke="#444444" stroke-width="0.8"/><text x="62.0" y="216.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">2.</text><text x="84.0" y="216.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">When I build study material with AI, I use only my textbook and my own notes, and mark the file &quot;own sources&quot;.</text><line x1="52" y1="236" x2="748" y2="236" stroke="#444444" stroke-width="0.8"/><text x="62.0" y="256.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">3.</text><text x="84.0" y="256.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">When I catch myself typing &quot;just tell me&quot; in a study session, I stop and note it in my study log.</text><line x1="52" y1="276" x2="748" y2="276" stroke="#444444" stroke-width="0.8"/><text x="62.0" y="296.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">4.</text><text x="84.0" y="296.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Before I rely on a drug fact from an AI tool, I check it in my course&#x27;s drug reference and note the page.</text><line x1="52" y1="316" x2="748" y2="316" stroke="#444444" stroke-width="0.8"/><text x="62.0" y="336.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">5.</text><text x="84.0" y="336.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">When I submit coursework, my declaration lists every AI use, checked against my session history.</text><rect x="40" y="370" width="720" height="62" rx="3" fill="#3A3A3A" stroke="#000000" stroke-width="3"/><text x="400.0" y="393.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Boundaries: the course&#x27;s zones (§1.5), the university&#x27;s data rules, my placement site&#x27;s</text><text x="400.0" y="408.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">rules; where one is stricter, it wins; when unclear, I ask my clinical instructor.</text><rect x="40" y="446" width="400" height="84" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="240.0" y="488.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><line x1="40" y1="446" x2="440" y2="446" stroke="#000000" stroke-width="5"/><rect x="52" y="458" width="34" height="30" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><line x1="52" y1="466" x2="86" y2="466" stroke="#000000" stroke-width="3"/><text x="100.0" y="472.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Review</text><text x="240.0" y="496.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">by the start of my next placement · triggers: a new</text><text x="240.0" y="511.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">site&#x27;s rules, a new tool, a mistake I make</text><rect x="456" y="446" width="304" height="84" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="608.0" y="472.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Dated note: the university provides</text><text x="608.0" y="488.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Microsoft Copilot Chat to all students</text><text x="608.0" y="503.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">(as of October 2026)</text><text x="400.0" y="558.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Constructed example; reasons are on Marcus&#x27;s full page. Line 1 is stricter than any rule he is under.</text><text x="400.0" y="582.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = your choice · thick border = the rules around your code · calendar = a date you set · dark fill or &quot;this</text><text x="400.0" y="597.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">section&quot; = the part discussed</text></svg>