ight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Connectors</text><text x="425.0" y="103.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">other apps it reads</text><text x="425.0" y="118.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">or sends to</text><polygon points="348.0,185.0 502.0,185.0 520.0,230.0 502.0,275.0 348.0,275.0 330.0,230.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="425.0" y="215.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">AI tool</text><text x="425.0" y="240.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the model, at the</text><text x="425.0" y="255.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">provider</text><rect x="330" y="330" width="140" height="86" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="359.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Storage</text><text x="400.0" y="382.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">history, memory,</text><text x="400.0" y="398.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">logs, backups</text><rect x="488" y="330" width="150" height="86" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="563.0" y="359.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Seen by</text><text x="563.0" y="382.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">reviewers, admins,</text><text x="563.0" y="398.