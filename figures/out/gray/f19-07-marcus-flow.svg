ight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Placement data never enters, even de-identified: his placement rule says no, above the table&#x27;s floor.</text><text x="400.0" y="488.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = people · hexagon = AI · rectangle = a place data goes · shaded box = depends on the terms · shaded band =</text><text x="400.0" y="503.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">trust boundary · thick = the risk</text></svg>