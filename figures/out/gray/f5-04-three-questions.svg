<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Three questions point to different rungs; they are weighed, not computed</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="450" fill="#FFFFFF"/><polygon points="189.0,26.0 354.0,85.0 189.0,144.0 24.0,85.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="189.0" y="76.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Can you check the result</text><text x="189.0" y="93.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">before it takes effect?</text><path d="M358.0,85.0 L390.0,85.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="394" y="40" width="382" height="90" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="585.0" y="85.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="585.0" y="77.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Yes: automation can fit. Not yet: add a check first,</text><text x="585.0" y="92.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">or keep the part with you (no AI or augmentation).</text><polygon points="189.0,158.0 354.0,217.0 189.0,276.0 24.0,217.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="189.0" y="208.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What would an error cost,</text><text x="189.0" y="225.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">and who would bear it?</text><path d="M358.0,217.0 L390.0,217.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="394" y="172" width="382" height="90" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="585.0" y="217.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="585.0" y="201.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Low, and only you: any rung can fit. High, or borne</text><text x="585.0" y="217.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">by others: no agency without a human check before the</text><text x="585.0" y="232.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">output reaches them (Chapter 14).</text><polygon points="189.0,290.0 354.0,349.0 189.0,408.0 24.0,349.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="189.0" y="340.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Is this skill yours to</text><text x="189.0" y="357.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">build?</text><path d="M358.0,349.0 L390.0,349.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="394" y="304" width="382" height="90" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="585.0" y="349.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="585.0" y="341.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Yes: no AI, or augmentation used as a tutor (Chapter</text><text x="585.0" y="356.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">7). No: let the other two questions decide.</text><text x="400.0" y="432.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Weigh all three together. They are questions to think with, not a formula.</text></svg>