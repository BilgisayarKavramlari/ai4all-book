<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Two labeled excerpts with the task last replace a 120-page catalog</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="530" fill="#FFFFFF"/><text x="200.0" y="28.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Before: everything pasted</text><text x="600.0" y="28.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">After: selected, labeled, task last</text><line x1="400" y1="46" x2="400" y2="470" stroke="#444444" stroke-width="1.4" stroke-dasharray="6 4"/><rect x="30" y="56" width="340" height="54" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="74.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Draft a parts order for the club</text><text x="200.0" y="93.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">task first, with no criteria</text><rect x="30" y="128" width="340" height="190" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="200.0" y="192.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Supplier catalog, all 120 pages</text><text x="200.0" y="245.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">motors, wheels, sensors, tools, clothing,</text><text x="200.0" y="261.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">returns policy, 2026 and 2027 price lists</text><text x="200.0" y="276.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">mixed</text><rect x="30" y="336" width="340" height="74" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="200.0" y="361.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Club budget rules, all 8 pages</text><text x="200.0" y="387.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">travel, food, parts, fundraising</text><text x="200.0" y="440.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">The rule that applies is on page 6.</text><text x="200.0" y="462.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Two price lists disagree.</text><rect x="430" y="56" width="340" height="62" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="77.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">TASK IN BRIEF</text><text x="600.0" y="91.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a parts order for the club (details at the</text><text x="600.0" y="107.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">end)</text><rect x="430" y="126" width="340" height="62" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="147.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">INSTRUCTIONS</text><text x="600.0" y="161.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Use only the material below; if a part is</text><text x="600.0" y="177.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">missing, say so</text><rect x="430" y="196" width="340" height="62" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="217.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">CATALOG p. 14 · 2027 price list</text><text x="600.0" y="239.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">drive motors (four models)</text><rect x="430" y="266" width="340" height="62" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="287.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">CATALOG p. 52 · 2027 price list</text><text x="600.0" y="309.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">wheels and hubs</text><rect x="430" y="336" width="340" height="62" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="600.0" y="357.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">BUDGET RULE 3 · Jan 2027</text><text x="600.0" y="379.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">parts orders over $250 need two officers</text><rect x="430" y="406" width="340" height="62" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="600.0" y="427.1" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">TASK (full, last)</text><text x="600.0" y="441.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Draft an order for two motors and four</text><text x="600.0" y="457.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">wheels; list total and who must approve</text><text x="400.0" y="486.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Thick border (orange in color, hatched in print) = material the task does not need · shaded = labeled excerpts with</text><text x="400.0" y="501.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">source and date · rounded = your task</text><text x="400.0" y="516.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Constructed example: catalog, prices and rules are invented for teaching.</text></svg>