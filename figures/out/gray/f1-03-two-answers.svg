<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 465" width="800" height="465" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>The same question can produce different answers that sound equally sure</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="465" fill="#FFFFFF"/><text x="400.0" y="28.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Prompt: &quot;What are three good study strategies for a chemistry exam?&quot;</text><rect x="20" y="50" width="370" height="34" rx="3" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="205.0" y="67.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Answer A · Claude Haiku 5.5 · Oct 17, 2026</text><rect x="20" y="84" width="370" height="345" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text x="34.0" y="104.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Practice problems by hand instead of just</text><text x="34.0" y="120.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">rereading notes. Chemistry is mostly applied</text><text x="34.0" y="137.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">skill, so work through stoichiometry, equilibrium,</text><text x="34.0" y="153.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">and gas law problems without looking at the</text><text x="34.0" y="170.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">solutions first. Then check your answers and redo</text><text x="34.0" y="186.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">the ones you missed.</text><text x="34.0" y="211.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Make a one-page sheet of key equations, units, and</text><text x="34.0" y="227.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">constants, and review it often. Also explain each</text><text x="34.0" y="244.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">reaction type or periodic trend in your own words.</text><text x="34.0" y="260.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Where you can&#x27;t, you&#x27;ve found a gap to study.</text><text x="34.0" y="285.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Do past exams or old quizzes under timed</text><text x="34.0" y="301.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">conditions, showing every step and unit. This</text><text x="34.0" y="318.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">builds speed and gets you used to exam pressure.</text><text x="34.0" y="334.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Afterward, label each mistake as a concept error</text><text x="34.0" y="351.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">or a calculation slip, since they need different</text><text x="34.0" y="367.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">fixes.</text><rect x="410" y="50" width="370" height="34" rx="3" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="595.0" y="67.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Answer B · Claude Sonnet 5.5 · Oct 17, 2026</text><rect x="410" y="84" width="370" height="345" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text x="424.0" y="104.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">1. Practice with problems, not just rereading.</text><text x="424.0" y="120.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Work through past exams, textbook problems, and</text><text x="424.0" y="137.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">problem sets without looking at the solution</text><text x="424.0" y="153.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">first, then check where you went wrong. Chemistry</text><text x="424.0" y="170.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">is a skill, so stoichiometry, equilibrium, and</text><text x="424.0" y="186.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">mechanisms only stick when you do them yourself.</text><text x="424.0" y="211.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">2. Use active recall and spaced repetition. Make</text><text x="424.0" y="227.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">flashcards for reactions, definitions, periodic</text><text x="424.0" y="244.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">trends, and formulas. Quiz yourself from memory,</text><text x="424.0" y="260.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">and review a little each day instead of cramming</text><text x="424.0" y="277.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">the night before.</text><text x="424.0" y="301.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">3. Understand the concepts behind the formulas. Be</text><text x="424.0" y="318.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">able to explain why something happens, such as why</text><text x="424.0" y="334.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">bond polarity affects solubility. Study with a</text><text x="424.0" y="351.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">friend and teach topics to each other. If you can</text><text x="424.0" y="367.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">explain it simply, you know it. Also write out a</text><text x="424.0" y="384.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">one-page summary of key equations and concepts</text><text x="424.0" y="400.5" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">from memory.</text><text x="400.0" y="448.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Same prompt, two models, same day: overlapping advice, different emphasis and form. Neither states how sure it is.</text></svg>