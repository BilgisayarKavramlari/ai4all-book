<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A face match treated as proof became a wrongful arrest</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="420" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">From failure to harm</text><polygon points="36.0,120.0 172.0,120.0 190.0,166.0 172.0,212.0 36.0,212.0 18.0,166.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="104.0" y="142.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1. The output is</text><text x="104.0" y="159.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">wrong</text><text x="104.0" y="184.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a branch of the tree</text><path d="M192.0,166.0 L212.0,166.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="104.0" y="66.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">False match (documented);</text><text x="104.0" y="81.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">bias inferred</text><polygon points="307.0,106.0 400.0,166.0 307.0,226.0 214.0,166.0" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-dasharray="7 5"/><text x="307.0" y="157.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2. Checked</text><text x="307.0" y="174.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">before use?</text><path d="M402.0,166.0 L422.0,166.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="412.0" y="154.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">no</text><text x="307.0" y="66.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Lineup, no independent</text><text x="307.0" y="81.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">evidence (reported)</text><rect x="424" y="120" width="182" height="92" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="515.0" y="142.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3. Someone relies on</text><text x="515.0" y="159.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">it</text><text x="515.0" y="184.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a person or system acts</text><path d="M608.0,166.0 L624.0,166.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="515.0" y="74.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Automation bias (inferred)</text><rect x="626" y="120" width="156" height="92" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="704.0" y="151.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4. Loss or harm</text><text x="704.0" y="176.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">money, safety,</text><text x="704.0" y="192.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">rights, trust</text><text x="704.0" y="66.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Wrongful arrest; charges</text><text x="704.0" y="81.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">dismissed</text><path d="M307.0,228.0 L307.0,286.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="318.0" y="250.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">yes</text><rect x="207" y="288" width="200" height="52" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="307.0" y="305.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Caught: fixed before</text><text x="307.0" y="322.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">harm</text><text x="400.0" y="372.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Link 2 is reported (the lawsuit&#x27;s allegations); dashed = inferred or reported</text><text x="400.0" y="394.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagon = AI output · diamond = a check · rounded = a person · thick border = the link that failed · dashed =</text><text x="40