<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A tutor-mode session is a small experiment on yourself</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="270" fill="#FFFFFF"/><text x="83.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1 · Before</text><rect x="10" y="50" width="146" height="150" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="83.0" y="100.3" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3 keyed check</text><text x="83.0" y="116.8" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">questions; first</text><text x="83.0" y="133.2" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">answers;</text><text x="83.0" y="149.7" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">confidence</text><path d="M157.0,125.0 L167.0,125.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="241.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2 · During</text><polygon points="185.5,50.0 296.5,50.0 314.0,125.0 296.5,200.0 185.5,200.0 168.0,125.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="241.0" y="100.3" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Tutor-mode</text><text x="241.0" y="116.8" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">dialogue on other</text><text x="241.0" y="133.2" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">problems: attempt</text><text x="241.0" y="149.7" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">first</text><path d="M315.0,125.0 L325.0,125.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="399.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3 · Right after</text><rect x="326" y="50" width="146" height="150" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="399.0" y="100.3" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Devices away:</text><text x="399.0" y="116.8" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">rate, answer,</text><text x="399.0" y="133.2" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">score,</text><text x="399.0" y="149.7" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">calibration gap</text><path d="M473.0,125.0 L483.0,125.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="557.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4 · Later</text><rect x="484" y="50" width="146" height="150" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="557.0" y="100.3" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2+ days: same</text><text x="557.0" y="116.8" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">steps, parallel</text><text x="557.0" y="133.2" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">questions if</text><text x="557.0" y="149.7" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">possible</text><path d="M631.0,125.0 L641.0,125.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="715.0" y="30.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">5 · Reflect</text><rect x="642" y="50" width="146" height="150" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="715.0" y="108.5" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Gaps; one S turn,</text><text x="715.0" y="125.0" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">one C turn; one</text><text x="715.0" y="141.5" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">change</text><text x="400.0" y="232.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Thick border = closed-book checks (no tool, no notes). Hexagon = the AI tool; rounded = you.</text><text x="400.0" y="256.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Your scores are evidence for your reflection, not your grade.</text></svg>