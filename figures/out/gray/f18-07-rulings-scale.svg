<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" width="800" height="316" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>U.S. courts answered differently on training because the facts differed</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="316" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Where U.S. rulings on AI training landed (as of October 2026)</text><path d="M60.0,200.0 L742.0,200.0" fill="none" stroke="#000000" stroke-width="2.4" marker-end="url(#arrow-gray)"/><path d="M742.0,200.0 L60.0,200.0" fill="none" stroke="#000000" stroke-width="2.4" marker-end="url(#arrow-gray)"/><text x="70.0" y="228.0" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">Not fair use</text><text x="732.0" y="228.0" font-size="15" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#000000" style="">Fair use</text><rect x="60" y="44" width="160" height="124" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="3"/><text x="140.0" y="77.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Ross (appeals,</text><text x="140.0" y="94.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">2026)</text><text x="140.0" y="114.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">non-generative tool</text><text x="140.0" y="130.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">competing with</text><text x="140.0" y="146.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Westlaw</text><rect x="240" y="44" width="160" height="124" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="320.0" y="77.6" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Bartz: pirated</text><text x="320.0" y="94.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">library</text><text x="320.0" y="122.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">millions of pirated</text><text x="320.0" y="138.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">books kept (2025)</text><rect x="430" y="44" width="160" height="124" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="510.0" y="86.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Kadrey (2025)</text><text x="510.0" y="114.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">fair use on this</text><text x="510.0" y="130.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">record; wrong</text><text x="510.0" y="146.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">arguments made</text><rect x="600" y="44" width="160" height="124" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="680.0" y="86.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Bartz: training</text><text x="680.0" y="114.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">training on books;</text><text x="680.0" y="130.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">scanning bought</text><text x="680.0" y="146.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">books</text><line x1="140" y1="170" x2="140" y2="192" stroke="#000000" stroke-width="1.6"/><line x1="320" y1="170" x2="320" y2="192" stroke="#000000" stroke-width="1.6"/><line x1="510" y1="170" x2="510" y2="192" stroke="#000000" stroke-width="1.6"/><line x1="680" y1="170" x2="680" y2="192" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="260.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Ross: an appeals court (binds courts in the Third Circuit). Bartz and Kadrey: trial courts (bind only their own</text><text x="400.0" y="275.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">cases).</text><text x="400.0" y="296.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = a court&#x27;s decision · thick = appeals court</text></svg>