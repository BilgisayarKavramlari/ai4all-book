<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 336" width="800" height="336" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>In 2023 a research system imitated a voice from a three-second sample</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="336" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">In 2023 a research system imitated a voice from a three-second sample</text><rect x="20.0" y="96" width="139.2" height="132" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="89.6" y="140.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Text to speak</text><text x="89.6" y="180.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">what the new</text><text x="89.6" y="196.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">speech says</text><path d="M160.2,162.0 L174.2,162.0" fill="none" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-gray)"/><rect x="175.2" y="96" width="139.2" height="132" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="3"/><text x="244.8" y="132.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">A short voice</text><text x="244.8" y="149.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">sample</text><text x="244.8" y="172.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">three seconds of</text><text x="244.8" y="188.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">one person, in</text><text x="244.8" y="204.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">the 2023 study</text><path d="M315.4,162.0 L329.4,162.0" fill="none" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-gray)"/><polygon points="347.1,96.0 452.9,96.0 469.6,162.0 452.9,228.0 347.1,228.0 330.4,162.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="132.3" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Predict audio</text><text x="400.0" y="149.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">tokens</text><text x="400.0" y="172.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">one after</text><text x="400.0" y="188.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">another, like</text><text x="400.0" y="204.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">next tokens</text><path d="M470.6,162.0 L484.6,162.0" fill="none" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-gray)"/><rect x="485.59999999999997" y="96" width="139.2" height="132" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="555.2" y="140.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Codec decoder</text><text x="555.2" y="180.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">turns the tokens</text><text x="555.2" y="196.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">into sound</text><path d="M625.8,162.0 L639.8,162.0" fill="none" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-gray)"/><rect x="640.8" y="96" width="139.2" height="132" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="710.4" y="140.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">New speech</text><text x="710.4" y="180.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">in an imitation</text><text x="710.4" y="196.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">of that voice</text><text x="400.0" y="290.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">A 2023 research system (Wang et al., 2023), trained on 60,000 hours of English speech; not a product.</text><text x="400.0" y="318.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = what a person provides · hexagon = AI step</text></svg>