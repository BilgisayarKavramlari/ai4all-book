<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Each transparency document answers a different reader&#x27;s question</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Each transparency document answers a different reader&#x27;s question</text><polygon points="36.0,151.0 150.0,151.0 168.0,221.0 150.0,291.0 36.0,291.0 18.0,221.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="93.0" y="198.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The model</text><text x="93.0" y="233.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">inputs in, output</text><text x="93.0" y="249.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">out; workings not</text><text x="93.0" y="264.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">visible</text><defs><pattern id="partly-dots" patternUnits="userSpaceOnUse" width="9" height="9"><rect width="9" height="9" fill="#FFFFFF"/><circle cx="4.5" cy="4.5" r="1.3" fill="#8A8A8A"/></pattern></defs><rect x="198" y="66" width="352" height="54" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="3"/><text x="374.0" y="84.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1. Notice</text><text x="374.0" y="103.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Was an AI system used in this decision?</text><line x1="170" y1="221.0" x2="194" y2="93.0" stroke="#444444" stroke-width="1.0"/><text x="562.0" y="85.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">a label or notice; an algorithm</text><text x="562.0" y="100.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">register entry</text><rect x="198" y="130" width="352" height="54" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="3"/><text x="374.0" y="148.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2. Documentation</text><text x="374.0" y="167.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Purpose, data, tests and known limits?</text><line x1="170" y1="221.0" x2="194" y2="157.0" stroke="#444444" stroke-width="1.0"/><text x="562.0" y="149.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">model card · datasheet · system</text><text x="562.0" y="164.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">card</text><rect x="198" y="194" width="352" height="54" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="374.0" y="212.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3. Global logic</text><text x="374.0" y="231.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What drives its outputs overall?</text><line x1="170" y1="221.0" x2="194" y2="221.0" stroke="#444444" stroke-width="1.0"/><text x="562.0" y="221.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">documentation may summarize it</text><rect x="198" y="258" width="352" height="54" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="374.0" y="276.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4. Local reasons</text><text x="374.0" y="295.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Why this output for this case?</text><line x1="170" y1="221.0" x2="194" y2="285.0" stroke="#444444" stroke-width="1.0"/><text x="562.0" y="277.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">owed to a person on request in</text><text x="562.0" y="292.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">some laws (17.7)</text><rect x="198" y="322" width="352" height="54" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="374.0" y="340.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">5. What would change it</text><text x="374.0" y="359.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What would give a different result?</text><line x1="170" y1="221.0" x2="194" y2="349.0" stroke="#444444" stroke-width="1.0"/><text x="562.0" y="341.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">one court called it sufficient in</text><text x="562.0" y="356.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">a credit case (17.7)</text><rect x="198" y="386" width="352" height="54" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="374.0" y="404.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">6. Contest</text><text x="374.0" y="423.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Who can review and change it, and how?</text><line x1="170" y1="221.0" x2="194" y2="413.0" stroke="#444444" stroke-width="1.0"/><text x="562.0" y="413.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">a named person and a route</text><text x="400.0" y="464.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Layers, not steps: a decision can need any of them, in any order.</text><text x="400.0" y="480.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagon = AI model · light fill = present · empty box with &quot;missing&quot; = missing · dotted frame with &quot;partly&quot; = partly</text><text x="400.0" y="495.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">present</text><text x="400.0" y="510.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = a person · thick border = this figure&#x27;s focus · dashed border = inferred (the book&#x27;s reading)</text></svg>