<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 616" width="800" height="616" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>For media, the primary source is the original file, or the person through a channel you trust</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="616" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The Verification Funnel</text><text x="400.0" y="46.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">For media: the primary source is the original file, or the person through a channel you trust</text><polygon points="226.0,76.0 410.0,76.0 428.0,98.0 410.0,120.0 226.0,120.0 208.0,98.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="318.0" y="98.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">An AI output</text><path d="M318.0,122.0 L318.0,140.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="646.0" y="86.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Stop when the evidence</text><text x="646.0" y="101.9" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">matches the stakes</text><rect x="48.0" y="142" width="540" height="66" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="318.0" y="164.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Claims</text><text x="318.0" y="188.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">split the output: one statement you might rely on per claim</text><path d="M318.0,209.0 L318.0,227.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="328.0" y="218.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">every claim you rely on</text><rect x="80.0" y="228" width="476" height="66" rx="3" fill="#3A3A3A" stroke="#000000" stroke-width="3"/><text x="318.0" y="250.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">1. Independent check</text><text x="318.0" y="266.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">a source no AI tool produced, with an author or publisher</text><text x="318.0" y="282.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">you can name, or redo the calculation yourself</text><path d="M318.0,295.0 L318.0,313.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="328.0" y="304.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">stakes not yet met</text><path d="M559.0,261.0 L638.0,261.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="654.0" y="253.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="font-style:italic;">earliest version;</text><text x="654.0" y="268.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="font-style:italic;">outside sources</text><rect x="113.0" y="314" width="410" height="66" rx="3" fill="#3A3A3A" stroke="#000000" stroke-width="3"/><text x="318.0" y="336.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">2. Primary source</text><text x="318.0" y="352.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">the original record: the study, dataset, law, court</text><text x="318.0" y="368.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">record or official page</text><path d="M318.0,381.0 L318.0,399.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="328.0" y="390.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">stakes not yet met</text><path d="M526.0,347.0 L638.0,347.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="654.0" y="331.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="font-style:italic;">original file, or the</text><text x="654.0" y="347.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="font-style:italic;">person via a known</text><text x="654.0" y="362.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="font-style:italic;">channel</text><rect x="146.0" y="400" width="344" height="66" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="318.0" y="422.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3. Expert</text><text x="318.0" y="438.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a person with the knowledge and access to</text><text x="318.0" y="454.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">judge it; ask for reasons</text><path d="M493.0,433.0 L638.0,433.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><line x1="640" y1="261.0" x2="640" y2="462" stroke="#000000" stroke-width="2.0"/><path d="M640.0,461.0 L640.0,490.0" fill="none" stroke="#000000" stroke-width="2.0" marker-end="url(#arrow-gray)"/><rect x="430" y="492" width="350" height="74" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="605.0" y="517.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Verdict</text><text x="605.0" y="535.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">supported · partly supported · unsupported ·</text><text x="605.0" y="551.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">contradicted · cannot verify</text><rect x="30" y="492" width="360" height="74" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="210.0" y="517.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Remaining uncertainty</text><text x="210.0" y="543.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">what you could not check, and why</text><path d="M428.0,529.0 L393.0,529.0" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/><text x="400.0" y="586.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagon = AI output · rectangles = checks you run · rounded = a person · dashed = uncertainty · thick dark border =</text><text x="400.0" y="601.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">the stage this figure marks</text></svg>