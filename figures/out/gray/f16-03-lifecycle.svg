<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" width="800" height="476" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Bias can enter at four phases, and each phase needs its own check</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="476" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The Bias Lifecycle: where bias can enter</text><rect x="22" y="66" width="170" height="112" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="107.0" y="104.1" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1. Data</text><text x="107.0" y="128.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Who is in it? How</text><text x="107.0" y="144.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">were labels made?</text><text x="107.0" y="160.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Which proxies?</text><path d="M194.0,122.0 L216.0,122.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="107.0" y="202.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">proxies such as &quot;women&#x27;s&quot;</text><text x="107.0" y="218.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">(Ch. 2) · the label: cost</text><text x="107.0" y="233.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">for need (Ch. 11)</text><polygon points="236.0,66.0 370.0,66.0 388.0,122.0 370.0,178.0 236.0,178.0 218.0,122.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="303.0" y="104.1" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2. Model</text><text x="303.0" y="136.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What was it trained</text><text x="303.0" y="152.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">and tested to do?</text><path d="M390.0,122.0 L412.0,122.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="303.0" y="210.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">one overall score, or</text><text x="303.0" y="225.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">tested group by group?</text><rect x="414" y="66" width="170" height="112" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="499.0" y="104.1" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3. Use</text><text x="499.0" y="136.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Who uses it, for what</text><text x="499.0" y="152.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">decision, on whom?</text><path d="M586.0,122.0 L608.0,122.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="499.0" y="210.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a tool built for one</text><text x="499.0" y="225.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">setting, used in another</text><rect x="610" y="66" width="170" height="112" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="695.0" y="104.1" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4. Feedback</text><text x="695.0" y="136.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Do its decisions</text><text x="695.0" y="152.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">become new data?</text><text x="695.0" y="210.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">people never chosen never</text><text x="695.0" y="225.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">show the tool was wrong</text><path d="M695.0,252.0 Q401.0,282.0 107.0,252.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="286.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">decisions become new data, and the loop starts again</text><rect x="250" y="304" width="300" height="46" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="318.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">People affected: everyone the</text><text x="400.0" y="335.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">decisions reach</text><text x="400.0" y="372.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Chapter 2&#x27;s recruiting tool and Chapter 11&#x27;s health algorithm both let bias in at the data phase</text><text x="400.0" y="396.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Sources of harm named by Suresh &amp; Guttag (2021): historical, representation, measurement (data) · learning,</text><text x="400.0" y="411.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">aggregation, evaluation (model) · deployment (use). Feedback loops: this book&#x27;s fourth phase (Ensign et al., 2018).</text><text x="400.0" y="438.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rectangle = step · hexagon = AI component · rounded = people · thick border (hatched in print) = the phase this</text><text x="400.0" y="453.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">figure marks · dashed = placement inferred</text></svg>