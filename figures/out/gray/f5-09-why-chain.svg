<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 515" width="800" height="515" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Asking why more than once traces a weak output back to the prompt, or to the frame</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="515" fill="#FFFFFF"/><rect x="40" y="26" width="470" height="74" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="275.0" y="51.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Weak output</text><text x="275.0" y="69.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the example budget&#x27;s total is wrong; two numbers were</text><text x="275.0" y="85.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">invented</text><path d="M275.0,102.0 L275.0,118.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="40" y="120" width="470" height="74" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="275.0" y="145.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Why?</text><text x="275.0" y="163.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">no figures were in the prompt, so the output filled in</text><text x="275.0" y="179.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">plausible ones</text><path d="M275.0,196.0 L275.0,212.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="520.0" y="157.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">checked</text><rect x="40" y="214" width="470" height="74" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="275.0" y="239.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Why?</text><text x="275.0" y="257.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the frame card said to use the association&#x27;s figures, but</text><text x="275.0" y="273.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">they were never pasted</text><path d="M275.0,290.0 L275.0,306.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="520.0" y="251.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">checked</text><rect x="40" y="308" width="470" height="74" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="275.0" y="333.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Why?</text><text x="275.0" y="359.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">they were in Lucia&#x27;s notes, not in the prompt</text><path d="M275.0,384.0 L275.0,400.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="520.0" y="345.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">checked</text><rect x="40" y="402" width="470" height="74" rx="16" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="275.0" y="427.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Fix (v2)</text><text x="275.0" y="453.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">add the figures as context; predict: every number matches</text><text x="520.0" y="63.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">observed in 2 runs</text><rect x="604" y="200" width="186" height="110" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="697.0" y="228.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Or is the model just</text><text x="697.0" y="245.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">bad at sums?</text><text x="697.0" y="269.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">assumed, not checked</text><text x="697.0" y="284.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">yet</text><path d="M512.0,100.0 L640.0,196.0" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/><text x="697.0" y="330.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">v2 tests it</text><text x="400.0" y="500.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Solid = a link you checked · dashed = a link you only assumed</text></svg>