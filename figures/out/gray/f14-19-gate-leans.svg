<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A gate that exists can still lean toward the draft</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="280" fill="#FFFFFF"/><polygon points="48.0,90.0 212.0,90.0 230.0,140.0 212.0,190.0 48.0,190.0 30.0,140.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="130.0" y="131.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Draft reply produced by</text><text x="130.0" y="148.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the model</text><path d="M232.0,140.0 L278.0,140.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="280" y="80" width="240" height="120" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5"/><text x="400.0" y="120.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A doctor edits every draft</text><text x="400.0" y="156.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">edited replies resembled the</text><text x="400.0" y="171.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">drafts</text><path d="M522.0,140.0 L568.0,140.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="570" y="100" width="200" height="80" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="670.0" y="131.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Reply that would be</text><text x="670.0" y="148.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">sent</text><text x="400.0" y="228.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">The gate existed; the authors suggest anchoring and automation bias (dashed = inferred: the authors&#x27;</text><text x="400.0" y="243.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">suggestion).</text><text x="400.0" y="262.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Chen et al. (2024): six radiation oncologists, simulated messages, GPT-4 drafts, 2023.</text></svg>