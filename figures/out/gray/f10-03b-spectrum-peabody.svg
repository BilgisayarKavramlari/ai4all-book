<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 554" width="800" height="554" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>The Peabody message sat near the far end for readers who expected the office&#x27;s own words</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="554" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The voice and ownership spectrum</text><text x="400.0" y="46.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Readers expected the office&#x27;s own words (inferred)</text><path d="M40.0,90.0 L760.0,90.0" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-gray)"/><text x="40.0" y="72.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">More of the wording supplied by a tool</text><text x="760.0" y="108.0" font-size="13" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#444444" style="">so more of your judgment is needed to keep the message yours</text><rect x="22" y="166" width="140" height="152" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="92.0" y="242.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="92.0" y="191.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1 · Your words</text><text x="92.0" y="208.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">only</text><text x="92.0" y="252.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">no AI</text><rect x="36" y="298" width="112" height="10" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><rect x="174" y="166" width="140" height="152" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="244.0" y="242.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="244.0" y="200.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2 · AI as reader</text><text x="244.0" y="244.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">comments; you</text><text x="244.0" y="259.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">change it</text><rect x="188" y="298" width="112" height="10" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><rect x="188" y="298" width="9.0" height="10" fill="url(#dots)" stroke="#000000" stroke-width="1"/><rect x="326" y="166" width="140" height="152" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="396.0" y="242.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="396.0" y="200.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3 · AI as editor</text><text x="396.0" y="236.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">grammar,</text><text x="396.0" y="252.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">rewording or</text><text x="396.0" y="267.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">translation</text><rect x="340" y="298" width="112" height="10" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><rect x="340" y="298" width="39.2" height="10" fill="url(#dots)" stroke="#000000" stroke-width="1"/><rect x="478" y="166" width="140" height="152" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="548.0" y="242.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="548.0" y="191.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4 · AI as</text><text x="548.0" y="208.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">co-drafter</text><text x="548.0" y="236.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">drafts from your</text><text x="548.0" y="252.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">points; you</text><text x="548.0" y="267.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">rewrite</text><rect x="492" y="298" width="112" height="10" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><rect x="492" y="298" width="76.2" height="10" fill="url(#dots)" stroke="#000000" stroke-width="1"/><rect x="630" y="166" width="140" height="152" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="700.0" y="242.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style=""></text><text x="700.0" y="200.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">5 · AI as author</text><text x="700.0" y="252.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">sent as is</text><rect x="644" y="298" width="112" height="10" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><rect x="644" y="298" width="106.4" height="10" fill="url(#dots)" stroke="#000000" stroke-width="1"/><line x1="474" y1="154" x2="774" y2="154" stroke="#000000" stroke-width="2.2" stroke-dasharray="6 4"/><line x1="474" y1="154" x2="474" y2="162" stroke="#000000" stroke-width="2.2"/><line x1="774" y1="154" x2="774" y2="162" stroke="#000000" stroke-width="2.2"/><text x="624.0" y="142.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Peabody email (2023): position 4 or 5, inferred</text><text x="400.0" y="338.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Which position fits depends on what these readers expect:</text><rect x="22" y="352" width="372" height="82" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="3"/><text x="208.0" y="379.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Own words expected</text><text x="208.0" y="401.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">apology · message after a loss · personal</text><text x="208.0" y="417.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">statement · reference letter · reflection essay</text><rect x="406" y="352" width="372" height="82" rx="16" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="592.0" y="379.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Accuracy and clarity first</text><text x="592.0" y="401.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">meeting summary · FAQ answer · routine notice ·</text><text x="592.0" y="417.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">status update</text><line x1="400" y1="348" x2="400" y2="438" stroke="#000000" stroke-width="1.6" stroke-dasharray="6 4"/><text x="400.0" y="456.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = your decisions · inner bar and label = how much wording the tool supplies · thick = highlighted · dashed</text><text x="400.0" y="471.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">bracket = an inferred placement</text></svg>