<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>Learning is many small corrections toward less error</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="490" fill="#FFFFFF"/><path d="M529.0,80.0 Q596.5,108.6 620.0,178.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M620.0,282.0 Q596.5,351.4 529.0,380.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M271.0,380.0 Q203.5,351.4 180.0,282.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M180.0,178.0 Q203.5,108.6 271.0,80.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="293.0,24.0 507.0,24.0 525.0,70.0 507.0,116.0 293.0,116.0 275.0,70.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="55.3" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1. Predict</text><text x="400.0" y="88.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The model guesses: &quot;nut&quot;</text><rect x="525.0" y="184.0" width="250" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="650.0" y="215.3" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2. Measure the error</text><text x="650.0" y="240.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The label says &quot;bolt&quot;: wrong,</text><text x="650.0" y="256.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">and by how much</text><rect x="275.0" y="344.0" width="250" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="375.3" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3. Adjust</text><text x="400.0" y="400.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Settings shift slightly toward</text><text x="400.0" y="416.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the right answer</text><rect x="25.0" y="184.0" width="250" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="150.0" y="215.3" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4. Repeat</text><text x="150.0" y="240.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Next example, thousands of</text><text x="150.0" y="256.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">times</text><text x="400.0" y="222.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Each round:</text><text x="400.0" y="246.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a little less error</text><text x="400.0" y="470.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagon = the model&#x27;s output · rectangles = steps of the training procedure</text></svg>