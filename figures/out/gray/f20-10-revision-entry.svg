<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A revision entry keeps the original and records why it changed</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="440" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A revision entry keeps the original and records why it changed</text><rect x="20" y="52" width="190" height="60" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="82.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Before (as submitted)</text><rect x="222" y="52" width="558" height="60" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="501.0" y="82.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Claim 3, &quot;75 to pass&quot;: supported, 75%. No source named.</text><rect x="20" y="124" width="190" height="60" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="154.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">After</text><rect x="222" y="124" width="558" height="60" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="501.0" y="138.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Supported: the exam&#x27;s FAQ page and the state board&#x27;s scoring page. 75</text><text x="501.0" y="154.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">is a scaled score on a 0–99 scale, not a percentage correct. Checked</text><text x="501.0" y="169.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">October 2026.</text><rect x="20" y="196" width="190" height="60" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="226.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What changed</text><rect x="222" y="196" width="558" height="60" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="501.0" y="226.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Corrected (the unit) and strengthened (a named source)</text><rect x="20" y="268" width="190" height="60" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="298.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Why</text><rect x="222" y="268" width="558" height="60" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="501.0" y="298.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Instructor feedback: &quot;Which page says 75?&quot;</text><rect x="20" y="340" width="190" height="60" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="115.0" y="370.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Trail</text><rect x="222" y="340" width="558" height="60" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="501.0" y="362.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Two rows: the FAQ page and the board&#x27;s page, with dates; uncertainty:</text><text x="501.0" y="377.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">rules change</text><text x="400.0" y="422.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Constructed example (Lucía&#x27;s A5, Chapter 8). Rounded = the entry&#x27;s fields · rectangle = what she wrote</text></svg>