<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>A position paper keeps your view in its own labeled box</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="340" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A position paper keeps your view in its own labeled box</text><rect x="20" y="60" width="176" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="108.0" y="94.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1. The question</text><text x="108.0" y="130.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">one sentence</text><rect x="212" y="60" width="176" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="300.0" y="94.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2. The map</text><text x="300.0" y="122.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">claim, reasons,</text><text x="300.0" y="137.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">objections</text><rect x="404" y="60" width="176" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="492.0" y="85.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3. Side A at its</text><text x="492.0" y="102.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">strongest</text><text x="492.0" y="130.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">from a primary source</text><rect x="596" y="60" width="176" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="684.0" y="85.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4. Side B at its</text><text x="684.0" y="102.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">strongest</text><text x="684.0" y="130.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">from a primary source</text><rect x="20" y="180" width="176" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="108.0" y="214.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">5. Hardest objection</text><text x="108.0" y="250.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">and your reply</text><rect x="212" y="180" width="176" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="300.0" y="205.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">6. What would change</text><text x="300.0" y="222.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">it</text><text x="300.0" y="242.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">evidence you would</text><text x="300.0" y="257.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">accept</text><rect x="404" y="180" width="176" height="100" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="492.0" y="205.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">7. AI Use</text><text x="492.0" y="222.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Declaration</text><text x="492.0" y="250.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">five elements</text><rect x="596" y="180" width="184" height="100" rx="3" fill="#3A3A3A" stroke="#000000" stroke-width="1.6"/><text x="688.0" y="214.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">YOUR VIEW (labeled)</text><text x="688.0" y="242.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">&quot;undecided, because...&quot;</text><text x="688.0" y="257.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">counts</text><text x="400.0" y="316.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Parts 3 and 4 never contain your view; the labeled box is the only place it appears.</text></svg>