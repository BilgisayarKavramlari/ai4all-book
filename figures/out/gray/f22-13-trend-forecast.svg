<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>The trend is measured; whether it continues is a forecast</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="460" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The trend is measured; whether it continues is a forecast</text><rect x="20" y="60" width="240" height="110" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="97.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Measured inputs</text><text x="140.0" y="121.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">training compute, electricity</text><text x="140.0" y="137.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">use, inference cost (outside</text><text x="140.0" y="152.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">trackers)</text><polygon points="400.0,60.0 520.0,115.0 400.0,170.0 280.0,115.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="115.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Debated returns</text><rect x="540" y="60" width="240" height="110" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="660.0" y="97.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Forecasts</text><text x="660.0" y="129.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2030 compute, data, power;</text><text x="660.0" y="144.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">what more scale will buy</text><path d="M262.0,115.0 L278.0,115.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M522.0,115.0 L538.0,115.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="20" y="200" width="370" height="120" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="205.0" y="240.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;Still paying off&quot;</text><text x="205.0" y="268.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">benchmark gains continue; answer-time computing</text><text x="205.0" y="284.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">adds a new way to scale (as its proponents</text><text x="205.0" y="299.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">report)</text><rect x="410" y="200" width="370" height="120" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="595.0" y="240.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">&quot;Slowing down&quot;</text><text x="595.0" y="276.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">reports in 2024 of smaller gains from</text><text x="595.0" y="291.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">pretraining; limits of data, chips and power</text><rect x="20" y="346" width="760" height="64" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="370.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What would move each side: outside measurements of the next systems, dated, on tasks not seen in</text><text x="400.0" y="385.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">training</text><text x="400.0" y="432.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = a position held by people · light fill = forecast · Chapter 23 treats debates about general AI and</text><text x="400.0" y="447.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">long-term risk</text></svg>