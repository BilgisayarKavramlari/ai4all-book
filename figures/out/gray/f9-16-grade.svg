<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 414" width="800" height="414" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Certainty in a body of evidence starts from study design and moves up or down</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="414" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Rating certainty in a body of evidence (GRADE, simplified)</text><rect x="20" y="60" width="220" height="74" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="130.0" y="85.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Randomized trials</text><text x="130.0" y="111.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">start high</text><rect x="20" y="160" width="220" height="74" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="130.0" y="185.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Observational studies</text><text x="130.0" y="211.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">start low</text><path d="M242.0,97.0 L300.0,140.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M242.0,197.0 L300.0,160.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="302" y="110" width="196" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="150.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Certainty rating</text><rect x="530" y="46" width="250" height="104" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="655.0" y="81.4" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Move down</text><text x="655.0" y="102.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">risk of bias, inconsistency,</text><text x="655.0" y="118.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">indirectness, imprecision,</text><text x="655.0" y="134.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">publication bias</text><rect x="530" y="168" width="250" height="70" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="655.0" y="191.8" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Move up</text><text x="655.0" y="209.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">for example, a very large</text><text x="655.0" y="224.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">effect</text><path d="M500.0,136.0 L528.0,100.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M500.0,166.0 L528.0,200.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M400.0,192.0 L400.0,276.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="150" y="278" width="500" height="62" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6"/><text x="400.0" y="309.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">High · Moderate · Low · Very low</text><text x="400.0" y="372.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Thick (hatched in print) = reasons to lower certainty · green = reasons to raise it</text><text x="400.0" y="396.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Simplified from Guyatt et al. (2008).</text></svg>