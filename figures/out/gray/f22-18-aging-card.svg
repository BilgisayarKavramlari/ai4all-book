<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>An aging check asks what a dated claim describes today, and who says so</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="480" fill="#FFFFFF"/><text x="400.0" y="22.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">An aging check asks what a dated claim describes today, and who says so</text><rect x="40" y="52" width="200" height="64" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="84.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1. The old claim</text><text x="500.0" y="84.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">quote it with its as-of date and status</text><path d="M140.0,118.0 L140.0,128.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="40" y="130" width="200" height="64" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="162.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2. Today&#x27;s best source</text><text x="500.0" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">a primary source you opened; never an AI tool&#x27;s answer</text><path d="M140.0,196.0 L140.0,206.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="140.0,204.0 240.0,241.0 140.0,278.0 40.0,241.0" fill="#3A3A3A" stroke="#000000" stroke-width="3"/><text x="140.0" y="233.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">3. Verdict for</text><text x="140.0" y="248.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">today</text><text x="500.0" y="240.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">supported · partly supported · unsupported · contradicted · cannot verify</text><path d="M140.0,274.0 L140.0,284.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="40" y="286" width="200" height="64" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="318.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4. What changed</text><text x="500.0" y="318.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the facts · the evidence status · only the names</text><path d="M140.0,352.0 L140.0,362.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="40" y="364" width="200" height="64" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="140.0" y="396.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">5. Next check</text><text x="500.0" y="396.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the date, or the event, that should trigger it</text><text x="400.0" y="460.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Diamond = your judgment · rounded = a person&#x27;s decision · verdicts on Chapter 8&#x27;s five-point scale</text></svg>