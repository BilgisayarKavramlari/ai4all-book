<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 305" width="800" height="305" role="img" font-family="'Source Sans 3', 'Source Sans Pro', STIXGeneral, sans-serif"><title>The AI Work Loop applied to an upset customer&#x27;s email</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="305" fill="#FFFFFF"/><rect x="10" y="40" width="146" height="56" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="83.0" y="68.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Frame</text><rect x="10" y="108" width="146" height="150" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="83.0" y="159.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Goal: solve and</text><text x="83.0" y="175.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">keep the customer.</text><text x="83.0" y="190.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Refund decision</text><text x="83.0" y="206.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">stays human.</text><path d="M157.0,68.0 L167.0,68.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="168" y="40" width="146" height="56" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="241.0" y="68.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Prompt</text><rect x="168" y="108" width="146" height="150" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="241.0" y="151.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Draft a polite</text><text x="241.0" y="167.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">reply; replacement</text><text x="241.0" y="183.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">by express; refund</text><text x="241.0" y="198.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">if preferred;</text><text x="241.0" y="214.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">under 120 words.</text><path d="M315.0,68.0 L325.0,68.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="326" y="40" width="146" height="56" rx="16" fill="#3A3A3A" stroke="#000000" stroke-width="3"/><text x="399.0" y="68.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" style="">Verify</text><rect x="326" y="108" width="146" height="150" rx="3" fill="url(#hatch)" stroke="#000000" stroke-width="3"/><text x="399.0" y="151.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Caught: an</text><text x="399.0" y="167.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">invented 20%</text><text x="399.0" y="183.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">discount the</text><text x="399.0" y="198.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">policy does not</text><text x="399.0" y="214.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">allow.</text><path d="M473.0,68.0 L483.0,68.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="484" y="40" width="146" height="56" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="557.0" y="68.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Decide</text><rect x="484" y="108" width="146" height="150" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="557.0" y="159.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Delete the</text><text x="557.0" y="175.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">discount, add the</text><text x="557.0" y="190.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">order number, send</text><text x="557.0" y="206.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">under your name.</text><path d="M631.0,68.0 L641.0,68.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="642" y="40" width="146" height="56" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="715.0" y="68.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Disclose</text><rect x="642" y="108" width="146" height="150" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="715.0" y="159.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Company rule:</text><text x="715.0" y="175.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">reviewed AI drafts</text><text x="715.0" y="190.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">need no extra</text><text x="715.0" y="206.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">note.</text><text x="400.0" y="290.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">The Verify step catches what the tool invented.</text></svg>