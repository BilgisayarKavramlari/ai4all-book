<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Six places a hidden choice can change the answer</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="490" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Six places a hidden choice can change the answer</text><polygon points="308.0,196.0 492.0,196.0 510.0,233.0 492.0,270.0 308.0,270.0 290.0,233.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="221.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">An AI-generated analysis</text><text x="400.0" y="247.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">check outside the tool</text><rect x="20" y="56" width="220" height="86" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="130.0" y="85.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1. Rows in, rows out</text><text x="130.0" y="108.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">how many records did it</text><text x="130.0" y="124.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">use?</text><line x1="130" y1="144" x2="330" y2="194" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/><rect x="290" y="56" width="220" height="86" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="85.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2. Blanks and odd values</text><text x="400.0" y="108.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">how were they handled? any</text><text x="400.0" y="124.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">impossible ones?</text><line x1="400" y1="144" x2="400" y2="194" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/><rect x="560" y="56" width="220" height="86" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="670.0" y="85.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3. Definitions and units</text><text x="670.0" y="108.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">net or gross? $ or $000?</text><text x="670.0" y="124.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">dates as dates?</text><line x1="670" y1="144" x2="470" y2="194" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/><rect x="20" y="330" width="220" height="86" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="130.0" y="359.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4. Time window</text><text x="130.0" y="382.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">does the period match the</text><text x="130.0" y="398.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">decision?</text><line x1="130" y1="328" x2="330" y2="272" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/><rect x="290" y="330" width="220" height="86" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="400.0" y="359.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">5. Totals vs. groups</text><text x="400.0" y="382.3" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">does the pattern hold</text><text x="400.0" y="398.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">inside each group?</text><line x1="400" y1="328" x2="400" y2="272" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/><rect x="560" y="330" width="220" height="86" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="670.0" y="359.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">6. Formula or code</text><text x="670.0" y="390.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">show it, read it, rerun it</text><line x1="670" y1="328" x2="470" y2="272" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/><text x="400.0" y="448.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Each checked number gets a verdict (Chapter 8&#x27;s scale); the analysis gets a line of remaining uncertainty.</text><text x="400.0" y="474.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagon = AI output · thick dark border = the check an example uses</text></svg>