<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A peer swap test shows what was in your head but not in your prompt</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="430" fill="#FFFFFF"/><rect x="20" y="40" width="170" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="105.0" y="67.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Your final prompt</text><text x="105.0" y="96.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">no explanation added</text><path d="M194.0,80.0 L222.0,80.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="226" y="40" width="170" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="311.0" y="67.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A classmate runs it</text><text x="311.0" y="96.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">fresh, temporary chat</text><path d="M400.0,80.0 L428.0,80.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="450.0,40.0 574.0,40.0 592.0,80.0 574.0,120.0 450.0,120.0 432.0,80.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="512.0" y="80.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Output</text><path d="M596.0,80.0 L624.0,80.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="628" y="40" width="152" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="704.0" y="72.1" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Scored against your</text><text x="704.0" y="87.9" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">criteria</text><path d="M704.0,124.0 L704.0,160.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="704.0,164.0 794.0,219.0 704.0,274.0 614.0,219.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="704.0" y="219.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A gap?</text><path d="M614.0,219.0 L474.0,219.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="544.0" y="209.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">yes</text><rect x="184" y="184" width="286" height="76" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="327.0" y="213.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Write what was in your head into</text><text x="327.0" y="230.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the prompt; rerun</text><path d="M704.0,278.0 L704.0,310.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="716.0" y="294.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444444" style="font-style:italic;">no</text><rect x="520" y="314" width="260" height="70" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="650.0" y="340.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Evidence the prompt carries</text><text x="650.0" y="357.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">its own context</text><text x="400.0" y="414.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = a person · hexagon = AI · diamond = decision</text></svg>