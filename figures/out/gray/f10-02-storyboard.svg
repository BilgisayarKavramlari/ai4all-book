</text><text x="708.0" y="152.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">roles (reported)</text><line x1="708" y1="180" x2="708" y2="200" stroke="#000000" stroke-width="1.4"/><circle cx="708" cy="200" r="5" fill="#000000"/><text x="400.0" y="388.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Yellow = the AI-drafted message · rounded = people&#x27;s actions · thick (hatched in print) = the tragedy · confirmed =</text><text x="400.0" y="403.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">the email&#x27;s line and the dean&#x27;s statement · reported = news reports</text><text x="400.0" y="432.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Sources: Perrotta (2023); Benbow (2023); Lele (2023); Lele &amp; Faquih (2023); Korn (2023); NPR (2023). What readers</text><text x="400.0" y="447.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">expected, and how much the office changed the output, are inferred.</text></svg>