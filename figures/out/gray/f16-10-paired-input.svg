<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A paired-input test changes one cue and counts many runs</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="340" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">A paired-input test</text><rect x="20" y="60" width="150" height="70" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="95.0" y="83.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">One input</text><text x="95.0" y="109.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">fixed text</text><rect x="210" y="40" width="150" height="50" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="285.0" y="65.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Version 1</text><rect x="210" y="104" width="150" height="50" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="285.0" y="129.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Version 2</text><text x="285.0" y="172.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">only one cue changed</text><path d="M172.0,88.0 L208.0,66.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M172.0,102.0 L208.0,128.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="400" y="60" width="160" height="74" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="480.0" y="85.2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Counting rule</text><text x="480.0" y="111.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">fixed before any run</text><path d="M362.0,66.0 L398.0,86.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M362.0,128.0 L398.0,110.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="618.0,54.0 762.0,54.0 780.0,97.0 762.0,140.0 618.0,140.0 600.0,97.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="690.0" y="74.7" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Many fresh runs of</text><text x="690.0" y="91.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">each</text><text x="690.0" y="114.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">same tool, memory off</text><path d="M562.0,97.0 L598.0,97.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="600" y="210" width="180" height="70" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="690.0" y="233.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Counts with totals</text><text x="690.0" y="259.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">e.g., 31 of 39</text><path d="M690.0,142.0 L690.0,208.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><polygon points="440.0,196.0 550.0,246.0 440.0,296.0 330.0,246.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="440.0" y="221.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Gap ≥ chance</text><text x="440.0" y="238.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">threshold?</text><text x="440.0" y="266.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">the table in 16.4</text><path d="M598.0,246.0 L552.0,246.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><rect x="30" y="200" width="200" height="40" rx="3" fill="#BDBDBD" stroke="#000000" stroke-width="1.6"/><text x="130.0" y="220.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Yes: a finding</text><rect x="30" y="254" width="200" height="40" rx="3" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="130.0" y="274.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">No: a lead; run more</text><path d="M330.0,238.0 L232.0,222.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><path d="M330.0,256.0 L232.0,272.0" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="400.0" y="326.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = a person&#x27;s decision · hexagon = AI runs · diamond = a check · dashed = inferred (a lead)</text></svg>