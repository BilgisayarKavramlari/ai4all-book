<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>A checker that flags everything catches every fake reference but wastes your time</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="360" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Two reference checkers on the same 20 references (constructed)</text><polygon points="48.0,46.0 372.0,46.0 390.0,72.0 372.0,98.0 48.0,98.0 30.0,72.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="210.0" y="72.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Checker A (flags what it cannot match)</text><text x="210.0" y="120.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Flagged 8 of 20 · fake ones caught: 4 of 5</text><rect x="30" y="140" width="172" height="88" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="116.0" y="169.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Precision</text><text x="116.0" y="193.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4 of 8 flags were</text><text x="116.0" y="209.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">fake = 50%</text><rect x="218" y="140" width="172" height="88" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="304.0" y="169.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Recall</text><text x="304.0" y="193.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">caught 4 of 5 fakes =</text><text x="304.0" y="209.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">80%</text><text x="210.0" y="254.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">Misses one fake reference; half of its flags are</text><text x="210.0" y="269.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">real references</text><polygon points="428.0,46.0 752.0,46.0 770.0,72.0 752.0,98.0 428.0,98.0 410.0,72.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="590.0" y="72.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Checker B (flags everything)</text><text x="590.0" y="120.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Flagged 20 of 20 · fake ones caught: 5 of 5</text><rect x="410" y="140" width="172" height="88" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="496.0" y="169.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Precision</text><text x="496.0" y="193.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">5 of 20 flags were</text><text x="496.0" y="209.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">fake = 25%</text><rect x="598" y="140" width="172" height="88" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="684.0" y="169.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Recall</text><text x="684.0" y="193.7" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">caught 5 of 5 fakes =</text><text x="684.0" y="209.5" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">100%</text><text x="590.0" y="254.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">Catches every fake reference; three of every four</text><text x="590.0" y="269.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="font-style:italic;">flags are real references</text><text x="400.0" y="312.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Precision: of what it flagged, the share really fake · Recall: of what was really fake, the share it flagged</text><text x="400.0" y="327.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">(Chapter 2)</text><text x="400.0" y="344.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Constructed counts for teaching (data/ch08_checkers.csv); 5 of the 20 references are fake.</text></svg>