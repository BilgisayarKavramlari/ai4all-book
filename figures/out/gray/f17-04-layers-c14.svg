<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 542" width="800" height="542" role="img" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif"><title>Parents reached none of the first five layers; the contest route failed in practice</title><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="1.3"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#FFFFFF"/><circle cx="3.5" cy="3.5" r="1.2" fill="#000"/></pattern></defs><rect width="800" height="542" fill="#FFFFFF"/><text x="400.0" y="24.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Parents reached none of the first five layers; the contest route failed in practice</text><text x="400.0" y="40.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">Layers 1–3 and 5: reported (Amnesty, 2021); layer 4: confirmed (AP, 2020); contest: the parliamentary inquiry</text><text x="400.0" y="55.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="font-style:italic;">(2020)</text><polygon points="36.0,173.0 150.0,173.0 168.0,243.0 150.0,313.0 36.0,313.0 18.0,243.0" fill="#EDEDED" stroke="#000000" stroke-width="1.6"/><text x="93.0" y="220.6" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">The model</text><text x="93.0" y="255.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">inputs in, output</text><text x="93.0" y="271.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">out; workings not</text><text x="93.0" y="286.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">visible</text><defs><pattern id="partly-dots" patternUnits="userSpaceOnUse" width="9" height="9"><rect width="9" height="9" fill="#FFFFFF"/><circle cx="4.5" cy="4.5" r="1.3" fill="#8A8A8A"/></pattern></defs><rect x="198" y="88" width="352" height="54" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="374.0" y="106.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">1. Notice — missing</text><text x="374.0" y="125.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Was an AI system used in this decision?</text><line x1="170" y1="243.0" x2="194" y2="115.0" stroke="#444444" stroke-width="1.0"/><text x="562.0" y="107.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">use hidden from the public for</text><text x="562.0" y="122.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">years (reported)</text><rect x="198" y="152" width="352" height="54" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="374.0" y="170.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">2. Documentation — missing</text><text x="374.0" y="189.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Purpose, data, tests and known limits?</text><line x1="170" y1="243.0" x2="194" y2="179.0" stroke="#444444" stroke-width="1.0"/><text x="562.0" y="171.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">no public information on the</text><text x="562.0" y="186.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">model (reported)</text><rect x="198" y="216" width="352" height="54" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="374.0" y="234.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">3. Global logic — missing</text><text x="374.0" y="253.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What drives its outputs overall?</text><line x1="170" y1="243.0" x2="194" y2="243.0" stroke="#444444" stroke-width="1.0"/><text x="562.0" y="235.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">workings not visible to users</text><text x="562.0" y="250.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">(reported)</text><rect x="198" y="280" width="352" height="54" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="374.0" y="298.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">4. Local reasons — missing</text><text x="374.0" y="317.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Why this output for this case?</text><line x1="170" y1="243.0" x2="194" y2="307.0" stroke="#444444" stroke-width="1.0"/><text x="562.0" y="291.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">reviewers could not see which</text><text x="562.0" y="307.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">indicators drove a score</text><text x="562.0" y="322.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">(confirmed: AP)</text><rect x="198" y="344" width="352" height="54" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="374.0" y="362.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">5. What would change it — missing</text><text x="374.0" y="381.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">What would give a different result?</text><line x1="170" y1="243.0" x2="194" y2="371.0" stroke="#444444" stroke-width="1.0"/><text x="562.0" y="363.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">no basis to say what would change</text><text x="562.0" y="378.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">it (reported)</text><rect x="198" y="408" width="352" height="54" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><text x="374.0" y="426.4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">6. Contest — partly</text><text x="374.0" y="445.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Who can review and change it, and how?</text><rect x="202" y="412" width="344" height="46" rx="16" fill="none" stroke="url(#partly-dots)" stroke-width="7"/><line x1="170" y1="243.0" x2="194" y2="435.0" stroke="#444444" stroke-width="1.0"/><text x="562.0" y="419.1" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">objection and appeal existed; the</text><text x="562.0" y="435.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">inquiry faults courts too</text><text x="562.0" y="450.9" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#000000" style="">(confirmed)</text><text x="400.0" y="486.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#000000" style="">Layers, not steps: a decision can need any of them, in any order.</text><text x="400.0" y="502.1" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Hexagon = AI model · light fill = present · empty box with &quot;missing&quot; = missing · dotted frame with &quot;partly&quot; = partly</text><text x="400.0" y="517.9" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">present</text><text x="400.0" y="532.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#444444" style="">Rounded = a person · thick border = this figure&#x27;s focus · dashed border = inferred (the book&#x27;s reading)</text></svg>