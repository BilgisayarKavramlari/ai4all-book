  <g id="text_27">
   <text style="font: 700 12.5px 'Source Sans 3', STIXGeneral, sans-serif; text-anchor: start" x="7.2" y="16.698047" transform="rotate(-0 7.2 16.698047)">On the task outside the frontier, rated quality rose with AI while correct answers fell</text>
  </g>
  <g id="text_28">
   <text style="font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 316.674078)">Source: Dell'Acqua et al. (2023), Harvard Business School Working Paper 24-013, Table 6 col. 1 (recommendation quality, 1–10 scale, two sets of human graders)</text>
   <text style="font: 9.5px 'Source Sans 3', STIXGeneral, sans-serif" transform="translate(7.2 327.312)">and Table 4 col. 1 (correctness); 373 consultants, GPT-4 as of April 2023. Quality rose for right and wrong answers alike (working paper, Figure 8).</text>
  </g>
