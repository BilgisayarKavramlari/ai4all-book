# AI for All: Career-Ready AI Skills — Quarto book project
# Outputs: screen PDF via Typst (color, with cover) -> _book/; print interior for the IngramSpark paperback
# (quarto render --profile print --to typst -> _book-print/, then tools/make-print-pdfx.sh; decision D29);
# EPUB 3 (color); HTML for the open web edition later. One volume, 8.5 x 11 in.
# Values marked "placeholder" change when docs/design-system.md is written.

project:
  type: book
  output-dir: _book

lang: en-US

book:
  title: "AI for All"
  subtitle: "Career-Ready AI Skills"
  author: "Sadi Evren Seker"
  edition: "2027.1"
  chapters:
    - index.qmd
    - front/thanks.qmd
    - front/preface.qmd
    - front/how-to-use-this-book.qmd
    - front/meet-the-students.qmd
    - front/meet-compass.qmd
    - front/visual-guide.qmd
    - front/mapping-to-frameworks.qmd
    - front/how-this-book-was-written.qmd
    - part: "Part I — Understanding AI"
      chapters:
        - chapters/01-why-ai-changes-study-and-work.qmd
        - chapters/02-how-machines-learn-from-data.qmd
        - chapters/03-inside-large-language-models.qmd
        - chapters/04-how-and-why-ai-fails.qmd
    - part: "Part II — Working with AI"
      chapters:
        - chapters/05-framing-tasks-and-iterating-prompts.qmd
        - chapters/06-context-engineering-and-reusable-workflows.qmd
        - chapters/07-learning-with-ai-tutor-not-answer-machine.qmd
        - chapters/08-hallucination-uncertainty-and-verification.qmd
        - chapters/09-sources-evidence-and-reading-with-ai.qmd
        - chapters/10-writing-and-professional-communication-keeping-your-voice.qmd
    - part: "Part III — Deciding and Building with AI"
      chapters:
        - chapters/11-decision-support-data-work-and-hidden-assumptions.qmd
        - chapters/12-the-tool-ecosystem-and-task-tool-fit.qmd
        - chapters/13-multimodal-ai-images-audio-and-video.qmd
        - chapters/14-agentic-workflows-and-human-oversight.qmd
    - part: "Part IV — Using AI Responsibly"
      chapters:
        - chapters/15-privacy-and-security.qmd
        - chapters/16-bias-and-fairness.qmd
        - chapters/17-explainability-and-transparency.qmd
        - chapters/18-intellectual-property-law-and-governance.qmd
    - part: "Part V — AI in Your Field and Your Future"
      chapters:
        - chapters/19-ai-across-disciplines-field-guides.qmd
        - chapters/20-your-ai-portfolio-and-career-narrative.qmd
        - chapters/21-your-personal-ai-code-of-practice.qmd
    - part: "Part VI — Frontiers and Big Questions"
      chapters:
        - chapters/22-the-state-of-the-art-current-developments.qmd
        - chapters/23-philosophical-debates-minds-meaning-and-responsibility.qmd
  appendices:
    - appendix/a-glossary.qmd
    - appendix/b-lab-index.qmd
    - appendix/c-templates.qmd
    - appendix/d-practice-exam.qmd
    - appendix/e-answers.qmd
    - appendix/f-deep-dives.qmd
    - appendix/g-case-index.qmd
    - appendix/references.qmd
    - back/about-the-author.qmd
    - back/colophon.qmd

format:
  html:
    toc: true
    number-sections: true
  typst:
    papersize: us-letter        # placeholder until the trim size is chosen (applied in typst/typst-show.typ)
    mainfont: "Source Serif 4"  # placeholder (font option A)
    fontsize: 10.5pt            # placeholder
    toc: true
    toc-depth: 1
    number-sections: true
    template-partials:
      - typst/typst-show.typ    # cover page, US Letter, palette, copyright block
  epub:
    toc: true
    cover-image: cover/cover-epub-inner.jpg   # 1400 x 2240 (under Ingram's 3.2 MP EPUB image limit)
    number-sections: true
    identifier:
      - scheme: ISBN-13
        text: "979-8-1829-6230-8"
    publisher: "OptiWisdom LLC"
    rights: "Copyright 2027 Sadi Evren Seker. Licensed under CC BY-NC-SA 4.0 (https://creativecommons.org/licenses/by-nc-sa/4.0/)."
    accessModes: [textual, visual]
    accessModeSufficient: [textual]
    accessibilityFeatures: [alternativeText, longDescription, tableOfContents, readingOrder, structuralNavigation, displayTransformability]
    accessibilityHazards: [none]
    accessibilitySummary: "This EPUB is structured with headings and a navigable table of contents. Every figure has alternative text, complex figures have long descriptions, meaning is never carried by color alone, and tables have header rows. The text can be read without the images."
    filters:
      - path: tools/epub-strip-div-alt.lua
        at: post-render
