# Every number and quotation comes from deck.sources; the builder flags any number it cannot find there.
# Independence (D27, docs/production/independence-rules.md): no institution, course code, term, calendar dates,
# enrollment, course-site system or syllabus references on slides or in notes; sessions are named by kind only.
#
# Sessions (keys are internal; labels are what instructors see):
#   tue = Session 1, concept session (about 75 min): opening case Ithaca, concept core 19.1–19.7, the live
#         end-to-end demonstration (the chapter's §19.5 worked example mirrors it), quick checks.
#   thu = Session 2, lab session (about 75 min): Lab 19.1 Discipline Sprint, timed as the chapter and the lab sheet
#         give it: briefing 5 · build and run 30 · peer test 20 · share 10 · exit 10 (the blueprint's older
#         10/25/20/15/5 table is superseded: the chapter wins).
# Even-numbered Review A items are instructor-only and never appear here; quizzes use odd items or Check Yourself.

