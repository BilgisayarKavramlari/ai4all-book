- layout: compare
  minutes: 2
  kicker: "§16.1 · worked example · Maya’s outreach score (constructed; book figure redrawn)"
  title: "Bias could enter Maya’s outreach score at every phase"
  size: 20
  columns:
    - heading: "Data"
      role: risk
      bullets: ["Label “visited the center”: who knew, not who needed help"]
    - heading: "Model"
      role: soft
      bullets: ["Tested only on overall accuracy"]
    - heading: "Use"
      role: soft
      dashed: true
      bullets: ["Emails in English only"]
    - heading: "Feedback"
      role: soft
      dashed: true
      bullets: ["Never emailed, never visit: data say no need"]
  takeaway: "Harm: allocation, a tutoring offer withheld · dashed = inferred"
  notes:
    say: |
      Maya studies psychology. In her research-methods class she read that most participants in published behavioral
      research come from WEIRD societies: Western, educated, industrialized, rich and democratic. She asks the same of
      AI: whose data trained this tool? At the tutoring center where she volunteers, the coordinator considers an outreach
      score that would email first-year students predicted to need tutoring, trained on last year's visit records. Data:
      the label "visited the center" records who knew about it and came, not who needed help: a proxy label. Model:
      tested only on overall accuracy. Use: emails in English only. Feedback: students never emailed never visit, so next
      year's data say they never needed help. The harm: allocation, a tutoring offer withheld.
    background: |
      §16.1 Worked Example "Maya's Outreach Score" (constructed), @fig-16-5 (use and feedback dashed as inferred).
      Henrich et al. (2010) for WEIRD. Chapter 11's health algorithm used cost as a proxy label for need. Faded example
      "A Bank's Offer Chatbot" (Appendix E): model tested only on overall acceptance; use only in the app; feedback,
      decliners see fewer offers; harm allocation.
    activity: "Pairs: do the bank chatbot faded example's three blanks (2 min) if time allows."
    book: "§16.1, @fig-16-5; Faded Example 'A Bank's Offer Chatbot'."

- layout: quiz
  minutes: 1
  answer_minutes: 0.5
  kicker: "Quick check · §16.1 · Review A1"
  title: "the gender field was removed"
  question: "A hiring tool is trained on ten years of a company’s hiring decisions. The gender field was removed. Where could bias still enter first?"
  options:
    - "Probably nowhere yet, since without a gender field the tool cannot easily tell groups apart."
    - "Data: past decisions used as labels, and proxies in resumes, can carry the old pattern."
    - "Mainly at use, when recruiters read the scores, rather than inside the tool itself."
    - "Mainly at feedback, once the tool’s own decisions start to become new training data."
  answer: b
  instruction: "Answer on your own, then vote"
  explanation: "(a) is M1: removing the field is not enough; (c) and (d) name later phases only"
  notes:
    say: |
      Quick check on the lifecycle. A hiring tool is trained on ten years of a company's hiring decisions. The gender
      field was removed. Where on the Bias Lifecycle could bias still enter first? Thirty seconds on your own, then vote.
      Think of Chapter 2's proxies, clues that stand in for something else, and of what a "past hiring decision" records
      when it is used as the label the tool learns to copy. Then use the four phases on the lifecycle slide: data, model,
      use, feedback. Which one comes first in time, before anyone ever runs the tool?
    background: |
      Review Questions A1 (O1 · LO5 · Apply), final-exam practice. Key (b). Appendix E: (a) is M1 (removing the field is
      not enough); (c) and (d) name later phases only.
    activity: "30 s individual, then hands."
    book: "§16.1; Review Questions A1."
  answer_notes:
    say: |
      The answer is (b), data. Past decisions used as labels carry whatever pattern the people who made them followed,
      and resumes hold proxies: a club, a college, a gap in work history. Option (a) is the misconception that removing a
      field removes the bias. Options (c) and (d) name real phases, use and feedback, but later ones; the question asks
      where bias could enter first. The same idea returns in section 16.5: a firm that removes names before an AI screen
      fixes the name cue, but a resume line like "women's chess club, captain" still carries it.
    background: |
      Faded Example "Name-Blind Resumes" (Appendix E): it may miss proxies such as "women's chess club" and women's
      colleges; detect with a paired-input test that changes only the club line or the college, and re-test after any
      change. Review B4 (even) asks the same; its key is private.
    misconceptions:
      - m: "M1 'If nobody intended it, or the group field was removed, the system is fair.'"
        fix: "Refutation check: the lifecycle is a map of where to look, not proof that every system is hopelessly biased."
    activity: "Reveal; one follow-up comment."
    book: "§16.1, §16.5; Appendix E (Review A1; Faded Example 'Name-Blind Resumes')."

# About 60 words on the last reveal: the three levels of the worked example must be compared together (deliberate exception).
- layout: worked
  minutes: 2
  max_words: 62
  kicker: "§16.2 · worked example · Gender Shades, IBM (Table 4)"
  title: "Reading Gender Shades group by group"
  context: "IBM’s classifier was right on 87.9% of faces overall."
  steps:
    - {label: "By gender", text: "Error 20.3% for women vs. 5.6% for men"}
    - {label: "By skin type", text: "22.4% for darker vs. 3.2% for lighter faces"}
    - {label: "Intersection", text: "34.7% for darker-skinned women (about 270 faces) vs. 0.3% for lighter-skinned men"}
  reveal: [2, 3]
  result: "The intersection shows where errors concentrate; report each group’s size"
  notes_reveal:
    - minutes: 1
      say: |
        The same results, level by level, for one service. Overall, IBM's classifier was right on 87.9 percent of faces.
        By one characteristic at a time: error 20.3 percent for women against 5.6 percent for men, and 22.4 percent for
        darker faces against 3.2 percent for lighter faces. Both gaps are large, and each alone would already be worth
        reporting. Before the next step, predict: if you combine the two characteristics, what would the error be for
        darker-skinned women, and for lighter-skinned men? Write a number for each.
      background: |
        §16.2 Worked Example (Buolamwini & Gebru, 2018). Disaggregated evaluation (Barocas et al., 2021).
      activity: "Take two predictions before revealing the intersection."
      book: "§16.2 Worked Example 'Reading Gender Shades Group by Group'."
    - minutes: 1
      say: |
        The intersection: 34.7 percent error for darker-skinned women, about 270 faces, against 0.3 percent for
        lighter-skinned men. Darker-skinned women were 21.3 percent of the faces and 61.0 to 72.4 percent of each
        service's errors. Looking at one characteristic at a time would have shown a problem, but not where it sits. And
        notice "about 270 faces": a rate means more when you know how many people it rests on. That is why the lesson has
        two parts: look at intersections, and report each group's size.
      background: |
        Faded Example "Speech Recognition" (Appendix E): report each group's size (42 and 73 speakers) and each system's
        error rate as well as the average; check race × gender or race × age (Koenecke et al., 2020: average word error
        rate 0.19 for White and 0.35 for Black speakers). Review A4 (even) asks why the audit reported intersections.
      activity: "Ask: 'Which intersection would you check in your own field?'"
      book: "§16.2 Worked Example; Faded Example 'Speech Recognition'."
  notes:
    book: "§16.2 Worked Example 'Reading Gender Shades Group by Group'."

- layout: compare
  minutes: 2
  kicker: "§16.3 · worked example · this book’s calculation (constructed groups)"
  title: "Two designs, and neither meets all three definitions"
  size: 22
  columns:
    - heading: "One threshold (0.5)"
      role: soft
      bullets: ["Missed: A 15.0% · B 45.0%", "Precision: A 65.4% · B 66.0%", "Nearly equal **precision**"]
    - heading: "B’s threshold lowered to 0.3"
      role: soft
      bullets: ["Missed: A 15.0% · B 15.0%", "Precision: A 65.4% · B 46.4%", "Equal **misses**"]
  takeaway: "Equal precision and different base rates: error rates cannot all match"
  notes:
    say: |
      Here is the trade-off as numbers. Two constructed groups of 1,000 students; half of group A and 30 percent of group
      B need tutoring; a score means the same in both. With one threshold, precision is nearly equal, 65.4 and 66.0
      percent, but group B's students are missed 45 percent of the time against A's 15. Lower B's threshold to 0.3 and
      the misses are equal, 15 and 15, but a flag in B now means less: precision 46.4 percent. When more of group A truly
      needs help, a flag there is right more often by default; to keep precision equal, the tool must flag wrongly more
      often in A, miss more often, or both. That is Chouldechova's result for any flag-or-not tool.
    background: |
      Full table (§16.3): selection one threshold A 65% · B 25%; lowered A 65% · B 55%; wrongly flagged one threshold
      A 45.0% · B 12.1%; lowered A 45.0% · B 42.1%. Chouldechova (2017); Kleinberg et al. (2017) for scores. Deep 16.A
      (optional): false-positive rate = (base rate ÷ (1 − base rate)) × ((1 − precision) ÷ precision) × (1 − miss rate);
      for group A, 1 × (0.346 ÷ 0.654) × 0.85 ≈ 0.45. Faded example "A Scholarship Screen", group Y (Appendix E): selection
      20%, miss 30%, false-positive 3.3%, precision 87.5%; meets equal miss rates and equal precision, fails equal
      selection and equal false-positive rates. Lab 16.3 (optional, Deep): the trade-off calculator.
    misconceptions:
      - m: "M4 'There is one correct mathematical definition of fairness.'"
        fix: "Refutation check: must not create 'fairness is arbitrary'; the choice is a reasoned judgment about which error does more harm, made in the open."
    activity: "Pairs: the scholarship screen's group Y (2 min) if time allows."
    book: "§16.3 Worked Example 'Two Groups, Two Designs'; Faded Example 'A Scholarship Screen'; Deep 16.A."

- layout: quiz
  minutes: 1
  answer_minutes: 0.5
  kicker: "Quick check · §16.3 · Review A7"
  title: "equal precision"
  question: "Which description matches equal precision?"
  options:
    - "The same share of each group is flagged by the tool, whatever their needs."
    - "The same share of the people who needed help is missed in each group."
    - "The tool is right about the same share of the time overall in each group."
    - "Of the people flagged, the same share really needed help in each group."
  answer: d
  instruction: "Answer on your own, then vote"
  explanation: "(a) is selection rate, (b) miss rate, (c) overall accuracy"
  notes:
    say: |
      Quick check on the three definitions. Which description matches equal precision? Thirty seconds on your own, then
      vote. Use the three questions: same share flagged, same share missed and wrongly flagged, same meaning of a flag.
      Precision, from Chapter 2, is the share of flagged cases that were really positive. Which option says that? A tip
      for every question of this kind: find the group the share is taken from. Is it everyone, everyone who needed help,
      or everyone who was flagged?
    background: |
      Review Questions A7 (O3 · LO5 · Understand), final-exam practice. Key (d). Appendix E: (a) is selection rate, (b)
      miss rate, (c) overall accuracy.
    activity: "30 s individual, then hands."
    book: "§16.3; Review Questions A7."
  answer_notes:
    say: |
      The answer is (d): of the people flagged, the same share really needed help in each group. That is "does a flag
      mean the same in each group?" Option (a) describes equal selection rates; option (b) describes equal miss rates,
      one half of equal error rates; option (c) describes overall accuracy by group, which none of the three definitions
      uses on its own. If students mixed up (b) and (d), ask: which group of people is the share taken from, everyone
      who needed help, or everyone who was flagged? That one word, the denominator, separates the definitions.
    background: |
      Short answer A6 (even; key private) asks for a miss rate and its Chapter 2 complement (recall).
    activity: "Reveal; one follow-up on denominators."
    book: "§16.3; Appendix E (Review A7)."

- layout: concept
  minutes: 1.5
  kicker: "§16.4 · the paired-input test (book figure, redrawn)"
  title: "A paired-input test changes one cue and counts many runs"
  size: 24
  bullets:
    - "Inputs identical except **one cue** linked to a group"
    - "Wilson & Caliskan (2024): only the name changed, 554 resumes"
    - "Bianchi et al. (2023): 99% of generated developers White; workforce 56%"
  flow:
    - {label: "Two versions, one cue", kind: step}
    - {label: "Rule fixed first", kind: human}
    - {label: "Many fresh runs", kind: ai}
    - {label: "Counts with totals", kind: step}
    - {label: "Gap vs. threshold", kind: human}
  notes:
    say: |
      You usually cannot see a generative tool's data, but you can test its outputs. A paired-input test runs inputs
      that are identical except for one cue linked to a group, a name, a pronoun, a stated first language, many times
      each, counts the outputs by a rule fixed before any run, and compares the counts. Chapter 12's bake-off changed only
      the tool; this changes only the cue. The evidence that such tests matter: Wilson and Caliskan changed only the name
      on 554 resumes ranked by three text-embedding models. Names associated with White Americans were favored in about
      85 percent of 27 statistical tests, and names associated with Black men were disadvantaged in up to 100 percent of
      comparisons. The study tested only those names.
    background: |
      @fig-16-10. Wilson & Caliskan (2024): race and intersectional results only; the gender-only results were later
      corrected (corrected version arXiv v3, August 30, 2026). Text-embedding model = a model that turns texts into
      numbers for comparison. Protected characteristics (race, sex) = characteristics anti-discrimination law says
      decisions such as hiring must not be based on (Chapter 18). Bianchi et al. (2023): for "a photo of the face of a
      software developer," a classifier labeled 99% of 100 generated images as White; 56% of U.S. software developers
      identify as White (@fig-16-11). An agent that ranks people needs the same test (Chapter 14).
    activity: "Ask: 'What stays the same in a paired-input test, and what changes?' (Check Yourself 16.4)."
    book: "§16.4, @fig-16-10, @fig-16-11."

# About 70 words on the last reveal (builder's count): rule, runs, counts and reading must be read together
# (deliberate exception).
- layout: worked
  minutes: 2
  max_words: 70
  kicker: "§16.4 · worked example · Maya tests a name (constructed outputs)"
  title: "Maya tests a name: lead or finding?"
  context: "“Three majors for a first-year student named ___ who loves biology and chemistry”"
  steps:
    - {label: "Rule, fixed first", text: "Count runs where all three are science majors"}
    - {label: "Runs", text: "15 fresh chats each, one tool, memory off"}
    - {label: "Counts", text: "Emily 8 of 15; Maya 5 of 15"}
    - {label: "Reading", text: "Differ by 3; at 15 runs they must differ by 6"}
  reveal: [3, 4]
  result: "A lead: she plans 30 runs each"
  notes_reveal:
    - minutes: 1
      say: |
        Maya tries the method herself. She asks a tool for three majors for a first-year student who loves biology and
        chemistry, with the name Emily or Maya. Before any run she fixes the rule: count runs in which all three
        suggestions are science majors. Fifteen fresh chats per name, one tool, memory off. The counts: Emily 8 of 15,
        Maya 5 of 15. Is that a finding? Use the two-part rule: was the test fair, and is the gap big enough?
      background: |
        §16.4 Worked Example (constructed outputs). Threshold at 15 runs per version: counts must differ by 6 (40
        points).
      activity: "Pairs, 30 s: lead or finding?"
      book: "§16.4 Worked Example 'Maya Tests a Name'."
    - minutes: 1
      say: |
        The test was fair: one cue, a fixed rule, one tool, fresh chats, equal runs, at least ten. But the counts differ
        by 3, and at 15 runs per version they must differ by 6. So it is a lead, not a finding. Maya plans 30 runs each.
        Notice what she does not do: she does not conclude "no bias" either. At 30 runs per version, only gaps of about
        30 points can show; no gap is not proof of no bias. Check Yourself 16.4 asks exactly this.
      background: |
        Check Yourself 16.4 (Appendix E). Review A5 (key b): 6 vs. 4 of 10 is a lead, since the threshold at 10 runs is
        50 points. Faded Example "Three Pronouns" (Appendix E): name one comparison first (her against his), 30 runs per
        version, counts must differ by at least 9; "their" is reported as a lead. Several comparisons raise the chance of
        a false finding, so name one in advance.
      misconceptions:
        - m: "M3 'One test settles it.'"
          fix: "Refutation check: must not create 'you can never conclude anything'; enough runs, pooled and counted, make a gap convincing."
      activity: "Ask: 'How many runs would she need to detect a 20-point gap?' (see @fig-16-7)."
      book: "§16.4; Check Yourself 16.4; Faded Example 'Three Pronouns'."
  notes:
    book: "§16.4 Worked Example 'Maya Tests a Name'."

- layout: compare
  minutes: 1.5
  kicker: "§16.5 · darker-skinned women’s error (book figure redrawn; Raji & Buolamwini, 2019)"
  title: "After the audit, the three named companies cut the gap sharply"
  size: 24
  columns:
    - heading: "Named: 2017 → Aug 2018"
      role: verified
      bullets: ["Microsoft: 20.8% → 1.52%", "Face++: 34.5% → 4.1%", "IBM: 34.7% → 16.97%"]
    - heading: "Not named: Aug 2018"
      role: neutral
      bullets: ["Amazon: 31.37%", "Kairos: 22.50%"]
  takeaway: "It cannot show results on other benchmarks or tasks"
  notes:
    say: |
      Mitigation, and it can work. A mitigation of bias is a change meant to reduce a measured bias, and Chapter 15's four
      kinds apply: avoid, reduce, detect and accept. Within seven months of receiving the results, all three named
      companies released new versions. On a re-test in August 2018, darker-skinned women's error fell by 17.7 to 30.4
      percentage points: Microsoft from 20.8 to 1.52 percent, Face++ from 34.5 to 4.1, IBM from 34.7 to 16.97. Two
      companies not named in the original audit, Amazon and Kairos, had 31.37 and 22.50 percent. What it cannot show:
      results on other benchmarks or tasks; the authors caution that models may have been tuned to this one benchmark.
    background: |
      §16.5 Worked Example "Gender Shades After the Audit"; @fig-16-13 (Raji & Buolamwini, 2019; re-test August 21,
      2018). The follow-up study judged the fixes to appear data-driven (a reduce mitigation). Timeline (Case Study):
      results sent without names December 19, 2017; paper public with names February 2018, presented February 24.
      Each phase has a fix (@fig-16-12): reduce at data and model, avoid or reduce at use, detect at feedback by
      re-running the probe after every update; accept what remains with a named owner (Check Yourself 16.5).
    misconceptions:
      - m: "M5 'Mitigation removes bias: add “show diverse people,” or delete the group field, and the problem is gone.'"
        fix: "Refutation check: must not create 'mitigation is useless'; this re-test shows a real reduction. The next slide shows the limits."
    activity: "Ask: 'What could the re-test show, and what could it not?' (Case Study Q4)."
    book: "§16.5, @fig-16-12, @fig-16-13; Case Study 'How an Outside Audit Found the Gap'."

- layout: compare
  minutes: 1.5
  kicker: "§16.5 · fixes have limits"
  title: "A fix can hide or move a problem: test again"
  size: 22
  columns:
    - heading: "Prompts"
      role: soft
      bullets: ["Counter-stereotype prompts did not stop the stereotypes (Bianchi et al., 2023)"]
    - heading: "Tuning"
      role: risk
      bullets: ["Feb 2024: Google paused its chatbot’s images of people"]
    - heading: "Debiasing"
      role: soft
      bullets: ["Removing a “gender direction” left the bias recoverable"]
  takeaway: "Test again after every fix"
  notes:
    say: |
      But fixes have limits. Counter-stereotype prompts did not stop the stereotypes that Bianchi and colleagues found in
      image generators. In February 2024 Google paused its chatbot's images of people, saying that tuning meant to show a
      range of people had not accounted for prompts that should not show one. And removing the "gender direction" from a
      word-embedding model, one that represents words as lists of numbers, left the bias recoverable. The pattern: a fix
      can hide a problem, or move it somewhere else, or create a new error. So the rule is short: test again after every
      fix, with the same paired-input test, and record what the fix might hide.
    background: |
      Raghavan (2024, Feb 23), Google; Gonen & Goldberg (2019); Bianchi et al. (2023). Short case 1 (Google, 2024):
      paused February 22; images of people returned with a new image model announced August 28, 2024 (Google, 2024);
      labels bias (documented, confirmed by the company) and secondary hallucination (documented). Review A11 (key b): a
      fix can create a new error, so test again; (a) overcorrects M5; (c) and (d) are M5.
    activity: "Ask: 'A firm removes names before an AI screen. What might it miss?' (proxies: clubs, colleges)."
    book: "§16.5 'Fixes have limits'; Short case 1; Faded Example 'Name-Blind Resumes'; Review A11."

- layout: concept
  minutes: 1.5
  kicker: "§16.6 · the choice record (book figure, redrawn)"
  title: "Choose which error matters more; say who was asked"
  size: 24
  bullets:
    - "The numbers show what each choice costs; they do not make it"
    - "**Stakeholders**: everyone affected, including non-users"
    - "**Decision owner**: decides and answers for the result"
  flow:
    - {label: "The decision", kind: step}
    - {label: "Which error harms whom?", kind: human}
    - {label: "Fairness definition", kind: step}
    - {label: "People affected asked", kind: human}
    - {label: "Owner records it", kind: human}
  notes:
    say: |
      Who decides what is fair? Choosing a fairness definition is a choice about whose errors matter more. The numbers
      show what each choice costs; they do not make it. Ask four questions. What is the decision, and does it need AI at
      all? Which error does more harm, and to whom? Who are the stakeholders, everyone affected by the decision, including
      people who never use the tool, and were they asked? And who is the decision owner, the named person or body who
      decides and answers for the result? A bias audit is a structured test of whether a system's outputs or errors
      differ across groups, recorded with its method, counts and decisions. As of October 2026, New York City requires a
      published one for automated hiring tools.
    background: |
      @fig-16-15. Selbst et al. (2019): fairness work can fail when it ignores the setting a tool is used in. NYC Local
      Law 144 of 2021; DCWP rules (2023): a published bias audit for automated employment decision tools comparing
      selection rates by sex and race or ethnicity, with no pass mark (as of October 2026; Chapter 18 owns the law).
      People affected may also need the decision explained (Chapter 17, Deep). Faded example "Reminder Calls" (Appendix
      E): ask patients, including those who speak neither English nor Spanish, and the call staff; equal miss rates
      across language groups follows; the manager records the choice.
    questions:
      - q: "Shouldn't the company that built the system choose its fairness definition?"
        a: "That is Review C2 (interpretive). The chapter's position: a named decision owner chooses, after asking the people who bear the errors (Review A13, key a); builders and vendors supply the numbers."
    misconceptions:
      - m: "M6 'Fairness is a technical question for engineers to settle.'"
        fix: "Refutation check: must not create 'technical measurement does not matter'; you cannot have the conversation without the numbers."
    activity: "Pairs: the reminder-calls faded example (2 min) if time allows."
    book: "§16.6, @fig-16-15; Faded Example 'Reminder Calls'; Review A13."

- layout: objectives
  minutes: 1
  kicker: "Chapter 16 summary (book figure: summary card)"
  title: "What you can do now"
  items:
    - {code: "O1", text: "**Look** for bias at four phases"}
    - {code: "O2", text: "**Measure** group by group, with sizes"}
    - {code: "O4", text: "**Read** a gap: fair test, then threshold"}
    - {code: "O3", text: "**Ask** which error harms whom"}
    - {code: "O5", text: "**Fix** where it entered; test again"}
    - {code: "O5", text: "**Name** who decides, and who was asked"}
  takeaway: "People choose which error matters most; numbers show what each choice costs"
  notes:
    say: |
      Back to the chapter's question: how can you tell whether an AI system treats different groups fairly, and who
      decides what fair means? Look for bias at four phases: data, model, use and feedback. Measure group by group, with
      each group's size. A gap is a finding only if the test was fair and the gap passes the chance threshold. Fair can
      mean equal selection rates, equal error rates or equal precision; when base rates differ, a tool that makes errors
      cannot meet them all, so people must choose which error matters most, ask those who bear it, and name an owner. Fix
      bias where it entered, and test again. And the opening case: only an intersectional count showed the gap; an
      outside audit found it, and the named companies then cut it.
    background: |
      Chapter Summary, "Return to the Opening Case" and @fig-16-22. Revisit your Warm-up (chapter): (1) not necessarily,
      you need rates by group with sizes (16.2); (2) no, one output is a lead at most (16.4); (3) yes, but unless its flags
      carry no information about who is qualified, it must then flag a different share of the unqualified wrongly in
      each group, and a flag means something different in each (16.3).
    activity: "Ask two students to compare their Warm-up confidence with these answers."
    book: "Chapter Summary, @fig-16-22; Revisit your Warm-up."

- layout: key_terms
  minutes: 0.5
  title: "Key terms (Chapter 16)"
  size: 20
  terms:
    - "allocation harm"
    - "base rate"
    - "bias (in an AI system)"
    - "bias audit"
    - "bias probe"
    - "Bias Lifecycle"
    - "chance threshold"
    - "disaggregated evaluation"
    - "equal error rates"
    - "equal precision"
    - "equal selection rates"
    - "fairness definition"
    - "false-positive rate (of a decision tool)"
    - "feedback loop (in an AI system)"
    - "intersectional subgroup"
    - "miss rate"
    - "mitigation (of bias)"
    - "paired-input test"
    - "protected characteristic"
    - "representation harm"
    - "selection rate"
    - "stakeholder"
    - "two-part rule"
  note: "Deep (optional): calibration within groups · runaway feedback loop · predictive policing. Core terms are examinable."
  notes:
    say: |
      Chapter 16's key terms. They are fair game for a quiz or exam, if your course has one, so make sure you can define each in
      a sentence and give an example from the lab session's station or the Gender Shades case. Watch three groups of terms.
      First, the three fairness definitions and the rates they compare: selection rate, miss rate, false-positive rate,
      and precision. Second, the testing words: paired-input test, bias probe, chance threshold, two-part rule. Third,
      the two kinds of harm, allocation and representation. The three Deep terms are optional and not on the exam.
    background: |
      Key Terms list from the chapter (23 Core terms; Deep: calibration within groups, runaway feedback loop, predictive
      policing). Examinable scope: Core sections only (D20).
    activity: "30 s self-test with a neighbor."
    book: "Chapter 16 Key Terms; glossary."

- layout: deep
  kicker: "Deep 16.A · the dispute that made the result famous"
  title: "Going deeper: COMPAS, two definitions, both right"
  bullets:
    - "ProPublica (2016): error rates differed by race"
    - "The maker: same precision for both groups"
    - "Different base rates: both can be right by their own definition"
  takeaway: "The dispute was largely about which errors matter more"
  notes:
    say: |
      Use this only if there is time or a student asks. In 2016 the news organization ProPublica analyzed a risk score
      called COMPAS, used in Broward County, Florida. Among defendants who did not reoffend within two years, Black
      defendants had been labeled higher risk 45 percent of the time and White defendants 23 percent; among those who did
      reoffend, White defendants had been labeled lower risk 48 percent of the time and Black defendants 28 percent. The
      score's overall accuracy was similar for both groups. The company that made the score answered that it met
      predictive parity, the same precision for both groups. By the arithmetic of section 16.3, with different base
      rates, both could be right by their own definition. The disagreement was largely about which errors matter more.
    background: |
      Deep 16.A (optional, not examinable): Larson et al. (2016), more than 10,000 people charged and scored in 2013 and
      2014; error rates from the 7,214 it could follow for two years. Dieterich et al. (2016), Northpointe. The company
      also disputed parts of the analysis. The identity: false-positive rate = (base rate ÷ (1 − base rate)) × ((1 −
      precision) ÷ precision) × (1 − miss rate) (@fig-16-17). Deep 16.B covers feedback loops (Ensign et al., 2018).
    activity: "Optional; not part of the session plan."
    book: "Deep 16.A, @fig-16-17."

