# ======================================================================= CONCEPT-SESSION SEGMENT (11 min)
- layout: title
  session: tue
  minutes: 0
  subtitle: "Concept-session segment and Lab 15.1 station 3"
  meta:
    - "Sadi Evren Seker"
    - "Reading: Chapter 16 Core (about 30 min) · Recommended: Buolamwini & Gebru (2018)"
  figure: f16-03-lifecycle
  notes:
    say: |
      This deck covers Chapter 16 inside a crowded unit. The unit has four chapters: privacy and security, this one on
      bias and fairness, intellectual property and law, and an optional chapter on explanations. Chapter 16's share of
      class is small: about eleven minutes in the concept session, and in the lab session one station of the red-team lab, the bias probe, plus
      reading the class's pooled counts at the gallery walk. The question of the chapter: how can you tell whether an AI
      system treats different groups of people fairly, and who gets to decide what "fair" means? The picture is the Bias
      Lifecycle: four phases where bias can enter a system, data, model, use and feedback. You will name a phase in
      the lab session for your station's prompt.
    background: |
      Chapter 16's map highlights Verify (test a system group by group), then Decide (who chooses what counts as fair)
      (@fig-16-1). Time (chapter): about 16 minutes for the Core sections and about 30 for the whole Core package,
      including about 6 minutes to answer the Warm-up, Check Yourself and faded examples; the blueprint's earlier count
      was about 28, and the chapter's 30 is used here. The recommended reading (Buolamwini & Gebru, 2018; abstract, §1, §4.1 with Table 4,
      §5) adds about 10 minutes; never assume it was read. Featured student: Maya (psychology). Compass
      is optional and never part of a course grade.
    activity: "Switch to this deck after the Chapter 15 segment's last check."
    book: "Chapter 16 opening page; @fig-16-1, @fig-16-3."

