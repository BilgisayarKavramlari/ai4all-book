# Lecture deck spec — Chapter 16: Bias and Fairness (shared unit with Chapters 15, 17 Deep and 18)
# Format and notes standard: slides/README.md. Build: python3 tools/build_slides.py slides/specs/ch16.yaml --preview
# Independence (D27, docs/production/independence-rules.md): no institution, course code, term, calendar dates,
# enrollment, course-site system or syllabus references on slides or in notes; sessions are named by kind only.
#
# The unit is shared (decision D22). The Chapter 15 deck carries the unit plan, the opening case (Samsung), the
# concept-session demonstration and the WHOLE Lab 15.1 briefing (all stations). This deck is compact (keys are internal):
#   tue: Chapter 16's segment of the shared concept session, about 8 of the 35 concept minutes (Ch16 blueprint
#     §1: the Gender Shades table and the three fairness questions) plus a 3-minute concept check = 11 min.
#   thu: Lab 15.1 station 3, the bias probe (minutes 34–49 of the lab) and the pooled reading with the two-part
#     rule at the gallery walk (3 of minutes 54–69) = 18 min; then the A12 fairness row (drafted at the walk, finished
#     at home inside Chapter 15's A12 count, so 0 extra class minutes). These slides repeat the Chapter 15 deck's
#     station-3 slides so the station can be run from either deck.
#   ext: an optional extended section that walks the Core sections 16.1–16.6 for instructors who have time (review
#     session, office hours, an extra session). Optional class time, NOT optional content: Core sections are examinable (D20).
# Conflicts noted for the editor: the Ch16 blueprint (§1, §11) places station 3 at minutes 40–55 of the lab; the lab
# sheet, the station card and the chapter say 34–49 (slides follow the chapter). The blueprint's package count is
# "about 28 minutes"; the chapter's time line says about 30 (slides follow the chapter).
# Every number below comes from the files under deck.sources.

deck:
  chapter: 16
  slug: bias-and-fairness
  title: Bias and Fairness
  short_title: Bias and Fairness
  author: Sadi Evren Seker
  sessions:
    tue: {label: "Concept session · Chapter 16 segment of the shared session (8 concept minutes + 3-minute check)", minutes: 11}
    thu: {label: "Lab session · Lab 15.1 station 3 (minutes 34–49) and the pooled reading at the gallery walk", minutes: 18}
    ext: {label: "extended section · optional class time, if time allows (the Core sections stay examinable)"}
    after: {label: "reference slides (not presented)"}
