# ======================================================================= OPTIONAL SESSION
- layout: title
  session: opt
  minutes: 0
  subtitle: "Optional enrichment · Deep chapter, not on exams"
  meta:
    - "Sadi Evren Seker"
    - "Reading (optional): Chapter 23, fast route about 23 min"
  figure: f23-01-chapter-map
  notes:
    say: |
      Use this deck only if time allows. Chapter 23 is the book's last chapter, and it is a Deep chapter: optional,
      and nothing in it is on an exam. Earlier chapters taught you to use AI tools well. This one asks questions no
      checklist settles. Can a machine understand what it says? Could one be conscious, and would that matter? When
      an AI system is involved in a harm, who is responsible? Is generated work creative, and whose is it? What
      happens to the meaning people find in work? And should the long-term future of AI worry us? Informed people
      disagree about all six. The chapter does not settle them, and neither will this session. What you get is a
      method for disagreement. On the AI Work Loop, the chapter highlights Decide, who answers for a judgment, with
      Disclose second: whose view is whose.
    background: |
      HOW TO TEACH THIS CHAPTER. The chapter's rule: every debate has two strong sides from primary sources; the book's
      own voice takes no side; marks and model answers go to the reasoning standard, never to a side (D-23.12: "no key
      names a correct side"; the rubric says "No side earns more points"). Keep that stance in class: present each
      side at its strongest and do not reveal or imply your own position as the answer. The chapter's "Author's view"
      boxes are placeholders ("to be added by the author before publication") and hold no view, so this deck has no
      author's-view slide; do not fill them in for the author. Decision D20: Deep chapters (6, 13, 17, 22, 23) are
      not examinable. Featured students: Maya (psychology, Izmir) and Hana (they/them; media arts and design); all their
      work is constructed. Case C30 (Turing, Searle, Bender et al., with Jones & Bergen, 2026).
    questions:
      - q: "Will any of this be on the final?"
        a: "No. Chapter 23 is Deep and not examinable (D20). Its review questions follow the exam format, so they are good practice for reasoning the exams do test."
      - q: "What do you think the right answer is?"
        a: "Say that the chapter, and this session, take no side; the goal is that each student can state both sides at their strongest and label their own view separately (§23.1, §23.8)."
    activity: "On screen while students settle, if the instructor chooses to run the optional session."
    book: "Chapter 23 opening page, @fig-23-1 (chapter map)."

