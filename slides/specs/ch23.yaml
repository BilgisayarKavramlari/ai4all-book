    - "existential risk"
    - "responsibility gap"
    - "problem of many hands"
    - "moral crumple zone"
    - "position paper"
    - "meaningful human control"
    - "forward-looking responsibility"
    - "creativity"
    - "meaningful work"
  notes:
    say: |
      These are the chapter's key terms. None of them is on an exam, because the whole chapter is Deep. If you keep
      only three pairs from this list, keep these. Steelman and straw man: the strongest fair version of a view, and a
      weak version built to be knocked down. Phenomenal consciousness and moral status: experience, and having
      interests that matter for their own sake. And the responsibility gap and the moral crumple zone: whether anyone
      can be justly blamed when no one could foresee a system's behavior, and the warning that blame can land on the
      person nearest the system. Each pair separates two questions people often run together.
    background: |
      Key Terms list from the chapter (26 terms); "indicator property (of consciousness)" and "artificial general
      intelligence (AGI)" are shortened on the slide. Reused from earlier chapters: authorship (in copyright),
      Chapter 18; evidence status (measured, reported, forecast, the book's inference), Chapter 22; labor-market
      forecast, Chapter 20; ownership (of a text), Chapter 10. CONFLICT NOTE: the blueprint lists 22 key terms; the
      chapter adds straw man, computational functionalism, interested source and position paper. Examinable scope:
      Core sections only (D20).
    activity: "Optional 30-second pair self-test on the three pairs."
    book: "Chapter Summary, Key Terms; glossary."

