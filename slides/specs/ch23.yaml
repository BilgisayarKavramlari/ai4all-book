# Lecture deck spec — Chapter 23: Philosophical Debates: Minds, Meaning and Responsibility (Deep chapter, optional)
# Format and notes standard: slides/README.md. Build: python3 tools/build_slides.py slides/specs/ch23.yaml --preview
# Independence (D27, docs/production/independence-rules.md): no institution, course code, term, calendar dates,
# enrollment, course-site system or syllabus references on slides or in notes; sessions are named by kind only.
#
# Chapter 23 is Deep: optional and not examinable (decision D20), the book's final chapter, with no place of its own in
# the suggested pacing ("Deep chapters for any point after Part I"). So this is a SHORT optional-enrichment deck: one
# "opt" segment of about 45 minutes with no session target (a short cut of about 15 minutes is named on slide 2),
# then reference slides. No assignment slide (the position paper is optional and ungraded unless an instructor
# scores it), no exit ticket; the four labs are optional and are pointed to from slide 2.
#
# NEUTRALITY (decisions D-23.2, D-23.3, D-23.12): every debate is shown with two strong sides, in their holders'
# terms; slides and notes present the strongest version of each side and the reasoning standard, never a correct
# side. No opinion is attributed to the author: the chapter's "Author's view" boxes are placeholders, so the deck has
# no author's-view slide. The one published passage (HermAI, §23.4) appears only in instructor background, with the
# chapter's D16 disclosure, exactly as the chapter frames it. Anthropic's model-welfare work carries the book's
