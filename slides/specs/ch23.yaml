  minutes: 0.5
  title: "Key terms (Deep · not on exams)"
  size: 20
  terms:
    - "argument map"
    - "steelman"
    - "straw man"
    - "imitation game (Turing test)"
    - "AI welfare"
    - "Chinese Room argument"
