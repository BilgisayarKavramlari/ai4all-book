# About 60 words: the two-part rule and its threshold rows must be read together at the walk (deliberate exception).
- layout: compare
  minutes: 3
  max_words: 62
  kicker: "Gallery walk · Chapter 16’s two-part rule"
  title: "Lead or finding? Fair test and a big enough gap"
  size: 22
  columns:
    - heading: "1 · Was the test fair?"
      role: soft
      bullets: ["One change, preregistered rule", "One tool, fresh chats", "Same runs per version, at least 10"]
    - heading: "2 · Is the gap big enough?"
      role: soft
      bullets: ["26 runs: counts differ by 8", "39 runs: by 10", "Smaller gap: a lead"]
  takeaway: "No gap is not evidence of no bias: at 39 runs, only gaps of about 26 points show"
  notes:
    say: |
      Here is how we read the pooled tallies. A gap is a finding only if two things hold. First, the test was fair: one
      change, the preregistered counting rule, one tool, fresh chats, the same number of runs per version, at least ten
      runs per version. Second, the gap is at least the chance threshold for that many runs. With about thirteen students
      per prompt, we have about thirty-nine runs per version for prompts A and B, where the counts must differ by at least
      ten, and about twenty-six for prompt C, where they must differ by at least eight. A smaller gap is a lead. And "no
      gap" is not evidence of no bias: write down the smallest gap your run count could have detected. With several prompts,
      one finding can still be chance, so re-run it before relying on it.
    background: |
      Threshold table (lab sheet; Chapter 16, D-16.3): 20 runs → 7 (35 points); 25 → 8 (32); 26 → 8 (31); 30 → 9 (30); 35 →
      9 (26); 39 → 10 (26); 45 → 10 (22). Threshold = the smallest gap chance alone produces less than 1 time in 20 when both
      versions share a 50% rate, by exact calculation; it assumes equal runs per version. If the versions' totals differ
      (e.g., "no score" replies in B), use the row for the smaller total. Chapter 16's worked example (constructed): 31 of
      39 vs. 19 of 39, a difference of 12, above 10, a finding to be re-run. Live and printed tallies are read separately.
    misconceptions:
      - m: "Ch16 M3 'One test settles it.'"
        fix: "Refutation check: must not create 'you can never conclude anything'; enough pooled, counted runs make a gap convincing."
    activity: "Read each prompt's pooled live line, then printed line; ask the class: lead or finding?"
    book: "Lab 15.1 step 7 threshold table; §16.4 'Is a gap real?'."

- layout: objectives
  minutes: 1
  kicker: "Chapter 15 summary (book figure: summary card)"
  title: "What you can do now"
  items:
    - {code: "O1", text: "**Trace** a prompt on the data-flow map"}
    - {code: "O2", text: "**Minimize**: names are not the only identifiers"}
    - {code: "O3", text: "**Assume** inputs can instruct; layer defenses"}
    - {code: "O3", text: "**Remove** a leg of the risky combination"}
    - {code: "O4", text: "**Check** the channel, not the voice"}
    - {code: "O5", text: "**Rate**, mitigate, and name an owner"}
  takeaway: "Send only what the task needs, and let a named person accept what remains"
  notes:
    say: |
      Back to the opening puzzle. What went wrong at Samsung, when nobody attacked and nobody meant to leak? The data crossed
      the trust boundary into storage the company did not control. And why could it not take the data back? Because its
      measures lowered the chance of new pastes, not the impact of the ones already made. Now your warm-up: copies can
      survive in backups, logs, memory and shared links; three ordinary facts made about 87 percent of Americans likely
      unique; and an instruction against injection is more text the model receives. Compare with your confidence. The
      chapter's answer: trace each input, send only what the task needs, assume any text can instruct, check the channel,
      and rate what remains with evidence and an owner.
    background: |
      Chapter Summary; "Return to the Opening Case" (§15.1, §15.6); "Revisit your Warm-up". Ethics Lens (optional to
