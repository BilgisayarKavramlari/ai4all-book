# ======================================================================= REFERENCE SLIDES
- layout: deep
  session: after
  kicker: "Deep 15.B · why prompt injection resists a fix"
  title: "Going deeper: train, detect, design"
  bullets:
    - "**Train**: rank instructions; attacks succeed less often, still succeed"
    - "**Detect**: classifiers flag likely injections; new attacks slip past"
    - "**Design**: the plan comes only from your request; fewer tasks get done"
  takeaway: "The data–instruction line is trained, not enforced"
  notes:
    say: |
      Use this only if there is time or a student asks why injection is so hard. A database can be told, by its design,
      "this part is a command, that part is only data." A language model receives one sequence of tokens, so the line
      between instruction and material is something training pushes the model to follow, not something the system
      enforces. Defenses fall into three families. Train: models trained to rank instructions, the developer's first and
      text from tools and web pages last, made attacks much less successful, not impossible. Detect: classifiers screen for
      likely injections; an attack written to look harmless can slip past. Design: systems in which the plan comes only
      from the user's request; they complete fewer tasks, and a summary can still be changed.
    background: |
      Deep 15.B (optional, not examinable): Wallace et al. (2024), instruction hierarchy on GPT-3.5; Debenedetti et al.
      (2025), CaMeL; David C. (2025), NCSC, "inherently confusable deputy"; OpenAI (2025, Dec 22); Willison (2025): in
      web-application security, a defense that stops 95% of attacks is a failing grade.
    activity: "Optional; not part of the session plan."
    book: "Deep 15.B, @fig-15-22."

