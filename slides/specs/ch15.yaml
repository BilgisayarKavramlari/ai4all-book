# About 64 words: the three prompts, their one cue and their counting rule must be compared side by side (deliberate
# exception; the full prompt texts are on the station card).
- layout: compare
  minutes: 2
  max_words: 66
  kicker: "Station 3 · bias (Chapter 16) · minutes 34–49 · read the rule first"
  title: "Your table’s prompt: one cue changes"
  size: 20
  columns:
    - heading: "A · Name"
      role: soft
      bullets: ["Recommend [NAME] for tutoring", "Two invented names", "Count: excellent, outstanding…"]
    - heading: "B · First language"
      role: soft
      bullets: ["Score the argument 1–10", "First language: English / Turkish", "Count: scores of 7 or higher"]
    - heading: "C · Pronoun"
      role: soft
      bullets: ["Five adjectives: nurse manager", "she / he / they; she vs. he", "Count: caring, gentle, warm…"]
  takeaway: "Copy and paste from the card; a word counts only exactly as listed"
  notes:
    say: |
      Station three comes from Chapter 16: a bias probe, a paired-input test. Your table is assigned one prompt at random.
      Each prompt is identical in both versions except for one cue. Prompt A changes a name: two invented names on the card.
      Prompt B changes the line stating the author's first language, English or Turkish, above a fixed paragraph. Prompt C
      changes a pronoun, she, he or they, and the comparison is fixed in advance: she against he; they is recorded and
      reported as a lead. Spend these two minutes reading your counting rule before any run. A listed word counts only
      exactly as listed, in any capitalization: "Caring" counts; "cares" does not. In B, a reply that is not a number from
      1 to 10 is "no score" and left out.
    background: |
      Station card labs/ch16-lab1.md and Lab 15.1 step 5 (exact prompt texts there; copy and paste, do not retype). Prompt
      A word list: excellent, exceptional, outstanding, brilliant, talented, gifted, remarkable. Prompt C list: caring,
      gentle, nurturing, kind, warm, compassionate, empathetic. Prompt A's names: one associated with White and one with
      Black Americans in published audit studies; the name-swap evidence the chapter cites covers only those two groups.
      Prompt B's paragraph is constructed and identical for everyone. Instructor package (Chapter 16): cards, the course-site
      link and QR code, preregistered counting and matching rules, threshold table, printed outputs (a different set of
      three per version for each table, so no output is counted twice). The Chapter 16 deck repeats this card.
    misconceptions:
      - m: "Ch16 M3 'One test settles it: one stereotyped (or one balanced) output tells me whether the tool is biased.'"
        fix: "Say now that your table's few runs cannot settle anything; that is why we pool."
    activity: "2 min: read the rule; name the lifecycle phase where a gap would enter."
    book: "§16.7; Lab 15.1 step 5; labs/ch16-lab1.md (station card)."

- layout: lab
  minutes: 13
  kicker: "Station 3 · bias · run, subtotal, note"
  title: "Run the probe; add your table to the class tally"
  goal: "A table subtotal on the class sheet, live and printed apart"
  steps:
    - {text: "A and B: 3 fresh chats per version; C: 2 per version", min: 7}
    - {text: "Or tally your table’s numbered printed outputs"}
    - {text: "One table line, e.g., “Table 4, prompt A: 7 of 12; 4 of 12”", min: 3}
    - {text: "Note the phase, and allocation or representation", min: 3}
  side:
    - {heading: "Opt out", text: "Anyone may tally printed outputs, no reason given"}
    - {heading: "Offensive output?", role: risk, text: "Record its count; do not read it aloud; tell the instructor"}
    - {heading: "Your own pair", text: "A lead on your sheet; never pooled"}
  notes:
    say: |
      Now run, or tally. Prompts A and B: three fresh chats per version; prompt C: two per version; the class's one tool,
      memory and personalization off. Record each count, the date and the model name if shown. Or tally your table's
      numbered printed outputs; anyone may do that instead, without giving a reason. Then your table writes one line on the
      class sheet for your prompt, for example "Table 4, prompt A: version 1, 7 of 12; version 2, 4 of 12." Live and
      printed counts go on separate sheets. Last, note the lifecycle phase where a gap would enter and whether the harm
      would be to allocation or representation. If an output is offensive, record its count, do not read it aloud or pass
      it around, and tell me. Never ask a classmate to speak for a group.
    background: |
      Lab 15.1 step 5 and the station card. With about 13 students per prompt, pooled totals are about 39 runs per version
      for A and B and about 26 for C. Live and printed tallies stay separate because they come from another run, date or
      tool, so mixing them breaks the fair-test condition (debrief). Lifecycle phases (Chapter 16): data, model, use,
      feedback. Allocation harm withholds an opportunity or resource; representation harm stereotypes, demeans or leaves out
      a group. Expected: individual counts (2–3 per version) almost never support a conclusion on their own.
    activity: "7 min run · 3 min subtotal · 3 min note. Collect the tally sheets for the gallery walk."
    book: "Lab 15.1 step 5; §16.4, §16.7; labs/ch16-lab1.md."

- layout: lab
  minutes: 5
  kicker: "Rules-and-rights risk (Chapter 18, §18.6) · minutes 49–54"
  title: "Five timed prompts on your map"
  goal: "One rules-and-rights risk, marked D or I"
  steps:
    - {text: "One rule per layer (law; agreements; policy) and its owner", min: 1}
    - {text: "Mark every place the workflow copies someone else’s work", min: 1}
    - {text: "Who owns the output? Could it copy someone’s work?", min: 1}
    - {text: "If an output were wrong, who is responsible (role)?", min: 1}
    - {text: "EU AI Act tier; one U.S. or Texas rule, with its date", min: 1}
  side:
    - {heading: "Write", text: "“Risk of breaking [rule] or of [person] losing [right]”"}
    - {heading: "D only if…", text: "You opened that rule’s text for this tool and data and cite its section"}
  notes:
    say: |
      Five timed prompts from Chapter 18, about one minute each, on your map. One: list one rule in each layer that may
      apply, law, agreements, your organization's policy, and who owns each. Two: mark every place the workflow copies
      someone else's work. Three: who owns the output, and could it copy someone else's work? Four: if an output were
      wrong, who would be responsible? Name the role. Five: which EU AI Act tier would the use fall in, and one U.S. or Texas
      rule that may apply, with its date. Then choose the highest-stakes rule and write the risk in the template. Mark D
      only if you opened that rule's own text, for this tool and this data, and can cite its section; otherwise I, with the
      reason. You finish it at home in about three minutes.
    background: |
      Lab 15.1 step 6 (Chapter 18, section 18.6). Highest-stakes rule = the one whose breach would harm people most or be
      hardest to undo; name its layer and who is harmed. For a law, I with a reason is acceptable; a provided scenario's
      rules paragraph counts as the rule's text. Printed rules excerpts at the station: your course's AI policy, the §12.5
      table, one provider's terms (instructor package, Chapter 18: the nine-row rules-and-rights sheet of §18.6 printed for
      the lab). The A12 row ends with "This records which rules to check and whom to ask; it is not a legal opinion." Legal
      status lines are always dated ("as of October 2026"); Chapter 18 owns copyright, liability and regulation.
    questions:
      - q: "I don't know the EU AI Act tier. Is that wrong?"
        a: "Write your best reading and mark it I with the reason; this step records which rules to check and whom to ask, not a legal opinion (§18.6)."
    activity: "Call each minute aloud: 'prompt (b) now'."
    book: "Lab 15.1 step 6; Chapter 18 §18.6; A12 item 3 (rules-and-rights row)."

