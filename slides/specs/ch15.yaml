# Lecture deck spec — Chapter 15: Privacy and Security (shared unit with Chapters 16, 17 and 18)
# Format and notes standard: slides/README.md. Build: python3 tools/build_slides.py slides/specs/ch15.yaml --preview
# Independence (D27, docs/production/independence-rules.md): no institution, course code, term, calendar dates,
# enrollment, course-site system or syllabus references on slides or in notes; sessions are named by kind only.
#
# The unit is shared (decision D22). This deck carries the unit plan, the opening case (Samsung, C12), Chapter 15's
# concept segment (~12 concept minutes, per the Ch15 blueprint §1 and handoff), the concept-session demonstration (a prompt
# injection hidden in a document, mirrored by the §15.3 worked example), Chapter 15's quick checks, and the WHOLE
# Lab 15.1 briefing (all stations, including Chapter 16's bias station and Chapter 18's rules-and-rights step).
# Chapter 16's concept segment (~8 min + 3 check) and Chapter 18's (~7 min + 3 check) are in their own decks.
# Concept-session split used here (75 min): opening case 10 · Ch15 concepts 12 + demo 20 + checks 4 · Ch16 11 · Ch18 10 ·
# guest or buffer 7 · before the lab 1. The chapter handoffs assign only 27 of the 35 concept minutes; the remaining
# 7 minutes are shown as "guest or buffer" for the instructor to use.
# Lab safety: station 1 runs on printed outputs unless your institution's IT and security offices confirm live runs
# (Ch15 handoff author item 3).

deck:
  chapter: 15
  slug: privacy-and-security
  title: Privacy and Security
  short_title: Privacy and Security
  author: Şadi Evren Şeker
  sessions:
