      in your own sessions, only on the provided files and only with fake data. Never test a hidden instruction, a leakage
      trick or a social-engineering move on another person's tool, account or system, or on a real person. No real
      personal, confidential, patient, client, customer or employer details anywhere: not in prompts, not on the sheets,
      not on the posters. If you run anything live, use the class's one tool with memory and personalization off, as the
      station 3 card requires.
    background: |
      Lab 15.1 safety rules, verbatim in substance. A12 rule: a submission with real personal, confidential, patient or
      client data is returned ungraded, to resubmit without it. Station 3 card: memory and personalization off, checked at
      the briefing; if the tool has no such option, say so on the tally sheet. Until your institution's IT office confirms live runs of the
