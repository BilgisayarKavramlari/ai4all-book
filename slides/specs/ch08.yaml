      who want to review before A5, and reuse them in a review session before any exam.
      Every quick check uses an odd-numbered review item or a Check Yourself question, so the answers can be shown.
    background: |
      Design decision for this deck: the concept session of this pair belongs to Chapter 4 (Ch. 4 and Ch. 8 blueprints),
      so Chapter 8 has no concept session. The lab sheet's briefing recaps the funnel, the citation checks and the verdict
