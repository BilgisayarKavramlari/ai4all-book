# Lecture deck spec — Chapter 8: Hallucination, Uncertainty and Verification (lab session)
# Format and notes standard: slides/README.md. Build: python3 tools/build_slides.py slides/specs/ch08.yaml --preview
# Independence (D27, docs/production/independence-rules.md): no institution, course code, term, calendar dates,
# enrollment, course-site system or syllabus references on slides or in notes; sessions are named by kind only.
#
# Chapter 8 follows Chapter 4 (Ch. 4 and Ch. 8 blueprints): Chapter 4's concept session (its own deck, with the
# niche-topic source demonstration run as Lab 4.1) comes first; this chapter's verification lab is Lab 8.1 "Ten
# Claims" (briefing 10 · team check 10 · own claims 30 · share 15 · exit 5 · buffer 5). This deck therefore has one
# presented session (thu = the lab session, 75 min; the key is internal).
# The concept recap the lab sheet asks for (funnel, three citation
# checks, verdict rule) sits in the briefing; signals and calibration sit in the share step, where the class pools
# its calibration gap. The remaining Core material (8.1–8.5 checks, the Case Study labels, short cases, Deep 8.A) is
# kept as self-study and review slides in the "after" session (not presented).
# Every number and quotation comes from the sources under deck.sources; the builder flags any number it cannot find.

