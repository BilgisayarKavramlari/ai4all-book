# Redrawn natively from @fig-8-3 (claim split): the book figure's table text is about 8 pt at slide size.
- layout: compare
  kicker: "§8.1 · worked example · constructed (book figure: claim split, redrawn)"
  title: "One fluent paragraph held six claims"
  size: 24
  columns:
    - heading: "High stakes"
      role: neutral
      bullets: ["Four sections, incl. BEC (fact)", "75 to pass each (number)", "All four in 18 months (number)"]
    - heading: "Medium stakes"
      role: soft
      bullets: ["Four hours each (number)", "“Official exam blueprint” (citation)"]
    - heading: "Low: not checkable"
      role: soft
      dashed: true
      bullets: ["Start with the hardest (judgment)"]
  takeaway: "One fact per claim · mark and type it · rank by stakes"
  notes:
    say: |
      You verify claims, not answers. A claim is one statement in an output that you might rely on. Some are checkable,
      true or false, such as a date or a number; others are not checkable as true or false, such as a recommendation,
      but you still list them because you may rely on them too. Lucia asked a chat tool for an overview of the CPA exam
      and got one confident paragraph. Split, it holds six claims: four sections, four hours each, a score of 75 to pass,
      all four within 18 months, a source named "the official exam blueprint", and advice to start with the hardest
      section. The ones that decide what she studies and when she must finish rank highest. The advice is not checkable.
      The source needs finding.
    background: |
      Worked Example "Lucia's Exam Overview" (constructed; Lucia is accounting, saving for the CPA exam). Evidence for M1:
      in a 2023 study, ChatGPT biographies split into single facts and checked against Wikipedia were 58% supported;
      later facts and facts about less famous people were supported less often (Min et al., 2023). "Not supported" is not
      the same as false. Faded example (steel paragraph) key in Appendix E. Section 8.2 later shows claims 1 and 4
      contradicted (BEC retired; 18 months became 30). The slide regroups @fig-8-3's six rows by stakes (type in
      parentheses); the dashed card marks the one claim not checkable as true or false, as the figure's dashed row does.
    misconceptions:
      - m: "M1 'If most of an answer checks out, the rest is probably right too.'"
        fix: "Accuracy varies claim by claim (58% in the 2023 study). Not 'most answers are wrong'."
    activity: "Self-study."
    book: "§8.1, @fig-8-3; Worked and Faded Examples; Check Yourself 8.1."

- layout: quiz
  kicker: "Quick check · §8.1"
  title: "split the sentence"
  question: "Split this made-up sentence into claims (you should find four): “A 2019 survey of 4,000 nurses by the American Nurses Association found that 62% worked overtime.”"
  instruction: "One fact per line; mark each checkable or not"
  answer_minutes: 0
  model_answer:
    - "(1) a survey was done in 2019 · (2) it had 4,000 nurses · (3) it was by the American Nurses Association · (4) 62% worked overtime."
    - "All four are checkable; the number and the source rank highest because the rest depends on them."
  notes:
    say: |
      Self-check for section 8.1. The sentence is made up for practice, so do not look for the survey; the exercise is
      the split. One fact per claim. A sentence with a year, a sample size, an organization and a percentage holds at
      least four separate things you might rely on, and each can be wrong on its own: the survey could be real but from
      another year, or by another organization, or the percentage could be about something else. Write one fact per
      line, mark each checkable or not, then compare with the answer slide.
    background: |
      Check Yourself 8.1, item 2 (the sentence is constructed in the chapter). Model split from §8.1's rule "one fact per
      claim": year, sample size, organization, finding. Ranking by stakes is the student's judgment; the number and the
      source are the natural top rows because a reader would repeat them.
    activity: "Self-study."
    book: "§8.1; Check Yourself 8.1."
  answer_notes:
    say: |
      Here is one good split. One: a survey was done in 2019. Two: it had 4,000 nurses. Three: it was by the American
      Nurses Association. Four: 62% worked overtime. All four are checkable as true or false. For ranking, ask what
      would be repeated: if you quote the 62%, the number and its source carry the most weight, so they go to the top,
      and the source points you to the primary record where the year and the sample size can be checked at the same
      time. If you found three claims, check whether you merged the organization and the year.
    background: |
      Same logic as Review B1 (Appendix E): split, mark, rank; a recommendation that follows from a statistic is a
      separate, not-checkable claim.
    activity: "Self-study."
    book: "§8.1; Check Yourself 8.1; Appendix E (Review B1)."

- layout: worked
  kicker: "§8.2 · worked example · Lucia’s claim 1 · high stakes"
  title: "Is BEC still on the exam?"
  context: "“Four sections: AUD, BEC, FAR, REG”"
  steps:
    - {label: "Stage 1", text: "Review-course page: exam changed January 2024"}
    - {label: "Stage 2", text: "NASBA: BEC ended December 15, 2023"}
    - {label: "Verdict", text: "Contradicted: outdated information"}
    - {label: "Uncertainty", text: "Checked October 2026; recheck"}
  reveal: [4]
  result: "Stage 1 conflicted, so she went on to stage 2"
  notes_reveal:
    - say: |
        A worked example of the funnel. Lucia's claim 1 says the exam has four sections, including BEC. The stakes are
        high: it decides what she studies. Stage 1: a review-course page with a named publisher says the exam changed in
        January 2024, which conflicts with the claim. When stage-1 sources disagree with a claim, you go on. Stage 2: the
        organization that runs the exam with the AICPA states that the last day to take BEC was December 15, 2023, and
        the exam now has three core sections and one discipline section chosen from three. Verdict: contradicted. Label:
        outdated information, once correct but no longer, a leaf of hallucination, documented. And the uncertainty line:
        checked in October 2026; rules change.
      background: |
        §8.2 Worked Example (constructed scenario; the exam facts are real, sources NASBA n.d.; AICPA & CIMA 2021; TSBPA
        n.d.). NASBA = National Association of State Boards of Accountancy; AICPA = American Institute of Certified
        Public Accountants. The exam now has three core sections (AUD, FAR, REG) and one discipline section chosen from
        three; the label is outdated information, a leaf of hallucination, documented. Faded example (warfarin and
        ibuprofen) key: stage 3 when the claim guides a decision for a real patient; for a study note stage 2 is
        enough; verdict supported (Appendix E). Time-sensitive: CPA rules dated October 2026.
      activity: "Self-study."
      book: "§8.2 Worked Example 'Is BEC Still on the Exam?'; Faded Example 'A Drug Interaction'."
  notes:
    book: "§8.2 Worked Example."

- layout: quiz
  kicker: "Quick check · §8.2"
  title: "how far to check"
  question: "A student says, “Verifying means taking every claim to an expert.” What is the most accurate response?"
  options:
    - "That is right; anything short of an expert’s judgment is not really verification."
    - "Claims that sound right can skip checking."
    - "Only citations need checking; numbers and dates can usually be trusted as given."
    - "Checks follow the stakes; every claim you rely on gets at least stage 1."
  answer: d
  answer_minutes: 0
  explanation: "(a) is M6; (b) is the fluency trap; (c) is M2’s mirror image: numbers often need the primary source"
  notes:
    say: |
      Self-check for section 8.2. Read all four options before you choose. The question is about the stopping rule:
      how far do you take a claim? Remember the side rail of the funnel and the bottom bar of the funnel slide. One
      option says everything goes to an expert, one says confident claims can skip checking, one says only citations
      matter. Only one matches the book's rule that checks follow the stakes while no claim you rely on skips the first
      stage. Before you look at the answer, think of one claim from your own A5 that could stop at stage 1 and one that
      must go further. Then check the answer slide.
    background: |
      Review Questions A5 (O2 · LO3 · Understand). Key (Appendix E): (d). (a) is M6; (b) is the fluency trap from Chapter
      1, which M1 extends; (c) is M2's mirror image, since numbers and dates are among the claims that most need the
      primary source.
    activity: "Self-study."
    book: "§8.2; Review Questions A5; Appendix E."
  answer_notes:
    say: |
      The answer is (d): checks follow the stakes, and every claim you rely on gets at least stage 1, an independent
      check. Taking everything to an expert, option (a), sounds careful but is impossible in practice and wastes the
      expert's time on low-stakes claims. Option (b) is the fluency trap: sounding right is not evidence. Option (c) gets
      it backwards: numbers, quotations and citations are exactly the claims the chapter sends to the primary source.
      In A5, the funnel record criterion asks whether your stages fit your stakes, so write the reason next to each.
    background: |
      Stage-2 triggers (§8.2): high stakes, stage-1 sources disagree, or the claim is a number, a quotation or a citation.
      Stage-3 triggers: sources conflict, applying a rule needs judgment, or someone's health, money or rights depend on
      the answer.
    activity: "Self-study."
    book: "§8.2; Appendix E (Review A5)."

- layout: figure
  kicker: "§8.3 · Walters & Wilder (2023)"
  title: "Newer models invented fewer references, but not none"
  figure: f8-06-citations
  takeaway: "A named source is a pointer until you open it"
  notes:
    say: |
      Here is the evidence behind citation checking. In 2023, researchers asked ChatGPT to write short literature
      reviews on 42 topics. Of the references the GPT-3.5 version produced, 55 in 100 did not exist; with GPT-4, 18 in
      100. Among the references that did exist, 43% from GPT-3.5 and 24% from GPT-4 had substantive errors, such as wrong
      authors, years or page numbers. Newer tools often do better, though not always. And tools that search real
      documents first help, but are not a cure: in a 2024 test, legal research tools built that way gave incorrect or
      misgrounded answers on 17% to 33% of questions. Misgrounded means backed by a source that does not support the
      answer.
    background: |
      Walters & Wilder (2023), Scientific Reports 13, 14045. OpenAI (2025, April 16) system card: two newer models made
      up facts about people more often than an older one on its own test, 33% and 48% vs. 16%. Magesh et al. (2025),
      Journal of Empirical Legal Studies, 202 questions. Retrieval is Chapter 3's term. Further reading: Chelli et al.
      (2024) for medical systematic reviews. Dated results; tool behavior changes.
    misconceptions:
      - m: "M2 'If the output names a source, the claim has been verified.'"
        fix: "Use both bars: fewer fakes with GPT-4, not none, and many real references had errors. Not 'AI references are always fake'."
    activity: "Self-study."
    book: "§8.3 (Predict box), @fig-8-6."

- layout: quiz
  kicker: "Quick check · §8.3"
  title: "a real author, a wrong title"
  question: "An output cites a journal article with a real author and a real journal, but the title and pages match nothing in the journal’s archive. Which statement is most accurate?"
  options:
    - "The real author’s name shows the citation is reliable."
    - "Ask the tool if it is real; if it says yes and names the journal, cite it."
    - "It may not exist or may be another work; match each detail to the record."
    - "The output named a source, so the claim is verified."
  answer: c
  answer_minutes: 0
  explanation: "(a) and (d) are M2; (b) is M3: the tool’s yes is not a check"
  notes:
    say: |
      Self-check for section 8.3. A real author and a real journal make a citation look solid, and that is exactly why
      this kind of reference slips through. But the title and pages match nothing in the journal's archive. Before you
      choose, ask yourself two questions. Which of the three citation failures could this be: a work that does not
      exist, a work whose details belong to something else, or a real work that does not say what is claimed? And which
      check comes next, using an index that no AI tool produced? Two of the options rely on the output's own word, in
      different forms. Choose, then compare with the answer slide.
    background: |
      Review Questions A7 (O3 · LO3 · Understand). Key (Appendix E): (c). (a) and (d) are M2 (a named source is a pointer,
      not evidence); (b) is M3 (the tool's yes, even with a journal name, is not a check). A real name attached to a
      nonexistent work is common in fabricated references.
    activity: "Self-study."
    book: "§8.3; Review Questions A7; Appendix E."
  answer_notes:
    say: |
      The answer is (c). The work may not exist at all, failure 1, or its details may belong to another work, failure
      2. Match each detail to the record: search the author's publications in the journal's archive and in your library
      catalog. If a record shows a different article with similar details, the citation is contradicted as cited, and
      you correct it from the record before using it. If you cannot find it in two indexes, it is unsupported, and your
      uncertainty line names the indexes. A real author's name is not evidence that this particular article exists.
    background: |
      Faded Example "Lucia's Enron Paragraph" (Appendix E): reference 2 is real but with wrong year and journal (Healy &
      Palepu, 2003, Journal of Economic Perspectives), so contradicted as cited; reference 3 matches nothing, so
      unsupported, with the indexes named.
    activity: "Self-study."
    book: "§8.3; Appendix E (Review A7; Faded Example 8.3)."

- layout: lanes
  kicker: "§8.4 · constructed example (book figure: three runs, redrawn)"
  title: "Agreement is not proof; disagreement is a warning"
  rows:
    - label: "Run 1"
      nodes:
        - {label: "“How many sections?”", kind: human, role: neutral}
        - {label: "Four, incl. BEC · “95% sure”", kind: ai}
        - {label: "Agrees with run 2; outdated", kind: step}
    - label: "Run 2"
      nodes:
        - {label: "Same question, new chat", kind: human, role: neutral}
        - {label: "Four, incl. BEC · “95% sure”", kind: ai}
        - {label: "Agrees with run 1; outdated", kind: step}
    - label: "Run 3"
      nodes:
        - {label: "Same question, new chat", kind: human, role: neutral}
        - {label: "Three core + one discipline", kind: ai}
        - {label: "Disagrees: check first", kind: human, role: risk}
  caption: "Each fresh run picks its words again (Chapter 3). Use temporary chats, or memory off."
  takeaway: "Two runs agreed at “95% sure”, and both were outdated"
  notes:
    say: |
      Back to Lucia, before she checked claim 1. She asks the same question in three temporary chats and asks the tool
      to state its confidence. Runs 1 and 2 repeat the four-section structure, each "95% sure". Run 3 describes three
      core sections plus a discipline section. Reading the signals: the disagreement flags claim 1 as one to check first.
      The funnel showed that the agreeing majority was wrong, and that the two "95%" ratings did not make it right. So
      a consistency check is useful for ordering your work. It is not a vote. Use temporary chats or turn memory off, or
      the runs are not really fresh.
    background: |
      Worked Example "What the Signals Would Have Shown" (constructed). Each run picks its words again with some
      randomness (Chapter 3). Disagreement → treat as unreliable (Manakul et al., 2023); agreement is weaker evidence
      because such methods catch answers that vary, not errors a model repeats (Farquhar et al., 2024). Faded example
      (a quotation, three agreeing runs at "90% sure") key: next stage is 2, the primary source, because quotations need
      the passage check (Appendix E).
    misconceptions:
      - m: "M4 'If several runs, or several tools, give the same answer, it is correct.'"
        fix: "Point to runs 1 and 2: same answer, same confidence, both outdated."
    activity: "Self-study."
    book: "§8.4, @fig-8-7; Worked and Faded Examples."

- layout: quiz
  kicker: "Quick check · §8.4"
  title: "the flip"
  question: "You ask a tool a question whose answer you have not checked. You reply, “I think that’s wrong,” and the tool changes its answer. What does the change tell you, and what do you do next?"
  instruction: "Two sentences: what it shows, what you do"
  answer_minutes: 0
  model_answer:
    - "**It shows:** the answer is unstable, a warning sign. It does not show which answer is right; you have checked neither."
    - "**Next:** take the claim through the funnel, at least stage 1, stage 2 if the stakes are high."
  notes:
    say: |
      Self-check for section 8.4. A flip under pushback is one of the four uncertainty signals. But be careful about
      what it shows. You have not checked either answer, the first one or the new one. Does the new answer become the
      right one because the tool agreed with you? Does the old one become wrong because you doubted it? Write two
      sentences: what the flip shows, and what you do next. Then compare with the answer slide. Bonus question: what
      would it have meant if the tool had held firm instead of changing its answer?
    background: |
      Review Questions A11 (O4 · LO3 · Apply); model answer in Appendix E. Chapter 4's pushback test challenges an answer
      you already know is correct; on an unchecked claim a flip shows instability, and holding firm is no evidence either
      way (§8.4; book decision on overconfidence labeling).
    activity: "Self-study."
    book: "§8.4; Review Questions A11; Appendix E."
  answer_notes:
    say: |
      The flip shows that the answer is unstable, which is a warning sign. It does not show which answer is right,
      because you have checked neither the first answer nor the second. A tool that changes its answer to agree with
      you may be producing what you seemed to want, which is the sycophancy leaf you met in Chapter 4. So the next step is
      the funnel: at least stage 1, and stage 2 if the stakes are high. And the bonus question: had the tool held firm,
      that would have been no evidence either way. In Mata, the replies held firm and were wrong.
    background: |
      Appendix E, Review A11. Sycophancy is a leaf of overconfidence on Chapter 4's tree; label overconfidence only with
      evidence about expressed certainty (book decision on overconfidence labeling).
    activity: "Self-study."
    book: "§8.4; Appendix E (Review A11); Chapter 4 (pushback test)."

- layout: quiz
  kicker: "Quick check · §8.5"
  title: "twenty answers at 90%"
  question: "A tool states “90% sure” on each of 20 answers. Based on the published tests in this chapter, which expectation is most reasonable?"
  options:
    - "About 18 will be right; the tool’s stated confidence matches its accuracy."
    - "Probably fewer than 18; check the high-stakes answers."
    - "The stated confidence has no relation to which answers are right."
    - "Fewer than half, because stated confidence runs opposite to accuracy."
  answer: b
  answer_minutes: 0
  explanation: "(a) is M5; (c) overcorrects; (d) reverses the finding: confidence and accuracy rose together"
  notes:
    say: |
      Self-check for section 8.5. Twenty answers, each "90% sure". If the tool were perfectly calibrated, about 18 would
      be right. What did the published tests in the chapter find? Remember two things at once: stated confidence tended
      to run ahead of accuracy, and answers stated with higher confidence were still more often right. Two of the options
      throw away one of those findings; one option ignores both. Choose the option that keeps both findings, and say
      what you would do with the twenty answers before relying on them.
    background: |
      Review Questions A13 (O4 · LO3 · Understand). Key (Appendix E): (b). (a) is M5; (c) overcorrects (higher confidence
      did go with more right answers); (d) reverses the finding. Sources: Xiong et al. (2024); Wei et al. (2024).
    activity: "Self-study."
    book: "§8.5; Review Questions A13; Appendix E."
  answer_notes:
    say: |
      The answer is (b): probably fewer than 18, so check the high-stakes answers. In published tests, stated confidence
      clustered high and ran ahead of accuracy, but it still rose with accuracy, so it is a weak signal, not a useless
      one. That rules out (c) and (d). And (a) is the misconception itself. Two cautions from the chapter: ten or twenty
      questions give a rough picture, not a measurement of the tool; and good calibration is not the same as usefulness.
      A tool that says 60% to everything and is right 60% of the time is perfectly calibrated and tells you nothing.
    background: |
      Faded Example "Lucia's Study Questions" key (Appendix E): 90–100% group 4 of 7 = 57%; gap 94 − 57 = 37 points; the
      tool's high confidence on accounting questions is overconfident; seven answers give a rough picture.
    activity: "Self-study."
    book: "§8.5; Appendix E (Review A13; Faded Example 8.5)."

- layout: compare
  kicker: "Case Study · labels (Chapter 4's tree and chain)"
  title: "Mata on the tree and the chain"
  size: 22
  columns:
    - heading: "Tree · primary"
      role: risk
      bullets: ["Hallucination", "Invented facts or sources", "**Documented** (¶ 36)"]
    - heading: "Tree · secondary"
      role: risk
      bullets: ["Overconfidence", "Certainty beyond the evidence", "**Documented** (¶ 45)"]
    - heading: "Chain · link 2"
      role: risk
      bullets: ["“Checked before use?” failed", "**Documented** (¶¶ 6, 12)"]
  takeaway: "The tree labels the output; the chain labels what people did"
  notes:
    say: |
      The Case Study labels the Mata failure with Chapter 4's tools. On the Failure Taxonomy Tree, the primary label is
      hallucination, leaf invented facts or sources, documented: the record shows the decisions do not exist and were
      generated by ChatGPT. The secondary label is overconfidence, leaf certainty beyond the evidence, also documented:
      asked directly, the replies affirmed the cases were real and findable in named databases. On the failure-to-harm
      chain, link 2, "checked before use?", failed, documented: the signer read none of the cases, and the writer cited
      one his own search could not find. The tree labels what went wrong in the output; the chain labels what people
      and workflows did.
    background: |
      Book figures @fig-8-11 (tree) and @fig-8-12 (chain), redrawn here as three cards. The insistence that "Varghese"
      existed (¶ 47) is reported (the lawyer's declaration); ¶ 45 is in the court's findings. Before anyone checked, a
      firm answer was no evidence either way; the overconfidence label rests on expressed certainty (book decision on overconfidence labeling). Moffatt
      (Chapter 4) carries no overconfidence label because its chatbot gave plain instructions with no such statement.
      Case Study Question 1 key in Appendix E.
    misconceptions:
      - m: "M3 'Asking the tool whether its source is real is a check.'"
        fix: "The secondary label exists precisely because the replies affirmed reality; an affirmation is a signal of overconfidence, not evidence."
    activity: "Self-study."
    book: "Case Study, @fig-8-11, @fig-8-12; Case Study Questions 1–2; Appendix E."

- layout: compare
  kicker: "Case Study · short cases (recommended)"
  title: "Two more fabrications, two different gaps"
  size: 26
  columns:
    - heading: "Expert’s declaration (2025)"
      role: soft
      bullets: ["Two articles that do not exist", "Statement excluded, Jan 10, 2025", "Hallucination, documented"]
    - heading: "Summer reading list (2025)"
      role: soft
      bullets: ["10 of 15 titles false (Bell, 2025)", "No review by the paper’s editors", "Link 2 failed, documented"]
  takeaway: "An expert’s statement is evidence to check, not the end of checking"
  notes:
    say: |
      Two short cases from 2025. In a Minnesota case over a state law on election deepfakes, the state filed a sworn
      statement by a university expert on AI and misinformation. It cited two academic articles that do not exist and
      gave the wrong authors for a third. The court's order records that the errors apparently came from his use of
      GPT-4o in drafting, and the judge excluded the statement. She did not fault the use of AI; she faulted the
      unchecked citations. In the second case, a newspaper's licensed summer insert paired real authors with books that
      do not exist: 10 of 15 titles were false, according to the newspaper owner's chief executive. A stage-1 catalog
      search per title would have flagged them.
    background: |
      Kohls v. Ellison (D. Minn. Jan. 10, 2025, ECF 46): AI origin "apparently" GPT-4o, recorded in the order (p. 3);
      excluded (pp. 8–9); corrected version denied as moot (pp. 11–12). Tree: hallucination, invented facts or sources
      (documented, p. 3); Case Study Question 4 asks for the chain link. Reading list: Chicago Sun-Times, May 18, 2025;
      King Features insert; 10 of 15 false per Melissa Bell, CEO of Chicago Public Media (Bell, 2025); newspaper's
      statement that a freelance writer used AI and it ran without review by its editors (Chicago Sun-Times, 2025); the
      Philadelphia Inquirer also ran the supplement and the company ended its relationship with the writer (Mihalopoulos,
      2025; reported). "A stage-1 check would have flagged them" is this book's inference.
    activity: "Self-study."
    book: "Case Study, short cases 1–2; Case Study Questions 4–5."

- layout: deep
  kicker: "Deep 8.A · book figure: two checkers"
  title: "Going deeper: precision and recall of a checker"
  size: 24
  bullets:
    - "**Precision:** of the flagged, how many were fake?"
    - "**Recall:** of the fakes, how many were flagged?"
    - "**A** flags 8 of 20: precision 50%, recall 80%"
    - "**B** flags all 20: recall 100%, useless"
  takeaway: "An AI checker is a signal, not a stage"
  notes:
    say: |
      Use this only if a student asks about automatic checkers. Some tools match references against an index with no
      AI model involved; others are AI models themselves. Chapter 2's Deep section gave two numbers for judging them.
      Precision: of the references the checker flagged, what share were really fake? Recall: of the references that were
      really fake, what share did the checker flag? Checker B flags all 20 references, so it catches all 5 fakes: perfect
      recall, and useless, because you still check all 20. Checker A flags 8 and catches 4 of the 5: precision 50%,
      recall 80%. Whether that is good enough depends on the stakes. For a court filing, a missed fake is the expensive
      error.
    background: |
      Deep 8.A (optional, not examinable; D20). Constructed checkers (@fig-8-14). Self-checking evidence is mixed:
      chain-of-verification reduced hallucinations on several tasks (Dhuliawala et al., 2024); without outside feedback,
      models revising their own reasoning answers often did not improve and sometimes got worse (Huang et al., 2024).
      This book's inference (D-8.5): an AI checker, including a model checking itself, is an uncertainty signal, not a
      funnel stage; an index-matching checker does part of stage 1.
    activity: "Self-study, or 1 minute if a student asks about automatic checkers."
    book: "Deep 8.A, @fig-8-14."

