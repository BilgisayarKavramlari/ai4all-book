- layout: tps
  minutes: 15
  kicker: "Share and critique · 15 min"
  title: "Did your top option survive?"
  prompt:
    - "Clearest proxy, and for whom?"
    - "Did your test change top, margin or shortlist?"
    - "Which blank has a real value you can get?"
  phases:
    - {name: "Think", min: 2, text: "One line each"}
    - {name: "Team", min: 5, text: "Pick one assumption"}
    - {name: "Share", min: 8, text: "Report; critique tests"}
  notes:
    say: |
      Share and critique. On your own, answer the three questions in one line each: which criterion in your matrix was
      the clearest proxy, and for whom was the gap bigger; did your sensitivity test change the top option, the margin
      or the shortlist; and for which blank could the real value be obtained, and how. Then, as a team, or as a pair for
      scenario C, pick one hidden assumption to report. In the last eight minutes each team says whether its top option
      survived and names that assumption. The rest of us critique the test, not the person: was it a defensible
      change? Would another test have been more revealing? Remember that "it survived" is a good result, if you can
      show how you know.
    background: |
      Debrief questions from labs/ch11-lab1.md (evaluate, analyze, apply). What to listen for: "lower is better"
      criteria not reversed; blanks scored as the lowest value or dropped without a note; one winner with no margin;
      weight changes that are not defensible (e.g., zeroing a criterion to force a result). Scenario-specific
      observations: private/ch11-a9-key.md (instructor only).
    misconceptions:
      - m: "M5 'A decision matrix makes a decision objective.'"
        fix: "When a team's top changes under a small weight change, ask what the owner should take from the margin."
    activity: "Think 2 · team 5 · share 8. Call first on a team whose top option did not survive, then one whose did."
    book: "Lab 11.1 step 5 and Debrief; §11.5."

- layout: objectives
  minutes: 2
  kicker: "Chapter summary (book figure: summary card)"
  title: "What you can do now"
  items:
    - {code: "O1", text: "**Distinguish:** informs, recommends, triggers; name the owner"}
    - {code: "O2", text: "**Test a blank:** count, ask why, get the real value, compare"}
    - {code: "O3", text: "**Evaluate a proxy:** mean? measure? for whom is the gap bigger?"}
    - {code: "O4", text: "**Verify:** six places; recalculate outside the tool"}
    - {code: "O5", text: "**Stress-test:** margins and shortlists, not only the top"}
    - {code: "O6", text: "**Design** a review step that makes disagreement possible"}
  takeaway: "AI can do the arithmetic. You own the choices, and the decision."
  notes:
    say: |
      Back to the opening question: can an AI-assisted analysis make a decision for you? It can do the arithmetic, draft a
      matrix and propose an option in seconds. But every analysis rests on choices: what a blank means, what a number
      stands in for, how criteria are weighted. Each can change the answer, and people who review a score tend to follow
      it. Now your warm-up. Can scores be unequal without race in the data? Yes: a proxy label carried the gap. Can two
      blanks change the best option? Yes: five ways of handling them all picked the wrong event. Does a doctor's review
      make errors harmless? No: reviewers often follow automated advice, and in the case doctors saw only the patients
      the score sent them. Compare those answers with your confidence ratings.
    background: |
      Chapter Summary and @fig-11-21. Answer to the chapter question (hedged, as in the book): get the real values where
      you can, recalculate what the decision depends on, test whether another defensible choice changes the result,
      and decide as the owner, with your reasons written down. If students did not keep their warm-up, ask them
      to answer again now and rate their confidence.
    activity: "Ask two students: 'Which warm-up answer did you get wrong with high confidence?'"
    book: "Chapter Summary, @fig-11-21; Warm-up revisit."

