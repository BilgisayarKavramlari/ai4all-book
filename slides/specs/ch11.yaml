- layout: quiz
  minutes: 2
  kicker: "Lab session · warm-up from memory"
  title_prefix: "Warm-up"
  title: "proxies and places"
  question: "Write the three proxy questions, and three of the six places to check an AI analysis."
  instruction: "No notes, no screens: write, then check with your team"
  model_answer:
    - "**Proxy:** What do we mean? What do we measure? For whom is the gap bigger?"
    - "**Six places:** rows in and out · blanks and impossible values · definitions and units · time window · totals vs. groups · formula or code"
  notes:
    say: |
      Warm-up, from memory, no notes and no screens. Write the three questions you ask of any proxy, and then name three
      of the six places a hidden choice can change an analysis. One minute to write, one minute to check with your team.
      These are exactly the tools you need today: the proxy questions drive the criteria audit, and the six places
      drive the recalculation. If someone is stuck, give a hint: the third proxy question is the one accuracy checks
      miss, and the first place to look is the one that caught Lucía's error.
    background: |
      Check Yourself 11.3 and 11.4 item 2. Retrieval two days after first meeting the ideas. Answers: §11.3 three
      questions; §11.4 six places (F11.12).
    activity: "1 min write, 1 min team check, then the answer slide."
    book: "§11.3; §11.4; Check Yourself 11.3–11.4."
  answer_minutes: 1
  answer_notes:
    say: |
      Here they are. The proxy questions: what do we mean, what do we measure, and for whom is the gap bigger? The six
      places: rows in and rows out; blanks and impossible values; definitions and units; time window; totals versus
      groups; formula or code. Now connect them to today. In your criteria audit, you ask the proxy questions of every
      criterion, plus a fourth point: how were its blanks handled, and can you get the real value? In your
      recalculation, places one, two and six are the ones you will use most: how many rows did the tool use, how did it
      treat the blanks, and did it reverse the "lower is better" criteria?
    background: |
      A9 item 3 (criteria audit): meant, measured, proxy and for whom, blanks and whether the real value can be
      obtained. Lab expected observations: AI-drafted matrices often score a blank as the lowest value or drop it
      without a note, add "lower is better" criteria without reversing them, and present one winner without margins.
    activity: "Reveal; connect to the lab steps."
    book: "§11.3; §11.4; Lab 11.1 'Expected observations'."

- layout: lab
  minutes: 4
  kicker: "Lab 11.1 · teams of 3–4 (A′, B′) or solo (C) · individual A9"
  title: "Decision audit: does the top option survive?"
  goal: "Audit an AI-drafted matrix; recalculate; test it"
  steps:
    - {text: "**Draft:** the scenario file and the brief’s prompt in a tool, or the provided dated output. Save prompt, tool, model, date", min: 10}
    - {text: "**Criteria audit** (individual): meant · measured · proxy, for whom · blanks, real value?", min: 15}
    - {text: "**Recalculate** the top two in the template, with verdicts; **test:** change one weight or blank → new top, margin, shortlist", min: 20}
  side:
    - {heading: "Deliverable", text: "A9 items 2–5 started; team drafts ungraded"}
    - {heading: "Privacy", role: risk, text: "Constructed data only. C: options, never people; your data only in a tool your institution provides or approves"}
    - {heading: "No device or no AI?", text: "Printed scenario sheets and the provided matrix"}
  notes:
    say: |
      Here is the lab, 45 minutes of practice. Step one, draft, ten minutes: teams on A-prime or B-prime give an AI
      tool the scenario file with the prompt in the brief, or use the provided dated output. Save the prompt, the tool,
      the model if shown, and the date. Scenario C students do the same alone from their own table. Step two, criteria
      audit, fifteen minutes, individually: for each criterion, what it is meant to capture, what the data measure,
      whether it is a proxy and for whom the gap is bigger, how blanks were handled and whether the real value can be
      obtained. Step three, twenty minutes: enter the values in the spreadsheet template, compare its totals for the top
      two options with the tool's, give each a verdict, then change one weight or one blank and record the new top,
      the margin and the shortlist.
    background: |
      From labs/ch11-lab1.md. The template does the scaling, so students check the tool's totals rather than computing
      six by hand; if time is short, recalculate one total in class and the second at home. Step 4 is the bottleneck.
      Scenario-specific observations are in the instructor key (private/ch11-a9-key.md); do not reveal them, so the
      scenarios stay unsolved. Privacy: constructed scenario data only; no real candidates, employees, patients or
      customers. No-device route: printed scenario sheets and the provided matrix (the alternative assignment).
      Accessibility: screen-reader-friendly CSV files and A9 sheet on your course site; solo work for any student who prefers it.
    questions:
      - q: "The tool's arithmetic was right and the top option survived my test. Did I fail to find anything?"
        a: "No. Both are valid results and can earn full marks if your audit shows how you know (§11.7)."
      - q: "The tool refused or gave a broken matrix. What now?"
        a: "Use the provided dated output for your scenario on your course site, and record that in your declaration."
    misconceptions:
      - m: "M5 'A decision matrix makes a decision objective.'"
        fix: "Ask each team which single change moved their top option most."
    activity: "4 min briefing on this slide; the 45 minutes of practice run while the A9 sheet slide is on screen."
    book: "§11.7; Hands-on Labs, Lab 11.1; labs/ch11-lab1.md."

