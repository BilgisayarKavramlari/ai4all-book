# ======================================================================= REFERENCE SLIDES
- layout: deep
  session: after
  kicker: "Deep 11.A · why values go missing"
  title: "Going deeper: why a value is missing decides the fix"
  size: 22
  bullets:
    - "**MCAR:** a wet page → deletion loses data, no tilt"
    - "**MAR:** evening shifts, and you know which → a pattern fill can work"
    - "**MNAR:** long shifts unlogged *because* long → get the real value"
  takeaway: "Multiple imputation needs MAR; under MNAR, test the assumption"
  notes:
    say: |
      Use this slide only if there is time or a student asks why the shortcuts failed in Lucía's log. Statisticians
      distinguish three reasons values go missing. Missing completely at random: the reason has nothing to do with any
      data, like a wet page of sign-in sheets; deleting rows loses information but does not tilt the answer. Missing at
      random: the reason depends only on things you observed, such as evening shifts logged less often when the log
      records which shifts were evenings; a fill that uses that pattern can work. Missing not at random: the reason
      depends on the missing value itself. Lucía's log is this case: the longest shifts went unlogged because they were
      long, and nothing in the log could predict them. No method recovers values missing for reasons the data cannot
      see; you need the real value.
    background: |
      Deep 11.A (optional, not examinable): Rubin (1976); Sterne et al. (2009). Multiple imputation fills each blank
      several times with plausible values drawn from a model of the data, analyzes each completed dataset and pools the
      results so the answer carries the blanks' extra uncertainty; it is widely used when data are MAR, provided the
      model includes what predicts the missingness. Under possible MNAR, analysts run a sensitivity analysis: assume the
      missing values were somewhat higher or lower and check whether the conclusion survives. Book figure @fig-11-22.
      Lab 11.4 (Deep) reruns the chapter's code in a browser notebook. Deep 11.B (Silberzahn et al., 2018): 29 teams, 61
      analysts, one dataset, estimates from 0.89 to 2.93 in odds-ratio units.
    questions:
      - q: "Would a fill based on time of day have rescued Lucía's log?"
        a: "No. Every late shift is blank, so no logged shift shows what a late shift is like (Deep 11.A)."
    activity: "Optional; not part of the 75-minute plan."
    book: "Deep 11.A, @fig-11-22; Deep 11.B; Lab 11.4."

