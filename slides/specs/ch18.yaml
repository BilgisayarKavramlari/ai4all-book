    - "transformative (use)"
    - "authorship (in copyright)"
    - "registration (copyright)"
    - "trademark"
  note: "Definitions: Chapter 18 and the glossary."
  notes:
    say: |
      These are the chapter's key terms, on two slides. This first set is about where rules come from and about
      copyright. They can appear in Part A of the final, which asks for terms and concepts, so make sure you can define
      each in a sentence of your own. Focus on pairs that are easy to confuse: a trial court and an appeals court; a
      holding and a remark in a footnote, which is not a holding; copyright and trademark; authorship in copyright and
      ownership of a text from Chapter 10. A quick self-test: cover the slide and define three terms for a neighbor.
    background: |
      The chapter lists 39 key terms (36 Core, 3 Deep); they are split over two slides here, none omitted. Definitions
      are worded identically in the chapter and docs/glossary.md. Examinable scope: Core only (D20); legal citations in
      parentheses are not examinable.
    activity: "30-second pair self-test."
    book: "Chapter Summary, Key Terms; box 'How U.S. courts work'; glossary."

- layout: key_terms
  minutes: 0.5
  title: "Key terms (2 of 2): responsibility and regulation"
  terms:
    - "liability"
    - "provider (of an AI system)"
    - "deployer"
    - "disclaimer"
    - "EU AI Act"
    - "prohibited practice"
    - "high-risk AI system"
    - "transparency duty"
    - "deepfake"
    - "synthetic media"
    - "FERPA"
    - "HIPAA"
    - "right (in the rules-and-rights risk)"
    - "rules-and-rights risk"
    - "disparate impact (Deep)"
    - "opt-out (text and data mining) (Deep)"
    - "voice cloning (Deep)"
  note: "Definitions: Chapter 18 and the glossary. (Deep) terms are optional and not on exams."
  notes:
    say: |
      The second set is about responsibility and regulation. The pairs to keep apart: a provider, who builds an AI
      system or puts it on the market, and a deployer, who uses it in its own work; a prohibited practice, which may not
      be used at all, and a high-risk system, which may be used with duties; a deepfake and synthetic media more
      generally; FERPA for education records and HIPAA for health information. And the term you will use in the lab: a
      rules-and-rights risk, the A12 row that names one rule, its text and its owner. The three terms marked Deep come
      from optional sections and are not on the exam.
    background: |
      Glossary wording: deepfake = synthetic media that realistically shows a real person, or a real event, saying,
      doing or happening in a way that did not happen; Core chapters define it again at first use (book-wide rule, as
      Chapter 13 is Deep). Disparate impact, opt-out and voice cloning come from Deep 18.B–18.C.
    activity: "30-second pair self-test on the provider/deployer and prohibited/high-risk pairs."
    book: "Chapter Summary, Key Terms; glossary."

