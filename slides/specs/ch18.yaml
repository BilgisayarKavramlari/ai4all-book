# Lecture deck spec — Chapter 18: Intellectual Property, Law and Governance (shared unit)
# Format and notes standard: slides/README.md. Build: python3 tools/build_slides.py slides/specs/ch18.yaml --preview
# Independence (D27, docs/production/independence-rules.md): no institution, course code, term, calendar dates,
# enrollment, course-site system or syllabus references on slides or in notes; sessions are named by kind only.
#
# The unit is shared by Chapters 15, 16, 18 (Core) and 17 (Deep) (decision D22). Chapter 18's class time is small (keys are internal):
#   tue: about 7 of the 35 concept minutes (Ch. 18 blueprint §1: the Regulation Map and "three courts, three
#     answers") plus a 3-minute concept check (Review A1) = 10 min, matching the Chapter 15 deck's concept-session plan
#     ("Ch. 18 · 7 + check 3"; the 10 concept-check minutes are split 4 / 3 / 3 across Ch. 15, 16, 18).
#     The unit's opening case (Samsung), the demo and the other segments belong to the Ch. 15/16 decks.
#   thu: Lab 15.1 step 6, minutes 49–54 (the rules-and-rights risk for A12); the lab itself is run from Ch. 15.
# So the deck has a compact CORE part (sessions tue, 10 min, and thu, 5 min) and an EXTENDED optional part (session
# ext) that walks the Core sections 18.1–18.6 for instructors who have time (a review session, office hours, an extra session).
# The extended slides are optional class time, NOT optional content: sections 18.1–18.5 are examinable if your course has an exam.
# Every legal status line is dated "as of October 2026" (chapter, data/ch18_legal_status.csv); not legal advice.
# Every number below comes from the files under deck.sources.

