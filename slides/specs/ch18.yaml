- layout: objectives
  minutes: 1
  kicker: "Chapter 18 · learning objectives"
  title: "By the end of the unit you can…"
  intro: "**Not legal advice.** For a real decision, ask the person or office that owns the rule."
  items:
    - {code: "O1", text: "**Differentiate** the layers of rules on one AI task"}
    - {code: "O2", text: "**Analyze** a training dispute with fair use’s four factors"}
    - {code: "O3", text: "**Determine** what copyright protects in AI-assisted work"}
    - {code: "O4", text: "**Judge** whether a disclaimer moves responsibility"}
    - {code: "O5", text: "**Apply** EU risk tiers and a dated U.S. or Texas rule"}
  notes:
    say: |
      Five objectives. First, tell apart the layers of rules that apply to one AI task: law, agreements such as a
      tool's terms, and your organization's policy. Second, analyze a dispute about training data with the four
      fair-use factors. Third, decide which parts of an AI-assisted work copyright can protect. Fourth, judge whether a
      disclaimer such as "AI may make mistakes" moves responsibility for an error; the book's answer is no. Fifth,
      place an AI use in the EU's risk tiers and name a dated U.S. or Texas rule. And read the line at the top
      aloud with me: this is not legal advice. If a real decision depends on a rule, ask the rule's owner, in writing,
      and keep the answer.
    background: |
      Full wording and tags (chapter): O1 Differentiate (LO5; AI Fluency Diligence); O2 Analyze (LO5; Discernment);
      O3 Determine, including what to disclose when registering (LO5, LO4; Diligence, Description); O4 Judge (LO5;
      Diligence; UNESCO human-centred mindset); O5 Apply (LO5; Discernment). Note: the blueprint's objective table
      still says "Classify" for O1 and O5; the chapter v2 (which governs) says Differentiate and Apply. The
      not-legal-advice line appears in the chapter's opening of 18.1 and in every A12 risk ("not a legal opinion").
    misconceptions:
      - m: "M6 'If it is legal, it is allowed in my course or job.'"
        fix: "Preview the working rule: follow the strictest rule that applies; a course or employer can be stricter than the law."
    activity: "Read the not-legal-advice line aloud."
    book: "Chapter 18, Learning Objectives; §18.1 first line."

- layout: timeline
  minutes: 2
  kicker: "Opening case · Thomson Reuters v. Ross (C15)"
  title: "Training on a competitor’s summaries"
  events:
    - {label: "License", text: "Ross asks to license Westlaw; refused", tier: "confirmed"}
    - {label: "Memos", text: "About 25,000 memos framed with headnotes", tier: "confirmed"}
    - {label: "Feb 2025", role: risk, text: "Trial court: not fair use", tier: "confirmed"}
    - {label: "Sept 2026", role: risk, text: "Appeals court affirms", tier: "confirmed"}
    - {label: "Oct 2026", text: "Ross plans Supreme Court petition", tier: "reported"}
  takeaway: "Two 2025 rulings favored AI companies. Why?"
  notes:
    say: |
      Thomson Reuters owns Westlaw, a legal-research service whose editors write headnotes: short summaries of a point
      of law in a court decision. Ross Intelligence, a start-up, asked to license Westlaw's content for an AI
      legal-search tool and was refused, because it was a competitor. Ross then had about 25,000 training memos
      written; the writers used Westlaw headnotes to frame the questions. Ross's tool did not write new text: it
      returned passages from court decisions. Thomson Reuters sued in 2020. In February 2025 the trial court held that
      copying 2,243 headnotes to train the tool was not fair use, and on September 29, 2026 the appeals court agreed.
      The puzzle: in 2025 two other federal judges ruled for AI companies that trained on books. Why the difference?
    background: |
      Tiers: confirmed from the two opinions (trial court, D. Del., Feb 11, 2025; Third Circuit, Sept 29, 2026): license
      refused; memos; not generative; 2,243 headnotes; both rulings. Reported: Ross shut down (announced December
      2020, offline January 2021; Ambrogi, 2020); as of October 2026, Ross had asked for more time to seek a rehearing
      and planned to ask the Supreme Court to review the case (Ambrogi, 2026; Davis, 2026). The trial court allowed an
      immediate appeal on April 4, 2025. Court box (chapter): a holding binds the courts below and is only persuasive
      elsewhere; the Third Circuit covers Delaware, New Jersey, Pennsylvania and the U.S. Virgin Islands. Labels: an
      input-side harm; no output was wrong, so the Failure Taxonomy Tree does not apply (data-flow map instead).
    questions:
      - q: "Does this ruling make AI training illegal?"
        a: "No. It binds courts in the Third Circuit, concerns a non-generative tool that competed with the original, and the court said in a footnote (not a holding) that generative models may differ (Case Study)."
    misconceptions:
      - m: "M2 'Courts have decided: AI training is legal' (or illegal)."
        fix: "Set up the puzzle: two results in the same year, both explained by the facts."
    activity: "Narrate; leave the puzzle on screen and move straight to the layers."
    book: "Opening Case; box 'How U.S. courts work'; Case Study 'The First Appeals Ruling on AI Training'; @fig-18-2."

# Redrawn natively from the Regulation Map (@fig-18-3): its nine boxes are below 15 pt at slide size. Columns run
# nearest first, as the section title says; the book figure states the boxes are kinds of rules, not a ranking.
- layout: compare
  minutes: 2
  kicker: "§18.1 · Core · the Regulation Map"
  title: "Rules come in layers, nearest first"
  size: 28
  columns:
    - heading: "Your organization"
      role: human
      bullets: ["Your course’s AI rule", "Institution’s AI policy", "Employer, placement"]
    - heading: "Agreements"
      role: soft
      bullets: ["Terms of service", "Licenses", "Contracts"]
    - heading: "Law, by jurisdiction"
      role: neutral
      bullets: ["EU", "U.S. federal, executive", "States, cities"]
  takeaway: "Follow the strictest rule that applies; ask its owner in writing"
  notes:
    say: |
      Several layers of rules apply to every AI use at once. Law is made by a government and enforced by courts or
      agencies: statutes, regulations, executive orders and case law, each from a jurisdiction such as the EU, the
      U.S., Texas or New York City. Closer to you are agreements: a tool's terms of service, licenses and contracts.
      Closest is your organization's policy: your course, your institution, your employer. Many institutions let each
      instructor permit, partly permit or prohibit AI use in a course. The working rule: follow
      the strictest rule that applies, and when a rule is unclear, ask its owner in writing and keep the answer. So
      "it's legal" does not mean "it's allowed in my course or job."
    background: |
      Definitions as in §18.1: law, statute, regulation, executive order, case law, jurisdiction, terms of service,
      license, policy, governance (the rules, roles and checks that decide how AI may be used and who is responsible
      for it). Where AI use is permitted, students cite and verify AI output; the
      three zones in Chapter 1 are one example of a course rule. Which data may enter which tool follows your institution's data
      classes (§12.5 table). The book's figure lists five law boxes (EU law; U.S. federal law; U.S. executive orders and
      policy, which change often; U.S. states, e.g., Texas TRAIGA; cities, e.g., NYC Local Law 144), terms and
      licenses, contracts, and your organization's policy, all pointing to "your AI use and the people it affects."
    questions:
      - q: "Which layer wins if two rules disagree?"
        a: "For you in practice: follow the strictest rule that applies and ask its owner. The book does not rank the layers legally; it gives a working rule (§18.1)."
    misconceptions:
      - m: "M6 'If it is legal, it is allowed in my course or job.'"
        fix: "Point at the left column: a course or employer rule can forbid what no law forbids."
    activity: "Ask: 'Name one rule from each column that applies to something you do with AI.'"
    book: "§18.1, @fig-18-3; Worked Example 'Hana's Menu Job' (@fig-18-4)."

- layout: compare
  minutes: 2
  kicker: "§18.2 · Core · book figure: rulings on a scale (as of October 2026)"
  title: "Three courts, three answers: the facts differed"
  size: 26
  columns:
    - heading: "Ross · appeals, 2026"
      role: risk
      bullets: ["Non-generative, competing tool", "**Not fair use**"]
    - heading: "Bartz · trial, 2025"
      role: soft
      bullets: ["Training on books: **fair use**", "Pirated library: **not**"]
    - heading: "Kadrey · trial, 2025"
      role: soft
      bullets: ["**Fair use** on this record", "The authors made the wrong arguments"]
  takeaway: "No U.S. appeals court has ruled on training a generative model"
  notes:
    say: |
      Here is the answer to the puzzle. Fair use is a U.S. exception decided case by case with four factors: the
      purpose of the use, including whether it is transformative; the nature of the work; how much was used; and the
      effect on the market. In Ross, the tool was not generative and served the same purpose as Westlaw, competing with
      it, so the appeals court called it "minimally transformative, at best" and found market harm. In Bartz v.
      Anthropic, a trial court held that training a model on books was fair use, but keeping a central library of
      pirated copies was a separate use and was not. In Kadrey v. Meta, another trial court ruled for Meta only because
      the authors had made the wrong arguments. Different facts, different answers.
    background: |
      Bartz v. Anthropic (N.D. Cal., June 2025): training "exceedingly transformative"; scanning bought books also fair
      use; the case settled for $1.5 billion, about $3,000 per work before fees and costs, final approval July 2026;
      as of October 2026, appeals of that order were pending. Kadrey v. Meta (N.D. Cal., June 2025): fair use on the
      record before the judge, who warned that it would often fail. As of October 2026, no U.S. appeals court had
      ruled on training a generative model. Ross binds courts in the Third Circuit; Bartz and Kadrey are trial-court
      rulings binding only their own cases (@fig-18-7 note). The colored card for Ross is also labeled "Not fair use"
      in words.
    questions:
      - q: "So is training on copyrighted books legal?"
        a: "Not settled. One trial court found training fair use on its facts; as of October 2026 no U.S. appeals court had ruled on generative training, and other countries use other tests (Deep 18.C)."
    misconceptions:
      - m: "M2 'Courts have decided: AI training is legal' (or illegal)."
        fix: "The law is not random either: factors 1 and 4 (same purpose, market harm) explain why Ross lost and Bartz's training won."
      - m: "M1 'If it is online, it is free to use, to train a model or paste into my project.'"
        fix: "Copyright arises automatically; uploading a whole protected text to a tool makes a copy that needs permission or an exception."
    activity: "Ask: 'Which single fact best explains why Ross lost?' (Same purpose, competing with the original.)"
    book: "§18.2, @fig-18-5, @fig-18-7; Check Yourself 18.2; Worked Example 'Ross, Factor by Factor'."

- layout: quiz
  minutes: 1.5
  kicker: "Quick check · §18.1 · Review A1"
  title: "which rule applies?"
  question: "Your course’s AI rule prohibits AI for an essay; your part-time employer allows a tool for work emails. You want to use the tool for the essay. What applies?"
  options:
    - "The employer’s rule, because an employer’s policy outranks a course’s rule."
    - "No rule, because no law forbids using AI to help write an essay."
    - "The course’s rule: for coursework, it is the rule that applies."
    - "Both equally, so you may choose whichever rule you prefer."
  answer: c
  instruction: "Vote in 20 seconds"
  explanation: "(b) is “legal means allowed”; (a) and (d) misread which layer governs"
  notes:
    say: |
      Quick check to close the concept-session segment. Read the four options and vote in twenty seconds. Your course's AI rule
      prohibits AI for an essay. Your part-time employer allows an AI tool for work emails. You want to use that tool
      for the essay. What applies? Watch for option (b): it is the misconception that whatever the law does not forbid
      is allowed. And watch for (a): an employer's policy governs work for the employer, not your coursework. If the
      vote splits, do not resolve it yet; ask one student from each side to give a reason in one sentence.
    background: |
      Review Questions A1 (O1 · LO5 · Apply), odd-numbered; key in Appendix E: (c). Distractors: (a) and (d) misread
      which layer governs; (b) is M6 (legal is not the same as allowed). Check Yourself 18.1 is the mirror case (course
      allows, employer forbids sharing the newsletter: the employer's rule decides, as the strictest that applies).
    activity: "20 s to read and vote (hands or a poll); if the vote splits, one reason from each side; then the answer slide."
    book: "§18.1; Review A1; Appendix E."
  answer_minutes: 1.5
  answer_notes:
    say: |
      The answer is (c). For coursework, the course's rule is the one that applies, and here it says no. The
      employer's permission covers work emails for the employer; it does not travel to your essay. Option (b) is the
      tempting one, and it is exactly the mistake this section is about: no law forbids using AI to write an essay,
      but legal is not the same as allowed. The mirror case is in Check Yourself 18.1: if your course allows AI but
      the article you want to upload comes from your employer's internal newsletter, the employer's rule decides,
      because it is the strictest rule that applies. In the lab session you will list one rule from each layer
      for your own workflow.
    background: |
      Appendix E, Check Yourself 18.1: the employer's rule decides (it forbids sharing outside the company); the
      course's permission and the tool's terms do not override it. Lab 15.1 step 6, prompt (a), asks for one rule in
      each layer and its owner.
    activity: "Reveal; take one question; then return to the Chapter 15 deck (guest or buffer, Before the lab)."
    book: "§18.1; Appendix E (Review A1, Check Yourself 18.1)."

# ======================================================================= LAB SESSION (Lab 15.1, step 6)
- layout: section
  session: thu
  minutes: 0
  number: "Lab"
  tag: "Lab"
  title: "Lab 15.1, step 6: rules and rights"
  idea: "Five minutes on your data-flow map; one risk for A12."
  meta: "Book §18.6 · Lab 15.1 minutes 49–54 · A12 due when your instructor sets it"
  notes:
    say: |
      Put this up at minute 49 of the red-team lab, right after the bias station. You have five minutes for Chapter
      18's part of A12: the rules-and-rights risk. Work on the data-flow map you drew at the start of the lab. You will
      answer five short prompts, about one minute each, and they become a scratch list of rules. Then you pick the one
      rule whose breach would harm people most or be hardest to undo, and you write it as a risk. You finish it at home
      in about three minutes. Remember: this records which rules to check and whom to ask; it is not a legal opinion.
    background: |
      Lab 15.1 (labs/ch15-lab1.md): step 5 (station 3, bias) runs 34–49; step 6 (rules and
      rights) 49–54; step 7 (gallery walk) 54–69; exit 69–75. Materials for step 6: printed excerpts of the course's
      AI policy, the §12.5 table and one provider's terms (instructor package, Chapter 18: the nine-row risk sheet as
      an accessible table; one-paragraph rules texts for Chapter 15's three alternative scenarios). A12 is due when the instructor sets it.
      Chapter 15's rubric scores this risk under "Register" and its mitigation under "Plan."
    activity: "On screen at minute 49; switch to the next slide immediately."
    book: "§18.6; Lab 15.1 step 6; Application Assignment (A12's rules-and-rights risk)."

- layout: lab
  minutes: 5
  kicker: "Lab 15.1 · step 6 · minutes 49–54 · one A12 risk"
  title: "Your rules-and-rights risk"
  goal: "One rule, its layer, its evidence, and whom to ask"
  steps:
    - {text: "(a) One rule per layer that may apply, and its owner", min: 1}
    - {text: "(b) Mark every place you copy someone else’s work", min: 1}
    - {text: "(c) Who owns the output? Could it copy someone’s work?", min: 1}
    - {text: "(d) If an output were wrong, who is responsible?", min: 1}
    - {text: "(e) EU tier, and one dated U.S. or Texas rule", min: 1}
  side:
    - {heading: "Write it", text: "“Risk of breaking [rule] or of [person] losing [right]”"}
    - {heading: "Evidence", role: verified, text: "D: you opened the rule’s own text and cite its section. Else I, with a reason"}
    - {heading: "No device?", text: "Printed excerpts: course policy, §12.5 table, one provider’s terms"}
  notes:
    say: |
      Five prompts, one minute each, on your map. (a) List one rule in each layer that may apply to your workflow:
      a law, an agreement such as the tool's terms, and your organization's policy, and who owns each rule. (b) Mark
      every place your workflow copies someone else's work: an upload, a paste, a stored file. (c) Who owns the output,
      and could it copy someone else's work? (d) If an output were wrong, who would be responsible? Name the role. (e)
      If the use were in the EU, which tier would it fall in, and which U.S. or Texas rule may apply, with its date?
      Then choose the highest-stakes rule and write the risk with the template on the right. Mark D only if you opened
      that rule's own text for this tool and data and can cite its section.
    background: |
      §18.6 steps: scratch list → choose the highest-stakes rule (whose breach would harm people most or be hardest
      to undo), name its layer and who is harmed → evidence D or I (for a law, I with a reason is acceptable: "read this
      chapter's summary, not the statute"; a provided scenario's rules paragraph counts as the rule's text) → rate
      likelihood and impact with Chapter 15's anchors; a mitigation (avoid, reduce, detect, accept) with a risk owner;
      the rule's owner with your question; last line "This records which rules to check and whom to ask; it is not a
      legal opinion." A right is something a law or agreement lets a person control or claim, such as copyright or
      privacy. Worked risk: Hana's zine (extended section).
    questions:
      - q: "I didn't open the tool's actual terms. Can I still mark D?"
        a: "No: D needs the rule's own text for this tool and data, with its section. Mark I and give the reason; the printed provider excerpt or a provided scenario's rules paragraph counts as the rule's text (§18.6)."
      - q: "Do I need to know the EU dates by heart?"
        a: "No. Prompt (e) asks you to name a tier and a dated rule from the chapter's status box; Review A tests tier reasoning, not dates."
    misconceptions:
      - m: "M4 'If the AI erred, its maker is liable; a disclaimer protects the user.'"
        fix: "For prompt (d), push for a role in the student's own workflow (deployer or user), not 'the AI company'."
    activity: |
      Minute 49–54: call each prompt aloud at one-minute intervals; students write on the map. At minute 54 announce
      the gallery walk. Students who were absent use the printed excerpts at home (Lab 15.1, accessibility).
    book: "§18.6, @fig-18-14 (rules on the data-flow map), @fig-18-15 (risk sheet); Lab 15.1 step 6; Check Yourself 18.6."

