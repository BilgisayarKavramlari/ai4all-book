  meta: "Book §18.1–18.6 · use any slide if time allows"
  notes:
    say: |
      The slides from here on are an extended section. Use them if a session has spare time, for a review session
      before an exam, or in office hours; students can also read them as a guide to the chapter. They follow the
      Core sections in order: privacy law applied to you, fair use factor by factor, who owns AI output, who is
      responsible when AI is wrong, the EU's risk tiers with dated status slides for the EU and the U.S., and a worked
      rules-and-rights risk. Tell students plainly: these slides are optional to present, but sections 18.1 to 18.5
      are Core and examinable, so the reading is not optional.
    background: |
      Total about 27 minutes if every slide is used. Pick by need: if students struggle with A12, show Hana's zine
      risk; if an exam is near, show the quick checks (Review A5, A7, A9 and the tier sort; all odd-numbered or from
      the chapter's worked example). Dated slides carry "as of October 2026"; recheck them against
      data/ch18_legal_status.csv and the refresh list before teaching.
    activity: "Divider; choose which extended slides to use."
    book: "§18.1–18.6."

- layout: compare
  minutes: 2
  kicker: "§18.1 · Core · privacy law, applied to you"
  title: "Privacy law in a student’s day"
  size: 24
  columns:
    - heading: "FERPA"
      role: soft
      bullets: ["Students’ education records", "Tutor or student worker: no AI tool"]
    - heading: "HIPAA"
      role: soft
      bullets: ["Health information", "Clinical placement: its rules too"]
    - heading: "Others’ data"
      role: soft
      bullets: ["Consent may be needed", "Texas TDPSA: businesses, not state agencies"]
  takeaway: "The §12.5 data classes are your starting floor for choosing a tool"
  notes:
    say: |
      Chapter 18 owns the legal layer of privacy, applied to your situation. FERPA, the Family Educational Rights and
      Privacy Act, protects students' education records, such as grades. If you are a tutor or a student employee who
      sees them, you may share them only as your institution's rules allow; unless they expressly allow a tool, that means no AI tool.
      HIPAA, the Health Insurance Portability and Accountability Act, protects health information held by health
      plans, most health-care providers and the companies that handle it for them; in a clinical placement, patient
      information falls under it and the placement's rules. Other people's personal data may need their consent before
      you share it. And many states have privacy laws for businesses; Texas's does not apply to state agencies such as
      a public university.
    background: |
      §18.1 "Privacy law, applied to you": FERPA (U.S. Department of Education, n.d.); HIPAA (U.S. Department of
      Health and Human Services, n.d.); Texas Data Privacy and Security Act, in force since July 1, 2024, does not
      apply to state agencies such as a public university (Texas Department of Information Resources, n.d.). Chapter 15
      owns data handling (data-flow map, data classes in practice); Chapter 18 owns the legal layer (book-wide rule).
      The §12.5 data-class table (a generic three-level classification) is a starting floor, and your institution's or employer's own classification decides; a field rule (placement policy, IRB
      protocol, employer policy) can still say no to an input the table allows.
    questions:
      - q: "Can I paste a patient case from my placement into an AI chat tool if I remove the name?"
        a: "Not without the placement's permission: patient information falls under HIPAA and the placement's rules, and removing a name may not de-identify it (Chapter 15). Use a constructed case instead."
    activity: "Faded example to assign: 'A Patient Leaflet' (placement rule stops the plan; the terms question is the student's part)."
    book: "§18.1 'Privacy law, applied to you'; Faded Example 'A Patient Leaflet'; Chapter 15."

- layout: quiz
  minutes: 1
  kicker: "Quick check · §18.2 · Review A5"
  title: "Bartz v. Anthropic"
  question: "In *Bartz v. Anthropic* (2025), what did the trial court hold?"
  options:
    - "All copying of books for AI was unlawful, whatever the source of the copies."
    - "All copying of books for AI was lawful, whatever the source of the copies."
    - "Training was fair use, but keeping a library of pirated copies was not."
    - "Training was lawful only because the company had bought every book it used."
  answer: c
  instruction: "Answer alone, then vote"
  explanation: "(a) and (b) are “courts have decided”; (d) confuses the scanning holding with training"
  notes:
    say: |
      A check on the details of the fair-use cases. In Bartz v. Anthropic, what did the trial court hold? Answer on
      your own, then vote. Two of the options say the court decided something about all copying, lawful or unlawful;
      that is the misconception that "courts have decided" AI training. One option mixes up two separate parts of the
      ruling. Before you reveal, ask a student to state, in their own words, why keeping a library of pirated copies
      could be judged differently from training.
    background: |
      Review Questions A5 (O2 · LO5 · Analyze), odd-numbered; Appendix E key (c); (a) and (b) are M2; (d) confuses the
      scanning holding (scanning bought books was also fair use) with training. Faded Example "Two Ways to Get Books"
      practises the same distinction (use A: bought and scanned; use B: pirated central library).
    activity: "30 s alone, vote, answer slide."
    book: "§18.2; Review A5; Faded Example 'Two Ways to Get Books'; Appendix E."
  answer_notes:
    say: |
      The answer is (c). The trial court held that training a model on books was fair use, calling it exceedingly
      transformative, and scanning books the company had bought was fair use too. But keeping a central library of
      pirated copies, including books it never used for training, was a separate use, and not fair use. That is why
      the case settled: for $1.5 billion, about $3,000 per work before fees and costs. Note what the settlement paid
      for: claims about pirated copies downloaded and kept, not training, which the court had found fair. Whether that
      outcome is fair to authors is a question the ruling did not ask; the Ethics Lens takes it up.
    background: |
      Bartz v. Anthropic, order on fair use June 23, 2025; settlement final approval July 2026; as of October 2026,
      appeals of that order were pending. Ethics Lens: three positions (permission first; opt-out, as the EU's mining
      rule allows; pay afterward). Hana opposes training on artists' work without consent; that is Hana's view, stated
      as theirs.
    activity: "Reveal; one follow-up comment."
    book: "§18.2; Appendix E (Review A5); Ethics Lens."

# Redrawn natively from @fig-18-6: the book figure's cell notes are below 15 pt at slide size.
- layout: compare
  minutes: 2
  kicker: "§18.2 · worked example: Ross, factor by factor (book figure: two courts)"
  title: "Same result on appeal, one factor decided differently"
  size: 26
  columns:
    - heading: "Trial court · Feb 2025"
      role: soft
      bullets: ["Purpose: against", "Nature: for", "Amount: **for**", "Market: against"]
    - heading: "Appeals court · Sept 2026"
      role: soft
      bullets: ["Purpose: against", "Nature: slightly for", "Amount: **against**", "Market: against"]
  takeaway: "Both: not fair use. The footnote is not a holding."
  notes:
    say: |
      Here are the four factors as the two courts weighed them, "for" and "against" meaning for or against fair use.
      Purpose: against in both; the appeals court called Ross's use "minimally transformative, at best," because it
      served the same purpose as Westlaw. Nature: for fair use, slightly, because headnotes are more factual than
      creative. Amount: the one factor decided differently. The trial court found it for Ross, because the outputs did
      not show headnotes; the appeals court found it against, because whole headnotes were copied and the court
      decisions themselves are free. Market: against in both; Ross competed with Westlaw and harmed a developing market
      for licensing headnotes as training data. Result in both courts: not fair use.
    background: |
      Thomson Reuters v. Ross (D. Del. Feb 11, 2025; 3d Cir. Sept 29, 2026). The trial court called factor 4 the most
      important; the appeals court described the training-data licensing market as developing fast. Both courts said
      the tool was not generative; the appeals court's footnote distinguishing generative models (such as those in
      Bartz) is not a holding. The headnotes are original enough to be protected, each as a work of its own. Case Study
      Question 3 asks how the two courts reasoned about factors 3 and 4 (odd: key in Appendix E).
    questions:
      - q: "If the result was the same, why does factor 3 matter?"
        a: "It changes the reasoning future courts can cite: copying whole works you do not need counts against you even if outputs never show them (Case Study Question 3, Appendix E)."
    activity: "Ask: 'Which factor carries great weight in both opinions?' (Market.)"
    book: "§18.2 Worked Example 'Ross, Factor by Factor', @fig-18-6; Case Study; Case Study Question 3."

# Redrawn natively from @fig-18-8 (menu layers): the figure's notes are small at slide size.
- layout: lanes
  minutes: 2
  kicker: "§18.3 · Core · worked example: Hana’s menu cover (constructed)"
  title: "Copyright protects what people author"
  label_width: 3.3
  rows:
    - label: "Generated draft"
      nodes:
        - {label: "Owner’s prompts only", kind: ai}
        - {label: "Not protected", kind: step, role: risk}
    - label: "Hana’s drawing"
      nodes:
        - {label: "Drawn by hand", kind: human}
        - {label: "Protected", kind: step, role: verified}
    - label: "Owner’s arrangement"
      nodes:
        - {label: "Text and pictures placed", kind: human, role: soft}
        - {label: "Thin protection at most", kind: step}
    - label: "Bakery logo"
      nodes:
        - {label: "Used as a brand", kind: human, role: soft}
        - {label: "Trademark (artwork: maybe ©)", kind: step}
  takeaway: "Terms saying “you own the output” cannot create a copyright"
  notes:
    say: |
      Authorship in copyright is the legal status of having created the expression in a work, and in U.S. law only a
      human can be an author. In 2025 an appeals court held that a work listed as made by an AI system alone could
      not be registered, and the Supreme Court declined to review it in 2026. The Copyright Office concluded that, with
      current technology, prompts alone do not give enough control; your own expression, creative selection or
      arrangement, and creative changes can be protected, case by case. Hana's menu cover shows the layers: the owner's
      generated draft is not protected; Hana's hand drawing is; the owner's arrangement has thin protection at most;
      the logo, as a brand, is the bakery's trademark. And a tool's terms cannot create a copyright the law does not
      grant.
    background: |
      Thaler v. Perlmutter (D.C. Cir. March 18, 2025; cert. denied March 2, 2026). U.S. Copyright Office (2025), Part 2
      (recommended reading): AI as an assisting tool does not affect protection; purely AI-generated material is not
      protected. Registration is optional but needed before suing over a U.S. work (17 U.S.C. § 411(a)); with more
      than a little AI-generated material, identify it and claim only your own part (USCO, 2023). Short phrases and
      slogans are not protected by copyright at all (37 C.F.R. § 202.1(a)). "Terms cannot create a copyright" is the
      book's reading. Ownership of a text (Chapter 10: you can explain and stand behind every sentence) is not
      authorship in copyright. Constructed example; Hana uses they/them.
    questions:
      - q: "If I write a really detailed prompt, am I the author?"
        a: "Per the Copyright Office (2025), prompts alone do not give enough control with current technology. Your own expression, selection, arrangement or changes in the output can be protected, case by case (§18.3)."
    misconceptions:
      - m: "M3 'I own whatever the tool makes from my prompt, and the terms say so.'"
        fix: "Separate contract from copyright; then the balancing fact so students do not overcorrect: AI-assisted work with your own expression can be protected."
    activity: "Assign the faded example 'A Product Description' (what to disclose when registering)."
    book: "§18.3, @fig-18-8, @fig-18-9; Worked Example 'Hana's Menu Cover'; Check Yourself 18.3."

- layout: quiz
  minutes: 1
  kicker: "Quick check · §18.3 · Review A7"
  title: "a four-word slogan"
  question: "A team writes a four-word slogan with no AI help. Can it register the slogan for copyright?"
  options:
    - "No: short phrases and slogans are not protected by copyright; trademark may apply."
    - "Yes: a person wrote it, so copyright protects it automatically from the moment it was written."
    - "Yes, but only if the team can prove that no AI tool suggested any of its words."
    - "No: copyright never protects anything written for business use."
  answer: a
  instruction: "Answer alone, then vote"
  explanation: "(b) and (c) assume any human writing is protected; (d) overcorrects"
  notes:
    say: |
      One more check on what copyright protects. A team writes a four-word slogan with no AI help at all. Can it
      register the slogan for copyright? This item is useful because it removes AI from the question: it tests
      whether you know what copyright covers in the first place. Take thirty seconds. Watch for the option that sounds
      most like the previous slide, the one that says a human author is enough, and for the option that overcorrects.
      Then ask: if copyright does not protect the slogan, what could protect it?
    background: |
      Review Questions A7 (O3 · LO5 · Apply), odd-numbered; Appendix E key (a): short phrases and slogans are not
      protected by copyright (37 C.F.R. § 202.1(a)); trademark may apply. (b) and (c) are M3; (d) overcorrects.
    activity: "30 s alone, vote, answer slide."
    book: "§18.3; Review A7; Appendix E."
  answer_notes:
    say: |
      The answer is (a). Short phrases and slogans are not protected by copyright at all, whoever wrote them. A slogan
      used as a brand can be protected another way: as a trademark, a word, name, logo or other sign that identifies
      who offers goods or services, protected for the business that uses it in trade. Option (b) is the natural
      mistake: human authorship is necessary for copyright, but it is not sufficient; the work also has to be the kind
      of expression copyright covers. Option (d) overcorrects: plenty of business writing, such as a report or a
      product description, can be protected.
    background: |
      §18.3: a drawn logo's artwork may also have copyright if a person drew it with enough originality. Faded Example
      "A Product Description": the intern's rewritten and added sentences can be protected if original; the tool's
      unchanged text cannot; if registered, identify the AI text and claim only her contribution (Appendix E).
    activity: "Reveal."
    book: "§18.3; Appendix E (Review A7)."

# The final reveal is about 60 words: the four links from output to responsibility on one slide are the point of
# the example (deliberate exception to the 40-word guide, as in Chapter 1's worked example).
- layout: worked
  minutes: 1.5
  max_words: 62
  kicker: "§18.4 · Core · worked example: a return window (constructed)"
  title: "Who is responsible when AI is wrong?"
  context: "A shop’s AI assistant answers a returns question."
  steps:
    - {label: "Output", text: "“60 days”; the policy says 30"}
    - {label: "Reliance", text: "Label: “may contain errors.” Day-45 return refused"}
    - {label: "Link 2", text: "Never checked against the policy"}
    - {label: "Responsible", text: "The shop, as deployer (book’s reading)"}
  reveal: [2, 4]
  result: "A label says how a message was made; it does not hand over the checking"
  notes_reveal:
    - minutes: 1.5
      say: |
        Liability is legal responsibility to make up for harm or to pay a penalty. Three roles: a provider builds an
        AI system or puts it on the market (Texas law says developer); a deployer uses it in its own work, such as a
        company with a website chatbot; a user works with the output. The model is not a legal person and has no
        duties. Now the case. An online shop's assistant tells a customer the return window is 60 days; the posted
        policy says 30. The chat window says "AI responses may contain errors." The customer returns the item on day
        45, and the shop refuses the refund. Ask: who is responsible, and does the label change that?
      background: |
        Worked Example "A Return Window" (§18.4), constructed; @fig-18-11 is Chapter 4's failure-to-harm chain for it.
        Roles figure @fig-18-10: provider, deployer, user and people affected, each with one duty; the model as a
        hexagon labeled "not a legal person."
      activity: "Pause; take two answers to 'who is responsible?'"
      book: "§18.4 Worked Example 'A Return Window', @fig-18-10, @fig-18-11."
    - minutes: 1.5
      say: |
        On Chapter 4's chain, link 2 failed: no one checked the assistant's policy answers against the policy page
        before launch. Who is responsible? By this book's reading of one decision, the shop, as deployer. In the
        airline chatbot case from Chapter 4, a British Columbia small-claims tribunal held the airline responsible for
        its chatbot's wrong answer like any page of its website. That is one decision, not a general rule, which is
        why the book calls it a reading. And the disclaimer? Whether it would have changed the airline case was not
        decided. The book's inference: a label tells readers how a message was made; it does not hand them the job of
        checking it.
      background: |
        Moffatt v. Air Canada, 2024 BCCRT 149 (Civil Resolution Tribunal, Feb 14, 2024); Mata v. Avianca (2023, Chapter
        8): lawyers penalized for filing AI-invented citations unchecked. Oversight is a duty: for high-risk uses the
        EU AI Act requires systems designed for human oversight and deployers who give that job to competent, trained
        people with authority; as of October 2026, from December 2, 2027 for listed uses (August 2, 2028 for regulated
        products). An approval gate (Chapter 14) meets such a duty. Check Yourself 18.4: "the deployer is responsible"
        rests on one small-claims decision, so it is a reading, not a rule.
      questions:
        - q: "Isn't the AI company that built the model responsible?"
          a: "Providers carry their own duties, but in the book's reading the organization that deploys the tool is responsible for what it tells people, as for any other statement it makes (§18.4)."
      misconceptions:
        - m: "M4 'If the AI erred, its maker is liable; a disclaimer protects the user.'"
          fix: "Walk the chain to link 2: the failure is the shop's missing check, and the label did not move it. Balance: providers are not off the hook; they have their own duties."
      activity: "Assign the faded listing example (1,850 vs. 1,580 square feet) as practice."
      book: "§18.4; Check Yourself 18.4; Faded Example 'A Listing'; Chapter 4 (Moffatt), Chapter 8 (Mata)."
  notes:
    book: "§18.4 Worked Example 'A Return Window'."

- layout: quiz
  minutes: 1
  kicker: "Quick check · §18.4 · Review A9"
  title: "the airline chatbot"
  question: "In the airline chatbot case (*Moffatt v. Air Canada*), who was held responsible for the chatbot’s wrong answer?"
  options:
    - "The chatbot’s maker, because the model produced the error."
    - "The airline, which ran the chatbot on its own website."
    - "The customer, who should have checked the policy page."
    - "No one, because a chatbot’s statements are not binding."
  answer: b
  instruction: "Answer alone, then vote"
  explanation: "(a) is “its maker is liable”; (c) and (d) contradict the decision"
  notes:
    say: |
      Quick retrieval from Chapter 4, now with Chapter 18's vocabulary. In the airline chatbot case, who was held
      responsible for the chatbot's wrong answer? Thirty seconds, then vote. When you reveal, use the roles from the
      previous slide: provider, deployer, user. Ask which role the airline played. And remind students what the book
      claims and does not claim: the decision is one small-claims ruling in British Columbia, so the book builds a
      reading on it, not a rule. You met this case in Chapter 4; this time, ask why the outcome matters for any
      organization that puts a chatbot on its website.
    background: |
      Review Questions A9 (O4 · LO5 · Understand), odd-numbered; Appendix E key (b). (a) is M4; (c) and (d)
      contradict the decision. Moffatt v. Air Canada, 2024 BCCRT 149 (met in Chapter 4).
    activity: "30 s alone, vote, answer slide."
    book: "§18.4; Review A9; Appendix E; Chapter 4."
  answer_notes:
    say: |
      The answer is (b): the airline, which ran the chatbot on its own website. In Chapter 18's terms, the airline was
      the deployer, and the tribunal treated the chatbot's answer like any other page of the airline's website. Not
      the model's maker, which is option (a), the misconception that the AI's maker is automatically liable. Not the
      customer: the tribunal did not expect him to double-check one part of the airline's website against another.
      And statements by a chatbot were not treated as non-binding. Keep the hedge: one decision, one tribunal; the book
      calls "the deployer is responsible" its reading.
    background: |
      Appendix E, A9: (b) the airline, which ran the chatbot. B3 (property-management chatbot, pet fee) is the same
      pattern: the company as deployer, link 2 failed, the disclaimer does not move the duty to check (inferred).
    activity: "Reveal."
    book: "§18.4; Appendix E (Review A9, Review B3)."

# Redrawn natively from @fig-18-12 (tiers): the figure's examples and dates are small at slide size.
- layout: lanes
  minutes: 2
  kicker: "§18.5 · Core · EU AI Act tiers (the book’s grouping) · dates as of October 2026"
  title: "The EU sets duties by risk; most uses carry none"
  label_width: 2.6
  rows:
    - label: "Prohibited"
      nodes:
        - {label: "Emotions from faces at school or work; social scoring", kind: step, role: risk}
        - {label: "Banned since Feb 2, 2025", kind: step}
    - label: "High-risk"
      nodes:
        - {label: "Admission, grading, test monitoring, CV screening", kind: step}
        - {label: "Duties from Dec 2, 2027", kind: step}
    - label: "Transparency"
      nodes:
        - {label: "Chatbots, generated content, deepfakes", kind: step}
        - {label: "Tell, mark, label", kind: step}
    - label: "Minimal"
      nodes:
        - {label: "Spam filters, spell-checkers", kind: step, role: soft}
        - {label: "No new duties", kind: step, role: soft}
  takeaway: "It reaches providers abroad whose systems are sold or used in the EU"
  notes:
    say: |
      The EU AI Act sets duties by risk. The book groups its rules into four tiers; the Act itself does not use that
      word. Prohibited practices are uses the Act bans, such as inferring people's emotions from their faces or
      voices at work or in education, except for medical or safety reasons, and social scoring. High-risk systems are
      listed uses such as admission, grading, test monitoring and screening job applicants; providers and deployers
      carry duties of risk management, documentation and oversight. Transparency duties: people must be told they are
      talking with AI, generated content must be marked and deepfakes labeled. Minimal risk is most uses, with no new
      duties beyond supporting AI literacy. And the Act reaches U.S. companies whose systems are sold or used in the
      EU.
    background: |
      Regulation (EU) 2024/1689 as amended by Regulation (EU) 2026/1744 (as of October 2026): prohibitions apply since
      February 2, 2025; general-purpose AI model duties from August 2, 2025; high-risk duties scheduled from December 2,
      2027 for listed uses and August 2, 2028 for AI in regulated products; transparency duties from August 2, 2026
      (marking duty from December 2, 2026 for systems already on the market). A deepfake is synthetic media (images,
      audio or video generated or substantially altered by AI) that realistically shows a real person, or a real event,
      saying, doing or happening in a way that did not happen; the label duty also covers realistic fakes of real
      objects and places. Instructor note (Appendix E): Recital 44 explains the emotion-inference ban by doubts about
      its scientific basis, the risk of discrimination and the imbalance of power in schools and workplaces.
    questions:
      - q: "Does the EU Act matter to a company in Texas?"
        a: "Yes, if its system is sold or used in the EU (Review A13, key (d))."
    misconceptions:
      - m: "M5 'The U.S. has no AI law; the EU Act matters only in Europe.'"
        fix: "Point at the takeaway (reach), then the next slides (U.S. rules). Balance: most uses are minimal risk."
    activity: "Ask the 18.5 prediction: which is regulated more tightly, a cheating-flag tool or an emotion-reading tool?"
    book: "§18.5, @fig-18-12; Check Yourself 18.5; Review A13."

- layout: quiz
  minutes: 1.5
  kicker: "Quick check · §18.5 · worked example: four uses on the tiers"
  title: "place four uses"
  question: "Which EU AI Act tier is each use in?"
  option_tags: ["(1)", "(2)", "(3)", "(4)"]
  options:
    - "An exam tool that infers students’ emotions from their faces on camera"
    - "An exam tool that flags possible cheating during tests"
    - "A help-desk chatbot"
    - "A spam filter"
  answer: ["Prohibited", "High-risk", "Transparency", "Minimal"]
  legend: "Tiers as grouped by the book (as of October 2026)"
  instruction: "Write a tier for each, then compare with a neighbor"
  explanation: "Prohibited may not be used at all; high-risk may, with duties"
  notes:
    say: |
      Now apply the tiers. Four uses: an exam tool that infers students' emotions from their faces on camera; an exam
      tool that flags possible cheating during tests; a help-desk chatbot; and a spam filter. Write a tier next to each,
      then compare with your neighbor. Most disagreement is usually between the first two, because both are exam tools
      watching students. The difference is what they do with what they see: one infers emotions, the other flags
      possible cheating. Ask students who disagree to name what each tier would mean in practice: can the tool be used
      at all, and with which duties?
    background: |
      Worked Example "Four Uses on the Tiers" (§18.5): emotion inference from faces in education, prohibited;
      cheating flags during tests, high-risk (duties scheduled from December 2, 2027, as of October 2026); help-desk
      chatbot, transparency (its provider must design it to tell users they are talking with AI); spam filter, minimal.
      Check Yourself 18.5 asks the same for the first two, with what each means for whether it may be used at all.
    activity: "45 s alone, 30 s with a neighbor, then the answer slide."
    book: "§18.5 Worked Example 'Four Uses on the Tiers'; Check Yourself 18.5."
  answer_notes:
    say: |
      Here is the key. The emotion-reading exam tool is a prohibited practice: it may not be used in education at all,
      except for medical or safety reasons. The cheating-flag tool is high-risk: it may be used, but with duties such as
      risk management, documentation and human oversight, scheduled, as of October 2026, from December 2, 2027. The
      help-desk chatbot falls under transparency: its provider must design it so users are told they are talking with
      AI. The spam filter is minimal risk, with no new duties. Notice that the tier depends on the use, not on the
      technology: the same camera and the same model can sit in different tiers depending on what they are used for.
    background: |
      Appendix E, Check Yourself 18.5. Review A12 (even, instructor-only key) and B4 are similar; do not show A12's key.
      Review A11 (odd): a résumé-screening tool is high-risk (employment); one deployer duty: use it as instructed, or
      assign oversight to people with the competence, training and authority.
    activity: "Reveal; ask which item the class split on."
    book: "§18.5; Appendix E (Check Yourself 18.5, Review A11)."

# Redrawn natively from the dates chart (@fig-18-19): its axis labels are about 9 pt at slide size.
- layout: lanes
  minutes: 1.5
  kicker: "Legal status as of October 2026 · check the current status · not legal advice"
  title: "EU AI Act: the high-risk dates moved, the others stayed"
  label_width: 3.4
  rows:
    - label: "Prohibitions, AI literacy"
      nodes:
        - {label: "Feb 2, 2025", kind: step}
        - {label: "Unchanged", kind: step, role: soft}
    - label: "General-purpose models"
      nodes:
        - {label: "Aug 2, 2025", kind: step}
        - {label: "Unchanged", kind: step, role: soft}
    - label: "Transparency (Art. 50)"
      nodes:
        - {label: "Aug 2, 2026", kind: step}
        - {label: "Marking: Dec 2, 2026", kind: step, role: soft}
    - label: "High-risk, listed uses"
      nodes:
        - {label: "Was Aug 2026", kind: step}
        - {label: "Now Dec 2, 2027", kind: step, role: human}
    - label: "High-risk, in products"
      nodes:
        - {label: "Was Aug 2027", kind: step}
        - {label: "Now Aug 2, 2028", kind: step, role: human}
  takeaway: "Regulation (EU) 2026/1744 moved only the high-risk dates"
  notes:
    say: |
      This is a dated status slide: it was true as of October 2026, and you should check the current status before
      relying on it. An amending law in 2026, Regulation 2026/1744, moved the EU AI Act's high-risk duties: for listed
      uses such as grading or screening job applicants, from August 2026 to December 2, 2027; for AI in regulated
      products, to August 2, 2028. The other dates stayed: the prohibitions have applied since February 2, 2025; the
      duties for general-purpose AI models since August 2, 2025; and the transparency duties from August 2, 2026, with
      the marking duty for systems already on the market from December 2, 2026. A habit that outlasts any date: write
      down where you read a rule, its section and the date.
    background: |
      Status box item 1 (§18.5) and Deep 18.C; data/ch18_legal_status.csv (the single dated legal-status table; refresh
      list). Deep 18.C: as of October 2026, the right to an explanation of decisions made with high-risk systems (Art.
      86) was not amended, but the duties for those systems now apply from December 2, 2027, so when the right can be
      used in practice is a question of interpretation. Deep 18.B: two new prohibitions (non-consensual intimate
      images of identifiable people; AI-generated child sexual abuse material) scheduled from December 2, 2026. Before
      teaching, recheck every date on this slide against EUR-Lex. Not legal advice.
    questions:
      - q: "Will dates like these be on the exam?"
        a: "Review A tests tier reasoning, not dates (chapter package note). Know that the dates are set by law and can move, and where to check them."
    activity: "Point to the line marking October 2026 on the chart."
    book: "§18.5 status box, item 1; Deep 18.C 'The EU dates', @fig-18-19."

- layout: compare
  minutes: 2
  kicker: "Legal status as of October 2026 · check the current status · not legal advice"
  title: "In the U.S.: existing laws, a state, a city"
  size: 26
  columns:
    - heading: "U.S. federal"
      role: soft
      bullets: ["No single AI law", "Dec 2025 order: challenge state AI laws"]
    - heading: "Texas"
      role: soft
      bullets: ["TRAIGA since Jan 1, 2026", "Agencies, health care: disclose AI"]
    - heading: "New York City"
      role: soft
      bullets: ["Local Law 144 since July 5, 2023", "Hiring tools: yearly bias audit"]
  takeaway: "A rule’s own text decides; a summary is a lead"
  notes:
    say: |
      Another dated slide, as of October 2026. At the federal level the U.S. has no single AI law; existing laws apply,
      such as copyright, consumer protection and the federal ban on job discrimination, Title VII. A December 2025
      presidential order set up a federal challenge to state AI laws. Texas's AI law, TRAIGA, has been in force since
      January 1, 2026: it bans some intentional uses, such as manipulating people toward self-harm, and requires
      governmental agencies and health-care providers to tell people they are dealing with AI. New York City has
      required, since July 5, 2023, that an employer using an automated hiring tool have a yearly bias audit, publish
      a summary and notify candidates. Check each against the rule's own page before you rely on it.
    background: |
      Status box items 2–4 (§18.5). Texas nuance (the book's reading): TRAIGA's exclusion of universities covers another
      term, so whether its disclosure duty reaches public universities is unsettled; Senate Bill 1964 (2025) requires
      state agencies to disclose public-facing AI unless a reasonable person would already know, and because Texas
      law's definition of "state agency" includes public universities, the book reads that duty as covering them.
      Deep 18.C (optional): the Senate voted 99 to 1 in July 2025 to strip a proposed 10-year pause on state AI laws;
      EO 14179 (January 2025); EO 14281 (April 2025, disparate impact; reported); Colorado replaced its law (SB 26-189,
      May 2026; duties from January 1, 2027; reported). As of October 2026, Congress had passed no law replacing state
      AI laws. Short case 2: the State Comptroller found NYC's enforcement of LL144 ineffective (Dec 2025).
    questions:
      - q: "Does TRAIGA apply to a public university in Texas?"
        a: "Unsettled for TRAIGA's disclosure duty, by the book's reading; SB 1964's disclosure duty, by the book's reading, covers public universities. Ask your institution's own offices; this is not legal advice."
    misconceptions:
      - m: "M5 'The U.S. has no AI law.'"
        fix: "No single federal AI law, but existing laws apply, plus state and city rules like these."
    activity: "Optional: faded example 'Two U.S. Uses' (Texas agency chatbot; NYC résumé screener) as practice."
    book: "§18.5 status box, items 2–4, @fig-18-13 (U.S. map); Deep 18.C; Short case 2; Faded Example 'Two U.S. Uses'."

# The book's heat-map figure (@fig-18-16) is small at slide size; its content is in the two cards and the notes.
- layout: compare
  minutes: 2
  kicker: "§18.6 · Studio · worked example: Hana’s zine (constructed)"
  title: "A rules-and-rights risk, written out"
  size: 28
  columns:
    - heading: "The risk · D"
      role: risk
      bullets: ["Contributors lose control of their drawings", "Form + terms § 4", "Medium, medium"]
    - heading: "The plan"
      role: verified
      bullets: ["Reduce: no-training tool", "Owner: Hana", "Ask: images too?"]
  takeaway: "Not a legal opinion: which rules to check and whom to ask"
  notes:
    say: |
      Here is a complete rules-and-rights risk. Hana runs a small zine and plans AI-drafted alt text for contributors'
      scanned drawings. The submission form permits printing and posting only; the tool's terms, section 4, let
      uploads train models. The risk: contributors losing their right to decide how copies of their drawings are used,
      which is copyright. The rule and its layer: the form and the terms, both agreements. Harmed: contributors.
      Evidence: D, because Hana opened both and can cite the sections. Rating: medium likelihood, medium impact. The
      mitigation reduces it: a no-training tool and an AI line on the form, owned by Hana as editor; the book's heat
      map shows the move to low likelihood. And the question for the rule's owner: does the no-training option cover
      images?
    background: |
      Worked Example "Hana's Rules-and-Rights Risk" (§18.6), constructed; the form and terms are invented. @fig-18-16
      shows the Risk Heat Map move (D, solid outline). Faded Example "A Club's Sign-up Assistant" (Chapter 15's club
      scenario) is the practice item; Appendix E gives a model answer (members harmed; medium, medium; reduce or avoid;
      owner: the club's president or data officer; ask the officers and the provider). Every risk ends with the line
      "This records which rules to check and whom to ask; it is not a legal opinion."
    questions:
      - q: "Why is Hana's evidence D but a law can be I?"
        a: "D needs the rule's own text for this tool and data, with its section cited. For a law you know only from the chapter's summary, I with a reason is acceptable (Check Yourself 18.6)."
    activity: "Ask students to compare Hana's risk with the one they drafted in the lab: which part is weakest in theirs?"
    book: "§18.6 Worked Example, @fig-18-16; Faded Example 'A Club's Sign-up Assistant'; Check Yourself 18.6."

- layout: objectives
  minutes: 1
  kicker: "Chapter summary (book figure: summary card)"
  title: "What you can do now"
  items:
    - {code: "O1", text: "**Layers:** follow the strictest rule; ask its owner"}
    - {code: "O2", text: "**Training:** fair use turns on the facts"}
    - {code: "O3", text: "**Output:** copyright protects what people author"}
    - {code: "O4", text: "**Errors:** deployers stay responsible (the book’s reading)"}
    - {code: "O5", text: "**Risk:** EU tiers; U.S. existing laws, a state, a city"}
    - {code: "A12", text: "**One risk:** a rule, its text, its owner"}
  takeaway: "Every legal status line has a date: check it before you rely on it"
  notes:
    say: |
      The chapter's question was: who sets the rules for AI, on training data, on outputs, on mistakes and on risky
      uses, and how do you find the ones that apply to you? Several layers apply at once; follow the strictest and ask
      its owner. Fair use in training depends on the facts. Copyright protects what people author. In this book's
      reading, those who deploy and rely on AI are responsible for its errors. The EU sets duties by risk tier; the
      U.S. relies on existing laws and a few state and city rules. Revisit the Warm-up: a public photo is still
      protected, and fair use depends on the facts; a prompted image probably has no author if your prompt was your
      only input; and the deploying company is responsible, disclaimer or not.
    background: |
      Chapter Summary and @fig-18-21. Warm-up answers (chapter): (1) not automatically: the photo is still protected,
      fair use depends on the facts (18.2); (2) probably no one, if the prompt was the only input; your own changes can
      be protected (18.3); (3) in this book's reading, the deploying company (18.4). Every dated line here is "as of
      October 2026"; the refresh list holds them.
    activity: "Ask students to compare the Warm-up answers with their 0–100% confidence ratings."
    book: "Chapter Summary, @fig-18-21; Warm-up revisit."

