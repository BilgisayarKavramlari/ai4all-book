# ======================================================================= CONCEPT-SESSION SEGMENT (about 7 min)
- layout: title
  session: tue
  minutes: 0
  subtitle: "Concept-session segment and Lab 15.1 step 6"
  meta:
    - "Şadi Evren Şeker"
    - "Reading: Chapter 18 Core (about 29 min) · Recommended: U.S. Copyright Office (2025), Part 2"
    - "Not legal advice"
  figure: f18-03-regulation-map
  notes:
    say: |
      This deck covers Chapter 18 inside a crowded unit. The unit has four chapters: privacy and security, bias and
      fairness, this one on intellectual property, law and governance, and an optional chapter on explanations.
      Chapter 18's share of class is small: about seven minutes of ideas and a three-minute check in the concept session, and five
      minutes in the red-team lab session, where you draft one risk for A12. The picture is the Regulation Map: every AI use sits under several layers of
      rules at once. One sentence before anything else, and it holds for the whole chapter: this is not legal advice.
      The chapter explains how AI law and policy work so you can ask good questions; for a real decision, ask the
      person or office that owns the rule.
    background: |
      Decision D22 (shared unit): each Core chapter (15, 16, 18) about 30 minutes of whole Core package; Chapter 18's
      Core package is about 29 minutes (about 16 for Core sections 18.1–18.5), about 5 minutes of answering included.
      Recommended readings: U.S. Copyright Office (2025), Part 2, and TRAIGA with the EU AI Act (instructor summary);
      the 18.5 status box is that summary. Faded examples, Review A–C, the Spaced Review and the Case Study
      Questions count as exam practice if your course has an exam; Deep 18.A–C, labs 18.1–18.3 and the Case Study are optional. Work Loop
      highlight: Decide (which rules apply; is this use allowed?), Disclose second. Featured student: Hana (they/them).
    questions:
      - q: "Will the law details be on the final?"
        a: "Core sections 18.1–18.5 are examinable (D20); legal citations in parentheses are not, and Review A tests tier reasoning, not dates (chapter time line; package note)."
    activity: "On screen as the Chapter 18 segment begins (after the Chapter 15 and 16 segments)."
    book: "Chapter 18 opening page, @fig-18-1 (chapter map), @fig-18-3 (Regulation Map)."

