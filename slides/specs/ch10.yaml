    book: "Midterm Bridge, @fig-10-17 and its table."

- layout: quiz
  minutes: 1
  kicker: "Midterm Bridge · A · Chapter 1"
  title_prefix: "Bridge MB1"
  title: "assistance or outsourcing?"
  question: "Which is assistance rather than outsourcing?"
  options:
    - "Pasting a tool’s correct homework answer in as your own work."
    - "Submitting a reflection a tool wrote, after checking it for errors."
    - "Copying a tool’s summary of a reading into your notes instead of reading it."
    - "Asking for an explanation of depreciation, then writing the answer yourself."
  answer: d
  instruction: "No notes: answer, then check · missed it? reread §1.5"
  explanation: "(a), (b) and (c) replace the thinking the work requires"
  notes:
    say: |
      Bridge item one, from Chapter 1. Which of these is assistance rather than outsourcing? Answer without notes. The
      test from Chapter 1 is what you can do afterward: could you explain, defend or redo the work without the tool? Give
      thirty seconds, then vote. Notice that two of the wrong options involve a correct or carefully checked output. That
      is deliberate: on the exam, as in Chapter 1's policy, correctness does not decide whether something was assistance. What
      decides it is who did the thinking the work exists to build.
    background: |
      MB1 (Chapter 1 · LO4 · Understand), options shortened. Key from Appendix E: (d). Asking for an explanation and then
      writing the answer yourself is assistance: the tool helps you do the thinking. (a), (b) and (c) replace the thinking
      the work requires (Chapter 1, §1.5).
    activity: "30 s individual, then vote."
    book: "Midterm Bridge MB1; Chapter 1 §1.5; Appendix E."
  answer_notes:
    say: |
      The answer is (d): you asked for an explanation of depreciation, then wrote the answer yourself. The tool helped
      you think; it did not think for you. The other three replace the thinking: pasting a correct answer as your own is
      outsourcing even though it is correct; a reflection written by a tool is outsourcing even after you check it, because
      the reflection exists to build your own reflection; and copying a summary instead of reading replaces the reading.
      Notice that correctness never decides it. If you missed this one, reread section 1.5, especially "assistance versus
      outsourcing" and the three zones.
    background: |
      Same distinction as Chapter 10's spectrum in coursework: position 4 or 5 on skill-building work is outsourcing
      unless explicitly allowed (§10.2).
    activity: "Reveal; one follow-up comment."
    book: "Appendix E (MB1); Chapter 1 §1.5."

- layout: quiz
  minutes: 1
  kicker: "Midterm Bridge · A · Chapter 3"
  title_prefix: "Bridge MB3"
  title: "same prompt, two answers"
  question: "Why can the same prompt give two different answers?"
  options:
    - "The model looks the answer up in a different database each time."
    - "Each next token is sampled from the model’s scores, so two runs can pick different tokens."
    - "The tool updates its settings from your last chat."
    - "A different answer means the tool has an unfixed error."
  answer: b
  instruction: "No notes: answer, then check · missed it? reread §3.2"
  explanation: "(a) is Chapter 1’s database idea; (c) confuses use with training; (d) is false"
  notes:
    say: |
      Bridge item three, from Chapter 3. You met a version of this question in Chapter 1; now you have Chapter 3's precise
      language. Answer without notes, then vote. Listen for students who say "it learns from my chat": that is a
      misconception about training worth correcting before the exam. A good answer on the midterm uses Chapter 3's words,
      tokens, scores and sampling, rather than Chapter 1's first approximation, "picks each piece with some chance." Both
      are right; the second is the one a terms-and-concepts item rewards.
    background: |
      MB3 (Chapter 3 · LO1 · Understand), options shortened. Key from Appendix E: (b). The model scores every possible
      next token and one is sampled, so two runs can pick different tokens. (a) is Chapter 1's "database" misconception;
      (c) confuses inference with training; (d) is false (Chapter 3, §3.2).
    activity: "30 s individual, then vote."
    book: "Midterm Bridge MB3; Chapter 3 §3.2; Appendix E."
  answer_notes:
    say: |
      The answer is (b). At each step the model scores every possible next token, and one is sampled from those scores,
      so two runs can pick different tokens and then continue differently. Option (a) is the oldest misconception in the
      book: the model does not look anything up in a database. Option (c) mixes up using a model with training it:
      your chat does not change the model's settings. And (d) is false: different answers are expected behavior, not a
      bug. If you missed it, reread section 3.2. This also explains why Elif's three tones in the demonstration would come out
      slightly different if we ran the prompt again.
    background: |
      Appendix E key for MB3. Chapter 1 §1.1 gives the first version of this idea ("picks each piece with some chance");
      Chapter 3 §3.2 gives the token-level mechanism (scores, sampling).
    activity: "Reveal; one follow-up comment."
    book: "Appendix E (MB3); Chapter 3 §3.2."

- layout: quiz
  minutes: 2
  kicker: "Midterm Bridge · C · Chapter 7"
  title_prefix: "Bridge MB7"
  title: "scaffold or crutch?"
  question: "“If the AI explanation is correct, it does not matter whether I tried the problem first.” Agree or disagree, using scaffold and crutch."
  instruction: "Write three sentences without notes, then compare · missed it? reread §7.2 and §7.4"
  model_answer:
    - "**Disagree.** The same correct explanation is a scaffold after your own attempt and a crutch without one."
    - "What builds skill is who recalled and produced the answer in that turn: you or the tool."
    - "Strong answers cite §7.2’s retrieval-practice evidence and give an example from their field."
  notes:
    say: |
      Bridge item seven, an interpretive question like the midterm's interpretive part. Take a position, agree or disagree, and
      use Chapter 7's two words, scaffold and crutch. Write three sentences without notes: your position, the reason, and
      one piece of evidence or an example from your field. Then compare with a neighbor. Interpretive items are scored on the
      reasoning, so a clear position with a reason beats a long answer that never takes a side. If students are unsure
      how to start, suggest the frame "I disagree, because…" and remind them that Chapter 7 asks who recalled and produced
      the answer in that turn.
    background: |
      MB7 (Chapter 7 · LO4 · Evaluate). Model answer from Appendix E: Disagree. In Chapter 7's terms, the same correct
      explanation is a scaffold after your own attempt and a crutch without one; what builds skill is who recalled and
      produced the answer in that turn, you or the tool. Strong answers cite the retrieval-practice evidence from §7.2 and
      give an example from their field. Connection to Chapter 1: Bastani et al. (2025) on practice with an unrestricted
      chatbot vs. a hint-based version.
    activity: "2 min write, then show the model answer."
    book: "Midterm Bridge MB7; Chapter 7 §7.2, §7.4; Appendix E."
  answer_minutes: 1.5
  answer_notes:
    say: |
      Here is the model answer. Disagree. In Chapter 7's terms, the same correct explanation is a scaffold when it comes
      after your own attempt, and a crutch when it replaces the attempt. What builds skill is who recalled and produced the
      answer in that turn: you or the tool. Strong answers bring in the retrieval-practice evidence from section 7.2 and
      give an example from their own field. Check your three sentences against that: did you take a position, use both
      terms, and give a reason that is not just "because it's cheating"? If not, reread sections 7.2 and 7.4. On the
      midterm, that is the difference between a partial and a full answer.
    background: |
      Appendix E key for MB7. Scoring idea for interpretive items: a defensible position, the book's
      terms used correctly, and evidence or an example.
    activity: "Students mark their own answer: position ✓, both terms ✓, reason ✓."
    book: "Appendix E (MB7); Chapter 7 §7.2, §7.4."

# About 54 words: three Bridge items with their reread pointers (deliberate exception).
- layout: tps
  minutes: 3.5
  kicker: "Midterm Bridge · practice without notes"
  title: "Three more: answer them, then we review them together"
  prompt:
    - "MB2 · Shortcut vs. proxy: what do new conditions reveal? (§2.3, §2.5)"
    - "MB6 · Wrong return deadline, nobody read it: tree and chain labels (§4.1, §4.7)"
    - "MB8 · Is a higher Delegation Ladder rung a better use? (§5.2)"
  phases:
    - {name: "Write", min: 2, text: "One item, no notes"}
    - {name: "Pair", min: 1.5, text: "Note what to reread"}
  notes:
    say: |
      Three more Bridge items, one each from Chapters 2, 4 and 5. Pick the one you feel least sure about and write your
      answer without notes. Then compare with a neighbor, and write down the section you need to reread. We go through
      all three together in class; the answers are not in the back of the book, so this is the place to check them. Item
      MB4 is the fourth one in the book, a one-line multiple-choice question about the part of a prompt you always need;
