- layout: deep
  session: after
  kicker: "Deep 10.A · why a score is weak evidence (see @fig-10-15)"
  title: "Going deeper: base rates and wrong flags"
  size: 24
  bullets:
    - "A weak 2023 classifier: caught 26% of AI texts, flagged 9% of human ones"
    - "10% of 1,000 texts AI: 81 of 107 flags point at a person"
    - "A far better tool: 9 of 99"
  takeaway: "Wrong flags depend on how much writing is AI, which no score shows"
  notes:
    say: |
      Use this slide only if there is time or a student asks why a small false-positive rate still matters. Take the
      rates OpenAI reported for its own, weak, classifier on a challenge set of English texts: it labeled 26% of
      AI-written texts "likely AI-written," missing 74%, and mislabeled 9% of human texts. Imagine 1,000 texts, 10% of
      them AI-written. It would flag 26 of the 100 AI texts and 81 of the 900 human ones: 81 of 107 flags, about three in
      four, would point at a person. A far better detector, with 90% detection and a 1% false-positive rate, would do far
      better: only 9 of 99 flags would point at a person. What stays true is that the share of wrong flags depends on how
      much of the writing is AI, which the person reading the score does not know.
    background: |
      Deep 10.A (optional, not examinable). The figure is a computed illustration with assumed shares (5%, 10%, 25% AI
      text: human share of flagged texts 87%, 76%, 51%), not a study. This is Chapter 2's precision problem in a new place.
      Vanderbilt University turned off one commercial detector in August 2023, estimating that the vendor's claimed 1%
      false-positive rate, applied to roughly 75,000 papers submitted in 2022, could have wrongly labeled about 750
      (Vanderbilt University, 2023). Detection methods (perplexity, classifiers, watermarks; Weber-Wulff et al., 2023
      judged none of 14 tools reliable) are in the same section; do not present the study's rewrite prompts as advice.
    questions:
      - q: "Why not just use the best detector?"
        a: "Even a far better one leaves some flags pointing at people, and the share depends on how much writing is AI, which the reader of a single score does not know. A score is a reason to look at process evidence (Deep 10.A)."
    activity: "Optional; not part of the class plans."
    book: "Deep 10.A, @fig-10-15."

