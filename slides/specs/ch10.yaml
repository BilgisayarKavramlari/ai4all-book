# Lecture deck spec — Chapter 10: Writing and Professional Communication: Keeping Your Voice
# Format and notes standard: slides/README.md. Build: python3 tools/build_slides.py slides/specs/ch10.yaml --preview
# Independence rule D27 (docs/production/independence-rules.md): no institution, course code, term, dates, syllabus or
# learning-system names; sessions are "Session 1 (concept)" and "Session 2 (lab)" with durations only.
# Chapter 10 is the last chapter before a midterm covering Chapters 1-10 (D20). Session 1 = concept session (Peabody
# case, demo "one email in three tones"); Session 2 = Lab 10.1 Writing Studio, starting A7. A third, short segment
# ("rev", about 15 min) carries the chapter's Midterm Bridge (Chapters 1 to 7) for a review session before the
# midterm (blueprint: the Bridge is used in the pre-midterm review); it can also be posted for self-study.
# Only odd Midterm Bridge items (keys in Appendix E) get answer slides; even items are shown as practice prompts only
# (keys are instructor-only, private/ch10-answers-even.md).
# Case C07 naming rule (blueprint V3): institution, office, roles and the dean only. The reference list keeps the
# Hustler headlines exactly as published (chapter decision); it is a reference slide, not presented.
# Every number and quotation below comes from the files under deck.sources; the builder flags any number it cannot find.

