    Prompt: "Ch. 3 · 5 · 6 (Deep)"
    Verify: "Ch. 2 · 3 (2nd) · 4 · 6 (Deep) · 7 · 8 · 9"
    Decide: "Ch. 8 (2nd) · 10 (2nd)"
    Disclose: "Ch. 9 (2nd) · 10"
  takeaway: "Midterm scope: Core of Ch. 1–10 · Ch. 6 is Deep, not examined"
  notes:
    say: |
      Here are Chapters 1 to 10 on one picture: the five steps of the AI Work Loop, and under each, the
      chapters whose maps highlighted it. Frame: Chapter 1's Work Loop and Jagged Frontier, Chapter 5's Delegation Ladder,
      Chapter 7's scaffold versus crutch. Prompt: Chapter 3's anatomy of a response and Chapter 5's anatomy of a prompt.
      Verify, the busiest column: Chapter 2's data-to-prediction pipeline, Chapter 4's Failure Taxonomy Tree and chain,
