      Core sections of the whole book, so this chapter is in scope. A quick self-test:
      cover the slide and define three terms in your own words, each in one sentence. Pay attention to two pairs. A
      revision trace and a verification trail: one records what changed and why, the other records the checks behind
      a result. A portfolio entry and the evidence map: one is the account of one piece of work, the other is the
