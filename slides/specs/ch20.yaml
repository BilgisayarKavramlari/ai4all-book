- layout: deep
  kicker: "Deep 20.A · how the numbers are made (book figure)"
  title: "Going deeper: from survey answers to “170 million jobs”"
  size: 26
  bullets:
    - "Employers estimate % changes by role"
    - "The WEF applies them to ILO employee counts"
    - "Each step adds an assumption"
  flow:
    - {label: "Survey answers", kind: step, size: 20}
    - {label: "% change by role", kind: step, size: 20}
    - {label: "× ILO counts", kind: step, size: 20}
    - {label: "Millions created, displaced", kind: step, size: 20}
    - {label: "Net and churn", kind: step, size: 20}
  flow_height: 1.4
  takeaway: "Cite it as what employers expected in 2024 — exactly that"
  notes:
    say: |
      Optional, for students who ask how a survey becomes "170 million jobs." The survey had 38 questions in 12
      languages and was answered by over 1,000 employers. Respondents estimated how their workforce would change from
      2025 to 2030, as percentages by role. The World Economic Forum then applied those percentages to employee counts
      from the International Labour Organization. The roles with enough survey answers cover about 1.18 billion
      employees, out of 2.18 billion in the ILO data. Each step adds an assumption. That does not make the report
      useless. It tells you what a large group of employers expected and planned in 2024, which is exactly what you
      should say when you cite it.
    background: |
      Deep 20.A (optional, not examinable). Data collection: the methods appendix says four months, May to September
      2024 (p. 97); a note two pages later says May to August 2024 (p. 99): a discrepancy inside the source, kept as
      such by the book. Employee counts were used because responding firms employ people in formal work (p. 99).
      Small enterprises and the informal sector are out of scope (p. 97). Skills-change share by edition: 57% (2020),
      44% (2023), 39% (2025); the report suggests more completed training may be one reason. The book's reading,
      marked: expectations about AI were changing quickly in 2024.
    activity: "Optional; not part of any class plan."
    book: "Deep 20.A How the Future of Jobs Numbers Are Made, @fig-20-19."

