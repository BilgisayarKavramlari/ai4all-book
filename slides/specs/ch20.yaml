      Exam-preparation reading: Chapter 21 Part B (Case Study, Summary, Last Words), about 7 minutes; Final
      Bridge about 40 minutes; Chapter 20's §20.2, Case Study, faded examples at home and review questions are
      exam preparation (D23, D24, D25). The Final Bridge's odd answers are in Appendix E; even answers are
