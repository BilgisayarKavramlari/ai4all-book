# ======================================================================= DEFENSE SESSION
- layout: section
  session: thu
  minutes: 0
  number: "Oral"
  tag: "Defense"
  title: "Oral defenses"
  idea: "Show that you own your work: one chain, your evidence, your answers."
  meta: "Defenses I · a second session (II) can follow the final review"
  notes:
    say: |
      Welcome to the defenses. Here is how today works. You defend in the order of the sign-up slots on your course site.
      Each defense is five minutes: three minutes from you, two minutes of questions from me. No AI tool and no
      script; one index card and your portfolio open. While others defend, please work quietly or wait outside, as
      announced; nobody needs to stay for every defense, and nobody should record anyone else's. If you are nervous,
      remember: three minutes is a limit, not a pace, and "I don't know yet; I would check it in…" is a good answer.
      In a later session, the defenses continue after a ten-minute final review.
    background: |
      Suggested plan: oral portfolio defenses I (3 + 2 minutes); a second session with defenses II and a final
      review. Room arrangements (waiting outside, order, changeovers) are not specified in the book; announce your
      own. Capacity (author item 3 in the blueprint): at 5 minutes each, plan about 5 minutes per student plus
      changeovers; the chapter says extra slots are announced on your course site. Students with an approved
      accommodation or a documented conflict may use the recorded 3-minute presentation plus a live 2-minute
      conversation (in person or by video).
    activity: "On screen as students arrive; read the slot order aloud."
    book: "The Oral Defense: Brief and Rubric."

# Run sheet on screen for a whole defense session (same flow as the format slide).
- layout: concept
  minutes: 75
  kicker: "Defense session · on screen between defenses"
  title: "Five minutes: three from you, two of questions"
  size: 24
  bullets:
    - "No AI tool, no script; card and portfolio open"
    - "Scored: chain, evidence, answers, structure"
  flow:
    - {label: "Narrative sentence · 30 s", kind: human, role: neutral}
    - {label: "One entry as a chain · 90 s", kind: human, role: neutral}
    - {label: "One revision + check · 60 s", kind: step, role: verified}
    - {label: "Questions · 2 min", kind: human}
  flow_height: 1.5
  takeaway: "Expect: “What did the AI do, and what did you do?”"
  notes:
    say: |
      This slide stays on screen during the defenses. Before each student starts, say one sentence: "You have three
      minutes; I will tell you at two and a half." Then listen for the chain: what you asked for, what the AI
      produced, what you kept, changed or rejected and why, how you checked, who decided. In the two minutes of
      questions, start with the expected question, "What did the AI do, and what did you do?", then one follow-up
      from the list in the background. If a student freezes, help them toward the strong answer: "What do you know,
      and where would you check?" Score the four criteria immediately after each defense, before the next student
      starts, and write one line of feedback per criterion.
    background: |
      Rubric (5 each): Decision chain (Exemplary: complete for one entry; Proficient: one link thin or missing,
      such as the decider unnamed; Developing: two or more links missing, parts blurred; Beginning: no chain).
      Evidence (before and after and the trail shown; numbers match the portfolio). Answers (from own
      understanding; limits stated; for an unknown, says what to check and where; Developing: defers to the tool or
      the slide). Structure and explanation (a non-specialist can follow; terms explained; content fits the time).
      Sample follow-ups (§20.8): Why this artifact? What would you check next? What did you leave out of the public
      version? Which part would you not trust a tool with again? You may also ask about one line of the code of
      practice: why that moment, how you would show you acted, what evidence stands behind it (§21.5). Do not score
      accent, fluency or speed. Where an approved accommodation allows it, a student may answer one question in writing
      within a set time.
    questions:
      - q: "Can I look at my portfolio while answering?"
        a: "Yes: the portfolio stays open, and showing the before and after or the trail is part of the Evidence criterion."
    activity: "75 min of defenses at 5 min each plus changeovers; keep a visible timer."
    book: "The Oral Defense: Brief and Rubric; §20.8; §21.5 (code line)."

# ======================================================================= EXAM PREPARATION
- layout: section
  session: after
  number: "20.2"
  tag: "Core"
  title: "Reading labor-market claims without hype"
  idea: "A labor-market number is a forecast by named respondents at a date."
  meta: "Book §20.2 · exam preparation"
  notes:
    say: |
      This part of the deck is for exam preparation: section 20.2 and the Case Study, which the chapter schedules as
      exam preparation. Use it in office hours, post it on your course site, or show it if time allows. The idea is
      on the slide. Before you repeat any labor-market number, ask who made it, whom they asked, when, what was
      measured, what caused it, and whether it is a forecast or a count of something that happened. A labor-market
      forecast is an estimate of future jobs or skills, made by named people or organizations at a date. The book's
      example is the most-quoted one: the World Economic Forum's Future of Jobs Report 2025.
    background: |
      §20.2 is Core and examinable, read after the workshop with the Case Study (D25). Recommended reading in part: WEF
      (2025), Key findings, pp. 5–6. Lab 20.3 (optional, 20–35 minutes) is the Your Turn: trace one headline that
      cites the report.
    activity: "Reference slide (not presented)."
    book: "§20.2 Reading Labor-Market Claims Without Hype."

# Native redraw of the claim-anatomy figure (F20.6): seven questions with short answers; detail in the notes.
- layout: compare
  kicker: "§20.2 · anatomy of a labor-market claim (book figure, redrawn)"
  title: "Seven questions before you repeat “170 million jobs”"
  size: 22
  columns:
    - heading: "Who said it, and why"
      role: neutral
      bullets: ["Who: the WEF, from employers", "Whom: over 1,000 employers", "When: May–Sep 2024", "Cause: all trends, not AI alone"]
    - heading: "What kind of number"
      role: neutral
      bullets: ["Measured: expectations", "Forecast: 2025–2030", "Gross: net is about 78 million"]
  takeaway: "A source for what employers expected, not for what will happen"
  notes:
    say: |
      Take the claim "170 million new jobs by 2030" and ask the seven questions. Who said it? The World Economic
      Forum, from employers' answers. Whom did they ask? Over 1,000 employers, not workers. When? A survey that ran
      from May to September 2024. What caused it? All the trends the survey asked about combined, such as wider
      digital access, the cost of living, the green transition and aging populations, not AI alone. What was
      measured? Expectations and plans, not outcomes. Forecast or count? An estimate for 2025 to 2030. Gross or net?
      Gross: 92 million displaced come with it, so the net figure is about 78 million. In short, the report is the
      primary source for what these employers expected, not evidence of what will happen.
    background: |
      WEF (2025): over 1,000 employers employing more than 14 million workers, 22 industry groups, 55 economies;
      answers collected May to September 2024 (a note on p. 99 says May to August; Deep 20.A). Respondents are
      mostly large employers; small firms and informal work are out of scope (p. 97). The WEF extrapolated the
      percentages to the jobs in its dataset (about 1.2 billion). Jobs linked to AI and information processing:
      about 11 million created and 9 million displaced (p. 25). Other key findings: on average 39% of workers' core
      skills expected to change or become outdated; analytical thinking rated the top core skill (seven in ten
      companies call it essential); AI and big data top the fastest-growing skills; two-thirds of employers plan to
      hire people with specific AI skills, while 40% expect to reduce their workforce where AI can automate tasks.
    misconceptions:
      - m: "M4 ''78 million new jobs' is a fact about the future.'"
        fix: "It is a forecast by surveyed employers, extrapolated, gross and net. Do not overcorrect into 'forecasts are useless': they report what employers expected and planned, dated."
    activity: "Self-study; Check Yourself 20.2."
    book: "§20.2, @fig-20-6; Lab 20.3."

# F20.5 redrawn natively: at slide size the book's bar chart has labels of about 8 pt.
- layout: compare
  kicker: "§20.2 · WEF (2025), all trends, 2025–2030 · % of about 1.2 billion jobs (book figure F20.5)"
  title: "Created, displaced, net: three different numbers"
  size: 32
  columns:
    - heading: "Created"
      role: neutral
      text: "**170 million**"
      bullets: ["14% of jobs"]
    - heading: "Displaced"
      role: neutral
      text: "**92 million**"
      bullets: ["8% of jobs"]
    - heading: "Net growth"
      role: neutral
      text: "**78 million**"
      bullets: ["7% of jobs"]
  takeaway: "170 million is gross; net is about 78 million; churn is 22%"
  notes:
    say: |
      The chart puts the three numbers side by side. About 170 million jobs created, 14 percent of the roughly 1.2
      billion jobs in the report's dataset. About 92 million displaced, 8 percent. Net growth, created minus
      displaced, about 78 million, or 7 percent. Created plus displaced, 22 percent of those jobs, is what the report
      calls churn. Notice that a headline can pick any one of these numbers and sound very different: "170 million
      new jobs" and "92 million jobs wiped out" describe the same estimate. And none of the three is an AI number;
      they cover every trend the survey asked about. For AI and information processing, the report gives about 11
      million created and 9 million displaced.
    background: |
      Data from data/ch20_wef2025.csv (WEF, 2025, pp. 5–6, 25, 97, 99). Gross = before subtracting; net = what
      remains. Deep 20.A (optional): churn = (170 + 92) ÷ 1,180 ≈ 22%; covered roles about 1.18 billion employees out
      of 2.18 billion in the ILO data. Skill-change estimates moved between editions: 57% (2020), 44% (2023), 39%
      (2025). In a portfolio a labor-market sentence is optional: one at most, exact, dated and attributed; "AI
      will…" only when quoting someone.
    questions:
      - q: "Why is 'AI will create 170 million jobs' wrong in two ways?"
        a: "It is not an AI number (all trends combined) and it is a gross estimate from employers' 2024 expectations, not a fact (Check Yourself 20.2)."
    activity: "Self-study."
    book: "§20.2, @fig-20-5 (redrawn here as three cards); Deep 20.A."

- layout: compare
  kicker: "§20.2 · worked example · constructed"
  title: "Lucia’s sentence: check it, fix it, then cut it"
  size: 22
  columns:
    - heading: "First draft"
      role: risk
      text: "“AI is creating 170 million jobs, so accounting is safe.”"
    - heading: "Checked"
      role: neutral
      bullets: ["Gross, not net", "Worldwide estimate", "All trends, not AI"]
    - heading: "Decision"
      role: verified
      bullets: ["Rewritten exactly, dated, attributed", "Then cut: it says nothing about her"]
  takeaway: "Accurate is not the same as useful to your reader"
  notes:
    say: |
      Here is the habit in one example. Lucia's first draft of her narrative said: "AI is creating 170 million jobs,
      so accounting is safe." She checks it against the report. The number is gross; it covers jobs worldwide; it is
      an estimate; and it is not an AI number, because it sums every trend the survey asked about. Her rewrite is
      exact, dated and attributed: the World Economic Forum, extrapolating from a 2024 survey of over 1,000
      employers, estimated about 170 million jobs created and 92 million displaced worldwide from 2025 to 2030,
      across all trends. Then she cuts the sentence from her narrative. It is accurate now, but it says nothing about
      her. That is the last step of reading a claim: deciding whether your reader needs it at all.
    background: |
      §20.2 Worked Example "Lucia's Sentence" (constructed). Faded example (journalism): "AI will wipe out 92 million
      jobs." Model answer (Appendix E): gross, not net (the same estimate has about 170 million created, net about
      78 million); displaced by all trends combined, not AI alone (AI and information processing: about 9 million
      displaced and 11 million created); the WEF's estimate from employers' 2024 expectations for 2025–2030. Review
      C1 (odd): strong answers say one exact, dated sentence can show awareness of the field but says nothing about
      the student, and most portfolios are stronger without one.
    activity: "Self-study; then try the faded headline."
    book: "§20.2 Worked Example 'Lucia's Sentence', Faded Example 'A Headline'; Review C1."

- layout: quiz
  kicker: "Review Questions A3 · §20.2"
  title: "net growth"
  question: "The WEF estimated about 170 million jobs created and 92 million displaced from 2025 to 2030. What is the expected net growth?"
  options:
    - "About 78 million jobs, or 7% of the jobs in the report’s dataset."
    - "About 170 million jobs, or 14% of the jobs in the report’s dataset."
    - "About 262 million jobs, or 22% of the jobs in the report’s dataset."
    - "About 92 million jobs, or 8% of the jobs in the report’s dataset."
  answer: a
  instruction: "Answer without notes, then check"
  explanation: "(b) is the gross figure; (c) adds created and displaced (that is churn); (d) is the displaced figure"
  notes:
    say: |
      Final-exam practice in the exam's Part A format. Read the four options and commit to one before checking. The
      question looks like arithmetic, and it is, but the distractors test whether you know the words. Each wrong
      option is a real number from the same report, used in the wrong role: one is the gross figure, one is the
      displaced figure, and one adds created and displaced together. If you can say what each of the four numbers
      is called, you understand gross, net and churn. Keep the units in mind too: the percentages are shares of
      the roughly 1.2 billion jobs in the report's dataset, not of all jobs in the world.
    background: |
      Review Questions A3 (O2 · LO3 · Apply). Key from Appendix E: (a) 170 − 92. Distractor sources (chapter
      comment): (b) gross for net (M4); (c) and (d) adding or picking the wrong figure.
    activity: "Self-study item; answer on the next slide."
    book: "§20.2; Review Questions A3; Appendix E."
  answer_minutes: null
  answer_notes:
    say: |
      The answer is (a): about 78 million jobs, or 7 percent of the jobs in the report's dataset, because net growth
      is jobs created minus jobs displaced, 170 minus 92. Option (b) is the gross figure, the one headlines like.
      Option (c) adds the two together: that sum, 22 percent, is what the report calls churn, a measure of how much
      the workforce moves, not of growth. Option (d) is the displaced figure alone. And remember the context that no
      option states: all of these are estimates from employers' expectations collected in 2024, across all trends,
      not only AI.
    background: |
      Appendix E (Chapter 20, Review A3). Net job growth and labor-market churn are defined in Deep 20.A (key terms
      marked Deep; optional), but gross and net are Core (§20.2).
    activity: "Self-check."
    book: "§20.2; Deep 20.A; Appendix E."

- layout: section
  number: "Case"
  tag: "Core"
  title: "Your experience, your first draft"
  idea: "Three employers’ rules keep AI tools out of the interview."
  meta: "Case Study (C29) · exam preparation"
  notes:
    say: |
      The Case Study returns to the Opening Case with more employers. Three firms, three rules about AI in hiring,
      two of them known only through news reports. The question for exam preparation is not "which company is right"
      but: what does each rule protect, where do the rules agree, and what can you conclude from three firms? The
      short answer, which the next two slides build: all three keep AI tools out of the interview, because the
      interview is the moment an employer can see the person think. Three firms are not a survey; they show that
      some employers set such rules, not what employers in general do.
    background: |
      Case C29 tiers: confirmed = Anthropic's candidate page (July 10, 2025); reported = Fortune (Feb 4, May 19, Jul
      21 and Jun 11, 2025) and Business Insider (Feb 27, 2025). No AI output was wrong, so no Failure Taxonomy Tree
      label and no failure-to-harm chain: a case about rules, like Chapter 1's productivity study. All three dated
      "as of October 2026".
    activity: "Reference slide (not presented)."
    book: "Case Study 'Your Experience, Your First Draft'."

# Native redraw of @fig-20-18: a 3 × 3 matrix of employers by stages with row and column headers, about 64 words;
# every cell is needed to show where rules were and were not reported (deliberate exception to the 40-word guide).
- layout: matrix
  max_words: 65
  kicker: "Case Study · three employers by three stages (book figure, redrawn)"
  title: "All three rules keep AI tools out of interviews"
  size: 22
  col_headers: ["Application", "Take-home", "Interviews"]
  row_headers: ["Anthropic (own page)", "Amazon (reported)", "Goldman Sachs (reported)"]
  cells:
    - - {title: "Own first draft", text: "AI may refine; invent nothing", role: neutral}
      - {title: "No AI", text: "unless allowed", role: neutral}
      - {title: "No AI", text: "unless indicated", role: neutral}
    - - {title: "No rule reported", role: soft}
      - {title: "No rule reported", role: soft}
      - {title: "AI may disqualify", text: "unless explicitly permitted", role: neutral}
    - - {title: "No rule reported", role: soft}
      - {title: "No rule reported", role: soft}
      - {title: "No outside sources", text: "including ChatGPT", role: neutral}
  takeaway: "Three firms show that such rules exist — not what employers in general do"
  notes:
    say: |
      Read the matrix by rows. The first company, from its own page as of July 2025: your own first draft of
      application materials, AI may refine but never invent experience; no AI in take-home tasks unless the company
      says it is allowed; no AI in live interviews unless indicated. Amazon, reported by Business Insider in February
      2025: internal recruiting guidelines said candidates could be disqualified for using generative AI in
      interviews unless explicitly permitted. Goldman Sachs, reported by Fortune in June 2025: an email to applicants
      said its video-interview process prohibits outside sources, including ChatGPT or a search engine. The row labels
      say which rules come from the company's own page and which are reported; "No rule reported" marks a gap in the
      reports, not evidence that those stages are unregulated.
    background: |
      Amazon (Kim, 2025, Business Insider, Feb 27): reasons given were an unfair advantage and the difficulty of
      assessing a candidate's own skills (reported). Goldman Sachs (Burleigh, 2025b, Fortune, June 11, citing
      eFinancialCareers): the campus recruiting team's email to applicants to its private investing academy in EMEA
      (Europe, the Middle East and Africa); the interview process uses the HireVue platform; a spokesperson said the
      same language goes to all campus applicants (reported). The first company's page also says it does not use
      candidates' data to train its model or let the model make hiring decisions, and asks candidates who need
      accommodations to tell their recruiter early (confirmed).
    questions:
      - q: "Why do all three rules keep AI out of the interview?"
        a: "The interview is the moment the employer sees the person think without a tool; the first company states this reason on its page ('how you think'); the rest is the book's reading."
    activity: "Self-study."
    book: "Case Study, short case 'Two interview rules from other large employers', @fig-20-18."

- layout: compare
  kicker: "Case Study · what each rule protects (this book’s reading)"
  title: "Each rule protects evidence of the person"
  size: 22
  columns:
    - heading: "Your first draft"
      role: human
      text: "Protects evidence of your own thinking"
    - heading: "No invented experience"
      role: human
      text: "Protects the truth of the record"
    - heading: "No AI in live interviews"
      role: human
      text: "Protects a moment to see you think without a tool"
  takeaway: "Your portfolio answers all three"
  notes:
    say: |
      What does each rule protect? This is the book's reading, marked as such. The first-draft rule protects evidence
      of the applicant's own thinking. The no-invention rule protects the truth of the record. The interview rule
      protects a moment in which the employer can see the person think without a tool, which is the page's own
      stated reason. The page allows what does not threaten these: preparation and polishing. Now map it onto your
      portfolio. Your declaration answers the company's request for openness. Your revision trace shows the first
      draft was yours. Your entries contain only experience you had. And your oral defense is the live interview,
      without a tool. That is also the answer to the Opening Case's puzzle.
    background: |
      Case Study "What each rule protects" (inferred tier: the book's reading, except "how you think", the page's
      stated reason). Appendix E, Case Study Q1 and Q5: the defense mirrors the live interview (live, no tool,
      questions about your own work) and differs (it is about course work, graded on a published rubric with an
      alternative route, and asks explicitly about the AI's part). Ethics Lens (recommended): transparency runs both
      ways; the company states its model does not make hiring decisions and candidates' data does not train it, a
      claim applicants can hold a company to; Chapter 18 covers laws on automated decisions about people.
    questions:
      - q: "Should employers ban AI in all application materials?"
        a: "Take a position with evidence from the case. The Ethics Lens notes that a first-draft rule lets someone like Maya, who writes important messages in Turkish first, draft and then refine (the book's reading)."
    activity: "Self-study; Case Study Questions 1–5."
    book: "Case Study ('What each rule protects', 'What a portfolio answers'); Ethics Lens; Chapter Summary."

- layout: quiz
  kicker: "Review Questions A11 · §20.8"
  title: "the strongest answer"
  question: "Which is the strongest answer to “What did the AI do, and what did you do?”"
  options:
    - "“The AI did most of the writing, and I checked it before I handed it in.”"
    - "“I asked for X, it gave Y, I rejected Z because…, I checked it against…, and I decided.”"
    - "“I used AI the way the course allows, so the work is fully mine.”"
    - "“I am not sure what the AI did, but the final version is correct.”"
  answer: b
  instruction: "Answer without notes, then check"
  explanation: "(a) leaves out every link; (c) cites a rule instead of evidence; (d) admits no ownership"
  notes:
    say: |
      One more Part A item, on the defense question. All four options are things students actually say, which is why
      it is worth practicing. Before you choose, count the links of the decision chain in each answer: what was asked
      for, what the AI produced, what was kept, changed or rejected and why, how it was checked, and who decided. The
      strongest answer gives a listener every link. Notice also the answer that sounds confident but rests on a rule
      rather than on evidence; a rule tells the listener what was allowed, not what you did. Commit to an answer,
      then check it on the next slide.
    background: |
      Review Questions A11 (O6 · LO6 · Understand). Key from Appendix E: (b). Distractors: (a) M6, leaves out every
      link; (c) cites a rule instead of evidence; (d) admits no ownership of the work. The chapter notes the key is
      the longest option in this item (one of two allowed).
    activity: "Self-study item; answer on the next slide."
    book: "§20.8; Review Questions A11; Appendix E."
  answer_minutes: null
  answer_notes:
    say: |
      The answer is (b): asked for, produced, rejected and why, checked against something, decided. It is the
      decision-chain answer from section 20.8. Option (a) is the weak answer from the Warm-up: it leaves out what was
      asked, what was rejected, how it was checked and who decided. Option (c) cites a rule instead of evidence:
      being allowed to use AI does not show what you did. Option (d) admits no ownership of the work; even if the
      final version is correct, the listener learns nothing about your judgment. In the defense, the strongest answer
      also shows the evidence: open the portfolio to the before and after, or to the trail.
    background: |
      Appendix E (Chapter 20, Review A11). Warm-up item 3 revisited in the Chapter Summary: "It wrote most of it and
      I checked it" is weak; give the decision chain.
    activity: "Self-check."
    book: "§20.8; Appendix E; Chapter Summary (Warm-up revisit)."

- layout: objectives
  kicker: "Chapter summary (book figure: summary card)"
  title: "What convinces a reader who has never met you"
  items:
    - {code: "O1", text: "Evidence, not a skills list (NACE)"}
    - {code: "O2", text: "Numbers with who, whom, when, gross or net"}
    - {code: "O3", text: "Before and after, the reason, the check"}
    - {code: "O4", text: "The AI’s part and yours, every claim to an artifact"}
    - {code: "O5", text: "Others’ information protected"}
    - {code: "O6", text: "Explained live, without a tool"}
  takeaway: "Chosen work with its evidence, explained live"
  notes:
    say: |
      The chapter's question was: what will convince a reader who has never met you that you can do this work, with
      AI, responsibly? Not a list of skills or tools: readers discount those, and in NACE's surveys employers were
      less positive about graduates' proficiency than students were in most competencies. What convinces is a few
      chosen pieces of work in which the reader can see the before and the after, what the AI did and what you did,
      how you checked and what you left out to protect others. A short narrative ties them together, every claim
      pointing to one of them, and the case closes when you explain any of it live, without a tool. Labor-market
      numbers can frame why it matters, if you say who estimated them, when, how and from what.
    background: |
      Chapter Summary and @fig-20-20. Warm-up revisit: (1) a draft shows the judgment between draft and final; (2)
      "AI will create 170 million jobs": the WEF's estimate from employers' 2024 expectations for 2025–2030, with 92
      million displaced, all trends combined (AI and information processing about 11 million created, 9 million
      displaced); (3) "It wrote most of it and I checked it" is weak; give the decision chain.
    activity: "Self-study."
    book: "Chapter Summary, @fig-20-20; Warm-up revisit."

