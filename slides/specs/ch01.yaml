- layout: exit_ticket
  minutes: 3
  questions:
    - "Why does “AI helps beginners most at work” not mean “beginners should let AI do their coursework”?"
    - "Which task surprised you, and what test showed it?"
    - "Which Work Loop step will you watch most in A1?"
  instruction: "3 min · index card or online form · ungraded"
  notes:
    say: |
      Last three minutes: the exit ticket. Answer the three questions on an index card or in an online form; it is
      not graded, and it tells me what to reteach next time. The first question checks the most important idea of
      the chapter. The second and third are about you: what surprised you in your own tests, and which step of the loop
      you will watch most closely while you write A1. Before you leave: A1 is due when your instructor sets it, on your course site,
      and next we open with another case, the Amazon recruiting tool, and ask how machines learn from data.
    background: |
      Question 1 is Check Yourself 1.2, item 3. Good answer (§1.2): at work, the goal is the output, so faster is
      better; in a course, an assignment exists to build a skill you can use without the tool, so if the tool produces
      the reasoning the assignment is done but the learning is not; evidence: the Türkiye mathematics study (Bastani et
      al., 2025). Next: Chapter 2, opening case the Amazon recruiting tool; how machines learn
      from data, then what a language model is.
    activity: "3 min; collect cards at the door or close the online form when time is up."
    book: "§1.2 (question 1); §1.7; Chapter 2."

# ======================================================================= REFERENCE SLIDES
- layout: deep
  session: after
  kicker: "Deep 1.A · how economists measured the effect"
  title: "Going deeper: a staggered rollout as an experiment"
  figure: f1-16-staggered-rollout
  size: 22
  bullets:
    - "Groups got the tool at different times"
    - "Compare recently treated with not-yet-treated, in the same weeks: **difference-in-differences**"
    - "Works only if groups were on parallel paths before"
  takeaway: "Ask of any AI study: compared with whom? Measured how? In what setting?"
  notes:
    say: |
      Use this slide only if there is time or a student asks how anyone can know the assistant caused the 15 percent
      gain. The assistant did not reach every agent on the same day: it arrived a few at a time over several months, a
      staggered rollout. At any moment, some agents had the tool and similar agents did not yet. The analysis compares
      the change in performance for agents who just received it with the change, over the same weeks, for agents
      still waiting. Anything that affected everyone, like a seasonal rush, shows up in both groups and cancels out.
      That is a difference-in-differences comparison. It works only if, without the tool, the groups would have moved
      in parallel; researchers check that the groups were on similar paths before the tool arrived.
    background: |
      Deep 1.A (optional, not examinable). The check matters here because managers chose which agents attended each
      training session. The authors report several checks, including similar effects across groups that started at
      different times and a small randomized pilot with similar results (Brynjolfsson et al., 2025). Limits: one
      company, one kind of job, one tool; productivity measured as issues resolved per hour (a different measure, such
      as long-term customer loyalty, might tell a different story). The writing and consulting studies used random
      assignment but designed tasks. The figure is schematic (three waves over eight months), not the study's actual
      schedule.
    questions:
      - q: "Is a randomized experiment always better?"
        a: "Random assignment makes groups alike on average, but those studies used tasks designed for the experiment, which may differ from real jobs. Each design trades realism against control (Deep 1.A)."
    activity: "Optional; not part of the 75-minute plan."
    book: "Deep 1.A How Economists Measure AI's Effect at Work, @fig-1-16."

