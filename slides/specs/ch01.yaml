      These are the key terms for the chapter. They may appear on a quiz or exam that asks for terms and
      concepts, so make sure you can define each one in a sentence in your own words. A quick self-test: cover the
      slide and define three of them for your neighbor. Pay special attention to the pairs: assistance and outsourcing;
      fluent and correct; control group and random assignment. The two terms marked Deep come from an optional
      section on how economists measure effects; they are not on the exams, but they help you read any study about AI
      at work.
    background: |
      Key Terms list from the chapter (19 terms). Definitions are in the chapter text and docs/glossary.md, worded
      identically. Examinable scope is Core sections only; Deep sections are not examinable (book decision D20).
