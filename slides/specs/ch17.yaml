    - "fidelity (of a surrogate model)"
    - "chain-of-thought text"
    - "model card"
    - "datasheet (for a dataset)"
    - "system card"
    - "algorithm register"
    - "right to contest"
  note: "Definitions: Chapter 17 and the glossary. The whole chapter is Deep: optional, not examinable."
  notes:
    say: |
      These are the chapter's key terms. None of them is on an exam, because the whole chapter is Deep. Two of them
      return in required chapters, though: Chapter 19 defines model card again, because the model-card paper is
      recommended reading there, and the habit behind faithfulness, treating a model's account of its own reasoning as a
      claim to check, is a book-wide rule. If you learn only three pairs from this list, learn these: global and local
      explanation; faithful and plausible; counterfactual and recourse. Each pair separates something that sounds
      like an explanation from something you can actually use.
    background: |
      Key Terms list from the chapter (22 terms). Book-wide vocabulary decisions: "faithful" vs. "plausible" is the
      book's pair; "fidelity" only for surrogate models; a model's self-account is a claim, never a record; opacity is
      not a branch of the Failure Taxonomy Tree (chapter-brief, book-wide rules). Examinable scope: Core sections only
      (D20).
    activity: "Optional 30-second pair self-test on the three pairs."
    book: "Chapter Summary, Key Terms; glossary."

