- layout: deep
  kicker: "Deep 2.B · one learning step, with numbers"
  title: "Going deeper: one step downhill"
  figure: f2-14-gradient-step
  size: 22
  bullets:
    - "price = w × size; start at w = 2"
    - "Sold for 300; model says 200"
    - "Step w downhill: **gradient descent**"
    - "Step size: **learning rate**"
  takeaway: "Large models do the same with billions of settings at once"
  notes:
    say: |
      Use this slide only if there is time or a student asks what "adjust the settings" means in numbers. Take the
      simplest possible model: price equals w times size, with one setting, w. A 100-square-meter apartment sold for
      300, in thousands of dollars. If w is 2, the model predicts 200, so the prediction is 100 too low. To learn, the
      training procedure measures how the error changes when w changes, and moves w a small step in the direction that
      reduces the error. Picture the error as a valley over all possible values of w; each step goes a little downhill.
      That procedure is gradient descent. The step size is the learning rate: too small, and learning takes a very long
      time; too large, and each step jumps past the bottom of the valley.
    background: |
      Deep 2.B (optional, not examinable). The curve is the squared error (× 1,000) for each value of w; the lowest
      error is at w = 3; the step shown goes from w = 2 toward about 2.6. Illustration, not market data (@fig-2-14).
      Appendix F works through the calculation. The other Deep sections: 2.A (three waves of AI: Dartmouth 1956,
      expert systems, 2012 image-recognition leap, 2016 AlphaGo, 2017 Transformer, November 2022 ChatGPT) and 2.C
      (discriminative vs. generative models; precision and recall).
    questions:
      - q: "Why not jump straight to w = 3?"
        a: "With one setting you could, but real models have millions or billions of settings and no formula for the best values; small steps downhill, repeated, are what works at scale."
    activity: "Optional; not part of the 36-minute plan."
    book: "Deep 2.B One Learning Step, with Numbers, @fig-2-14; Appendix F."

