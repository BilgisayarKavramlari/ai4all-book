      These are the key terms for Chapter 4. Exams that use this book ask for terms like these, so make sure you can
      define each one in a sentence of your own. Watch the pairs: documented and inferred; intrinsic and extrinsic; direct and indirect
      injection; the tree and the chain. And watch one filing decision the book makes: sycophancy is a leaf of
      overconfidence. Confabulation is marked Deep; it is the name a U.S. standards body uses for hallucination, and it
      is not on the exams.
    background: |
      Key Terms list from the chapter (19 terms). Definitions in the chapter and docs/glossary.md. Examinable scope:
      Core sections only (D20); Deep 4.A and 4.B are not examinable. NIST AI 600-1 (2024) calls hallucination
