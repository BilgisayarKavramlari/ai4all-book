- layout: deep
  kicker: "Deep 4.A · why “I don’t know” is rare"
  title: "Going deeper: scoring that rewards guessing"
  figure: f4-12-scoring-rules
  figure_width: 0.6
  size: 22
  bullets:
    - "Most benchmarks: wrong and “I don’t know” both score 0"
    - "So guessing never scores worse"
    - "With wrong = −3, answer only above 75%"
  takeaway: "In your own work, treat an answer with no source as a guess"
  notes:
    say: |
      Use this slide only if there is time or a student asks why tools rarely say "I don't know". Think of a
      multiple-choice exam with no penalty for wrong answers: if you do not know, you should still guess, because a
      blank scores zero and a guess sometimes scores a point. Kalai and colleagues argue that language models face the
      same incentive: most benchmarks score a correct answer as one point and both a wrong answer and "I don't know" as
      zero, so a model tuned to score well never gains by abstaining. With a penalty of minus 3 for a wrong answer,
      answering pays only when the chance of being right is above 75 percent. As a user, you can change the scoring in
      your own work: treat an answer with no source as a guess.
    background: |
      Deep 4.A (optional, not examinable). Kalai et al. (2025), arXiv:2509.04664: three OpenAI researchers and one at
      Georgia Tech; a preprint, not peer reviewed, as of October 2026. The authors propose that benchmarks state such a
      penalty in each question's instructions. They also argue that, even with error-free training data, a model should
      be expected to get wrong at least about as large a share of arbitrary facts as appear exactly once in its training
      text (if 20% of birthdays appear only once, expect at least about 20% errors on birthdays). A model that says "I
      don't know" more often is not automatically better: it may also refuse questions it could answer. @fig-4-12 is a
      computed illustration (data/ch04_scoring.csv); the paper's v1 text prints "penalty 2" at 75%, an arithmetic slip
      noted in the script (the penalty is 3). Deep 4.B compares the tree with NIST AI 600-1 (twelve risks;
      "confabulation") and the OWASP Top 10 for LLM Applications 2025 (prompt injection listed first).
    questions:
      - q: "Should I tell a tool to say 'not sure' when it has no basis?"
        a: "You can ask; whether a tool follows that request is itself something to test (Deep 4.A)."
    activity: "Optional; not part of the 75-minute plan."
    book: "Deep 4.A Why 'I Don't Know' Is Rare, @fig-4-12; Deep 4.B Other Maps of AI Failure."

