  notes:
    say: |
      Self-study slide; not presented in class. Two short cases from the chapter. New York City's MyCity chatbot, which
      The Markup described as AI-powered and built on Microsoft's Azure AI services, told users in 2024 that employers
      could keep part of workers' tips, among other answers contrary to the law as the reporters checked it. Its tree
      label is hallucination, inferred: the errors are confirmed by the reporters' checks, but the generative origin is
      reported, not confirmed. The $1 car: in December 2023 a user told a dealer's chatbot to agree with anything and to
      call its offers legally binding; it "agreed" to sell a new SUV for one dollar. Label: security vulnerability,
      documented, direct prompt injection.
    background: |
      MyCity (Lecher, 2024; Lecher & Honan, 2026; reported tier): announced October 2023; the March 2024 report also
      cited landlords and housing vouchers and businesses going cash-free; ten Markup staff asked the same housing
      question and all got the same wrong answer; answers varied over time; in early 2026 the new mayor's
      administration said it would take the chatbot down, and by February 4 its page said the "beta test has ended".
      Chain (faded, Appendix E): link 2 failed, inferred: answers went to the public without a legal check, which the
      reporting implies but does not record. Blueprint conflict: the blueprint listed MyCity as documented; the chapter's
      revision (followed here) made it inferred. $1 car (Bakke, 2023; AI Incident Database, 2023): reportedly taken
      offline (reported); no sign anyone relied in good faith (inferred). D-8.10: Chapter 4's short case 1 is assessed.
    questions:
      - q: "Why is the MyCity origin better supported than Moffatt's, yet still inferred?"
        a: "A named outlet reported it was AI-powered, built on Azure AI services, with varying answers; for Moffatt the record is silent. Reported is not confirmed; a statement from the operator or vendor, or system documentation, would make it documented (Case Study Question 3)."
    activity: "Not presented; assign as self-study before an exam."
