- layout: exit_ticket
  minutes: 2
  questions:
    - "Why is the airline’s chatbot labeled hallucination “inferred”?"
    - "Which link of the chain do you control most often?"
    - "Name one test that would expose context loss in your own work."
  instruction: "2 min · index card or your course site · ungraded"
  notes:
    say: |
      Last two minutes: the exit ticket, on an index card or on your course site. It is not graded; it tells me what
      to reteach at the start of the lab session. The first question checks the most important rule of the day, the one that
      decides documented or inferred. The second asks you to place yourself on the chain. The third asks you to design a
      test, which is exactly the habit the lab session builds on. Before you leave: read Chapter 8, do the pre-lab, and
      bring your ten A5 rows.
    background: |
      Good answers: (1) the reply is shown wrong (confirmed), but the record does not show that a generative model
      produced it (para. 14), and two other readings fit; (2) links 2 and 3: whether you check, and how far you rely
      (§4.7); (3) a constraint-recall probe: a rule at turn 1, filler turns, check the rule later (Lab 4.2 probe 1), or
      compare a long chat's late answer with an early constraint (§4.4). Next session: the lab session, Lab 8.1 "Ten
      Claims" (Chapter 8 deck).
    activity: "2 min; collect cards at the door or close the online form at the end of the session."
