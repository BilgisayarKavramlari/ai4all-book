- layout: objectives
  minutes: 1.25
  kicker: "Chapter 4 summary (book figure: summary card)"
  title: "Is AI failure a bug or a feature?"
  items:
    - {code: "O1", text: "**Classify:** five branches; documented or inferred"}
    - {code: "O2", text: "**Explain:** no truth check; data and feedback; window and long chats"}
    - {code: "O2", text: "**Explain:** rating pressure; one stream for instructions and data"}
    - {code: "O3", text: "**Analyze:** output → check → reliance → loss"}
    - {code: "O4", text: "**Test:** known-answer, pushback, constraint recall"}
    - {code: "O5", text: "**Analyze:** your own failures in a diary"}
  takeaway: "Mostly a feature of how they work; whether it harms depends on people"
  notes:
    say: |
      Back to the chapter's question: is AI failure a bug that will be fixed, or a feature of how these systems work?
      Mostly the second, with a hopeful qualification. Each branch follows from how these systems are built and used:
      likely text with no truth check, patterns inherited from data and feedback, a limited context and early
      commitment, tuning toward answers people rate highly, and one stream for instructions and data. So failures are
      expected, not exceptional. Better models, retrieval and tools lower some failure rates on some tasks, but as of
      October 2026 none removes a branch. Whether an error becomes a harm depends on the people around the tool. Check
      your warm-up: the company; yes; and yes.
    background: |
      Chapter Summary (@fig-4-2s complete tree with five cause lines; @fig-4-13 summary card). Return to the Opening
      Case: if it was a generative system, the likely answer is a hallucination, likely-sounding policy text produced
      without a check against the page it linked to; the record does not say, so the label stays inferred. Who answers?
      In this decision, the airline. Warm-up revisit: (1) the company that runs the website; (2) yes, recombination;
      (3) yes, text inside it can act as an instruction.
    activity: "Ask two students which warm-up answer they changed."
    book: "Chapter Summary, @fig-4-2s, @fig-4-13; Warm-up revisit."

