# Lecture deck spec — Chapter 4: How and Why AI Fails (concept session; paired with Chapter 8)
# Format and notes standard: slides/README.md. Build: python3 tools/build_slides.py slides/specs/ch04.yaml --preview
# Independence rule D27 (docs/production/independence-rules.md): no institution, course code, term, dates, course
# site names or syllabus references on slides or in notes; sessions are named by type and length only.
# Reading order differs from chapter order (chapter-brief): Ch. 1 → 2, 3 → 5 (+6 Deep) → 7 → 4 + 8. Chapters 4 and 8
# are paired: this deck is Session 1, the concept session (about 75 min: Moffatt opening case, Core 4.1–4.7, a live
# demonstration "asking for sources on a niche topic" run as Lab 4.1, concept checks); Session 2, the verification
# lab, is Chapter 8's deck (slides/specs/ch08.yaml). So this deck has one presented session (tue key, 75 min).
# The Case Study short cases and Deep 4.A sit in the "after" session (self-study and reference, not presented).
# Every number and quotation comes from the sources under deck.sources; the builder flags any number it cannot find.

deck:
  chapter: 4
  slug: how-and-why-ai-fails
  title: How and Why AI Fails
  short_title: How and Why AI Fails
  author: Sadi Evren Seker
  sessions:
    tue: {label: "Session 1 · concept session, about 75 min", minutes: 75}
    after: {label: "self-study and reference slides (not presented)"}
  sources:
    - chapters/04-how-and-why-ai-fails.qmd
    - labs/ch04-lab1.md
    - labs/ch04-lab2.md
    - labs/ch04-lab3.md
    - figures/longdesc/ch04.md
    - appendix/answers.md
    - docs/blueprints/ch04-blueprint.md
    - docs/decisions.md
    - chapters/08-hallucination-uncertainty-and-verification.qmd
    - labs/ch08-lab1.md

