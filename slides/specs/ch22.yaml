- layout: objectives
  minutes: 0.5
  kicker: "Chapter 22 · learning objectives (optional chapter)"
  title: "After this chapter you can…"
  items:
    - {code: "O1", text: "**Distinguish** measured, reported and forecast claims, each dated"}
    - {code: "O2", text: "**Explain** what reasoning models do differently, and their limits"}
    - {code: "O3", text: "**Interpret** a dated trend chart on a log axis"}
    - {code: "O4", text: "**Compare** open-weight and closed models beyond scores"}
    - {code: "O5", text: "**Evaluate** an energy or discovery claim: what it counts, who checked"}
    - {code: "O6", text: "**Judge** which dated claims have aged"}
  notes:
    say: |
      Six objectives, in the order of the chapter. The first is the method the whole chapter rests on: telling measured
      claims from reported ones and from forecasts, each with the date it was made. The next four apply it: what a
      reasoning model does differently from an earlier chat model and what outside tests show; how to read a trend chart
      whose axis grows by multiples; how far open-weight models trail closed ones, and what matters besides scores; and
      how to judge a claim about energy use or a scientific discovery by what it counts and who checked it. The last
      objective turns the method on the chapter itself: which of its claims have already aged? None of these is examined.
    background: |
      Chapter wording and tags: O1 Distinguish measured, reported and forecast claims about an AI development, each with
      its as-of date (LO1, LO3; AI Fluency: Discernment); O2 Explain what a reasoning model does differently from an
      earlier chat model and what outside evidence shows about its gains and limits (LO1; AI4K12: Learning); O3 Interpret
      a dated trend chart: a logarithmic axis, data points and a fitted trend line (LO1); O4 Compare open-weight and
      closed models on the measured capability gap and on what each lets users inspect and control (LO1; Delegation); O5
      Evaluate a claim about AI's energy use or a scientific discovery by what it counts and who checked it (LO1, LO3;
      Discernment, Diligence; UNESCO: Ethics of AI); O6 Judge which claims in a dated account have aged and what that
      means for work in your field (LO1; Diligence; UNESCO: Human-centred mindset, Apply).
    activity: "Do not read the list; point to O1 as the habit the segment builds and O6 as where it ends."
    book: "Chapter 22, Learning Objectives; Warm-up (three questions, revisited in the Summary)."

# About 56 words incl. labels and status pills: four tagged events are the case (deliberate exception).
- layout: timeline
  minutes: 2.5
  max_words: 58
  kicker: "Opening case · International Mathematical Olympiad (IMO), July 2025 · pill = status (last: case tier)"
  title: "Two gold medals, three kinds of grading"
  events:
    - {label: "Jul 19 · OpenAI", text: "Experimental model, 35 of 42; ex-medalists graded, per OpenAI", tier: "reported"}
    - {label: "Jul 21 · DeepMind", text: "Gemini Deep Think, 35 of 42; IMO coordinators graded", tier: "measured"}
    - {label: "Same week", text: "Seed Prover, 30 of 42; proofs checked in Lean", tier: "proofs measured"}
    - {label: "Not covered", role: risk, text: "Computing used; whether people helped", tier: "tier: reported (AFP)"}
  takeaway: "Puzzle: which 35 would you cite, and how?"
  notes:
    say: |
      Every July, secondary-school students from more than 100 countries sit the International Mathematical Olympiad: six
      proof problems over two days. In 2025, AI developers tested their systems on the same problems. On Saturday, July
      19, OpenAI said an experimental model had solved five of the six problems, 35 of 42 points, a gold-medal score;
      according to OpenAI, three former medalists graded the proofs. The IMO did not grade or certify them. On Monday,
      July 21, Google DeepMind announced that an advanced Gemini Deep Think had also scored 35 of 42, and here the IMO's
      own coordinators had graded and certified the proofs by the criteria used for students. A third kind of check came
      the same week: proofs checked line by line by a computer program. And the IMO's president said the organizers could
      not check the computing used or whether people helped. The puzzle: both 35-point statements may well be true. Which
      would you cite, how would you phrase it, and how long would your sentence stay accurate?
    background: |
      Tiers and statuses exactly as the chapter states them. OpenAI's result: reported (Wei, 2025, as reproduced by
      Willison, 2025); only Google had entered the competition, so the IMO did not grade or certify OpenAI's proofs
      (Davies, 2025); Reuters reported the IMO had asked cooperating companies to publish on July 28, and OpenAI said an
      IMO board member allowed it to publish after the closing ceremony (Reuters, 2025). DeepMind: its post is the
      confirmed record of what DeepMind says, and the score was graded by the IMO's coordinators, so the capability claim
      is measured, with the limit the post itself states: the IMO's review does not extend to validating the system,
      processes or underlying model (Google DeepMind, 2025). AFP (2025), reported: the IMO president's caution; of 641
      students from 112 countries, about 10% won gold and five scored a perfect 42. ByteDance said the IMO had confirmed
      Seed Prover's 30 of 42, after people translated the problems into Lean by hand and the system worked for about
      three days (ByteDance Seed, 2025); the proof checker confirmed each proof's validity, while the score is the
      developer's report, hence the pill "proofs measured". The fourth pill is a case tier, not a status: that the
      organizers could not check these things is a fact reported by AFP. Harmonic's Aristotle also reported a gold-medal-level result
      with formally verified proofs (Achim et al., 2025; Case Study). CONFLICT NOTE: Reuters' student counts differ from
      AFP's; the chapter uses AFP's and the blueprint records both.
    misconceptions:
      - m: "M1 “A developer's announcement tells you what AI can now do.”"
        fix: "Do not swing to “the announcement is false”: OpenAI's result may well be true. The point is that it is unchecked by an outside source until one checks it; the next slides give the vocabulary."
    activity: "Narrate; do not read the cards. Take two quick answers to the puzzle (which would you cite?) and park them for the worked example."
    book: "Opening Case 'Two Gold Medals, Three Kinds of Grading'; @fig-22-2 (storyboard); Case Study 'Two Gold Medals, Revisited'."

- layout: compare
  minutes: 2
  kicker: "§22.1 · reading a dated claim (book figure @fig-22-4, redrawn)"
  title: "Every capability claim needs three tags"
  size: 24
  columns:
    - heading: "1 · As-of date"
      role: soft
      text: "When it was made or measured, **not** when you read it"
    - heading: "2 · Evidence status"
      role: neutral
      text: "Who has checked it so far"
    - heading: "3 · Who could check it"
      role: soft
      text: "The outside source that could make it measured"
  takeaway: "Trace first: no source named, no status yet"
  notes:
    say: |
      News about AI arrives as capability claims: statements that a system can now do something, such as "solves olympiad
      problems" or "completes two-hour software tasks." On its own, a capability claim is incomplete. To use one, you
      need three tags. First, the as-of date: when the claim was made or measured, not when you read it. A claim true in
      2024 may be false in 2026, so write the date into your sentence: "As of July 2025, …". Second, the evidence status:
      who has checked it so far. Third, who could check it: for a reported claim, name the outside source that could move
      it to measured, such as the competition, an evaluation group, peer reviewers or a replication. One rule comes before
      all three: trace first. A claim with no source, from a sales page, a newsletter or a speaker, has no status yet;
      trace it to where it came from, or write "no source given."
    background: |
      Definitions (§22.1): capability claim; as-of date; evidence status (who has checked a claim so far; it does not say
      whether the claim is true: a reported claim can be true, and a measured one can be measured badly or on the wrong
      task); outside evaluation (a test of a system run by an outside source). Statuses apply to claims about what a
      system can do or what it uses (a score, an energy figure). A fact about an event or a page (a prize was awarded, a
      paper passed peer review, a page stopped being updated) takes a case tier instead. The redrawn figure @fig-22-4 also
      prints the crosswalk with case tiers; it is on the next slide's notes.
    questions:
      - q: "If a claim is reported, does that mean it is probably false?"
        a: "No. The status says who checked it, not whether it is true. A reported claim can be true; it simply has not been checked by an outside source yet."
    activity: "Ask: “Name one AI claim you saw this week. Which of the three tags can you fill right now?” (Your Turn §22.1.)"
    book: "§22.1, @fig-22-4; Check Yourself 22.1; Your Turn §22.1."

- layout: compare
  minutes: 2
  kicker: "§22.1 · evidence status and its two variants"
  title: "Status says who checked a claim, not whether it is true"
  size: 22
  columns:
    - heading: "Measured"
      role: verified
      bullets:
        - "An outside source tested it; method readable"
        - "Variant: **outside estimate** from stated assumptions"
    - heading: "Reported"
      role: soft
      bullets:
        - "The developer, or an outlet citing it"
        - "Variant: **reported (compiled)** by a tracker"
    - heading: "Forecast"
      role: soft
      bullets:
        - "About the future, whoever makes it"
        - "Kept apart: **the book’s inference**"
  takeaway: "Ask who ran the test, not who printed it"
  notes:
    say: |
      Here are the statuses. Measured means tested, run or checked by someone other than the developer, with a method you
      can read: a competition's own graders, an evaluation group such as METR, or a program that checks proofs. Reported
      means stated by the developer, or by a news outlet citing the developer: a launch post, a system card, a benchmark
      table in an announcement. The developer's page is the primary source for what the developer claims, but it is not
      an outside source. A forecast is a statement about the future, and a forecast by a careful outside body is still a
      forecast. Two variants. When a tracker such as the AI Index compiles scores, many of them were reported by
      developers, so the tag is "reported (compiled)". When an outside body such as the International Energy Agency
      calculates a figure from stated assumptions, it is an "outside estimate": check its assumptions.
    background: |
      §22.1 and the box "Two kinds of labels, two questions." CROSSWALK: case tiers (confirmed, reported, inferred; since
      Chapter 5) ask whether a fact is in the primary record; the evidence status asks who checked the capability. The two
      can differ for the same sentence: DeepMind's blog post is the confirmed record of what DeepMind says, and the score
      it describes was graded by the IMO's coordinators, so the capability claim is measured. "Reported" appears in both
      lists with different meanings: as a tier, a named outlet says so; as a status, only the developer vouches for the
      capability. OpenAI's gold-medal claim, as Reuters relayed it, is reported in both senses. METR = Model Evaluation
      and Threat Research, a nonprofit; AI Index = Stanford HAI's annual report; Epoch AI = a research group tracking AI
      trends; IEA = International Energy Agency. The book's inference is marked "this book reads …" and drawn dashed in
      figures. CONFLICT NOTE: the blueprint listed the AI Index and the IEA among "measured" examples; the chapter v2
      tags them "reported (compiled)" and "outside estimate". The deck follows the chapter.
    misconceptions:
      - m: "M1 “A developer's announcement tells you what AI can now do.”"
        fix: "Use the crosswalk: the developer's page is a primary source for what the developer claims, and it passes Chapter 8's independent check (no AI tool produced it), but it is not an outside source."
    activity: "Ask: “The AI Index prints a developer's score. Measured or reported?” (Reported (compiled): ask who ran the test.)"
    book: "§22.1, box 'Two kinds of labels, two questions', @fig-22-4; Review Questions A1, A3."

