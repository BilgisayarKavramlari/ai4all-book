# ======================================================================= 25-MINUTE SEGMENT
- layout: title
  session: seg
  minutes: 0
  subtitle: "Optional enrichment · Deep chapter · not on exams"
  meta:
    - "Şadi Evren Şeker"
    - "Written as of October 2026; parts will have aged"
    - "Use as a 25-minute segment or for self-study"
  figure: f22-01-chapter-map
  notes:
    say: |
      This deck is optional enrichment, and you can say so plainly: Chapter 22 is a Deep chapter, nothing in it is on an
      exam, and there is no graded artifact. It is different from every other chapter. The earlier chapters taught what
      stays true for years: how models are built, how they fail and how to check them. This one is about what changes
      every few months: what AI systems can do now, what they cost, and who says so. It was written in October 2026, so
      some of its facts will be out of date by the time you see these slides. That is the point. Here is the chapter's
      question: when you read that AI "can now" do something, how do you tell what was measured, what was only claimed
      and what is a guess about the future, and how long will the answer stay true?
    background: |
      HOW TO USE THIS DECK. Chapter 22 is Deep in 22.1–22.7 and Studio in 22.8; not examinable (D20); its review
      questions are exam-format practice only. Best read after Chapter 21; anyone who has read Chapter 14 can follow it.
      Three ways to use the deck: (1) a 25-minute segment, slides 1–19 (through the summary), in any session with spare
      time near the end of a course; a 15-minute short cut is slides 1–11 (opening case, the three tags, the quick check)
      plus the summary; (2) self-study: post the deck with its notes on your course site beside the chapter's fast route;
      (3) the slides after the summary support the optional labs and the optional essay. BEFORE PRESENTING: every dated
      fact here is as of October 2026, the chapter's own dating; it is rewritten each edition (written for edition
      2027.1). If you present later, say so, and consider running one aging check (slide on §22.8) live on a box value.
      Work Loop highlight: Verify, with Decide second (the map on this slide). Featured student: Hana (they/them), a
      media arts and design student who runs a small zine; all of Hana's files and outputs are constructed. Compass is
      optional and never part of a course grade.
    questions:
      - q: "Is any of this on an exam?"
        a: "No. Chapter 22 is a Deep chapter: optional and not examinable (D20). Its method, dating and tagging claims, helps in every chapter that asks you to verify."
      - q: "Why read a chapter that will be out of date?"
        a: "Because the method lasts while the facts age. Each section teaches a way of reading current developments and keeps its dated facts in one box marked “As of October 2026”; the last section asks what has already aged. Review Question C2 asks you to take a position on exactly this."
    activity: "On screen while you introduce the segment; say “optional, not on exams” and “as of October 2026” once, clearly."
    book: "Chapter 22 opening page, @fig-22-1; 'Chapter 22 at a glance' (fast and full routes)."

