  note: "Definitions: Chapter 22 and the glossary. The whole chapter is optional and not on exams."
  notes:
    say: |
      These are the chapter's key terms. None is examined, because the chapter is Deep, but the first group is a
      vocabulary you can use in any chapter that asks you to verify: capability claim, as-of date, evidence status,
      measured, reported, forecast, outside estimate and outside evaluation. If you remember three, remember these: an
      as-of date is when a claim was made or measured, not when you read it; the evidence status says who has checked a
      claim so far, not whether it is true; and an aging check asks what a dated claim describes today and what changed:
      the facts, the status or only the names.
    background: |
      Key Terms list from the chapter (18 terms). CONFLICT NOTE: the blueprint listed 16 (no "outside estimate", no "tool
      protocol"); the draft notes add tool protocol, and chapter v2 adds outside estimate; the chapter list is used.
      Glossed in the chapter but not key terms: logarithmic axis, doubling time, extrapolation, terawatt-hour, preprint,
      data center, proof assistant (Lean), saturation, reported (compiled).
    activity: "Self-study."
    book: "Chapter Summary, Key Terms; glossary."

