# Lecture deck spec — Chapter 22: The State of the Art: Current Developments (Deep chapter, optional enrichment)
# Format and notes standard: slides/README.md. Build: python3 tools/build_slides.py slides/specs/ch22.yaml --preview
# Independence (D27, docs/production/independence-rules.md): no institution, course code, term, calendar dates of
# sessions, enrollment, course-site system or syllabus references on slides or in notes; sessions are named by kind only.
#
# Chapter 22 is Deep (22.1–22.7) and Studio (22.8): optional and not examinable (D20); it adds no required class time
# and has no graded artifact (the essay is optional and self-checked). So this is a SHORT deck framed as enrichment
# (Chapter 6 and 13 pattern): a 25-minute segment ("seg") an instructor can run in any session after Chapter 21 (or any
# time after Chapter 14), self-study slides ("self", no class time), reference slides ("after").
# Chapter 22's own rule: every dated fact carries its date. Every time-sensitive claim on a slide names its date or
# says "as of October 2026"; evidence vocabulary as the chapter defines it: measured · reported · reported (compiled) ·
# outside estimate · forecast · the book's inference; "trace first" for a claim that names no source. Case facts keep
# the chapter's tiers (confirmed · reported · inferred). Hana (they/them) examples are constructed.
# Even-numbered review items are instructor-only and never appear; quick checks use a faded example (key in Appendix E).
# Every number and quotation comes from the files under deck.sources; the builder flags any number it cannot find.

