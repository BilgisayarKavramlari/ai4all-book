# About 48 words: three exit questions plus the instruction bar (deliberate exception).
- layout: exit_ticket
  minutes: 3
  questions:
    - "Why could “change nothing” not hold the agent?"
    - "One gate you chose not to add, and why?"
    - "Which point caught your planted fault, or should have?"
  instruction: "3 min · index card or your course site · ungraded"
  notes:
    say: |
      Last three minutes: the exit ticket, ungraded. The first question checks the chapter's central idea: why an instruction
      could not hold the agent still. The second is the lab's exit step: one gate you decided not to add, and why; a good
      reason usually mentions approval fatigue or that the action is reversible and only you bear an error. The third is
      about your own design. Before you leave: photograph your lab sheet if you have not, and A11 is due when your
      instructor sets it. The next chapters cover privacy, security, bias and the law, and the next concept session opens
      with a prompt injection hidden in a document, the same kind of trick Sam planted on his datasheet.
    background: |
      Question 1 is Check Yourself 14.5 item 2 (answer: it was an instruction in the context, nothing in the system
      enforced it, and the agent could reach the live data). Question 2 is Lab 14.1's exit step. Next chapters (15–18): privacy, security, bias, intellectual property, regulation; demo: a prompt injection hidden in a
      document; red-team lab; A12.
    activity: "3 min; collect cards at the door or close the course-site form at the end of the session."
    book: "§14.5; Lab 14.1 exit; Chapters 15–18."

# ======================================================================= REFERENCE SLIDES
- layout: figure
  session: after
  kicker: "Case Study · C11 on the failure-to-harm chain"
  title: "No enforced gate stood between the command and the database"
  figure: f14-18-chain-c11
  notes:
    say: |
      Reference slide for the Case Study. On the failure-to-harm chain, link 1 is the destructive command, reported. Link 2,
      the check before use, failed: no enforced gate stood between the command and the data. That label is documented,
      because the company's chief executive wrote that the agent working in development deleted production data and that
      this should never be possible. Link 3, the system ran it. Link 4, the loss: data deleted, and later restored
      according to the user. What limited the harm was reversibility, a restore point, doing the work a gate should have
      done. Ask: which single hard gate would most likely have stopped the deletion, and what would it have cost the user
      in convenience?
    background: |
      Case Study text; Masad (2025) is the documented record for link 2; restore per Lemkin (Sharwood, 2025a) and Masad's
      note that backups allowed a one-click restore. Case Study Question 2 asks for the single hard gate (e.g., the agent
      cannot reach production data, or a gate before any database command). What each party could have changed: the user
      (a test copy; a gate before any database command), the company (separate dev and production data, planning-only mode,
      the agent's access to its documentation, all announced afterward), both (a log the user reads). Tree labels
      (@fig-14-17, not shown in this deck): primary context loss, inferred, because the freeze and the agent's
      acknowledgment are known only through Lemkin's posts and screenshots and the prompts were not published; secondary
      hallucination (alleged fake data) and overconfidence (certain "rollback impossible", contradicted by the restore),
      both inferred because the screenshots only appear to show the tool's output (Case Study Question 1, Appendix E).
    activity: "Not part of the 75-minute plan."
    book: "Case Study, @fig-14-18; Case Study Questions 2 and 4."

- layout: deep
  kicker: "Deep 14.A · levels of autonomy"
  title: "Going deeper: autonomy is a design choice"
  figure: f14-21-five-roles
  takeaway: "Approver level: the agent acts, you sign off; the risk is rubber stamping"
  notes:
    say: |
      Use this only if there is time or a student asks how researchers think about autonomy. A 2025 paper describes five
      levels of autonomy for AI agents by the role the user plays. Operator: you direct and the agent helps when asked.
      Collaborator: you plan and act together. Consultant: the agent leads and asks you for direction. Approver: the agent
      acts, and you sign off on consequential actions or unblock it. Observer: the agent acts; you watch its log and can
      switch it off. The authors argue that autonomy is a design choice, separate from how capable a model is. At the
      approver level they warn that users may disengage, which can lead to rubber stamping, and that it is hard to know in
      advance which actions are consequential.
    background: |
      Feng, McDonald & Zhang (2025), arXiv:2506.12469. Older roots: Parasuraman, Sheridan & Wickens (2000) proposed that a
      system can automate four functions, each to its own degree (information gathering, analysis, choosing a decision or
      action, carrying it out); an agent can be highly automated in all four. Bainbridge (1983), "Ironies of automation":
      the more a system automates, the more the person's job becomes watching and taking over in rare, difficult moments
      with little practice. The book's reading: an approval gate keeps a step at the approver level, and the §14.5 rules
      try to keep that approver engaged. Deep sections are not examinable (D20).
    activity: "Optional; not part of the 75-minute plan."
    book: "Deep 14.A Levels of Automation and the Person's Role, @fig-14-21."

