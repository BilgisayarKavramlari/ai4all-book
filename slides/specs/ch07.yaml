# Lecture deck spec — Chapter 7: Learning with AI: Tutor, Not Answer Machine
# Format and notes standard: slides/README.md. Build: python3 tools/build_slides.py slides/specs/ch07.yaml --preview
# Two sessions of about 75 minutes (D27: no institution, course, term or dates on slides or in notes). Session 1,
# concept: opening case, §7.1–7.5, the demonstration "answer mode versus Socratic mode" and the Case Study, which the
# chapter says is read together in class. Session 2, lab: Lab 7.1 (briefing 5 · dialogue 25 · closed-book 10 · score and
# verify 10 · annotate 20 · exit 5), which starts A4.
# Opening case C04 (Bastani et al., 2025) is a published, peer-reviewed study: its design and results are confirmed
# (primary record); the copying mechanism is the authors' interpretation (reported); "what differed was who produced
# the answers" is the book's reading (inferred). Every number below comes from deck.sources.
# Conflicts noted (the deck follows the chapter): the blueprint's test wording "who recalled and produced the answer"
# was replaced in the chapter by "who produced the answer in this turn: you, from your own memory, or the tool?"
# (D-7.e); the blueprint's Your Turn dialogue (music, cadences) became a business break-even dialogue; the blueprint
# cites Nickow et al. 2020, the chapter 2024.

