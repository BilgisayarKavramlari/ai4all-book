# ======================================================================= REFERENCE SLIDES
- layout: deep
  session: after
  kicker: "Deep 9.A · grading a body of evidence"
  title: "Going deeper: GRADE rates certainty across studies"
  size: 24
  bullets:
    - "Randomized trials start **high**; observational studies **low**"
    - "Down for five problems, such as inconsistent results"
    - "Up for three reasons, such as a very large effect"
    - "Four levels: high · moderate · low · very low"
  takeaway: "“A study found” is weaker than “the evidence shows”"
  notes:
    say: |
      Use this only if there is time or a nursing or health student asks. The ladder asks how directly one source records
      one claim. Health researchers ask a different question: across all the studies, how sure can we be about the
      answer? The GRADE system rates a body of evidence at one of four levels: high, moderate, low or very low. Evidence
      from randomized trials starts high, and from observational studies starts low. The rating moves down for five
      kinds of problem: limitations in the studies, inconsistent results, evidence that does not directly match the
      question, imprecise estimates, and signs that unfavorable results went unreported. It can move up, mainly for
      observational evidence, for three reasons. Marcus meets this as evidence-based practice.
    background: |
      Deep 9.A (optional, not examinable). GRADE = Grading of Recommendations Assessment, Development and Evaluation
      (Balshem et al., 2011; Guyatt et al., 2008). Up-grading reasons: a very large effect, a dose–response pattern, or
      biases that would have hidden the effect. Early GRADE papers said "quality" of evidence; later ones "certainty".
      This explains M7: a systematic review or meta-analysis is usually stronger on a broad question than any single
      study. @fig-9-16 shows the scheme; Deep 9.B (summary faithfulness measures) is not on a slide.
    activity: "Optional; not part of the 75-minute plan."
    book: "Deep 9.A Grading a Body of Evidence, @fig-9-16."

