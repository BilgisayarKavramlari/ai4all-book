# ======================================================================= SESSION 1 · CONCEPT
- layout: title
  session: tue
  minutes: 0
  subtitle: "Concept session and lab session · about 75 minutes each"
  meta:
    - "Şadi Evren Şeker"
    - "Read Chapter 9 before the lab session"
  figure: f9-08b-source-ladder
  notes:
    say: |
      Put this slide up while students arrive. In Chapter 8 you learned to check a claim: split an output into claims,
      take each through the Verification Funnel and give a verdict. This chapter asks two questions the funnel leaves open.
      First: how directly does a source record the claim you need, and who is behind it? A source can be real and still
      be a weak record of that claim. Second: does a summary say what its source says? More and more of your reading now
      arrives through AI tools that search, condense and cite for you. The picture on the right is this chapter's main
      tool, the source ladder. By the end of the lab you will place sources on it, read laterally, trace one claim upstream and
      check one AI summary sentence by sentence. That is A6.
    background: |
      The chapter map (@fig-9-1) highlights Verify ("how directly does a source record the claim?") and then Disclose
      ("cite what you read"). The title figure is the source ladder (@fig-9-8b), shown at readable size on slide 11.
      Chapter 9 owns the ladder, lateral reading and summary fidelity; it reuses Chapter 8's definitions (claim,
      independent check, primary source) word for word and Chapter 8's verdict scale (book-wide rules).
    activity: "On screen before class starts."
    book: "Chapter 9 opening page, @fig-9-1 and @fig-9-8b."

