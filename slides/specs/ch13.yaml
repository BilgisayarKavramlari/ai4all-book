# Lecture deck spec — Chapter 13: Multimodal AI: Images, Audio and Video (Deep chapter, optional enrichment)
# Format and notes standard: slides/README.md. Build: python3 tools/build_slides.py slides/specs/ch13.yaml --preview
# Chapter 13 is Deep: optional and not examinable (decision D20); it is read alongside Chapter 12 and has no required
# class time and no graded artifact. So this is a SHORT deck framed as enrichment (Chapter 6 pattern): a 20-minute
# segment ("seg") an instructor can run in any session, self-study slides ("self", no class time), reference slides.
# Independence rule D27: no institution, course code, term, dates, syllabus or learning-system names on slides or notes.
# Safety rules (blueprint §12, lab sheets): no identifiable person in any example or item (the employee, officers and
# other individuals in the cases stay unnamed); no method for removing or bypassing credentials, watermarks or
# detectors; never generate a real person's face or voice; lab items carry the same neutral band "COURSE SAMPLE — may be
# real or generated". No generated imagery appears in the deck. All Hana examples are constructed.
# Every number and quotation comes from the files under deck.sources; the builder flags any number it cannot find.

deck:
  chapter: 13
  slug: multimodal-ai-images-audio-and-video
  title: "Multimodal AI: Images, Audio and Video"
