      These are the chapter's key terms. None is examined, because the chapter is Deep, but several return in Core
      chapters, which define them again in their own text: deepfake, content credentials, watermark and out-of-band check
      come back in Chapters 15, 16, 18 and 19. If you remember three, remember these: a deepfake is synthetic media that
      realistically shows a real person or event in a way that did not happen; an out-of-band check confirms a request
      through a channel you already trust; and a cheap fake is media manipulated without generative AI, often just a real
      photo with a false caption.
    background: |
      Key Terms list from the chapter (22 terms; "transcription (speech recognition)" shortened here). Definitions of
      deepfake, synthetic media, voice cloning, social engineering and cheap fake are book-wide; Core chapters copy them
      verbatim (chapter brief).
