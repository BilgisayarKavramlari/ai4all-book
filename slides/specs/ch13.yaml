    say: |
      Reference slides; not presented. These are the sources cited on the slides and in the speaker notes, in short APA
      form, taken from the chapter's reference list. Students do not need to read them. For a student who wants more, the
      chapter suggests the government's reply on deepfake frauds, with the police's advice for checking video calls; NIST
      (2024), a clear overview of provenance, watermarks and detection and their limits; the C2PA explainer, including what
      the standard does not claim; Koenecke et al. (2024) on transcription; and Paris and Donovan (2019), the report that
      named cheap fakes.
