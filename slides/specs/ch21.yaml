    - "European Commission. (2025, July 10). *The General-Purpose AI Code of Practice*."
    - "Gollwitzer, P. M. (1999). Implementation intentions: Strong effects of simple plans. *American Psychologist, 54*(7), 493–503."
    - "Gollwitzer, P. M., & Sheeran, P. (2006). Implementation intentions and goal achievement: A meta-analysis of effects and processes. *Advances in Experimental Social Psychology, 38*, 69–119."
    - "McNamara, A., Smith, J., & Murphy-Hill, E. (2018). Does ACM’s code of ethics change ethical decision making in software development? *ESEC/FSE 2018*, 729–733."
    - "Sheeran, P., Listrom, O., & Gollwitzer, P. M. (2025). The when and how of planning. *European Review of Social Psychology, 36*(1), 162–194."
    - "Wang, G., Wang, Y., & Gai, X. (2021). A meta-analysis of the effects of mental contrasting with implementation intentions on goal attainment. *Frontiers in Psychology, 12*, 565202."
  notes:
    say: |
      Reference slides; not presented. These are the sources cited on the slides and in the speaker notes, in short
      APA form, from Chapter 21's reference list. Students do not need to read them. If a student wants to go
      further, the chapter recommends the ACM booklet's Preamble and principles 2.3 and 2.5, about five minutes, and
      the short McNamara study behind the Ethics Lens. The Final Bridge items draw on Chapters 8 to 18, whose
      sources are in those chapters' own reference lists. Full entries with DOIs are in the chapter.
    background: |
      Full entries in the chapter's References (fact-checked; open checks in docs/factcheck/ch21.csv per the chapter
      status comment). The From the Field entry (Seker, 2014, Kontrol sayfasi) is mentioned in one note only.
    activity: "Not presented."
    book: "Chapter 21, References; Further Reading and Compass Links."
