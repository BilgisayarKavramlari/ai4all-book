- layout: quiz
  minutes: 1.5
  kicker: "Final Bridge FB1 · Chapter 8 · LO3"
  title: "a tool’s own “yes”"
  question: "You ask a chat tool whether a source it cited exists, and it answers, “Yes, it is a real article.” What does that answer count as?"
  options:
    - "An independent check, because you asked a second question in a new turn."
    - "The primary source, because the tool named the article and its authors."
    - "No evidence: a tool’s own “yes” is never a source; check an index or open the work."
    - "An expert’s check, because the tool was trained on most of the published research in the field."
  answer: c
  instruction: "Answer without notes · Missed it? Reread §8.2 and §8.3"
  explanation: "(a) the same tool is not independent; (b) naming is not the record; (d) a model is not an expert"
  notes:
    say: |
      Chapter 8, the Verification Funnel. Recall the definitions: an independent check is evidence that no AI tool
      produced; a primary source is the original record a claim comes from; an expert is a person with the knowledge
      to judge the claim. Now apply them to a tool's answer about its own citation. Which of the three stages, if
      any, does that answer reach? Be careful with option (a): asking again feels like checking, so ask yourself
      whether the evidence came from outside the tool. Commit, then check.
    background: |
      FB1 (Chapter 8 · LO3 · Understand). Key (Appendix E): (c). Book-wide rule (chapter brief): an AI tool's own
      "yes" is never a source.
    activity: "1 min, then the answer slide."
    book: "§8.2–8.3; Final Bridge FB1; Appendix E."
  answer_minutes: 0.5
  answer_notes:
    say: |
      The answer is (c): a tool's own "yes" is no evidence; it is never a source. To check that a cited article
      exists, search an index or open the work itself. Option (a) is tempting, but a second question to the same tool
      is not independent: the evidence still comes from the tool. Option (b) confuses naming a source with the
      record itself; the primary source is the article, which you have not seen. Option (d) treats a model as an
      expert; an expert is a person who can judge the claim, and training data is not judgment. This is the single
      most useful habit from Chapter 8.
    background: |
      Appendix E (Final Bridge FB1): (a) a second question to the same tool is not independent; (b) the tool's naming
      is not the record; (d) a model is not an expert.
    activity: "Self-check."
    book: "§8.2–8.3; Appendix E."

- layout: quiz
  minutes: 1.5
  kicker: "Final Bridge FB3 · Chapter 11 · LO3"
  title: "three methods agree"
  question: "A tool computes a club’s dollars per volunteer hour from a log with two blank hour cells; three ways of handling the blanks pick the same “best” event. What does that agreement show?"
  options:
    - "The result is reliable: three different ways of handling the blanks reached the same answer."
    - "Little on its own: each way of handling a blank is an assumption, and all can be wrong."
    - "The blanks do not matter, because functions such as AVERAGE leave empty cells out."
    - "The tool made an error, because an analysis may not use a log with missing values."
  answer: b
  instruction: "Answer without notes · Missed it? Reread §11.2"
  explanation: "(a) agreement is not evidence of correctness; (c) leaving blanks out is itself a choice; (d) overcorrects"
  notes:
    say: |
      Chapter 11, data and decisions. A club's log has two blank hour cells, and three different ways of handling
      them all pick the same best event. It feels like strong evidence. Before you choose, ask what each way of
      handling a blank actually assumes about the missing hours, and whether three assumptions agreeing makes any of
      them true. Remember Lucia's fundraiser: the real hours were on the paper sign-in sheets, and they changed the
      answer. Write your letter down before you look; on an exam, a multiple-choice item gives you no second try.
    background: |
      FB3 (Chapter 11 · LO3 · Understand). Key (Appendix E): (b). Lucia's A9 (Chapter 11, reused in Chapter 20): two
      unlogged book-swap shifts reversed which fundraiser looked best.
    activity: "1 min, then the answer slide."
    book: "§11.2; Final Bridge FB3; Appendix E."
  answer_minutes: 0.5
  answer_notes:
    say: |
      The answer is (b): the agreement shows little on its own, because each way of handling a blank is an
      assumption, and all of them can be wrong. Option (a) treats agreement among methods as evidence that they are
      right; it is not, if they share the same blind spot. Option (c) hides a choice: leaving empty cells out of an
      average is itself one way of handling the blanks. Option (d) overcorrects: an analysis can use a log with
      missing values, as long as you state how you handled them and check what you can, for example against the
      paper sign-in sheets.
    background: |
      Appendix E (Final Bridge FB3): (a) agreement among methods is not evidence that they are right; (c) leaving
      blanks out is itself a choice; (d) overcorrects.
    activity: "Self-check."
    book: "§11.2; Appendix E."

- layout: quiz
  minutes: 1.5
  kicker: "Final Bridge FB5 · Chapter 16 · LO5"
  title: "three fairness measures"
  question: "Why can a screening tool, in general, not give two groups equal selection rates, error rates and precision at once?"
  options:
    - "When it makes errors and the groups’ base rates differ, the three cannot all hold."
    - "The developers chose one definition and never tested the other two."
    - "Fairness definitions apply only to tools that take a protected characteristic as an input."
    - "Any tool trained on past data is biased against every group equally."
  answer: a
  instruction: "Answer without notes · Missed it? Reread §16.3"
  explanation: "(b) assumes a better choice would fix it; (c) and (d) are unrelated misreadings"
  notes:
    say: |
      Chapter 16, fairness. The question says "in general": not for one badly built tool, but for any screening tool
      that makes errors. Recall the three measures: selection rates, error rates and precision, compared between two
      groups. What property of the two groups makes it impossible to equalize all three at once? If you are
      unsure, think about what happens when one group has a higher share of qualified people than the other. Write
      your letter down, then check it on the next slide.
    background: |
      FB5 (Chapter 16 · LO5 · Understand). Key (Appendix E): (a). (b) is Chapter 16's M4 (a better choice would fix
      it). The slide shortens the book's option (b) (drops "on their data") and the question stem ("equal selection rates, equal error rates and equal
      precision at the same time") to fit; the meaning is unchanged.
    activity: "1 min, then the answer slide."
    book: "§16.3; Final Bridge FB5; Appendix E."
  answer_minutes: 0.5
  answer_notes:
    say: |
      The answer is (a): when a tool makes errors and the groups' base rates differ, the three measures cannot all
      hold at once. The base rate is the share of each group that actually meets the criterion. With different base
      rates, equalizing one measure pulls another apart. So choosing a fairness definition is a decision, with a
      decision owner, not a bug to fix. Option (b) is Chapter 16's misconception that a better choice by the
      developers would make the conflict go away. Options (c) and (d) are unrelated misreadings: fairness measures
      apply whatever the inputs, and bias is not spread equally.
    background: |
      Appendix E (Final Bridge FB5). Chapter 16 owns fairness measurement.
    activity: "Self-check."
    book: "§16.3; Appendix E."

# About 50 words on the answer slide: a five-part case answer (a)–(e) is the model a Bridge B case answer follows.
- layout: quiz
  minutes: 3
  kicker: "Final Bridge FB7 · Chapter 15 · LO5 · case question"
  title: "the treasurer’s spreadsheet"
  question: "A treasurer pastes members’ data (names removed; ZIP code, birth date, major, payment status) into a free chat tool. Trace the flow, say why removing names was not enough, rate one risk, give one mitigation with an owner, and say why the tree does not apply."
  instruction: "Write five short parts, (a)–(e) · Missed it? Reread §15.1, §15.2, §15.5, §15.6"
  model_answer:
    - "**(a)** Treasurer → sheet → free chat tool (its terms) → output → treasurer"
    - "**(b)** ZIP code, birth date, major together can identify a person"
    - "**(c)** e.g., medium likelihood and impact; inferred unless terms read"
    - "**(d)** Avoid: a spreadsheet filter, no AI tool; owner: treasurer"
    - "**(e)** No AI output was wrong: an input-side harm"
  notes:
    say: |
      A Bridge B case question from Chapter 15. A student club's treasurer pastes a spreadsheet of members into a free
      chat tool to find who has not paid dues. Names were removed; ZIP code, birth date, major and payment status
      remain. Five parts: trace the data flow; explain why removing names was not enough; rate one risk on the Risk
      Heat Map and say whether the rating is documented or inferred; propose one mitigation, avoid, reduce, detect or
      accept, with a risk owner; and say in one sentence why the Failure Taxonomy Tree does not apply. Write five
      short lines, one per part. Three minutes.
    background: |
      FB7 (Chapter 15 · LO5 · Analyze). Model answer in Appendix E. Quasi-identifiers (§15.2): ZIP code, birth date
      and major together can identify a person without a name. Input-side rule (chapter brief): for privacy leaks by
      users, use the data-flow map and the heat map, and say the tree does not apply because no output was wrong.
    activity: "3 min writing, then the answer slide."
    book: "§15.1, §15.2, §15.5, §15.6; Final Bridge FB7; Appendix E."
  answer_minutes: 1
  answer_notes:
    say: |
      Here is a model answer. (a) The flow: treasurer, spreadsheet with ZIP code, birth date, major and payment
      status, a free chat tool under its consumer terms, where storage and possible review or reuse depend on the
      terms, then the output list back to the treasurer. (b) ZIP code, birth date and major are quasi-identifiers:
      together they can identify a person without a name. (c) For example, medium likelihood and medium impact for
      members' data kept or reused under the tool's terms, inferred unless the terms were read and quoted. (d) Avoid:
      do the lookup with a filter in the spreadsheet, no AI tool; risk owner the treasurer or the club president.
      Or reduce: only a tool the institution's data classes allow, with only the columns needed. (e) No AI output was
      wrong; the harm is on the input side.
    background: |
      Appendix E (Final Bridge FB7), full text. Scoring hint for self-check: each of the five parts must be present;
      the documented/inferred tag in (c) and the named owner in (d) are the parts most often missed.
    activity: "Self-check part by part."
    book: "§15.1–15.6; Appendix E."

- layout: quiz
  minutes: 2
  kicker: "Final Bridge FB9 · Chapter 18 · LO5 · interpretive"
  title: "who owns the image?"
  question: "“I wrote the prompt, so I own the image the tool made.” Agree or disagree, using authorship."
  instruction: "Take a position in three sentences · Missed it? Reread §18.3"
  model_answer:
    - "**Disagree.** As of October 2026, U.S. copyright protects what a person authors; output from a prompt alone is not protected."
    - "Your own expression, selection, arrangement and changes can be."
    - "The tool’s terms may assign the provider’s rights to you: a different question."
  notes:
    say: |
      A Bridge C interpretive item from Chapter 18. Take a position on the statement "I wrote the prompt, so I own the
      image the tool made," and support it with the idea of authorship. Three sentences: your position, the reason
      from authorship, and one distinction a strong answer makes. Hint for that distinction: there are two different
      questions here, one about the law of copyright and one about the contract between you and the tool's
      provider. Write your answer before you look.
    background: |
      FB9 (Chapter 18 · LO5 · Evaluate). Model answer (Appendix E): Disagree; as of October 2026, the U.S. Copyright
      Office's position (2025 report) is that U.S. copyright protects what a person authors; output a tool produces
      from a prompt is not protected, though your own expression, selection, arrangement and changes can be; writing
      the prompt does not make you the author; the tool's terms may assign whatever rights the provider has, a
      different question. Legal status is dated and on the refresh list; not legal advice.
    activity: "2 min writing, then the answer slide."
    book: "§18.3; Final Bridge FB9; Appendix E."
  answer_minutes: 1
  answer_notes:
    say: |
      A strong answer disagrees and separates two questions. Copyright: as of October 2026, the U.S. Copyright
      Office's position, in its 2025 report, is that U.S. copyright protects what a person authors. Output a tool
      produces from a prompt is not protected, though your own expression, selection, arrangement and changes can
      be. Writing the prompt does not make you the author of the image. Terms: the tool's terms may assign to you
      whatever rights the provider has, but that is a contract between you and the provider; it cannot create a
      copyright the law does not grant. Strong answers use human authorship and keep terms and copyright apart.
    background: |
      Appendix E (Final Bridge FB9); Chapter 18 Check Yourself 18.3: authorship requires a human who created the
      expression; prompts alone are not enough control; terms cannot create a copyright the law does not grant.
    activity: "Self-check."
    book: "§18.3; Appendix E."

# Chapters 19 and 20 are practiced in the Spaced Review, not the Final Bridge (chapter); odd items only.
- layout: quiz
  minutes: 2
  kicker: "Spaced Review 1 and 3 · Chapters 20 and 19 · LO7, LO6"
  title_prefix: "Spaced review"
  title: "Chapters 19 and 20"
  question: "(1) What does an entry’s AI Use Declaration show that the artifact alone does not? (3) Write one safeguard from your A13 workflow as a trigger."
  instruction: "Two short answers, no notes · Missed it? Reread §20.3 and §19.6"
  model_answer:
    - "**1.** What the AI did and what you did: tools, purpose, accepted, rejected or revised, how verified, where your judgment shaped it"
    - "**3.** e.g., *Before my flashcards go into my deck, I check each against my textbook page, because my A13 peer test found an error*"
  notes:
    say: |
      The Final Bridge stops at Chapter 18 because Chapter 21 practices Chapters 19 and 20 in its Spaced Review.
      Here are the two odd-numbered Spaced Review items. The first goes back to Chapter 20's Portfolio Anatomy:
      what does an entry's AI Use Declaration show a reader that the artifact alone cannot? The second goes back to
      Chapter 19: take one safeguard from your own A13 domain workflow and rewrite it as a commitment in the "when,
      I, because" form, with your own evidence as the reason. That second item is also a good way to find a sixth or
      seventh line for your code. Write both answers without notes, then check them on the next slide.
    background: |
      Spaced Review items 1 (Chapter 20 · LO7 · Understand; section 20.3) and 3 (Chapter 19 · LO6 · Apply; section
      19.6). Items 2 and 4 are even (instructor-only key). Chapter 21's Final Bridge introduction: "Chapters 19 and
      20 are practiced in this chapter's Spaced Review." Both stems are shortened on the slide.
    activity: "2 min writing, then the answer slide."
    book: "Spaced Review 1 and 3; §20.3; §19.6; Appendix E."
  answer_minutes: 1
  answer_notes:
    say: |
      Item 1: the declaration shows what the AI did and what you did for that entry: the tools and purpose; what you
      accepted, rejected or revised; how you verified it; and where your own judgment shaped the work. The artifact
      alone shows only the result. Item 3 has many good answers. Any safeguard from your A13 workflow counts, if it
      is written in the "when, I, because" form with your own evidence. The book's constructed example: before my
      study workflow's flashcards go into my review deck, I check each card against my textbook page, because my
      A13 peer test found an error. Check your own line with the trigger test: moment, action, reason.
    background: |
      Appendix E (Chapter 21, Spaced Review 1 and 3). The item 3 example is constructed (Appendix E); the slide
      shortens it. The slide drops "In the Portfolio Anatomy" from item 1's stem to fit.
    activity: "Self-check; apply the trigger test to your item-3 line."
    book: "Appendix E (Chapter 21, Spaced Review)."

# ----------------------------------------------------------------------- Closing
- layout: objectives
  minutes: 1
  kicker: "Chapter summary (book figure: summary card)"
  title: "Which rules will you keep, and when will you change them?"
  items:
    - {code: "O1", text: "Your code adds to policy and a profession’s code"}
    - {code: "O2", text: "When…, I…, because… my own evidence"}
    - {code: "O3", text: "Moment, action, reason; stricter rule wins"}
    - {code: "O4", text: "Dated notes, a review date, triggers, marks"}
    - {code: "O5", text: "One page, in your portfolio, defended live"}
  takeaway: "Before you close the book: put your review date in your calendar"
  notes:
    say: |
      The chapter's question: when your course's rules end, which of them will you keep, and how will you know when to
      change them? Keep the ones your own work showed you need, written as commitments with triggers you will
      recognize at the moment of use: a few, chosen by the stakes in your field, each with your own evidence as its
      reason. Your code sits inside the rules that bind you and never loosens them. Give it a review date and review
      triggers, keep tool facts in dated notes, and keep marks, because a code that is never used or reviewed
      protects no one. The book's last words: the tools will change; the five decisions of the AI Work Loop, and who
      answers for the work, stay with you. Put your review date in your calendar.
    background: |
      Chapter Summary and @fig-21-13; Last Words (the book began with five decisions, Frame, Prompt, Verify, Decide,
      Disclose; Part VI, Chapters 22 and 23, is optional reading). Warm-up revisit: (1) a rule passes if it names a
      moment you would notice and an action someone could trace; (2) whichever your own evidence supports; (3)
      disagree: tool names belong in dated notes. Last Words contains an optional author note placeholder (author
      item).
    activity: "Optional: read the last paragraph of Last Words aloud."
    book: "Chapter Summary, @fig-21-13; Last Words; Warm-up revisit."

- layout: key_terms
  title: "Key terms"
  terms:
    - "personal AI code of practice"
    - "commitment (in a code of practice)"
    - "trigger (in a code of practice)"
    - "trigger test"
    - "own evidence (in a code of practice)"
    - "professional code of ethics"
    - "review date"
    - "dated note"
    - "implementation intention (Deep)"
  note: "Definitions: Chapter 21 and the glossary. (Deep) terms are optional and not on exams."
  notes:
    say: |
      The key terms of Chapter 21. Bridge A–style items ask for terms and concepts, so make sure you can define each
      in one sentence of your own. Pay special attention to the sense labels: "trigger in a code of practice" is not
      the same as Chapter 12's re-test trigger, and Review A5 asks exactly that difference. A trigger in a code tells
      you one of your commitments applies now; a re-test trigger is an event that should make you test a tool's fit
      again, and in a code, the re-test triggers become review triggers for the whole code. Implementation intention
      is a Deep term: optional, and not examined.
    background: |
      Key Terms list from the chapter. Review A5 (odd; Appendix E): a trigger in a code tells you one of your
      commitments applies now; a re-test trigger (Chapter 12) is an event that should make you test a tool's fit
      again; in a code, Chapter 12's re-test triggers become review triggers.
    activity: "Self-test: define three terms aloud."
    book: "Chapter Summary, Key Terms; glossary; Review A5."

- layout: exit_ticket
  minutes: 2
  questions:
    - "Write one commitment. Could someone check afterward that you followed it?"
    - "Your review date, and what would send you back sooner?"
    - "Which line would you show an employer, with which entry?"
  instruction: "Ungraded · keep the answers with your code"
  notes:
    say: |
      Three questions to close the book's last core chapter, ungraded. The first returns to the Warm-up: write one
      commitment from your code, and ask whether someone else could check afterward that you followed it. If not,
      your moment or your action needs work. The second asks for your review date and one event that would send you
      back sooner. The third is the career question from Discussion Question 2: which line of your code would you
      show an employer, and which portfolio entry shows it in use? Two lines of your code and one entry make a better
      answer to "how do you use AI?" than the word "carefully."
    background: |
      Question 1 revisits Warm-up item 1; question 3 is Discussion Question 2 and the Career Connection's "In an
      interview" paragraph.
    activity: "2 min; keep the answers with your code."
    book: "Warm-up; Discussion Question 2; Career Connection."

- layout: deep
  minutes: 0
  kicker: "Deep 21.A · why if-then plans help, and their limits"
  title: "Going deeper: the evidence behind “when, I, because”"
  size: 24
  bullets:
    - "2006: 94 tests, average d = 0.65"
    - "2025: 642 tests, d about 0.27–0.66"
    - "Independent 2021 review: g = 0.34, publication bias signs"
    - "No study tested AI use: an inference"
  takeaway: "If-then plans help with goals you hold; they do not choose them"
  notes:
    say: |
      Optional, for students who ask whether triggers really work. The "when, I, because" form borrows from research
      on implementation intentions, plans that link a goal to a cue. Gollwitzer and Sheeran combined 94 independent
      tests in 2006 and reported an average effect size of 0.65, between medium and large by common conventions. A
      larger review in 2025 combined 642 tests and reported effects from about 0.27 to 0.66, larger with the explicit
      if-then form, high motivation and rehearsal. An independent 2021 meta-analysis of if-then plans combined with
      mental contrasting found a smaller effect, 0.34, and signs of publication bias. Both larger reviews include the
      theory's originators. And no study tested AI use or codes of practice.
    background: |
      Deep 21.A (optional, not examinable). Effect size: a standard way to say how large a difference is. Studies
      concern goals people already held (exercising, studying, health screening). Rehearsal here means repeating or
      picturing a plan soon after forming it; the nearest habit is reading commitments aloud in the peer check and
      rereading them often (book's inference). Gollwitzer (1999) introduced the term. Wang et al. (2021): 21 studies.
    activity: "Optional; not part of any class plan."
    book: "Deep 21.A Why If-Then Plans Help, and Their Limits."

