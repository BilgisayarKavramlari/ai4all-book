# Lecture deck spec — Chapter 21: Your Personal AI Code of Practice
# Format and notes standard: slides/README.md. Build: python3 tools/build_slides.py slides/specs/ch21.yaml --preview
# Every number and quotation comes from deck.sources; the builder flags any number it cannot find there.
# Independence (D27, docs/production/independence-rules.md): no institution, course code, term, calendar dates,
# enrollment, course-site system or syllabus references on slides or in notes; sessions are named by kind only.
#
# Chapter 21 has no concept session of its own (book plan: D23, D25). Its class time is (keys are internal):
#   tue    = the portfolio workshop (Chapter 20's Lab 20.1), minutes 50–65: the code peer check (Lab 21.1), 15 min.
#            The Chapter 20 deck hands over at its "50–65" section slide and takes back at minute 65.
#   may4   = a 10-minute final-review segment (the Final Bridge's even items), run at the start of a later session
#            (in the book's suggested plan, before the second defense session) or posted on the course site.
#            Even answers are instructor-only (README), so that segment shows the prompts only.
# Two further segments carry minutes as estimates but belong to no scheduled session:
#   parta  = Part A in brief (read at home before the workshop): code of practice, triggers, four required lines,
#            own evidence, boundaries, how codes age, the brief and rubric. For office hours, a recording, or a
#            short recap if the instructor finds time.
#   review = final-exam review segment: Part B (Case Study, Ethics Lens, Summary, Last Words), the Final Bridge
#            (Chapters 8 to 20) with odd items only, and Spaced Review 1 and 3 (Chapters 20 and 19), each answer on
#            the next slide (Appendix E).

