- layout: compare
  minutes: 1.5
  kicker: "§21.2 · four required lines, then the rest"
  title: "Every code covers four things"
  size: 22
  columns:
    - heading: "Verification"
      role: verified
      text: "Check numbers, names, dates before others rely on them"
    - heading: "Data"
      role: neutral
      text: "What goes into which tool"
    - heading: "Disclosure"
      role: neutral
      text: "Say what AI did before you send or submit"
    - heading: "One of"
      role: soft
      text: "Delegation, or risk, or fairness"
  takeaway: "Five to seven in all: a line you cannot recall will not help"
  notes:
    say: |
      Every code written with this chapter has at least one commitment each on verification, data and disclosure, and a fourth
      on delegation and oversight, or risk, or fairness, whichever your work most needs. Then add others, up to
      seven in all, by the stakes in your field and by what your own record shows you forget. Why not more? Because a
      line you cannot recall at the moment it matters will not help you. Each course method suggests a trigger: the
      Verification Funnel, before you send anything with a number, a name or a date others will rely on; the data
      gate, before you paste anything that is not Public Data; approval gates, when a workflow can send, pay, publish
      or delete; fairness checks, when an output will describe, score or sort people.
    background: |
      §21.2 tables: AI Work Loop (1), Delegation Ladder (5), Verification Funnel (8), data gate (12), approval gates
      (14), Risk Heat Map (15), fairness checks (16), disclosure (10), each with a cue and a commitment; plus the
      definitions table (Verification Funnel, independent check, primary source, stakes, data class, data gate, hard
      gate, risk owner, paired-input test). Check Yourself 21.2 (3): verification, data, disclosure, and one on
      delegation and oversight, or risk, or fairness. Rubric: all four required lines present for full "Grounding"
      credit (4); one missing drops to Developing (2).
    misconceptions:
      - m: "M6 'The more rules in my code, the safer.'"
        fix: "Five to seven; recall at the moment matters. Do not overcorrect into 'fewer is better': the four required lines stay."
    activity: "Ask students which fourth line their work most needs, and why."
    book: "§21.2 'Where triggers come from' table; 'Four required lines, then the rest'; Check Yourself 21.2."

- layout: concept
  minutes: 1
  kicker: "§21.2 · own evidence"
  title: "Your “because” comes from your own record"
  size: 26
  bullets:
    - "Search your Failure Diary, graded work, lab records"
    - "Find a moment that cost time, a grade or a correction"
    - "A rule can be part of the reason, not all of it"
  takeaway: "“Two of ten AI-stated dates in my A5 were wrong” beats “AI makes mistakes”"
  notes:
    say: |
      The third test question asks whether your reason points to your own evidence: something from your own work
      that shows why the line matters to you. Where do you find it? Open your Failure Diary, your graded assignments
      and your lab records, and look for a moment that cost you time, a grade or a correction: two wrong dates in
      your A5 table, a planted fault your A11 dry run missed, a lab where a tool's answer changed between runs. If
      you wrote the optional Chapter 13 verification protocol, its log counts too. A rule can be part of the reason,
      but only together with your own evidence. "Because AI tools make mistakes" is true of everyone; it is not your
      evidence.
    background: |
      §21.2 "Your own evidence". Review A12 (even; key not shown) practices the reason question; Check Yourself 21.2
      (2): a rule says what you must do, not why the line matters to you. Lab 21.2's point: a generated code can
      never pass the reason question for you, because the tool has no access to your evidence. The alternative
      assignment (four role briefs on the course site) treats the brief's three dated incidents as "your own evidence".
    questions:
      - q: "What if I prefer not to describe my own practice?"
        a: "Use the alternative assignment: write the code for a role from one of four role briefs; the brief's incidents count as your evidence (Application Assignment, Alternative)."
    activity: "Ask students to name one moment from their own record in one line."
    book: "§21.2 'Your own evidence'; Check Yourself 21.2; Application Assignment."

- layout: quiz
  minutes: 1
  kicker: "Review Questions A3 · §21.2"
  title: "fourteen commitments"
  question: "A classmate’s code has fourteen commitments, one for every chapter. What is the main problem?"
  options:
    - "None: more commitments make a person’s work safer than a short list of lines could."
    - "A code may contain only the four required lines and nothing more."
    - "Codes longer than five lines break the course’s written policy."
    - "Fourteen lines are hard to recall, so many will not come to mind when needed."
  answer: d
  instruction: "Answer on your own, then check"
  explanation: "(a) is the misconception itself; (b) misstates the rule (5–7, four required); (c) invents a rule"
  notes:
    say: |
      One more exam-format item, on how long a code should be. Read all four options. Two of them invent or misstate
      a rule, so check each one against what the chapter actually requires: how many commitments, and which lines
      are required. One option states the misconception directly; if it sounds reasonable to you, that is the
      reason the item exists. Ask yourself what a code is for: a line helps only if it comes to mind at the moment it
      matters. Commit to an answer before you look.
    background: |
      Review Questions A3 (O3 · LO5 · Evaluate). Key (Appendix E): (d) (M6). (a) is M6 itself; (b) misstates the
      rule (5–7 with four required); (c) invents a rule.
    activity: "30 s, then the answer slide."
    book: "§21.2; Review Questions A3; Appendix E."
  answer_minutes: 0.5
  answer_notes:
    say: |
      The answer is (d): fourteen lines are hard to recall, so many will not come to mind when needed. A code works
      at the moment of action, under some pressure, so it has to be short enough to remember. Option (a) is the
      misconception itself: more rules feel safer, but a rule that does not come to mind does not fire. Option (b)
      misstates the rule: the chapter asks for five to seven commitments, four of which are required kinds. Option (c)
      invents a rule: there is no five-line limit. The fix for the classmate: keep the lines their own record shows
      they need, and cover the four required kinds.
    background: |
      Appendix E (Chapter 21, Review A3). Rubric, Commitments as triggers: "eight or more" commitments scores
      Proficient (3.5) at most.
    activity: "Self-check."
    book: "§21.2; Appendix E; Application Assignment rubric."

- layout: section
  minutes: 0
  number: "21.3"
  tag: "Core"
  title: "Your code inside the rules that bind you"
  idea: "Your code adds to the rules that bind you; it never loosens them."
  meta: "Book §21.3 · workshop draft, part 2"
  notes:
    say: |
      Your code is not the only set of rules you are under. Chapter 18 described the layers: law; what you agree to,
      such as terms of service, licenses and contracts; and your organization's policy, the written rules of your
      course, school or employer. Its working rule applies here unchanged: follow the strictest rule that
      applies, and when a rule is unclear, ask its owner in writing and keep the answer. So your code may be
      stricter than any rule you are under, never looser. If your code says "drafting with AI is fine" and an
      assignment says no, the assignment wins.
    background: |
      §21.3; §18.1 "follow the strictest rule that applies". Rule's owner: the person or office that can say what a
      rule means (instructor, manager, client, clinical instructor). This chapter is not legal advice.
    activity: "Reference."
    book: "§21.3; Chapter 18 §18.1."

- layout: concept
  minutes: 1.5
  kicker: "§21.3 · the boundaries line · Marcus (nursing), constructed"
  title: "Name the rules, say the stricter wins, name the owner"
  size: 24
  bullets:
    - "This code works inside [the rules I am under]"
    - "Where one of them is stricter, it wins"
    - "When a rule is unclear, I ask [its owner, by role]"
  takeaway: "Marcus: course zones, data classes, placement rules · ask my clinical instructor"
  notes:
    say: |
      Write this into your code as a boundaries line, with three parts. One: the rules you are under, cited, not
      copied: "the course's zones, section 1.5," not a restatement of them as if they were law. Two: where one of
      them is stricter, it wins. Three: when a rule is unclear, whom you ask, by role. Here is Marcus's: this code
      works inside the course's zones, the institution's data classes and my placement site's rules; where one of
      them is stricter, it wins; when a rule is unclear, I ask my clinical instructor. His first commitment, no
      information about a patient in any AI tool, even without a name, is stricter than any of these rules. That is
      allowed: a personal line may be stricter, never looser.
    background: |
      §21.3 Worked Example "Marcus's Boundaries Line" (constructed). His reason is his own: his A12 data-flow map
      showed that what he pastes is stored under the provider's rules. What if a rule seems wrong? ACM principle 2.3,
      paraphrased: rules judged unethical should be challenged; consider challenging through existing channels before
      breaking a rule; anyone who breaks one must consider the consequences and accept responsibility. Your code is
      not a reason to skip a rule, a review or a person's approval. Check Yourself 21.3: (1) the assignment applies;
      (2) the three parts. Rubric "Fit with the rules that bind you" (2): 0 if a commitment is looser than a rule you
      are under.
    questions:
      - q: "What if my code is stricter than my employer's rule? Is that unprofessional?"
        a: "No: a personal code may be stricter, never looser (Review C2 asks for a position). Being stricter about patient information, for example, is within your own control."
    misconceptions:
      - m: "M2 'My code is my own rule, so where I disagree with a rule, my code decides.'"
        fix: "Stricter wins; ask the owner. Do not overcorrect into 'rules can never be questioned': ACM 2.3 says challenge through existing channels first."
    activity: "Ask: 'Name one rule you are under that your course does not set.'"
    book: "§21.3, Worked Example 'Marcus's Boundaries Line', @fig-21-8; Check Yourself 21.3."

- layout: quiz
  minutes: 1
  kicker: "Review Questions A7 · §21.3"
  title: "stricter than every rule"
  question: "Which statement about a personal line that is stricter than every rule you are under is accurate?"
  options:
    - "It must be removed, because a code may not go beyond the rules."
    - "It is allowed only if your employer approves it in writing first."
    - "It turns into a rule that binds your classmates once it is graded."
    - "It is allowed: a personal code may be stricter, but never looser."
  answer: d
  instruction: "Answer on your own, then check"
  explanation: "(a) and (b) misstate the rule; (c) a personal code binds no one else"
  notes:
    say: |
      This item checks the boundaries rule in the direction students often forget. We usually ask whether a code is
      looser than a rule. Here the line is stricter than every rule you are under. Is that allowed, does it need
      permission, and does it bind anyone else? Think of Marcus's patient line: no information about a patient in
      any AI tool, even without a name, which is stricter than the course, the institution and his placement. Read
      all four options and commit.
    background: |
      Review Questions A7 (O3 · LO5 · Understand). Key (Appendix E): (d). (a) and (b) misstate the rule; (c) a
      personal code binds no one else. Distractors from M2 (chapter comment).
    activity: "30 s, then the answer slide."
    book: "§21.3; Review Questions A7; Appendix E."
  answer_minutes: 0.5
  answer_notes:
    say: |
      The answer is (d): it is allowed, because a personal code may be stricter than the rules you are under, but
      never looser. Option (a) gets the rule backwards: going beyond the rules in the stricter direction is exactly
      what a personal code may do. Option (b) invents a permission step; you do not need approval to hold yourself to
      a higher standard. Option (c) is wrong because a personal code binds no one but you; grading it does not make
      it a rule for others. The one case to watch is the opposite: a line looser than a rule you are under scores
      zero on the "fit" criterion.
    background: |
      Appendix E (Chapter 21, Review A7). Rubric "Fit with the rules that bind you": 0 if a commitment is looser than
      a rule you are under.
    activity: "Self-check."
    book: "§21.3; Appendix E."

- layout: section
  minutes: 0
  number: "21.4"
  tag: "Core"
  title: "How codes age"
  idea: "Keep what changes slowly apart from what changes fast, and set a date to look again."
  meta: "Book §21.4 · part of finishing your code"
  notes:
    say: |
      The ACM code went from 1992 to 2018 without an update. Your code will age faster, because tools change every
      few months. Section 21.4 gives three habits. Keep tool facts out of your commitments and in dated notes. Set a
      review date and review triggers that send you back earlier. And keep marks: brief notes of when a commitment
      applied and what you did, so that your review rests on evidence. A code you never check behaves like what
      Chapter 14 called a soft gate: text that asks for an action but cannot make it happen.
    background: |
      §21.4. Soft gate (Chapter 14): an instruction in the context asking the model to ask first or not to act, which
      the model receives as text and may not follow; here, an unread code is text you wrote, with nothing that makes
      you act on it. ACM principle 2.5 asks for a similar habit for systems whose future risks cannot be reliably
      predicted.
    activity: "Reference."
    book: "§21.4 How Codes Age."

# Native redraw of @fig-21-9 (the book figure's example text is too small at slide size).
- layout: compare
  minutes: 1
  kicker: "§21.4 · three shelf lives (book figure, redrawn)"
  title: "Commitments last years; tool facts last months"
  size: 22
  columns:
    - heading: "Commitments · years"
      role: human
      text: "Before I send, I check each number, name and date"
    - heading: "Practices · 1–2 years"
      role: neutral
      bullets: ["Prompt template", "Checklist", "Review routine"]
    - heading: "Tool notes · months"
      role: soft
      bullets: ["Tool, model, price", "Data terms, settings", "“As of [month year]”"]
  takeaway: "Tool names go in dated notes"
  notes:
    say: |
      This book dates its own content in three layers, and your code can do the same. Commitments should last
      years: "before I send anything others will rely on, I check every claim that carries a number, a name or a
      date." Practices, such as a prompt template, a checklist or a review routine, last a year or two. Tool notes,
      such as which tool, which model, its price, its data terms or a setting, last months. So keep tool facts out of
      your commitments and in dated notes, each written with the date it was true: "as of" a month and year. This is
      not a ban on naming tools. It is about putting the name where it can age without breaking the commitment.
    background: |
      §21.4 and @fig-21-9 (source: the book's own dating rule, not a measured result). Check Yourself 21.4 (1): tool
      facts change in months, commitments should last years; a dated note keeps the fact and its date together.
      Review A9 (odd): tool's name and price go in a dated note because tool facts change in months while commitments
      should last years. Rubric "Review plan and dated notes": one tool fact inside a commitment = 1.5 of 2.
    misconceptions:
      - m: "M4 'A good code names the exact tools and settings I use.'"
        fix: "Move the tool into a dated note. Do not overcorrect into 'never name a tool': tools may be named, in dated notes."
    activity: "Ask: 'Which line of your draft names a tool?' Move it."
    book: "§21.4, @fig-21-9; Check Yourself 21.4; Review A9."

- layout: compare
  minutes: 1.5
  kicker: "§21.4 · a review plan (book figure: review cycle)"
  title: "A date, triggers, and marks to reread"
  size: 22
  columns:
    - heading: "Review date"
      role: human
      text: "≤ 6 months, or before your next job, placement or term"
    - heading: "Review triggers"
      role: neutral
      bullets: ["Model update or retirement", "New price, terms, input", "New job, school or rule", "A failure you met"]
      size: 20
    - heading: "Marks"
      role: soft
      text: "When a line applied, and what you did"
  takeaway: "At review: keep, revise or retire each line"
  notes:
    say: |
      Three parts of a review plan. A review date: the date by which you reread your whole code and keep, revise or
      retire each line. The chapter asks for one no more than six months ahead, and before a new job, internship,
      clinical placement or term, whichever comes first. Review triggers: events that send you back before the
      date. Chapter 12's re-test triggers all apply: a model update or retirement, a change in price or terms, a new
      kind of input, a change of job or school. Add two more: a new rule from someone who binds you, and a failure
      you met. Marks: a brief note each time a commitment applies. At your review, the marks show which lines did
      their job and which never came up.
    background: |
      §21.4 and @fig-21-10. Check Yourself 21.4 (2): a new kind of input is a re-test trigger and so a review
      trigger; do not wait for the date. Hana's plan (worked example): review the first week of next term; triggers:
      a new client contract, a change in a tool's data terms, a change to the zine's submission form; marks: a line
      in the job log each time a commitment applies. Faded example (co-op engineering student; model being retired)
      in Appendix E. Mini-Project (optional): a six-week code log, like a check sheet (From the Field: Seker, 2014,
      check sheet).
    questions:
      - q: "My firm adopts a new AI tool two months before my review date. Wait?"
        a: "No. A new tool is a review trigger: reread your marks, then keep, revise or retire lines now (Review A6's logic)."
    misconceptions:
      - m: "M3 'Once written, a code is finished.'"
        fix: "Point to the triggers column: the world sends you back before the date."
    activity: "Students write their review date on their draft now."
    book: "§21.4, @fig-21-10, Worked Example 'Hana's Review Plan'; Check Yourself 21.4."

- layout: assignment
  minutes: 1.5
  kicker: "Application Assignment · O5 · LO7, LO4, LO5 · 15 of the portfolio’s 100"
  title: "Your personal AI code of practice"
  due: "With the portfolio, when your instructor sets it · one page; card about 300 words"
  parts:
    - "Scope line: who you are in this code, and the date"
    - "5–7 commitments “When…, I…, because…” incl. the four required lines"
    - "Boundaries line; review date and two or more triggers"
    - "Dated notes (optional); trigger-test record with one revised line"
    - "AI Use Declaration for the code"
  rubric_title: "Rubric · 15 points"
  rubric:
    - {criterion: "Triggers", points: 5, full: "5–7 lines; all pass the recorded test"}
    - {criterion: "Own evidence", points: 4, full: "Every reason yours; four required lines"}
    - {criterion: "Fit with rules", points: 2, full: "Rules cited; stricter wins; owner named"}
    - {criterion: "Review plan", points: 2, full: "Date within limit; ≥ 2 triggers; tool facts in notes"}
    - {criterion: "Revision", points: 1, full: "Before/after; question failed and passed"}
    - {criterion: "Declaration", points: 1, full: "All five elements"}
  note: "Drafting help is permitted with disclosure, but every line must be yours to explain in your defense."
  notes:
    say: |
      Here is what you submit with the portfolio. One page. A scope line: who you are in this code, such as
      a student in your major, a job, freelance work or a club, and the date. Five to seven commitments in the "when,
      I, because" form, including the four required lines. A boundaries line. A review plan: a date no more than six
      months ahead, or before your next job, placement or term, and at least two review triggers. Optional dated
      notes. The trigger-test record from today, with one revised line. And an AI Use Declaration for the code. It
      is worth fifteen of the portfolio's hundred points. In your defense you may be asked to explain one line: why
      that moment, how you would show you acted, what evidence stands behind it.
    background: |
      Application Assignment (chapter). AI use: following the book's three zones (§1.5), drafting help is permitted with disclosure
      and verification; feedback and grammar-only edits are permitted and listed; every commitment must be the
      student's own and each "because" must point to their own evidence; the brief is the explicit permission §10.2's
      table asks for. Without a trigger-test record (item 7), the first criterion is scored at Proficient at most. A
      true "no AI tools used" declaration scores 1. Never include personal or confidential data about anyone else.
      Alternative assignment: write the code for a role from one of four role briefs on the course site (hospital unit
      clerk, marketing intern, lab research assistant, freelance translator); the brief's incidents count as your
      own evidence. Time: workshop draft about 15 minutes; finishing about 27–29 minutes (about 42–44 in all).
    questions:
      - q: "Can I ask an AI tool to write my code?"
        a: "Drafting help is permitted with disclosure, but no tool can supply your own evidence, so a generated line cannot pass the reason question for you (Lab 21.2). You must be able to defend every line without a tool."
    activity: "Point at 'Triggers' (5) and 'Own evidence' (4): nine of fifteen points."
    book: "Application Assignment: Your Personal AI Code of Practice (brief, rubric, alternative); §21.5, @fig-21-11."

