# ======================================================================= REVIEW SEGMENT · PART B AND FINAL BRIDGE
- layout: section
  session: review
  minutes: 0
  number: "Part B"
  tag: "Core"
  title: "What a profession’s code can and cannot do"
  idea: "A code is a basis for judgment, not a procedure — and it needs readers."
  meta: "Case Study (C21), Ethics Lens, Summary, Last Words · read before the final review"
  notes:
    say: |
      This is the final-exam review segment: Part B of Chapter 21 and the Final Bridge items whose answers are in
      Appendix E, each answer on the next slide. Use it on your own or in an office-hours review. Part B returns to
      the ACM code with two questions. How is a profession's code built, and what does it say it cannot do? And does
      a code change what people do? Then the chapter closes the book: five students' first lines and the last words.
      If you run this segment in a group, it takes about half an hour.
    background: |
      Part B: Case Study, Chapter Summary, Last Words (about 7 minutes reading), plus the End-of-Chapter Package with
      the Final Bridge (final-exam practice, about 70 minutes; Final Bridge about 40). Minutes in this segment are
      estimates for an optional group review (about 30 min), outside any planned session.
    activity: "Optional review segment."
    book: "Part B box; Case Study; Final Bridge."

- layout: compare
  minutes: 2
  kicker: "Case Study (C21) · ACM Code of Ethics, 2018 · confirmed"
  title: "How the code is built, and what it says it cannot do"
  size: 22
  columns:
    - heading: "Built"
      role: neutral
      bullets: ["Principles + guidelines", "Four sections, incl. compliance", "2.5: reassess unpredictable systems"]
    - heading: "Its own limit"
      role: soft
      bullets: ["A basis for decisions, not a procedure", "Taken as a whole; needs judgment"]
    - heading: "Your decision"
      role: human
      bullets: ["How often you review", "One principle as your trigger"]
  takeaway: "No AI output, nothing failed: no tree label"
  notes:
    say: |
      How the code is built: principles stated as responsibilities, each followed by guidelines that say what it
      means in practice. Section 1 holds general ethical principles, such as avoid harm, be honest and trustworthy,
      respect privacy. Section 2 adds professional responsibilities, including respecting existing rules, 2.3,
      giving thorough evaluations of systems and their risks, 2.5, and disclosing when a task is beyond one's
      competence, 2.6. Section 3 is for leaders. Section 4 is about compliance. What it says it cannot do: the
      Preamble calls it a basis for ethical decision-making, not a procedure; several principles may apply with
      different weight, and applying them takes judgment. Your decision: how often you will review your code, and
      which ACM principle you would turn into a commitment of your own.
    background: |
      Case Study (confirmed: ACM, 2018a). Section 4: members should uphold the code; violations are treated as
      inconsistent with ACM membership and may be reported to the ACM; ACM has an Enforcement Policy. Section 3
      example: taking care when modifying or retiring systems people depend on (3.6). The book reads the 26-year gap
      as a reminder that codes age more slowly than the fields they guide (inferred tier). Labels: no AI output was
      produced and nothing failed, so no Failure Taxonomy Tree label and no failure-to-harm chain link; a governance
      document used as a model. Case Study Q1 (Appendix E): in 1992 many saw computing as purely technical and the
      web was in its infancy; by 2018 computing could affect lives in ways not intended or predictable. Q3 example
      commitment from 2.5: when a tool I rely on is updated, I re-run my three test inputs before using it again.
    questions:
      - q: "If the code admits it can't decide for me, what is it for?"
        a: "It gives principles, reasons and guidelines that support judgment; Review C1 asks you to argue that triggers support judgment rather than replace it."
    activity: "Ask each student to name the principle they would turn into a trigger."
    book: "Case Study 'What a Profession's Code Can and Cannot Do'; Case Study Questions 1–4."

- layout: compare
  minutes: 2
  kicker: "Ethics Lens · McNamara et al. (2018)"
  title: "Does reading a code change answers?"
  size: 22
  columns:
    - heading: "The study"
      role: neutral
      bullets: ["105 developers, 63 students", "Eleven scenarios", "One group asked to consider the ACM code"]
    - heading: "Found"
      role: soft
      bullets: ["No significant difference from control"]
    - heading: "Did not test"
      role: neutral
      bullets: ["Codes as triggers", "Codes people chose", "Training or enforcement"]
  takeaway: "Risk: ethics washing, fine principles that change nothing"
  notes:
    say: |
      Does a code change what people do? Researchers at North Carolina State University tested one version of that
      question. They gave 105 professional software developers and 63 software engineering students eleven short
      scenarios about ethical choices at work. One group was asked to consider the ACM code before answering; a
      control group was not. They found no significant difference in the answers. What does that show? That being
      asked to consider the code before a decision did not change answers in this setting. It does not show that
      codes never work: the study did not test codes written as triggers, codes people chose themselves, training, or
      codes with enforcement behind them. Still, it is a warning: ethics washing, good principles that make a person
      look responsible without changing what they do.
    background: |
      McNamara, Smith and Murphy-Hill (2018), ESEC/FSE 2018. Ethics Lens second risk: a code used as cover; "my
      code allows it" is not an answer to a client, patient or instructor who was not asked; the boundaries line and
      the declaration point outward. Two protective habits: write lines that can be checked (moment, traceable
      action, reason), and keep marks and review them. Review A10 (even; key not shown) asks what the study
      reported.
    misconceptions:
      - m: "M5 'Writing a code makes me act ethically.'"
        fix: "Use the study: being asked to consider a code did not change answers. Do not overcorrect into 'codes are useless': if-then plans help people act on goals they hold (Deep 21.A); write triggers and keep marks."
    activity: "Ask: 'What would you need to see to believe your own code works?' (Marks.)"
    book: "Ethics Lens 'A Code No One Reads'."

- layout: concept
  minutes: 1.5
  kicker: "Chapter Summary · five codes, first lines (constructed)"
  title: "Five students, five first commitments"
  size: 22
  bullets:
    - "**Lucia:** check every promise in an AI draft against policy"
    - "**Marcus:** no patient information in any AI tool"
    - "**Maya:** paired-input test before relying on a scoring tool"
    - "**Sam:** hard gate and named person before spend, send, delete"
    - "**Hana:** written agreement before AI images on client jobs"
  notes:
    say: |
      The book's five students close their arcs with one line each from their codes, each tied to their own
      evidence. Lucia, accounting: before an AI-drafted reply reaches a customer, she checks every promise in it
      against the written policy, because a draft once offered a discount the policy did not allow, back in Chapter
      1. Marcus, nursing: no information about a patient in any AI tool, because his data-flow map showed what he
      pastes is stored under someone else's rules. Maya, psychology: a paired-input test before she relies on a tool
      that scores students, because her 15-run test could show only a lead. Sam, mechanical engineering: a hard gate
      and a named person before any spend, send or delete, because his agent once placed a $312 order. Hana: written
      agreement before AI images on a client job.
    background: |
      Chapter Summary box "Five Codes, First Lines" (constructed examples, each in the student's own words). Each
      covers a different required kind: verification (Lucia), data (Marcus), fairness (Maya), delegation and
      oversight (Sam), and Hana's line combines a client rule with own evidence. Hana uses they/them.
    activity: "Ask: 'Which of the five is closest to your own first line?'"
    book: "Chapter Summary, box 'Five Codes, First Lines'."

