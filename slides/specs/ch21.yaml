# ======================================================================= PORTFOLIO WORKSHOP · LAB 20.1 MINUTES 50–65
- layout: title
  session: tue
  minutes: 0
  subtitle: "Code peer check in the portfolio workshop · final review"
  meta:
    - "Sadi Evren Seker"
    - "Part A before the workshop"
    - "Part B and Final Bridge before the final review"
  figure: f21-11-principles-card
  notes:
    say: |
      This deck has two short moments in class. The first is now, minute fifty of the portfolio workshop: fifteen
      minutes to check each other's code of practice. The second comes later: ten minutes of final review on the
      Final Bridge. Everything else in Chapter 21 you read at home. The picture on the right is the card your code
      should fit on: a scope line, five to seven commitments written as "when, I, because", a boundaries line, a
      review date with review triggers, and dated notes for tool facts. For the next fifteen minutes you need only
      two things on the table: your three commitments and your boundaries line, the workshop draft from Part A. Put
      your A14 draft aside; you will need it again at minute sixty-five.
    background: |
      Chapter 21 is read in two parts (D23, D25): Part A (opening page, Opening Case, Objectives, Warm-up,
      21.1–21.4 with Check Yourself) before the workshop, about 29 minutes reading plus 7 answering, and the
      workshop draft (three commitments and a boundaries line) about 15 minutes; finishing the code (21.5, the
      brief, the rest of the code) about 27–29 minutes of portfolio-assembly time, before the portfolio is due; Part
      B (Case Study, Summary, Last Words) before the final review, about 7 minutes; final-exam practice about 70
      minutes, the Final Bridge about 40. The figure is the blank principles card (@fig-21-11). The chapter map
      highlights Frame, with Disclose second. Note: the chapter text still gives calendar dates for these steps,
      pending the D27 assembly pass; this deck names the steps only.
    questions:
      - q: "I did not write a workshop draft. What do I do?"
        a: "Write two commitments now in the 'when, I, because' form from your A1 goals or a Failure Diary entry, and a boundaries line; your partner tests those."
    activity: "On screen at minute 50 while partners swap drafts."
    book: "Chapter 21 opening page and time table; @fig-21-11; Lab 21.1."

- layout: session_plan
  minutes: 0
  title: "Chapter 21 in class and at home"
  columns:
    - heading: "Workshop · min 50–65"
      sub: "Lab 21.1 inside Lab 20.1 · pairs"
      blocks:
        - {min: 1, label: "Brief", detail: "Three test questions"}
        - {min: 4, label: "Read aloud", detail: "Each partner’s draft"}
        - {min: 6, label: "Test", detail: "Moment · action · reason"}
        - {min: 1, label: "Name one line", detail: "The weakest"}
        - {min: 3, label: "Revise, record", detail: "Item 7 of the brief"}
    - heading: "Final review · 10 min"
      sub: "Before a defense session, or online"
      blocks:
        - {min: 1, label: "Chapters 8–20 on one loop", detail: "Where each chapter sits"}
        - {min: 7, label: "Final Bridge, even items", detail: "From the instructor key"}
        - {min: 2, label: "Final exam practice", detail: "Three kinds of items"}
    - heading: "At home"
      sub: "Code due with the portfolio"
      blocks:
        - {min: 36, label: "Part A", detail: "Before the workshop"}
        - {min: 15, label: "Workshop draft", detail: "3 lines + boundaries"}
        - {min: 28, label: "Finish the code", detail: "Before the portfolio"}
        - {min: 7, label: "Part B", detail: "Before the review"}
        - {min: 40, label: "Final Bridge", detail: "Exam practice"}
  notes:
    say: |
      Here is how Chapter 21 fits into the end of the book. Today, minutes fifty to sixty-five of the workshop, you
      read your draft aloud to your partner, your partner tests each line with three questions, names the one line
      that most needs work, and you revise it and record the change. The finished code is due with your portfolio,
      when your instructor sets it. Later, ten minutes of final review go through the Final Bridge items whose
      answers are not in Appendix E. At home, Part B is short, about seven minutes, and the Final Bridge takes about
      forty. If your course has a final exam, the Final Bridge is the practice for it.
    background: |
      Chapter 21 time table (Part A about 29 min reading + 7 answering; workshop draft about 15; finishing the code
      about 27–29, portfolio-assembly time; Part B about 7; final-exam practice about 70, Final Bridge about 40).
      Lab 21.1 steps on the lab sheet: read aloud 2 min each (4), test 3 min each (6), name one line (1), revise and
      record (4) = 15. This deck takes 1 minute from "revise and record" for a brief at the start; students finish
      the written record at home if needed (it is item 7 of the brief). The "28" for finishing the code is the
      midpoint of the chapter's 27–29 minutes.
    activity: "Skip in class (0 min); for reference and for the course-site copy of the deck."
    book: "Chapter 21 time table; Lab 21.1; Final Bridge introduction."

- layout: objectives
  minutes: 0
  kicker: "Chapter 21 · learning objectives"
  title: "After this chapter you will be able to…"
  items:
    - {code: "O1", text: "**Distinguish** your code from policy, a profession’s code, a slogan, a tool note"}
    - {code: "O2", text: "**Write** commitments as triggers from your own evidence"}
    - {code: "O3", text: "**Judge** a draft with the trigger test and the rules that bind you"}
    - {code: "O4", text: "**Plan** how your code ages: review date, triggers, dated notes"}
    - {code: "O5", text: "**Produce** your code for the final portfolio"}
  notes:
    say: |
      Five objectives. Today's peer check practices objective three: judging a draft with the trigger test and
      against the rules that bind you, then revising the lines that fail. The code you submit with your portfolio
      is objective five. Objectives one, two and four are in Part A, which you read before the workshop, and they
      are practiced in the Review Questions: telling a personal commitment from a policy, a professional code, a
      slogan or a dated tool note; writing commitments as triggers; and planning how a code ages. The chapter's
      question ties them together: when your course's rules end, which of them will you keep, and how will you know
      when to change them?
    background: |
      Full objectives with tags (chapter): O1 Distinguish (Understand; LO7, LO4); O2 Write (Apply; LO5, LO4); O3
      Judge (Evaluate; LO5); O4 Plan (Create; LO7); O5 Produce (Create; LO7, LO4, LO5). The Final Bridge is review,
      not an objective (blueprint).
    activity: "Reference; 0 min in class."
    book: "Chapter 21, Learning Objectives; the chapter's question."

- layout: section
  minutes: 0
  number: "50–65"
  tag: "Lab"
  title: "Code peer check"
  idea: "Read it aloud; test every line: moment, action, reason."
  meta: "Lab 21.1 inside Lab 20.1 · Book §21.2, §21.3, §21.5 · 15 minutes"
  notes:
    say: |
      Minute fifty. For the next fifteen minutes you work on the code-of-practice draft you wrote for Part A: three
      commitments in the "when, I, because" form and a boundaries line. Your partner reads it aloud, because reading
      aloud shows quickly whether a moment is one you would notice. Then your partner tests each commitment with
      three questions, checks the boundaries line, and names one line to revise. You rewrite it and record it before
      and after, with the question it failed and the question it now passes. That record is item 7 of your code's
      brief. No device and no AI account are needed; please do not put anyone else's draft into an AI tool.
    background: |
      Lab 21.1 (labs/ch21-lab1.md): Studio, 15 minutes, a named slot of Lab 20.1 (minutes 50–65); objectives Ch. 21
      O3, O5 (LO5, LO7); materials: the workshop draft, the printed trigger-test strip (instructor package), a pen.
      Pairs inside the workshop team; use your own draft only.
    activity: "Hand out the trigger-test strips while pairs form."
    book: "Lab 21.1; §21.5 (peer check paragraph)."

# Native redraw of @fig-21-4 (the book figure's diamond labels fall below 15 pt at slide size).
- layout: concept
  minutes: 1
  kicker: "§21.2 · the trigger test (book figure, redrawn)"
  title: "A line becomes a commitment only if it passes three tests"
  size: 26
  bullets:
    - "**Moment:** would I notice it then?"
    - "**Action:** could someone trace it afterward?"
    - "**Reason:** does “because” point to my own evidence?"
  flow:
    - {label: "A line in your draft", kind: step}
    - {label: "Moment?", kind: step}
    - {label: "Action?", kind: step}
    - {label: "Reason?", kind: step}
    - {label: "Commitment", kind: human, role: verified}
  takeaway: "A no at any question → rewrite; the new line takes the test again"
  notes:
    say: |
      One minute on the test you will apply. A line in your draft passes three questions. Moment: would I notice it
      at the time, from something I can see, such as "I am about to send, upload or publish", "the input contains a
      person's data", or "a tool I set up can act for others"? Action: could I or someone else tell afterward that I
      did it, from a mark in a log, a saved check or a line in a declaration? Reason: does the "because" point to my
      own evidence, something from my own work, such as a Failure Diary entry or a graded assignment? A no at any
      question means rewrite, and a rewritten line takes the test again. Listeners, mark each commitment with a tick
      or a cross for each question.
    background: |
      §21.2 and @fig-21-4. Commitment: a line that states an action you will take. Trigger (in a code of practice):
      the observable situation that tells you a commitment applies now. Own evidence: something from your own work
      that shows why the line matters to you (Failure Diary, graded assignments, lab records, the optional Chapter 13
      protocol log); a rule can be part of the reason only together with your own evidence. Check Yourself 21.2 (1):
      "When I use AI, I am careful" fails moment and action, and has no reason.
    misconceptions:
      - m: "M1 'A code of practice is a list of good values: be honest, be responsible.'"
        fix: "Values become the 'because', not the line. Do not overcorrect into 'values do not matter': each commitment keeps a reason."
    activity: "1 min; then start the read-aloud."
    book: "§21.2, @fig-21-4; Check Yourself 21.2."

- layout: lab
  minutes: 14
  kicker: "Lab 21.1 · on screen while you work"
  title: "Read aloud, test, revise one line"
  goal: "Every commitment passes moment, action and reason"
  steps:
    - {text: "Partner A reads A’s draft aloud; then B reads B’s", min: 4}
    - {text: "Listener ticks or crosses each line: **moment · action · reason**", min: 6}
    - {text: "Boundaries: “Which rule is stricter here, and whom would you ask?”"}
    - {text: "Listener names the one line that most needs work", min: 1}
    - {text: "Rewrite it; record before, after, failed and passed questions", min: 3}
  side:
    - {heading: "Deliverable", text: "Item 7 of your code: the trigger-test record and one revised line"}
    - {heading: "Can’t attend?", text: "Check with a classmate by message, or in office hours, or self-test with the strip"}
    - {heading: "Privacy", role: risk, text: "Your own draft only; no one else’s data"}
  notes:
    say: |
      Go. Partner A reads A's draft aloud, then B reads B's: two minutes each. Then test: the listener goes line by
      line and marks moment, action and reason with a tick or a cross, three minutes each. Read the boundaries line
      too and ask: which rule is stricter here, and whom would you ask? Then the listener names the one line that
      most needs work and says which question it failed. In the last three minutes, each writer rewrites that line
      and records it before and after, with the question it failed and the question it now passes. If a line passes
      all three on the first try, that is a valid result: record it unchanged and say so. At minute sixty-five we go
      back to Chapter 20 for the defense rehearsal.
    background: |
      Lab 21.1 expected observations: most first drafts have at least one line that fails moment ("when I use AI…"),
      action ("I am careful…") or reason (a rule with no evidence of why it matters to the writer). Boundaries lines
      often name the course and forget a job, a placement or a client; "which rule is stricter here?" brings these
      out. Debrief questions (folded into Lab 20.1's share-and-critique, if time): Which test question did your draft
      fail most often, and why? Did your boundaries line name a rule you had forgotten? Rubric link: without a
      trigger-test record (item 7), the first criterion is scored at Proficient at most; the Revision criterion (1
      point) needs one before-and-after with the question failed and the question passed. The lab sheet gives 4
      minutes to revise and record; this plan uses 3 because of the 1-minute brief.
    questions:
      - q: "My partner says 'before I submit coursework' is not a moment. Is it?"
        a: "Yes, if you would notice it at the time: submitting is a visible moment. 'When I use AI' is the classic fail, because it covers everything and you would not notice it as special."
      - q: "Can my reason be 'because the course rules say so'?"
        a: "Not on its own: a rule says what you must do, not why the line matters to you; pair it with your own evidence (Check Yourself 21.2, item 2)."
    misconceptions:
      - m: "M2 'My code is my own rule, so where I disagree with a course or employer rule, my code decides.'"
        fix: "Ask the boundaries question for every draft: the stricter rule wins; a personal code may be stricter, never looser."
    activity: |
      Read aloud 4 (2 each) · test 6 (3 each) · name one line 1 · revise and record 3. Call each switch aloud. At
      minute 65 switch back to the Chapter 20 deck ("Defense rehearsal").
    book: "Lab 21.1; §21.2–21.3, §21.5; Application Assignment item 7 and rubric."

# ======================================================================= PART A IN BRIEF (reference)
- layout: section
  session: parta
  minutes: 0
  number: "Part A"
  tag: "Core"
  title: "Your code, in brief"
  idea: "When your course’s rules end, which will you keep, and how will you know when to change them?"
  meta: "Book Opening Case, §21.1–21.4 · read before the workshop"
  notes:
    say: |
      These slides summarize Part A, which you read at home before the workshop. Use them to review, or if you
      missed the reading. Throughout the book, your course has given you rules for working with AI. When the
      course ends, no one will tell you when to use them. Part A helps you choose the ones you will keep and write them
      as a short personal AI code of practice. It answers four questions: what a personal code is, compared with
      other kinds of rules; how to write a commitment so that you recognize when it applies; how your code sits
      inside the rules that bind you; and how a code ages. All four are Core and examinable.
    background: |
      Part A is Core and examinable (D20). Segment timing if presented: about 15 minutes. Workshop draft = the 21.2
      and 21.3 Your Turns (three commitments, at least two of them required lines, and a boundaries line); the 21.1
      Your Turn was folded into the 21.2 draft (D25).
    activity: "Reference segment; no scheduled class time."
    book: "Chapter 21 Part A box; §21.1–21.4."

- layout: timeline
  minutes: 1.5
  kicker: "Opening case · ACM Code of Ethics (2018)"
  title: "A profession rewrites its rules"
  events:
    - {label: "1992", text: "The code’s previous version", tier: "confirmed"}
    - {label: "Two years", text: "Drafts published for comment", tier: "confirmed"}
    - {label: "Jun 22, 2018", text: "ACM Council adopts it", tier: "confirmed"}
    - {label: "Its own limit", text: "“Not an algorithm for solving ethical problems”", tier: "confirmed"}
  takeaway: "About 26 years to update, and it still asks for judgment"
  notes:
    say: |
      In June 2018 the Association for Computing Machinery, ACM, a professional society for people who work in
      computing, adopted a new version of its Code of Ethics and Professional Conduct. The ACM Council approved it on
      June 22, 2018. The version it replaced dated from 1992, about 26 years earlier. ACM described the update as a
      two-year process, with drafts published for comment. Why update? In 1992 many people saw computing work as
      purely technical; by 2018 it could affect people's lives in ways that may not be intended or even predictable.
      The new code names machine learning. And it says what it is not: in its own words, it is not an algorithm for
      solving ethical problems; it is a basis for ethical decision-making. Puzzle: if a profession's code needs
      judgment and revision, what should your own code contain, and how will you know it is out of date?
    background: |
      Case C21 (ACM, 2018a, booklet; ACM, 2018b, press release of July 17, 2018). All facts here are confirmed in the
      primary record. The co-chairs' example: a reading app can meet the requirement of enlarging text for readers
      with impaired vision and still fail them if the instructions for doing so are printed in tiny type. Principle
      2.5: extraordinary care with the risks of machine-learning systems; a system whose future risks cannot be
      reliably predicted needs frequent reassessment in use, or should not be deployed. Audience: current and
      aspiring computing professionals, instructors, students, and anyone whose computing affects others. Status:
      as of October 2026, the 2018 code is still current (ACM's code page as archived July 9, 2026). The quotation
      is the chapter's single quotation from the ACM sources.
    misconceptions:
      - m: "M3 'Once written, a code is finished.'"
        fix: "Even a profession revised its code; principle 2.5 asks for frequent reassessment. Do not overcorrect into 'rewrite it weekly': commitments change rarely, tool notes often."
    activity: "Pose the puzzle; Part A's sections answer it."
    book: "Opening Case 'A Profession Rewrites Its Rules', @fig-21-2."

- layout: section
  minutes: 0
  number: "21.1"
  tag: "Core"
  title: "Why a personal code"
  idea: "Policy and a profession’s code bind you anyway; your code is the part you choose to keep."
  meta: "Book §21.1"
  notes:
    say: |
      Many fields now have rules about AI: an employer's, a client's, a profession's. None of them will tell you
      which habits from this book to keep. That choice is yours. A personal AI code of practice is a short set of
      commitments you choose for how you will use AI in your own work, each written so that you recognize when it
      applies, with a date to review it. In your course the artifacts, rubrics and declarations were scaffolds,
      temporary support withdrawn as you improve. Your code is the part you keep when the scaffolding comes down.
      The two goals you set in A1 are a good place to start.
    background: |
      §21.1. Scaffold (Chapter 7): temporary support that lets you do what you cannot yet do alone, withdrawn as you
      improve. In EU law, a "code of practice" can also be a voluntary document AI companies sign (Deep 21.B; the
      EU's General-Purpose AI Code of Practice was published July 10, 2025); not the sense used here.
    activity: "Reference."
    book: "§21.1 Why a Personal Code."

- layout: compare
  minutes: 1.5
  kicker: "§21.1 · five kinds of text that look alike"
  title: "Only one of them is your commitment"
  size: 22
  columns:
    - heading: "Binds you anyway"
      role: neutral
      bullets: ["**Policy:** your instructor, employer, client", "**Professional code:** e.g., ACM"]
    - heading: "Not a commitment"
      role: soft
      bullets: ["**Slogan:** “use AI responsibly”", "**Dated tool note:** true as of a date"]
    - heading: "Yours"
      role: human
      bullets: ["**Commitment:** a moment, an action, a reason"]
  takeaway: "A slogan has no moment and no action"
  notes:
    say: |
      Your code sits next to four other kinds of text that look similar but do different jobs. Policy: rules someone
      with authority over your work sets, such as your instructor, an employer or a client. A professional code of
      ethics: principles a profession sets for its members, such as the ACM code. A slogan: a good intention with no
      moment or action attached, such as "use AI responsibly." A dated tool note: a fact about a tool or a rule, true
      as of a date, such as which tool your school provides. Marcus sorted six lines from his notes: two were
      his own commitments, one about patient information and one about stopping a study session when he types
      "just tell me." The policy and the ACM principle bind him anyway; his code does not replace them.
    background: |
      §21.1 and Worked Example "Marcus Sorts His Notes" (nursing; constructed). Check Yourself 21.1 (Appendix E): a
      commitment names a moment you would notice and an action someone can trace, with your own evidence as the
      reason; a slogan has neither moment nor action. Policy and a profession's code bind you whether or not you
      write them down; your code adds your own commitments inside them. Dated tool note example: which chat tool a school
      provides to its students, written "as of" a month and year (the chapter's example still names one
      institution's tool, pending the D27 assembly pass). Faded example (marketing
      student) and Lab 21.2 (generated "code of AI ethics", optional) practice the sorting; generated codes tend to
      be lists of slogans and none can pass the reason question for the student.
    misconceptions:
      - m: "M1 'A code of practice is a list of good values.'"
        fix: "Sort two slogans and two commitments aloud; the difference is the moment and the action."
    activity: "Ask: 'Is \"be transparent\" a commitment?' (No: a slogan.)"
    book: "§21.1, @fig-21-3, Worked Example 'Marcus Sorts His Notes'; Check Yourself 21.1; Lab 21.2."

- layout: quiz
  minutes: 1
  kicker: "Review Questions A1 · §21.1"
  title: "which line is yours?"
  question: "Which line is a personal commitment?"
  options:
    - "“Use AI ethically and responsibly in all of my work, every single day.”"
    - "“AI use during examinations is not acceptable in this course.”"
    - "“Before I submit work, I list every AI use in my declaration.”"
    - "“Our school provides a chat assistant to students (as of October 2026).”"
  answer: c
  instruction: "Answer on your own, then check"
  explanation: "(a) is a slogan; (b) is policy; (d) is a dated tool note"
  notes:
    say: |
      Exam-format practice. Four lines, and only one is a personal commitment. Use the sorting from the last slide:
      which one is a slogan, which is policy, which is a dated tool note? Then check the remaining one with the first
      two test questions: is there a moment you would notice, and an action someone could trace afterward? Note that
      the commitment in this item has no "because"; in your own code it would need one, but the item asks only
      about the kind of line. Commit to an answer before you look.
    background: |
      Review Questions A1 (O1 · LO7 · Understand). Key (Appendix E): (c). (a) slogan (M1); (b) policy; (d) dated
      tool note (M4). Option (d) is reworded on the slide to name no institution or product (D27); the chapter's
      item still names one, pending the assembly pass.
    activity: "30 s, then the answer slide."
    book: "§21.1; Review Questions A1; Appendix E."
  answer_minutes: 0.5
  answer_notes:
    say: |
      The answer is (c): "Before I submit work, I list every AI use in my declaration." It names a moment you would
      notice, submitting, and an action someone could trace, the declaration. Option (a) is a slogan: it sounds
      strong, with "every single day," but it has no moment and no action. Option (b) is policy: it binds you, but
      someone else set it. Option (d) is a dated tool note: a fact true as of a date, which belongs in your code's
      dated notes, not among the commitments. To finish (c) as a line in your own code, add a "because" that points
      to your own evidence.
    background: |
      Appendix E (Chapter 21, Review A1).
    activity: "Self-check."
    book: "§21.1–21.2; Appendix E."

- layout: section
  minutes: 0
  number: "21.2"
  tag: "Core"
  title: "Commitments as triggers"
  idea: "A line helps only if you notice the moment it applies."
  meta: "Book §21.2 · workshop draft, part 1"
  notes:
    say: |
      "Be honest about AI" is easy to agree with and easy to forget, because nothing tells you when it applies. So
      the chapter asks for one form: when a moment I will notice, I take an action I or someone else can trace,
      because of my own evidence. The "when" is the trigger: the observable situation that tells you a commitment
      applies now. Psychologists call a plan in this "if this situation arises, I will respond this way" form an
      implementation intention, and reviews of many tests find that such plans help people act on goals they already
      hold. No study the book found tested AI use, so applying this to your code is the book's inference.
    background: |
      §21.2. Gollwitzer and Sheeran (2006); Sheeran et al. (2025): reviews of hundreds of tests find that such plans
      help people act on goals they already hold, more so in the explicit if-then form. Applying it to codes is the
      book's inference (Deep 21.A, optional, gives effect sizes and limits). Three senses of "trigger" in the book:
      in a code of practice (this chapter), re-test trigger (Chapter 12), trigger in a verification protocol (Chapter
      13, Deep).
    activity: "Reference."
    book: "§21.2 Commitments as Triggers; Deep 21.A."

# About 59 words on the last reveal: three value → trigger pairs are the example (deliberate exception).
- layout: worked
  minutes: 1.5
  kicker: "§21.2 · worked example · Hana (they/them), constructed"
  title: "Hana’s values become triggers"
  context: "Hana (they/them), freelance illustrator"
  steps:
    - {label: "“Respect artists”", text: "Client job, before AI images → written agreement · because: clause, bakery draft"}
    - {label: "“Protect my work”", text: "Before an upload → check terms, log tool, date · because: terms differed"}
    - {label: "“Be honest”", text: "Before an invoice → list AI use · because: clients ask"}
  reveal: [1, 3]
  result: "The value becomes the “because”"
  notes_reveal:
    - minutes: 0.75
      say: |
        Here is the method on one person. Hana starts from three values, the kind most people would write first.
        Take "respect artists." As a commitment: before I use any AI image generation on a client job, I get the
        client's written agreement, because my contract clause requires it and a bakery client once arrived with a
        generated draft. Check it. Moment: any client job, before generation; Hana would notice that. Action: the
        agreement on file, which someone could check. Reason: the clause together with Hana's own evidence, the
        bakery job. Notice a detail: an earlier draft began "When a client's brief mentions AI images." That
        trigger would miss briefs that say nothing about AI. A trigger must cover the whole rule it cites.
      background: |
        §21.2 Worked Example "Hana's Values Become Triggers" (constructed; Hana uses they/them; major Media Arts and
        Design, D26). The bakery job and the contract clause come from Chapter 18; the tool-terms comparison from
        Chapter 13.
      activity: "Ask: 'Which of the three questions would the earlier draft fail?' (Moment: it misses some jobs.)"
      book: "§21.2 Worked Example; @fig-21-5."
    - minutes: 0.75
      say: |
        The other two follow the same pattern. "Protect my work": before I upload a drawing to any tool, I check its
        data terms and log the tool and the date, because comparing two tools' terms showed me how much they differ.
        Moment: the upload. Trace: the log line. Reason: Hana's own comparison. "Be honest": before I send an
        invoice, I list any AI use in its notes, because clients already ask me about these tools. Moment: the
        invoice. Trace: the notes. Reason: what clients have asked. Hana then adds two more lines: one on tracing
        images before they are printed, a verification line, and a risk line about contributors' scans and tools
        that train on uploads. Five lines in all, covering the four required kinds.
      background: |
