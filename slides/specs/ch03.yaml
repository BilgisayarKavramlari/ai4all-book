# ======================================================================= SESSION 1 · CONCEPT (second part)
- layout: title
  session: tue
  minutes: 0
  subtitle: "Concept session (second part) and lab session"
  meta:
    - "Şadi Evren Şeker"
    - "Reading: Chapter 3 (before the lab session)"
    - "Recommended: Wolfram (2023)"
  figure: f3-03-anatomy
  notes:
    say: |
      We switch from Chapter 2 to Chapter 3 without a break. Chapter 2 showed how a machine learns from examples. This
      chapter looks inside the large language models behind today's chat tools. The picture is the book's fourth
      signature diagram, the Anatomy of an LLM Response: everything the model receives sits in a context window on the
      left; the text becomes tokens; the model scores every possible next token; one token is picked; it is added, and
      the loop repeats. We build this picture one piece at a time today, with two live demonstrations, and in the lab
      session you test it yourselves. The chapter strengthens the Prompt step of the AI Work Loop: know what the model actually
      receives. Its question: does a language model know things, or does it predict text?
    background: |
      Chapter 3 is the reading for the lab session; this second half of the concept session introduces it. Time line
      in the chapter: about 25–30 minutes for Core sections 3.1–3.5 and about 50 minutes for the whole Core package.
      Wolfram (2023) is recommended, not required (the chapter's Further Reading). Chapter Map: Prompt highlighted,
      Verify second. Signature 4
      is `llm_anatomy` in figures/scripts/ch03_figures.py; Compass, the book's optional companion, has an interactive version and a token
      explorer.
    activity: "Switch decks; no pause."
    book: "Chapter 3 opening page, @fig-3-1 (chapter map) and @fig-3-3 (Anatomy of an LLM Response)."

