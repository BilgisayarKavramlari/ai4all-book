- layout: exit_ticket
  minutes: 3
  questions:
    - "Which link in your map are you least sure of, and why?"
    - "Why can the same prompt give two different answers?"
    - "Name one Chapter 2 data problem a language model can inherit."
  instruction: "3 min · index card or your course site · ungraded"
  notes:
    say: |
      Last three minutes: the exit ticket. Answer on an index card or on your course site; it is not graded, and it
      tells me what to reteach. The first question is your hardest link, which you will turn into two sentences for A2.
      The second checks the central mechanism of Chapter 3. The third connects the two chapters: generative
      AI is machine learning, so it inherits Chapter 2's problems. Before you leave: finish A2 by the date your
      instructor set. Next we move from how the tools work to how to frame a task for them, Chapter 5.
    background: |
      Good answers: (2) at each step a token is picked with some chance, so runs can follow different paths (§3.2);
      (3) for example who is in the sample (sampling bias), biased labels, or shortcuts the training data allows
      (§2.6: generative AI "inherits every problem in this chapter"). Next in the book's suggested order: framing a
      task (Chapter 5; Deep: Chapter 6). Reading order differs from chapter order: Chapter 4 is read later, together
      with Chapter 8.
    activity: "3 min; collect cards at the door or close the online form at the end of the session."
    book: "§3.2; §2.6; Lab 3.1 exit step."

# ======================================================================= REFERENCE SLIDES
- layout: deep
  session: after
  kicker: "Deep 3.A · attention in plain words"
  title: "Going deeper: attention"
  figure: f3-10-attention
  figure_width: 0.62
  size: 22
  bullets:
    - "Each token’s representation mixes in tokens **before** it"
    - "“big” draws on “trophy”; “small” on “suitcase”"
    - "Illustration, not measured weights"
  takeaway: "Most of today’s language models are built on the Transformer (as of October 2026)"
  notes:
    say: |
      Use this slide only if there is time or a student asks how the model uses the whole context when it scores the
      next token. Most of today's language models are built on the Transformer architecture, and its central part is
      called attention. At every layer, the representation of each token is updated with a weighted mix of the
      representations of the tokens before it; a token cannot draw on tokens that come later, which matches how text is
      produced, one token after another. Take a sentence from a well-known test of everyday reasoning: "The trophy
      doesn't fit in the brown suitcase because it's too big." When the model reaches "big", attention lets that
      position draw strongly on "trophy". Change "big" to "small", and the strongest link should go to "suitcase".
    background: |
      Deep 3.A (optional, not examinable). Vaswani et al. (2017) introduced the Transformer; as of October 2026 some
      newer designs mix in other parts. The sentence is from the Winograd schema challenge (Levesque et al., 2012).
      The figure is an illustration, not measured weights; real models have many attention layers and many heads per
      layer, and individual weights are hard to interpret (Chapter 17). Deep 3.B (scale): prediction error fell
      predictably as models, data and compute grew (Kaplan et al., 2020); Chinchilla, 70 billion parameters on 1.4
      trillion tokens (Hoffmann et al., 2022); lower prediction error is not the same as more truthful output.
    activity: "Optional; not part of the 75-minute plans."
    book: "Deep 3.A Attention in Plain Words, @fig-3-10; Deep 3.B."

