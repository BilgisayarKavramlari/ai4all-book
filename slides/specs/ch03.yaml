    say: |
      A reminder of what you finish after today. The map has 15 terms: at least 7 from Chapter 2, which is your Part 1,
      and at least 5 from Chapter 3, Part 2. Each Chapter 3 term needs a worked definition, your own words plus one
      concrete example, and at least one labeled link to a Chapter 2 term that reads as a true sentence, for example
      "pretraining is a kind of self-supervised learning", or "inference uses fixed parameters". Verify each definition
      against the chapter or a cited source and note where. The whole map needs one corrected AI-generated definition;
      if yours is a Chapter 3 term, a probe result makes excellent evidence. Then two sentences on your hardest link:
      start from the one you write down at the end of the lab. There is one rubric, the one from Chapter 2.
    background: |
      Chapter 3 Application Assignment: A2 lives in Chapter 2; no second rubric. Chapter 3 pool: token, tokenizer,
      next-token prediction, probability distribution, sampling (of tokens), temperature, pretraining, instruction
      tuning, learning from human feedback, knowledge cutoff, context window, system prompt, retrieval, tool use, agent;
      any other Chapter 3 Core Key Term counts; a term in both pools (e.g., inference) counts once. Alternative
      assignment: audit at least 5 Chapter 3 entries of the dated AI glossary on the course site, with probe records or the
      chapter as the source for each correction. The rubric's Links criterion requires every Chapter 3 term to be
      linked to a Chapter 2 term for full credit.
    questions:
      - q: "Can my corrected AI definition be from Chapter 2 instead?"
        a: "Yes. The whole A2 needs one corrected AI-generated definition, in either part (§3.6; Application Assignment)."
    activity: "Show the worked correction in §3.6 if asked ('context window' defined as memory of all past chats)."
    book: "§3.6 'From probes to your concept map'; Application Assignment A2 Part 2; Chapter 2 rubric."

- layout: concept
  minutes: 30
  kicker: "Lab 3.1 · on screen while teams run and pool the probes"
  title: "The four probes"
  size: 24
  bullets:
    - "**1 Tokens:** count a letter in a long word; spell, recount"
    - "**2 Sampling:** one open prompt, five new chats"
    - "**3 Context:** long text; facts at start, middle, end"
    - "**4 Cutoff and search:** dated events; search off, then on"
  takeaway: "Record: tool, model name, options, date"
  notes:
    say: |
      This stays on screen while you work. Probe 1, tokens: ask the model to count a letter in a long word or name;
      then ask it to spell the word letter by letter first and count again; record whether the tool showed a reasoning
      step. Probe 2, sampling: one open prompt from your own field, five times, each in a new chat; mark what stays and
      what changes. Probe 3, context: use the provided long public-domain text with one fact near the start, one in the
      middle and one near the end; ask about each fact in a new chat with the full text. Probe 4, cutoff and search:
      ask about the provided dated events with search off and, if your tool allows it, with search on. Do not rely on
      the model's own statement of its cutoff. Extension, if you finish early: test the reversal curse with a less
      famous parent–child pair from the list, in both directions.
    background: |
      Expected observations (lab sheet, instructor notes): probe 1 varies by tool and word; many current tools answer
      short words correctly, especially with a reasoning step; longer words or letters appearing more than twice fail
      more often (Fu et al., 2024). Probe 2: core content often repeats while wording, order and examples change. Probe
      3: the middle fact is most likely missed or confused, but newer tools may answer all three; either result is
      evidence. Probe 4: without search, events after the cutoff produce a statement of no information or a plausible
      but invented answer; with search, answers improve but sources must be checked. Extension: newer tools may answer
      both directions; a correct answer does not show the curse is gone in general. Circulate during minutes 5–20; most
      help is needed on writing a prediction with a reason.
    questions:
      - q: "Our middle fact was found every time. Is the chapter wrong?"
        a: "No. Liu et al. measured 2023 models; the chapter calls it a pattern to test, not a law. Record your result as evidence about this tool on this date, and say what would change your mind (§3.4)."
    misconceptions:
      - m: "M5 'If it fits in the context window, the model uses all of it equally well.'"
        fix: "Whatever probe 3 shows, ask teams how many runs they did before concluding."
    activity: |
      Lab minutes 0–30: teams assign probes (5), run them (15), pool the records (7), quick team debrief (3). At lab
      minute 27 ask each team for one surprising result and the section that explains it.
    book: "Lab 3.1 probes 1–4 and extension; labs/ch03-lab1.md instructor notes."

- layout: lanes
  minutes: 15
  kicker: "§3.6 · on screen during the individual write-up (book figure: mini-map)"
  title: "Attach each new term to a Chapter 2 term"
  label_width: 3.7
  rows:
    - label: "Pretraining"
      nodes:
        - {label: "is a kind of", kind: step, role: soft}
        - {label: "Self-supervised learning", kind: human, role: neutral}
    - label: "Next-token prediction"
      nodes:
        - {label: "uses the next token as its", kind: step, role: soft}
        - {label: "Label", kind: human, role: neutral}
    - label: "Knowledge cutoff"
      nodes:
        - {label: "marks the end of the", kind: step, role: soft}
        - {label: "Training data", kind: human, role: neutral}
    - label: "Context window"
      nodes:
        - {label: "is rebuilt at every step of", kind: step, role: soft}
        - {label: "Inference", kind: human, role: neutral}
  caption: "Read each row as a sentence: “Pretraining is a kind of self-supervised learning.”"
  takeaway: "At least three definitions and links from your probes before you leave"
  notes:
    say: |
      Now each of you, on your own, turns the probes into A2 Part 2. Each new term attaches to a Chapter 2 term with a
      true sentence. Read the rows on the slide aloud: pretraining is a kind of self-supervised learning; next-token
      prediction uses the real next token as its label; a knowledge cutoff marks the end of the training data; the
      context window is rebuilt at every step of inference. Use your probe results as evidence: if probe 1 showed a
      miscount, that is evidence for your definition of token. Write at least three worked definitions and links before
      you leave. In the last two minutes, write down one link you are unsure of; that becomes your "hardest link"
      sentences in A2.
    background: |
      @fig-3-9 (mini-map), redrawn natively: white Chapter 3 terms on the left in the book, shaded Chapter 2 terms on
      the right. Worked example in §3.6: definition of token with an example; links pretraining → is a kind of →
      self-supervised learning, inference → uses fixed → parameters; a corrected AI definition of context window.
      Faded example: instruction tuning → ___ → supervised learning; temperature → ___ → inference; correct "Temperature
      is how sure the model is that its answer is true" (start: an option that changes how often less likely tokens are
      picked; it does not…).
    questions:
      - q: "Can a link go from a Chapter 2 term to a Chapter 3 term?"
        a: "Yes, as long as it reads as a true sentence; the rubric asks that every Chapter 3 term be linked to at least one Chapter 2 term."
    activity: "Lab minutes 30–45: 13 min individual write-up, 2 min exit step (one unsure link; one Failure Diary entry). Circulate and read links aloud."
    book: "§3.6 'From probes to your concept map', @fig-3-9; Worked Example 'One Term, Two Links, One Correction'; Faded Example 'Label and Correct'."

- layout: tps
  minutes: 15
  kicker: "Share and critique · 15 min"
  title: "What did your probes show?"
  prompt:
    - "Which result surprised you? Which section explains it?"
    - "What does your probe not show?"
    - "Which probe tested training; which the context?"
  phases:
    - {name: "Think", min: 2, text: "One line each"}
    - {name: "Team", min: 5, text: "Pick one result to report"}
    - {name: "Share", min: 8, text: "Report; class critiques the probe"}
  notes:
    say: |
      Time to share and critique. On your own, answer three questions in one line each: which result surprised your
      team and which section explains it, or fails to; what your probe does not show; and which of your probes tested
      something that came from training and which tested something in the context window. Then, as a team, pick one
      result to report. In the last eight minutes each team reports, and the rest of us critique the probe, not the
      person: was the prediction stated with a reason? How many runs? Would a different word, text or date change the
      result? This is the habit the book builds: deciding on evidence, not on how an answer sounds.
    background: |
      Debrief questions from labs/ch03-lab1.md ("Further debrief questions": what your probe does not show; training vs.
      context window; turn one result into a labeled link). What to listen for: conclusions drawn from one run (weak);
      probes that trusted the model's own statement of its cutoff (not a test); correct answers recorded honestly as
      evidence (strong); probe 4 results that distinguish search on from search off (strong).
    misconceptions:
      - m: "M6 'If the tool searched, the answer is correct.'"
        fix: "When a team reports a searched answer to probe 4, ask whether they opened the source."
      - m: "M3 'A different answer means an error.'"
        fix: "When a team reports varied answers to probe 2, ask which step explains it."
    activity: "Think 2 · team 5 · share 8. Call on teams that ran different probes."
    book: "Lab 3.1 debrief; §§3.1–3.5."

- layout: objectives
  minutes: 1
  kicker: "Chapter 3 summary (book figure: summary card)"
  title: "Does a language model know things, or predict text?"
  items:
    - {code: "O1", text: "**Explain:** tokens → scores → pick one → add and repeat"}
    - {code: "O2", text: "**Explain:** training changes settings; inference only uses them"}
    - {code: "O2", text: "**Explain:** a knowledge cutoff; your chat does not retrain it"}
    - {code: "O3", text: "**Judge:** search and tools change the input, not the machine"}
    - {code: "O4", text: "**Test:** prediction, prompt, result, conclusion"}
    - {code: "O5", text: "**Complete:** A2 Part 2, linked to Chapter 2"}
  takeaway: "Mechanically, it predicts text; whether that is “knowing” is debated (Chapter 23)"
  notes:
    say: |
      Back to the chapter's question: does a language model know things, or does it predict text? Mechanically, it
      predicts text, one token at a time, in four steps: split the text into tokens, score every possible next token,
      pick one, add it and repeat. Its scores come from settings adjusted during training, applied to whatever is in the
      context window. What looks like knowledge comes from patterns in the training text, from the context and from
      tools. Whether that adds up to "knowing" is a real debate, taken up in Chapter 23. And the reversal curse fits
      this picture: training ran in one direction; once the fact was in the context, the reverse question could be
      answered. Check your warm-up from the concept session: no, no, and not necessarily.
    background: |
      Chapter Summary, including "Revisit your Warm-up": (1) the model receives tokens, each a number, not letters;
      (2) a correction does not fix the model for everyone: inference does not change the settings; memory features
      only add text to later conversations; some providers may train a future version on conversations, depending on
      account and options, never the model you are talking to; (3) a searched answer is not necessarily correct.
      Reversal curse attribution: invented-fact test = training effect (confirmed); celebrity test = the researchers'
      suggestion (reported). The summary card is @fig-3-12; the complete anatomy is @fig-3-3.
    activity: "Ask two students which probe result changed their picture of the tool most."
    book: "Chapter Summary, @fig-3-3, @fig-3-12; Warm-up revisit."

