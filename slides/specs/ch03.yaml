      A quick self-test: cover the slide and define three of them for your neighbor. Watch the pairs: training and
      inference; settings and options, so temperature is an option, never a setting; the context window and a memory
      feature; retrieval and tool use; an agent and a workflow. The two Deep terms come from an optional section on
      attention and are not on the exams.
    background: |
      Key Terms list from the chapter. Definitions are in the chapter text and docs/glossary.md. Examinable scope: Core
