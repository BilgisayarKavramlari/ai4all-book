  minutes: 1
  title: "Key terms"
  terms:
    - "task–tool fit"
    - "AI tool"
    - "provider"
    - "domain tool"
    - "open-weight model"
    - "local model"
    - "total cost of use"
    - "verification cost"
    - "no-AI baseline"
    - "data terms"
    - "data class"
    - "data gate"
    - "bake-off"
    - "fit matrix"
    - "drift (in a tool or model over time)"
    - "lock-in"
    - "re-test trigger"
    - "leaderboard (Deep)"
  note: "Definitions: Chapter 12 and the glossary. (Deep) terms are optional and not on exams."
  notes:
    say: |
      These are the chapter's key terms; if your course has a written exam they can appear in it. Make sure you can define
      each one in a sentence. Some come in useful pairs: total cost of use and verification cost, the second being the part of the
      first that people most often leave out; data terms and data class, one about the tool and one about your input,
      which together make the data gate; open-weight model and local model. And note the sense label on drift: this is
      drift in a tool or model over time, not Chapter 9's drift of a claim as it is retold.
    background: |
      Key Terms list from the chapter (17 Core terms plus leaderboard, Deep). Examinable scope: Core sections only (D20).
      Exam format and weighting are the instructor's call.
    activity: "30-second pair self-test."
    book: "Chapter Summary, Key Terms; glossary."

- layout: exit_ticket
  minutes: 2
  questions:
    - "Name one part of your task you will keep on the floor (no AI), and why."
    - "Which data-terms answer surprised your team most?"
    - "What is your A10 re-test trigger?"
  instruction: "2 min · index card or your course site · ungraded"
  notes:
    say: |
      Last two minutes: the exit ticket, on an index card or in a course-site form, ungraded. The first question is the
      lab's own exit step: one part of your task you will keep on the floor, with no AI, and your reason. The second
      tells me what to clarify about data terms. The third makes sure your matrix has its re-test trigger. Before you
      leave: A10 is due when your instructor sets it, on your course site. The next chapter is about agentic workflows: systems in which the
      model chooses its own steps, and how people keep oversight of them.
    background: |
      Question 1 = Lab 12.1 step 5. Next chapter (Chapter 14): agentic workflows and human oversight;
      demo: a multi-step agent and its failure; recommended reading: Anthropic (2024); A11, the workflow blueprint with
      approval points.
    activity: "2 min; collect cards at the door or close the course-site form at the end of the session."
    book: "Lab 12.1 step 5; Chapter 14."

# ======================================================================= REFERENCE SLIDES
- layout: deep
  session: after
  kicker: "Deep 12.B · beyond one study"
  title: "Going deeper: field data, national data, leaderboards"
  size: 22
  bullets:
    - "Field experiments, 4,867 developers: about 26% more tasks (Cui et al., 2026)"
    - "Denmark, through 2024: no detectable effect on earnings or hours"
    - "Leaderboards rank models on other people’s questions"
  takeaway: "A ranking can start a shortlist; only your bake-off settles fit"
  notes:
    say: |
      Use this slide only if there is time or a student asks about the bigger picture. Three kinds of evidence beyond one
      study. Field experiments: three companies gave a random subset of developers a coding assistant in normal work in
      2022 and 2023; pooled across 4,867 developers, those with the tool completed about 26 percent more tasks, with
      noisy results that varied by firm. National data: in Denmark, surveys of about 25,000 workers linked to official
      records found no detectable effect of chatbot adoption on earnings or hours through 2024. Large gains in one task
      need not add up to large changes across a job. Leaderboards: an audit of one crowd-vote leaderboard reported that
      private testing let a few providers publish only their best score; the operators disputed several claims.
    background: |
      Deep 12.B (optional, not examinable). Cui et al. (2026): Microsoft, Accenture and an anonymous firm; tasks counted
      as pull requests; the tool's parent company was one of the firms and some authors work there; a count is not a
      quality measure. Humlum and Vestergaard (2026): 11 occupations; effects larger than 2% ruled out; reported time
      savings about 3%. Singh et al. (2025): 2 million comparisons, 243 models, 42 providers, January 2024–April 2025; 27
      private versions from one provider in one month; LMArena (2025) responded on May 9, 2025, accepting some
      recommendations and disputing others (reported). Deep 12.A covers open-weight vs. open-source AI (OSI definition
      1.0, October 28, 2024).
    questions:
      - q: "Should I ignore leaderboards then?"
        a: "No; a ranking can start a shortlist. It scores models on other people's questions, so only your bake-off settles fit for your part (Deep 12.B)."
    activity: "Optional; not part of the 75-minute plan."
    book: "Deep 12.B; Deep 12.A; Warm-up item 1."

